# Area Taxonomy
# Coarse-grained areas for the tag cloud and area landing pages.
# Each area maps to ~15-25 clickable tags (vs. 266 fine-grained topics).
#
# Rules:
#   - Every topic in topics.yaml maps to exactly one area (a few may appear in multiple)
#   - color: CSS hex for the tag cloud badge
#   - description: shown on the area landing page
#
# Generated files (do NOT edit directly):
#   training/library/portal/areas/{slug}.md — regenerated by tools/gen_area_pages.py

