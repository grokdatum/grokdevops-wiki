# Deck-to-Topic Mapping Registry
#
# Maps flashcard deck names (TSV filename stems) to topics, domains, or areas
# when the automatic heuristic (replace hyphens → underscores, look up in
# topics.yaml + aliases) fails to find a match.
#
# This file is consumed by tools/export_site_data.py to improve card→topic
# association beyond the built-in heuristic.
#
# Mapping modes:
#   topic_id: <string>        → maps deck to one topic
#   topic_ids: [t1, t2, ...]  → maps deck to multiple topics (primary = first)
#   domain: <string>          → maps to domain only, no specific topic
#   area: <string>            → maps to area only
#   unmapped: true            → intentionally uncategorized, will stay topic_id: null
#
# Rules:
#   - Only decks that fail the automatic heuristic need entries here.
#   - Do not duplicate mappings the heuristic already handles.
#   - Prefer honest "unmapped: true" over guessed assignments.
#   - When a deck spans multiple topics, list them; the exporter uses the first
#     as primary topic_id and records the full list for future multi-topic use.
#
# Phase 2 — 2026-03-20

decks:
  # ── Ansible family ──────────────────────────────────────────────────────
  ansible-core:
    topic_id: ansible
    note: "Core Ansible concepts (modules, tasks, handlers) — subset of ansible topic"

