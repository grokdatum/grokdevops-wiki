# Level Definitions
# L0-L3 progression system for cross-domain skill tracking

levels:
  L0:
    name: Entry
    description: First exposure. Can follow instructions with docs open.
    expectations:
      - Navigate basic tooling (terminal, editor, git clone)
      - Run commands from documentation
      - Recognize key terms and concepts
      - Complete guided exercises with hints
    domains_covered:
      - Linux basics (filesystem, permissions, package management)
      - Docker basics (build, run, Dockerfile)
      - Networking basics (IP, DNS, ping, curl)
      - CLI basics (grep, find, pipes)
      - Git fundamentals

  L1:
    name: Foundations
    description: Can work independently on standard tasks. Occasional doc lookups.
    expectations:
      - Debug simple failures without hand-holding
      - Write basic configs (Dockerfiles, manifests, playbooks)
      - Explain core concepts to others
      - Complete exercises without hints
    domains_covered:
      - Kubernetes core (pods, deployments, services, probes)
      - Helm basics (install, upgrade, rollback)
      - CI/CD basics (pipeline structure, triggers)
      - Datacenter basics (rack awareness, cabling, power)
      - Ansible basics (playbooks, roles)

  L2:
    name: Operations
    description: Can operate systems in production. Handles incidents.
    expectations:
      - Triage production incidents under time pressure
      - Design and implement monitoring/alerting
      - Perform safe maintenance (node upgrades, rolling deploys)
      - Write runbooks for common failures
    domains_covered:
      - Kubernetes ops (node maintenance, PDBs, debugging)
      - Observability (Prometheus, Grafana, Loki, alerting)
      - Incident response (triage, forensics, RCA)
      - Networking troubleshooting (layer-by-layer, tcpdump, MTU)
      - Infrastructure as Code (Terraform, Ansible at scale)

  L3:
    name: Advanced
    description: Designs systems and mentors others. Deep internals knowledge.
    expectations:
      - Design resilient architectures
      - Lead incident response and write post-mortems
      - Optimize systems for performance and cost
      - Teach and mentor effectively
    domains_covered:
      - SRE patterns (SLOs, error budgets, chaos engineering)
      - GitOps and release engineering
      - Security hardening (RBAC, network policies, scanning)
      - Interview mastery (articulate reasoning under pressure)
      - Advanced troubleshooting (kernel, CNI, etcd)
