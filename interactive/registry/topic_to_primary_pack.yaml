# Explicit topic → primary pack directory overrides.
#
# When absent, the exporter uses a heuristic (word overlap scoring between
# topic slug and directory name). This file overrides cases where the
# heuristic picks the wrong directory.
#
# Format: overrides: { topic_id: "pack-directory-name" }
#
# Only add entries where the heuristic is known to fail.
# Run `python3 tools/export_site_data.py` and check primary_pack values
# in the output to find new cases.

overrides:
  # systemd has 7 pack dirs; heuristic picks rhce, should be systemctl-journalctl
  systemd: "systemctl-journalctl"

  # grafana has 3 pack dirs; heuristic picks monitoring-migration, should be monitoring-fundamentals
  grafana: "monitoring-fundamentals"

  # k8s_core has 6 pack dirs; heuristic picks k8s-debugging-playbook, should be k8s-pods-and-scheduling
  k8s_core: "k8s-pods-and-scheduling"

  # hardware_security maps to ipmi + redfish; heuristic picks redfish, ipmi is more focused
  hardware_security: "ipmi-and-ipmitool"
