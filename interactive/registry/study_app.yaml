# Study App Configuration
# Used by tools/gen_wiki_nav.py to generate MkDocs → Vite cross-links.
#
# Set base_url to the deployed Vite study app URL.
# When set, wiki portal topic pages include a "Study this topic" link.
# When empty or commented out, no study links are generated.
#
# The topic route is:  {base_url}/#/topics/{topic_slug}
# The study route is:  {base_url}/#/study/{topic_slug}

base_url: "https://grokdatum.github.io/grokdevops"
