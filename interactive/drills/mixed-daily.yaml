# Mixed Daily Drill — 15-minute cross-domain session
# See training/interactive/TRAINING_METADATA.md for manifest conventions.

name: Daily Mixed Drill
description: 15-minute mixed drill across weak areas
duration_minutes: 15
sources:
  - type: flashcard
    count: 10
    strategy: weak_first
  - type: quiz
    count: 5
    strategy: balanced
  - type: scenario
    count: 1
    strategy: random
filters:
  levels: [L1, L2]
  exclude_topics: []
