# Security Drill — TLS, secrets, IAM, policies, scanning
# See training/interactive/TRAINING_METADATA.md for manifest conventions.

name: Security Drill
description: 20-minute drill covering TLS, secrets management, IAM, policies, and security scanning
duration_minutes: 20
sources:
  - type: flashcard
    count: 10
    strategy: weak_first
  - type: quiz
    count: 6
    strategy: balanced
  - type: scenario
    count: 1
    strategy: random
filters:
  levels: [L1, L2]
  topics:
    - tls
    - secrets_management
    - iam
    - security
    - k8s_security
    - open_policy_agent
    - scanning
    - compliance
