---
- name: Setup application environment
  hosts: appservers
  become: true
  tasks:
    - name: Create application user
      ansible.builtin.user:
        name: appuser
        state: present
        shell: /bin/bash

    - name: Download application binary
      ansible.builtin.shell:
        cmd: curl -L https://releases.example.com/app-v2.0.tar.gz -o /opt/app-v2.0.tar.gz && tar xzf /opt/app-v2.0.tar.gz -C /opt/app/
        creates: /opt/app-v2.0.tar.gz

    - name: Set correct permissions
      ansible.builtin.file:
        path: /opt/app
        owner: appuser
        group: appuser
        recurse: true
        state: directory
