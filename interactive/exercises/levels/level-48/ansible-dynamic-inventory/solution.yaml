---
# Dynamic inventory output format (simulated as YAML)
# This represents what a dynamic inventory script should output
inventory_output:
  webservers:
    hosts:
      - web1.example.com
      - web2.example.com
  dbservers:
    hosts:
      - db1.example.com
  _meta:
    hostvars:
      web1.example.com:
        ansible_host: 10.0.1.10
        http_port: 80
      web2.example.com:
        ansible_host: 10.0.1.11
        http_port: 80
      db1.example.com:
        ansible_host: 10.0.2.10
        db_port: 5432
