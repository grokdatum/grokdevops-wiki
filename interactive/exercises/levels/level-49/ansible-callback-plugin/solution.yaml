---
# Custom callback plugin configuration (simulated as YAML)
callback_plugin:
  name: custom_logger
  type: notification
  base_class: CallbackBase
  version: "2.0"
  description: "Custom callback plugin for deployment logging"

  config:
    log_file: /var/log/ansible/deployments.log
    log_level: info
    include_timestamps: true

  # The plugin class definition reference
  class_definition:
    inherits: "ansible.plugins.callback.CallbackBase"
    implements:
      - v2_runner_on_ok
      - v2_runner_on_failed
      - v2_playbook_on_start
      - v2_playbook_on_stats

  callback_needs_enabled: true
  CALLBACK_VERSION: 2.0
  CALLBACK_TYPE: notification
  CALLBACK_NAME: custom_logger
