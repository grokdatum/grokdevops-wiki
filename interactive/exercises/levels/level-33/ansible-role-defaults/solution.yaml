---
# This playbook uses a role where configurable values are in defaults/main.yml
# so they can be easily overridden by play vars

- name: Deploy nginx with custom settings
  hosts: webservers
  become: true
  vars:
    nginx_port: 9090
    nginx_worker_processes: 8
  roles:
    - role: nginx

# roles/nginx/defaults/main.yml (correct location - can be overridden):
# nginx_port: 80
# nginx_worker_processes: 4
# nginx_user: www-data

# Variables from defaults/main.yml have the lowest precedence,
# so nginx_port will correctly be 9090 as set in play vars

# FIXED: Variables are now in defaults/main.yml
- name: Simulate the role variable file
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    var_location: "defaults/main.yml"
  tasks:
    - name: Show variable location
      ansible.builtin.debug:
        msg: "Role variables are in: {{ var_location }} - correctly in defaults/main.yml"
