services:
  web:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
  app:
    build:
      context: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://db:5432/myapp
      - SECRET_KEY=hardcoded-secret-key-12345
  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: admin123
    volumes:
      - /var/lib/postgresql/data
