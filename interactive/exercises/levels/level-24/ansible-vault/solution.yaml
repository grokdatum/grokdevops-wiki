---
- name: Deploy application with secrets
  hosts: appservers
  become: true
  vars:
    db_host: db.example.com
    db_port: 5432
    db_name: appdb
    db_password: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      61626364656667686970
  tasks:
    - name: Create database config
      ansible.builtin.copy:
        content: |
          [database]
          host={{ db_host }}
          port={{ db_port }}
          name={{ db_name }}
          password={{ db_password }}
        dest: /etc/myapp/database.conf
        mode: '0600'
