---
- name: Deploy secrets to application
  hosts: appservers
  become: true
  vars:
    api_endpoint: https://api.example.com
    api_key: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      61616263646566676869706f6e6d6c6b
      6a696867666564636261616263646566
    db_connection_string: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      31323334353637383930616263646566
      6768696a6b6c6d6e6f707172737475
  tasks:
    - name: Create secrets file
      ansible.builtin.copy:
        content: |
          API_KEY={{ api_key }}
          DB_CONN={{ db_connection_string }}
        dest: /etc/myapp/secrets.env
        mode: '0600'
        owner: appuser
        group: appuser
