---
# meta/main.yml for the webapp role
galaxy_info:
  author: devops-team
  description: Web application deployment role
  license: MIT
  min_ansible_version: "2.9"
  platforms:
    - name: Ubuntu
      versions:
        - focal
        - jammy

dependencies:
  - role: common
    vars:
      common_packages:
        - python3
        - git
  - role: nginx
    vars:
      nginx_port: 8080
