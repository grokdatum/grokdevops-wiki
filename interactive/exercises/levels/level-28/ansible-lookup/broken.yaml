---
- name: Deploy SSL certificates
  hosts: webservers
  become: true
  vars:
    ssl_certificate: "{{ lookup('files', '/etc/ssl/certs/app.crt') }}"
    ssl_private_key: "{{ lookup('file', '/etc/ssl/private/app.key') }}"
  tasks:
    - name: Deploy certificate
      ansible.builtin.copy:
        content: "{{ ssl_certificate }}"
        dest: /etc/nginx/ssl/app.crt
        mode: '0644'

    - name: Deploy private key
      ansible.builtin.copy:
        content: "{{ ssl_private_key }}"
        dest: /etc/nginx/ssl/app.key
        mode: '0600'
