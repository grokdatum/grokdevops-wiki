services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - public
      - private
  backend:
    image: python:3.11-slim
    command: python3 -m http.server 5000
    networks:
      - private
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: secret
    networks:
      - private

networks:
  public:
  private:
