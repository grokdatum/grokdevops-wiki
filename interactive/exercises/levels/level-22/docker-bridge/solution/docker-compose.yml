services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - appnet
  api:
    image: python:3.11-slim
    command: python3 -c "import http.server; http.server.HTTPServer(('0.0.0.0', 5000), http.server.SimpleHTTPRequestHandler).serve_forever()"
    networks:
      - appnet

networks:
  appnet:
