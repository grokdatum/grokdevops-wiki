---
- name: Display system information
  hosts: all
  gather_facts: true
  tasks:
    - name: Show OS distribution
      ansible.builtin.debug:
        msg: "OS: {{ ansible_facts.distribution }}"

    - name: Show total memory
      ansible.builtin.debug:
        msg: "Memory: {{ ansible_facts.memory.total_mb }} MB"

    - name: Show default IPv4 address
      ansible.builtin.debug:
        msg: "IP: {{ ansible_facts.default_ipv4.address }}"
