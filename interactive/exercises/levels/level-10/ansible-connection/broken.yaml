---
- name: Configure local development environment
  hosts: localhost
  connection: ssh
  gather_facts: true
  tasks:
    - name: Create project directory
      ansible.builtin.file:
        path: /opt/myproject
        state: directory
        mode: '0755'

    - name: Create config file
      ansible.builtin.copy:
        content: |
          [app]
          debug = true
          port = 8080
        dest: /opt/myproject/config.ini
