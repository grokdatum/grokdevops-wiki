---
- name: Multi-stage deployment
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      tag: setup

    - name: Install application packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
        state: present
      tags: packages

    - name: Deploy configuration
      ansible.builtin.template:
        src: app.conf.j2
        dest: /etc/app/app.conf
      tags: config
