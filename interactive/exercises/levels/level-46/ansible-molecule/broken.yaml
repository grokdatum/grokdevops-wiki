---
# molecule/default/molecule.yml
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ubuntu-test
    image: ubuntu:22.04
    pre_build_image: true
    command: /sbin/init
    privileged: true
  - name: centos-test
    image: centos:8
    pre_build_image: true
    command: /sbin/init

provisioner:
  name: ansible
  inventory:
    host_vars:
      ubuntu-test:
        ansible_python_interpreter: /usr/bin/python3

verifier:
  name: testinfra
