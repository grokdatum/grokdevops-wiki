---
# aws_ec2.yml - Dynamic inventory for AWS
plugin: aws_ec2
regions:
  - us-east-1
  - us-west-2
keyed_groups:
  - key: tags.Environment
    prefix: env
  - key: instance_type
    prefix: type
  - key: placement.region
    prefix: region
filters:
  tag:Project: myapp
  instance-state-name: running
compose:
  ansible_host: public_ip_address
hostnames:
  - tag:Name
  - private-ip-address
