services:
  writer:
    image: python:3.11-slim
    command: python3 -c "open('/data/output.txt', 'w').write('Hello!')"
    volumes:
      - shared-data:/data
  reader:
    image: python:3.11-slim
    command: python3 -c "print(open('/data/output.txt').read())"
    volumes:
      - shared-data:/data:ro

volumes:
  shared-data:
