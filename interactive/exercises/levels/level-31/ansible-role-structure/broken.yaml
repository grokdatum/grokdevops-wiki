---
- name: Apply nginx role
  hosts: webservers
  become: true
  roles:
    - role: nginx

  # Role structure reference:
  # roles/nginx/
  #   task/main.yml    <-- BUG: should be tasks/
  #   handlers/main.yml
  #   templates/nginx.conf.j2
  #   defaults/main.yml

# roles/nginx/task/main.yml content:
# This simulates a role with tasks in the wrong directory
- name: Simulate role tasks file
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    role_dir: "roles/nginx/task/main.yml"
  tasks:
    - name: Show role directory structure
      ansible.builtin.debug:
        msg: "Role tasks are in: {{ role_dir }}"
