---
- name: Configure and restart nginx
  hosts: webservers
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy nginx configuration
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Restart nginx service

  handlers:
    - name: Restart nginx service
      ansible.builtin.service:
        name: nginx
        state: restarted
