---
- name: Generate hosts file
  hosts: all
  become: true
  vars:
    dns_servers:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
  tasks:
    - name: Create resolv.conf
      ansible.builtin.copy:
        content: |
          # Generated by Ansible
          {% for server in dns_servers %}
          nameserver {{ dns_server }}
          {% endfor %}
        dest: /etc/resolv.conf
        mode: '0644'
