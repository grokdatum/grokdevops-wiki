---
- name: Configure application using role template
  hosts: appservers
  become: true
  tasks:
    - name: Deploy application config from template
      ansible.builtin.template:
        src: app.conf.j2
        dest: /etc/myapp/app.conf
        owner: root
        group: root
        mode: '0644'

    - name: Deploy logging config from template
      ansible.builtin.template:
        src: logging.conf.j2
        dest: /etc/myapp/logging.conf
        owner: root
        group: root
        mode: '0644'
