---
- name: Configure application with defaults
  hosts: appservers
  become: true
  tasks:
    - name: Create application config
      ansible.builtin.copy:
        content: |
          [server]
          port={{ server_port | default(8080) }}
          debug={{ debug_mode | default(false) }}
          workers={{ worker_count | default(4) }}
          log_level={{ log_level | default('info') }}
        dest: /etc/myapp/config.ini

    - name: Start application
      ansible.builtin.service:
        name: myapp
        state: started
