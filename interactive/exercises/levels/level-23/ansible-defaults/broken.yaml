---
- name: Configure application with defaults
  hosts: appservers
  become: true
  tasks:
    - name: Create application config
      ansible.builtin.copy:
        content: |
          [server]
          port={{ server_port }}
          debug={{ debug_mode }}
          workers={{ worker_count }}
          log_level={{ log_level }}
        dest: /etc/myapp/config.ini

    - name: Start application
      ansible.builtin.service:
        name: myapp
        state: started
