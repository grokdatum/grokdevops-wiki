---
- name: Generate Kubernetes manifest
  hosts: localhost
  connection: local
  vars:
    app_config:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: myapp
        labels:
          app: myapp
      spec:
        replicas: 3
        selector:
          matchLabels:
            app: myapp
  tasks:
    - name: Write k8s manifest to file
      ansible.builtin.copy:
        content: "{{ app_config | to_yaml }}"
        dest: /tmp/deployment.yaml
        mode: '0644'
