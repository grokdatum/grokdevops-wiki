---
- name: Check and act on service status
  hosts: all
  become: true
  tasks:
    - name: Check if nginx is installed
      ansible.builtin.command:
        cmd: which nginx
      register: nginx_check
      ignore_errors: true

    - name: Install nginx if not present
      ansible.builtin.apt:
        name: nginx
        state: present
      when: nginx_check.rc != 0
