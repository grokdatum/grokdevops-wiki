---
- name: Setup application server
  hosts: appservers
  become: true
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
        state: present

    - name: Copy application config file
      ansible.builtin.copy:
        src: app.conf
        dest: /etc/app/app.conf
        owner: root
        group: root
        mode: '0644'

    - name: Start application service
      ansible.builtin.service:
        name: myapp
        state: started
        enabled: true
