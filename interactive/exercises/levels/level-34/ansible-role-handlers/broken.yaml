---
- name: Configure and manage nginx
  hosts: webservers
  become: true
  roles:
    - role: nginx

# Role directory structure:
# roles/nginx/
#   tasks/main.yml
#   handler/main.yml     <-- BUG: should be handlers/
#   templates/nginx.conf.j2
#   defaults/main.yml

# roles/nginx/tasks/main.yml:
- name: Simulate role tasks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    handler_dir: "handler/main.yml"
  tasks:
    - name: Install nginx
      ansible.builtin.debug:
        msg: "Installing nginx"

    - name: Deploy nginx config
      ansible.builtin.debug:
        msg: "Deploying nginx.conf"
      notify: Restart nginx

    - name: Show handler location
      ansible.builtin.debug:
        msg: "Handlers are in: {{ handler_dir }}"
