---
- name: Deploy web application
  hosts: webservers
  become: true
  vars:
    app_name: mywebapp
  tasks:
    - name: Create app directory
      ansible.builtin.file:
        path: "/opt/{{ app_name }}"
        state: directory
        mode: '0755'

    - name: Deploy application config
      ansible.builtin.template:
        src: app.conf.j2
        dest: "/opt/{{ app_name }}/app.conf"

    - name: Start application
      ansible.builtin.service:
        name: "{{ app_name }}"
        state: started
