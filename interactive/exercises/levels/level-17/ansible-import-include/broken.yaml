---
- name: Setup web infrastructure
  hosts: webservers
  become: true
  vars:
    app_name: mywebapp
  tasks:
    - name: Include common setup tasks
      ansible.builtin.include_task:
        file: common.yaml

    - name: Configure firewall
      ansible.builtin.import_tasks:
        file: firewall.yaml

    - name: Deploy application
      ansible.builtin.import_tasks:
        file: deploy.yaml
