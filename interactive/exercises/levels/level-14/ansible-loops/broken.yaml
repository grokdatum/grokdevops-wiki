---
- name: Install multiple packages
  hosts: webservers
  become: true
  tasks:
    - name: Install web stack packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_item:
        - nginx
        - php-fpm
        - mysql-client
        - redis-tools

    - name: Enable services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nginx
        - php-fpm
