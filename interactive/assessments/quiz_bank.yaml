questions:
- id: linux-001
  topic: linux_fundamentals
  level: L0
  question: What does `chmod 755 script.sh` do?
  answer: Sets owner read/write/execute (7), group read/execute (5), others read/execute (5). Owner can modify, everyone can
    run.
  distractor: Many people confuse the octal digits. 7=rwx, 6=rw-, 5=r-x, 4=r--.
- id: linux-002
  topic: linux_fundamentals
  level: L0
  question: How do you find which process is using port 8080?
  answer: ss -tlnp | grep 8080  or  lsof -i :8080. ss is preferred on modern systems.
- id: linux-003
  topic: systemd
  level: L0
  question: How do you check why a service failed to start?
  answer: journalctl -u <service-name> -e  to see recent logs. systemctl status <service-name> for quick overview.
- id: linux-004
  topic: bash_scripting
  level: L0
  question: What does `set -euo pipefail` do in a bash script?
  answer: -e exits on error, -u treats unset variables as errors, -o pipefail makes pipe return the exit code of the first
    failed command.
- id: linux-005
  topic: linux_fundamentals
  level: L0
  question: What is the difference between a hard link and a soft link?
  answer: Hard link points to the same inode (same data, survives original deletion). Soft link (symlink) points to a path
    (breaks if target deleted).
- id: docker-002
  topic: docker
  level: L0
  question: Why should you use multi-stage builds?
  answer: To keep final images small. Build stage has compilers/tools, final stage only has the binary and runtime deps. Reduces
    attack surface and pull time.
- id: docker-003
  topic: docker
  level: L0
  question: What happens to data inside a container when it's deleted?
  answer: It's gone. Containers are ephemeral. Use volumes or bind mounts for persistent data.
- id: net-001
  topic: dns
  level: L1
  question: dig shows the correct IP but the app can't connect. What do you check?
  answer: '1) /etc/hosts overrides. 2) /etc/nsswitch.conf order. 3) App-level DNS cache. 4) IPv6 AAAA vs A records. 5) In
    K8s: ndots setting causing search domain issues.'
- id: net-002
  topic: tcp_ip
  level: L1
  question: How do you troubleshoot a connection timeout vs connection refused?
  answer: Timeout = packets not reaching destination (firewall, routing, wrong IP). Refused = reached destination but no listener
    (service down, wrong port). Use tcpdump to differentiate.
- id: net-003
  topic: linux_networking
  level: L1
  question: What is the difference between an access port and a trunk port?
  answer: Access port carries one VLAN (untagged). Trunk port carries multiple VLANs (tagged with 802.1Q). Servers usually
    connect to access ports; switch-to-switch links are trunks.
- id: net-004
  topic: mtu
  level: L1
  question: How do you detect an MTU blackhole?
  answer: 'ping -M do -s 1472 <target> (don''t fragment). If it fails at 1473 but works at 1472, MTU is 1500. Reduce size
    to find the actual path MTU. Symptoms: SSH works but large HTTPS pages hang.'
- id: net-005
  topic: linux_networking
  level: L1
  question: How do you capture only DNS traffic with tcpdump?
  answer: tcpdump -i any port 53 -nn. Add -w dns.pcap to save for Wireshark analysis.
- id: k8s-001
  topic: k8s_core
  level: L1
  question: A pod is in CrashLoopBackOff. What are your first three commands?
  answer: 1) kubectl describe pod <name> (check Events). 2) kubectl logs <name> --previous (see crash output). 3) kubectl
    get events --sort-by=.lastTimestamp (cluster-wide context).
- id: k8s-002
  topic: k8s_core
  level: L1
  question: What is the difference between liveness and readiness probes?
  answer: 'Liveness: is the container alive? Failure = container restart. Readiness: can it serve traffic? Failure = removed
    from Service endpoints. Never make liveness depend on external deps.'
- id: k8s-003
  topic: k8s_core
  level: L1
  question: What happens when you delete a pod managed by a Deployment?
  answer: The ReplicaSet controller creates a new pod to maintain desired count. The Deployment is self-healing. To actually
    remove it, scale the deployment to 0 or delete the deployment.
- id: k8s-004
  topic: k8s_pods_scheduling
  level: L1
  question: HPA shows <unknown> for CPU. What's wrong?
  answer: Metrics server is not installed, or the deployment doesn't have resource requests defined. HPA needs requests to
    calculate percentage utilization.
- id: k8s-005
  topic: k8s_services_ingress
  level: L1
  question: How does a Kubernetes Service route traffic to pods?
  answer: Service selector matches pod labels. kube-proxy maintains iptables/IPVS rules that NAT traffic to pod IPs. If selector
    doesn't match pod labels, no endpoints = no traffic.
- id: dc-001
  topic: rack_ops
  level: L1
  question: You're racking a new server. What's the cabling checklist?
  answer: 1) Power (redundant PSUs to different PDUs/circuits). 2) Network (production NICs, OOB/iDRAC). 3) Label both ends
    of every cable. 4) Cable management (no blocking airflow). 5) Verify hot/cold aisle orientation.
- id: dc-002
  topic: raid
  level: L1
  question: RAID 5 is degraded and another disk has a predictive failure. What do you do?
  answer: Do NOT wait. Replace the predictive failure disk first (if hot spare isn't active). During rebuild, a second failure
    kills the array. Consider RAID 6 or RAID 10 for critical data.
- id: dc-003
  topic: oob_management
  level: L1
  question: Server is unresponsive to SSH. How do you access it?
  answer: Use OOB (iDRAC/iLO/IPMI). 1) Web console for virtual KVM. 2) ipmitool -I lanplus power status / power cycle. 3)
    Serial over LAN if network KVM fails.
- id: dc-004
  topic: server_hardware
  level: L1
  question: How do you identify a failing disk on a running server?
  answer: 'smartctl -a /dev/sdX (check Reallocated_Sector_Ct, Current_Pending_Sector). dmesg | grep -i error for I/O errors.
    For RAID: megacli/storcli -PDList -aAll.'
- id: k8sops-001
  topic: k8s_node_lifecycle
  level: L2
  question: Walk through the safe process to upgrade a worker node.
  answer: 1) kubectl cordon node (mark unschedulable). 2) kubectl drain node --ignore-daemonsets --delete-emptydir-data (evict
    pods, respect PDBs). 3) Perform upgrade. 4) kubectl uncordon node. Watch for PDB-blocked drains and local storage.
- id: k8sops-002
  topic: k8s_node_lifecycle
  level: L2
  question: kubectl drain hangs. What could cause this?
  answer: '1) PDB preventing eviction (minAvailable not met). 2) Pod with no controller (standalone pod can''t be evicted
    safely). 3) Pod with local storage and no --delete-emptydir-data flag. Check: kubectl get pdb, kubectl get pods -o wide
    on the node.'
- id: k8sops-003
  topic: k8s_core
  level: L2
  question: How do you debug a pod that's running but not receiving traffic?
  answer: 1) Check service selector matches pod labels. 2) kubectl get endpoints <svc> (should list pod IPs). 3) Check readiness
    probe (failing = removed from endpoints). 4) Check NetworkPolicy. 5) Check if pod is on a cordoned node.
- id: obs-001
  topic: prometheus
  level: L2
  question: Prometheus shows a target as DOWN. How do you troubleshoot?
  answer: 1) Check ServiceMonitor selector matches service labels. 2) Verify the metrics endpoint is reachable (curl pod-ip:port/metrics).
    3) Check Prometheus config (Status > Targets). 4) Check network policies blocking scrape traffic.
- id: obs-002
  topic: loki
  level: L2
  question: Logs stopped appearing in Grafana/Loki. Where do you look?
  answer: 1) Check Promtail/agent pods are running. 2) Verify Promtail config (pipeline stages, scrape targets). 3) Check
    Loki ingestion (loki_ingester_chunks_stored_total). 4) Check label cardinality (too many = rejection).
- id: cli-001
  topic: jq
  level: L0
  question: How do you extract all pod names from kubectl output using jq?
  answer: kubectl get pods -o json | jq -r '.items[].metadata.name'
- id: cli-002
  topic: ripgrep
  level: L0
  question: How do you search for a pattern in only Python files, excluding tests?
  answer: rg 'pattern' -t py -g '!test*' or rg 'pattern' --type py --glob '!*test*'
- id: cli-003
  topic: fzf
  level: L0
  question: How do you use fzf to interactively select and kill a process?
  answer: 'ps aux | fzf | awk ''{print $2}'' | xargs kill. Or with preview: ps aux | fzf --preview ''echo {}'' | awk ''{print
    $2}'' | xargs kill'
- id: cli-004
  topic: jq
  level: L0
  question: How do you filter kubectl JSON output for pods in CrashLoopBackOff?
  answer: kubectl get pods -o json | jq -r '.items[] | select(.status.containerStatuses[]?.state.waiting?.reason == "CrashLoopBackOff")
    | .metadata.name'
- id: helm-001
  topic: helm
  level: L1
  question: Helm upgrade failed and the app is broken. How do you recover?
  answer: 1) helm history <release> to see revisions. 2) helm rollback <release> <revision> to go back. 3) Check helm get
    values <release> to see what changed. 4) helm get manifest <release> to see rendered templates.
- id: helm-002
  topic: helm
  level: L1
  question: What is the difference between helm install and helm upgrade --install?
  answer: helm install fails if release exists. helm upgrade --install creates if not exists, upgrades if exists. Use upgrade
    --install in CI/CD for idempotency.
- id: ir-001
  topic: incident_response
  level: L2
  question: You get paged at 2am for a production outage. What are your first 60 seconds?
  answer: 1) Check monitoring dashboards (is it total or partial outage?). 2) Check recent deployments/changes (was anything
    deployed?). 3) Check cluster health (kubectl get nodes, kubectl get pods -A | grep -v Running). 4) Check external dependencies.
    Don't start fixing until you understand scope.
- id: ir-002
  topic: incident_response
  level: L2
  question: How do you decide between rolling back and fixing forward?
  answer: 'Roll back if: recent deploy is the obvious cause, rollback is safe and fast, data migrations haven''t run. Fix
    forward if: rollback would cause data loss, the fix is small and well-understood, or the issue isn''t deploy-related.'
- id: obs-003
  topic: prometheus
  level: L1
  question: What is the difference between a counter and a gauge in Prometheus?
  answer: Counter only goes up (e.g., total requests). Gauge goes up and down (e.g., current memory). Use rate() on counters;
    use gauge values directly.
- id: obs-004
  topic: prometheus
  level: L2
  question: Write a PromQL query to find the top 5 pods by CPU usage.
  answer: topk(5, sum by (pod) (rate(container_cpu_usage_seconds_total[5m]))). Use sum to aggregate across containers within
    a pod.
- id: obs-005
  topic: alerting
  level: L2
  question: What makes a good alert? Give criteria.
  answer: 1) Actionable (someone needs to do something). 2) Urgent (can't wait until morning). 3) Real (low false-positive
    rate). 4) Includes runbook link. Symptoms over causes — alert on error rate, not CPU.
- id: obs-006
  topic: prometheus
  level: L1
  question: What is a histogram and when do you use one?
  answer: Histogram buckets count observations by value range. Use for latency (p50/p95/p99). Query with histogram_quantile(0.95,
    rate(http_request_duration_seconds_bucket[5m])).
- id: obs-007
  topic: grafana
  level: L1
  question: Grafana dashboard shows 'No data'. What do you check?
  answer: 1) Data source connection (Settings > Data Sources > Test). 2) Time range too narrow or in the future. 3) Query
    syntax errors (run in Explore). 4) Metric name changed or missing labels.
- id: obs-008
  topic: monitoring_fundamentals
  level: L1
  question: What are the three pillars of observability?
  answer: Metrics (numeric time-series), Logs (discrete events), Traces (request flow across services). Each answers different
    questions; you need all three.
- id: obs-009
  topic: tracing
  level: L2
  question: A request is slow but each service reports low latency. How do you find the bottleneck?
  answer: Distributed tracing. Check spans for gaps between services (network/queue delay), fan-out (parallel calls serialized),
    or missing instrumentation hiding a slow hop.
- id: net-006
  topic: tcp_ip
  level: L1
  question: Explain the TCP three-way handshake.
  answer: Client sends SYN. Server responds SYN-ACK. Client sends ACK. Connection established. If SYN-ACK never comes back,
    you get a timeout (firewall or no listener).
- id: net-007
  topic: dns
  level: L1
  question: What is the difference between an A record and a CNAME?
  answer: A record maps a name to an IP address. CNAME maps a name to another name (alias). CNAME cannot coexist with other
    record types at the zone apex.
- id: net-008
  topic: linux_networking
  level: L1
  question: How do you add a static route on Linux?
  answer: ip route add 10.0.0.0/8 via 192.168.1.1 dev eth0. Persists across reboots only if added to /etc/network/interfaces,
    netplan, or NetworkManager config.
- id: net-009
  topic: firewalls
  level: L1
  question: What is the difference between iptables DROP and REJECT?
  answer: DROP silently discards the packet (sender sees timeout). REJECT sends back an ICMP error (sender sees 'connection
    refused'). DROP is stealthier; REJECT is more user-friendly for internal networks.
- id: net-010
  topic: load_balancing
  level: L2
  question: What is the difference between L4 and L7 load balancing?
  answer: L4 routes by IP/port (fast, protocol-agnostic, no payload inspection). L7 routes by HTTP headers, path, cookies
    (smarter routing, can do TLS termination, caching). L7 adds latency but enables content-based routing.
- id: net-011
  topic: tcp_ip
  level: L2
  question: What does TIME_WAIT mean and why do you see thousands of them?
  answer: 'TIME_WAIT = connection closed, waiting 2*MSL (60-120s) to ensure late packets don''t corrupt new connections on
    same port. Thousands = high connection churn. Fix: connection pooling, SO_REUSEADDR, or longer keep-alives.'
- id: net-012
  topic: dns
  level: L2
  question: How does DNS resolution work inside Kubernetes?
  answer: Pod resolves via CoreDNS (kube-dns service at 10.96.0.10). ndots:5 default means short names get search domains
    appended first. svc.cluster.local resolves to ClusterIP. Headless services return pod IPs.
- id: net-013
  topic: tls_pki
  level: L1
  question: A TLS certificate error says 'certificate has expired'. How do you check and fix it?
  answer: openssl s_client -connect host:443 | openssl x509 -noout -dates. Check notAfter. Renew the cert, update the secret/configmap,
    reload the server. Automate with cert-manager or ACME.
- id: dc-005
  topic: oob_management
  level: L1
  question: What is iDRAC and how is it different from IPMI?
  answer: 'iDRAC is Dell''s BMC implementation. IPMI is the vendor-neutral protocol/standard. iDRAC supports IPMI but adds
    features: web GUI, virtual media, Lifecycle Controller, Redfish API. iLO is HP''s equivalent.'
- id: dc-006
  topic: firmware
  level: L1
  question: Why is firmware management critical in a datacenter?
  answer: Outdated firmware causes security vulns, hardware instability, and missed bug fixes. Update BIOS, BMC/iDRAC, RAID
    controller, NIC, and disk firmware. Always read release notes — some updates require reboot or specific order.
- id: dc-007
  topic: pxe
  level: L1
  question: A server won't PXE boot. What do you check?
  answer: 1) NIC set as first boot device in BIOS. 2) DHCP server responding with next-server and filename options. 3) TFTP
    service running and reachable. 4) Correct bootloader for UEFI vs legacy BIOS. 5) VLAN tagging on the provisioning port.
- id: dc-008
  topic: raid
  level: L2
  question: What is the RAID write penalty and why does it matter for RAID 5?
  answer: RAID 5 write penalty is 4 (each write = 2 reads + 2 writes for parity). RAID 10 penalty is 2 (1 write to each mirror).
    For write-heavy workloads (databases), RAID 5 throughput is significantly worse.
- id: dc-009
  topic: rack_ops
  level: L1
  question: What is hot aisle / cold aisle containment and why does it matter?
  answer: Cold aisle faces server intakes; hot aisle faces exhausts. Containment prevents mixing of hot and cold air, improving
    cooling efficiency. Without it, hot exhaust recirculates into intakes, causing thermal issues.
- id: dc-010
  topic: power
  level: L1
  question: What is PUE and what is a good value?
  answer: PUE = Total Facility Power / IT Equipment Power. 1.0 is perfect (impossible). 1.2-1.4 is good. 2.0 means half the
    power goes to cooling/lighting. Track PUE to find cooling inefficiencies.
- id: dc-011
  topic: oob_management
  level: L2
  question: What is Redfish and why is it replacing IPMI?
  answer: Redfish is a RESTful API standard for server management (JSON over HTTPS). Replaces IPMI's binary protocol. Easier
    to automate, better security (TLS, RBAC), richer schema. Supported by Dell, HP, Lenovo, Supermicro.
- id: dc-012
  topic: server_hardware
  level: L2
  question: How do you troubleshoot ECC memory errors on a running server?
  answer: 1) edac-util -s or mcelog --client for correctable error counts. 2) ipmitool sel list for hardware events. 3) dmidecode
    -t memory to map DIMM slot. Correctable errors are OK short-term; rising count = replace the DIMM before it goes uncorrectable.
- id: dc-013
  topic: rack_ops
  level: L1
  question: What is the standard unit of rack space and how tall is a full rack?
  answer: One rack unit (1U) = 1.75 inches (44.45mm). A standard full rack is 42U. Half-rack is 22-24U. Most 1U servers hold
    1-2 CPUs; 2U servers hold more drives and PCIe slots.
- id: sec-001
  topic: linux_hardening
  level: L1
  question: What are the first three things you harden on a fresh Linux server?
  answer: 1) Disable root SSH login (PermitRootLogin no). 2) Enable firewall (ufw/firewalld) with default-deny inbound. 3)
    Enable automatic security updates (unattended-upgrades on Debian, dnf-automatic on RHEL).
- id: sec-002
  topic: ssh_deep_dive
  level: L1
  question: Why should you disable SSH password authentication and what do you use instead?
  answer: Passwords are brute-forceable. Use SSH key pairs (Ed25519 preferred). Set PasswordAuthentication no in sshd_config.
    For teams, use an SSH CA or short-lived certificates via Vault/SSO.
- id: sec-003
  topic: ssh_deep_dive
  level: L1
  question: How do you limit which users can SSH into a server?
  answer: AllowUsers or AllowGroups in sshd_config. Combine with firewall rules to restrict source IPs. For bastion hosts,
    use ProxyJump (-J) so internal servers never expose SSH to the internet.
- id: sec-004
  topic: secrets_management
  level: L1
  question: A developer committed an API key to git. What do you do?
  answer: 1) Revoke/rotate the key immediately (assume it's compromised). 2) Remove from history with git filter-repo or BFG.
    3) Add the pattern to .gitignore and set up pre-commit hooks (e.g., detect-secrets). History rewriting alone is not enough
    — the key is already exposed.
- id: sec-005
  topic: secrets_management
  level: L1
  question: Where should applications get secrets at runtime instead of config files?
  answer: 'Use a secrets manager: HashiCorp Vault, AWS Secrets Manager, or K8s external-secrets-operator. Inject via environment
    variables or mounted volumes. Never bake secrets into container images or git repos.'
- id: sec-006
  topic: least_privilege
  level: L1
  question: What is the principle of least privilege and give one concrete Linux example?
  answer: 'Grant only the minimum permissions needed for a task. Example: instead of giving a deploy user full sudo, use sudoers
    to allow only ''systemctl restart myapp''. Or use Linux capabilities (cap_net_bind_service) instead of running as root.'
- id: sec-007
  topic: least_privilege
  level: L1
  question: How do you audit which sudo commands a user has run?
  answer: 'Check /var/log/auth.log (Debian) or /var/log/secure (RHEL). All sudo executions are logged with user, command,
    and timestamp. For centralized auditing, ship logs to a SIEM. Also: sudo -l shows what a user is allowed to run.'
- id: sec-008
  topic: audit_logging
  level: L1
  question: What is auditd and when do you use it?
  answer: 'auditd is the Linux audit framework. Use it to track file access, syscalls, user logins, and privilege escalation.
    Key commands: auditctl -w /etc/passwd -p wa (watch for writes/attribute changes), ausearch -k <key> to search, aureport
    for summaries.'
- id: sec-009
  topic: audit_logging
  level: L2
  question: How do you detect if someone modified system logs to cover their tracks?
  answer: 1) Ship logs to a remote syslog/SIEM in real-time (attacker can't modify remote copies). 2) Use append-only log
    storage. 3) Compare local logs vs remote for gaps. 4) Check file timestamps with stat and look for gaps in sequence numbers.
- id: sec-010
  topic: incident_response
  level: L1
  question: You suspect a server is compromised. What are your first three steps?
  answer: '1) Isolate: restrict network access (security group/firewall) but do NOT power off. 2) Preserve: snapshot disk
    and dump memory before changes. 3) Assess: check running processes (ps auxf), network connections (ss -tlnp), recent logins
    (last, lastb), and cron jobs.'
- id: sec-011
  topic: incident_response
  level: L2
  question: What is the difference between containment and eradication in incident response?
  answer: Containment = stop the bleeding (isolate affected systems, block C2 IPs, disable compromised accounts). Eradication
    = remove the threat (patch vulnerability, remove malware, rebuild from clean image). Contain first, then eradicate. Premature
    eradication tips off the attacker.
- id: sec-012
  topic: incident_response
  level: L2
  question: What are Indicators of Compromise (IOCs) and give three examples?
  answer: 'IOCs are forensic artifacts that suggest a breach. Examples: 1) Unexpected outbound connections to unknown IPs.
    2) Modified system binaries (check with rpm -Va or debsums). 3) New cron jobs or systemd services you didn''t create.
    Also: unusual login times, new user accounts.'
- id: sec-013
  topic: incident_response
  level: L1
  question: Why should you NOT immediately shut down a compromised server?
  answer: 'Volatile evidence is lost: running processes, network connections, memory contents (encryption keys, malware in
    RAM). Instead: isolate network, capture memory dump (e.g., LiME), snapshot disk, then investigate. Power off only if active
    data exfiltration can''t be stopped otherwise.'
- id: sec-014
  topic: backup_restore
  level: L1
  question: How do you validate that your backups actually work?
  answer: 'Regular restore tests — schedule them quarterly at minimum. Restore to a separate environment and verify: data
    integrity, app functionality, RTO (time to restore), RPO (data freshness). Untested backups are just hope. Automate restore
    tests in CI where possible.'
- id: sec-015
  topic: backup_restore
  level: L1
  question: What is the 3-2-1 backup rule?
  answer: '3 copies of data, on 2 different media types, with 1 copy offsite. Modern version adds: 1 copy offline/immutable
    (protects against ransomware). Cloud snapshots alone don''t count as offsite if the attacker has your cloud credentials.'
- id: sec-016
  topic: secrets_management
  level: L1
  question: What are common operational security mistakes in DevOps teams?
  answer: 1) Sharing credentials in Slack/email. 2) Long-lived API keys with broad permissions. 3) No MFA on cloud consoles.
    4) Running production workloads as root. 5) Not rotating secrets after employee departure. 6) Overly permissive security
    groups (0.0.0.0/0).
- id: sec-017
  topic: linux_hardening
  level: L2
  question: What is the purpose of SELinux/AppArmor and when does it help?
  answer: Mandatory Access Control (MAC) — restricts what processes can do beyond standard Unix permissions. Even if an attacker
    gets shell as www-data, SELinux/AppArmor can prevent reading /etc/shadow or binding to other ports. Use enforcing mode
    in production.
- id: sec-018
  topic: linux_hardening
  level: L1
  question: How do you find all SUID binaries on a system and why does it matter?
  answer: find / -perm -4000 -type f 2>/dev/null. SUID binaries run as the file owner (often root) regardless of who executes
    them. Attackers use them for privilege escalation. Audit the list regularly and remove SUID from any binary that doesn't
    need it (chmod u-s).
- id: sec-019
  topic: incident_response
  level: L2
  question: What should a post-incident review (PIR) document include?
  answer: 1) Timeline of events (detection to resolution). 2) Root cause and contributing factors. 3) What went well and what
    didn't. 4) Concrete action items with owners and deadlines. Focus on systems and processes, not blame. Share findings
    widely to prevent recurrence.
- id: sec-020
  topic: secrets_management
  level: L2
  question: How do you handle secrets rotation with zero downtime?
  answer: '1) Add the new secret alongside the old one (dual-read). 2) Update the app to accept both. 3) Roll out the new
    secret to all consumers. 4) Remove the old secret. For databases: create new credentials, update connection strings via
    rolling restart, then revoke old credentials.'
- id: tf-001
  topic: terraform
  level: L1
  question: What is Terraform state and why is it critical?
  answer: State maps real infrastructure to your config. Without it Terraform can't know what exists. Store state remotely
    (S3 + DynamoDB lock) for teams. Never edit state manually — use terraform state mv/rm. Lost state means Terraform will
    try to recreate everything.
- id: tf-002
  topic: terraform
  level: L1
  question: What does terraform plan show and why should you always run it?
  answer: Plan shows what Terraform will create, change, or destroy without making changes. It catches drift, unexpected deletions,
    and dependency issues before they hit production. Always review the plan output — especially the destroy count — before
    running apply.
- id: tf-003
  topic: terraform
  level: L2
  question: What is drift in Terraform and how do you detect it?
  answer: 'Drift = real infrastructure differs from state (someone made a manual change). Detect with terraform plan — it
    shows differences. terraform refresh updates state to match reality (but doesn''t fix config). Best practice: run plan
    in CI on a schedule to catch drift early.'
- id: tf-005
  topic: terraform
  level: L2
  question: When should you use terraform import vs writing new config?
  answer: Use import to bring existing resources under Terraform management without recreating them. Write the config first,
    then terraform import <resource> <id>. Use it for brownfield adoption. For new infra, always write config and apply normally.
- id: tf-006
  topic: terraform
  level: L1
  question: How do Terraform modules help with infrastructure code?
  answer: Modules are reusable packages of Terraform config. They enforce standards (e.g., all VPCs get flow logs), reduce
    duplication, and abstract complexity. Pin module versions (source with ?ref=v1.2.0) to prevent surprise changes.
- id: tf-007
  topic: terraform
  level: L2
  question: How do you safely rename a resource in Terraform without destroying it?
  answer: 'Use a moved block (Terraform 1.1+): moved { from = aws_instance.old to = aws_instance.new }. Or: terraform state
    mv aws_instance.old aws_instance.new. Without this, Terraform destroys old and creates new — causing downtime.'
- id: ans-001
  topic: ansible
  level: L1
  question: What does idempotent mean in Ansible and why does it matter?
  answer: Idempotent = running the same playbook multiple times produces the same result. Ansible modules check current state
    before acting (e.g., package module won't reinstall if already present). Non-idempotent tasks (shell/command) should use
    creates/removes guards.
- id: ans-003
  topic: ansible
  level: L1
  question: What is the difference between Ansible inventory and playbook?
  answer: Inventory defines WHAT to manage (hosts, groups, variables). Playbook defines WHAT TO DO (tasks, roles, handlers).
    Inventory can be static (INI/YAML file) or dynamic (script/plugin that queries cloud APIs). Keep them separate for reusability.
- id: ans-004
  topic: ansible
  level: L2
  question: How do you test Ansible playbooks before running them in production?
  answer: 1) --check (dry run, shows what would change). 2) --diff (shows file content changes). 3) Molecule for local testing
    with Docker/Vagrant. 4) Run against a staging inventory first. 5) Use assert module to verify expected state after tasks.
- id: ans-005
  topic: ansible
  level: L1
  question: What is the difference between shell and command modules in Ansible?
  answer: command runs a binary directly (no shell features). shell runs through /bin/sh (supports pipes, redirects, env vars).
    Prefer command for security (no shell injection). Use shell only when you need shell features. Both are non-idempotent
    — add creates/removes guards.
- id: ans-006
  topic: ansible
  level: L2
  question: How do you handle secrets in Ansible?
  answer: Use ansible-vault to encrypt sensitive files or variables. ansible-vault encrypt secrets.yml, then reference with
    --ask-vault-pass or --vault-password-file at runtime. For dynamic secrets, integrate with HashiCorp Vault via the hashi_vault
    lookup plugin.
- id: cicd-001
  topic: cicd
  level: L1
  question: What are the typical stages in a CI/CD pipeline?
  answer: 1) Build (compile, install deps). 2) Test (unit, integration, lint). 3) Package (Docker image, artifact). 4) Deploy
    to staging. 5) Acceptance/smoke tests. 6) Deploy to production. Each stage gates the next — fail fast, fix early.
- id: cicd-002
  topic: cicd
  level: L1
  question: What is the difference between an artifact and a package in CI/CD?
  answer: Artifact = any build output (binary, Docker image, test report, log file). Package = a versioned, distributable
    artifact (Docker image with tag, npm package, Helm chart). Packages go to registries; artifacts may be ephemeral. Always
    tag packages with the git SHA or semver.
- id: cicd-003
  topic: cicd
  level: L1
  question: What is the difference between continuous delivery and continuous deployment?
  answer: Continuous delivery = every commit is deployable but requires manual approval for production. Continuous deployment
    = every commit that passes tests deploys to production automatically. Most teams start with delivery and graduate to deployment
    as confidence grows.
- id: cicd-004
  topic: cicd
  level: L2
  question: How do you implement a safe rollback strategy in CI/CD?
  answer: '1) Keep previous artifacts/images available (don''t delete old tags). 2) Use deployment strategies: blue-green
    or canary. 3) Automate rollback on health check failure. 4) Database migrations must be backwards-compatible (expand-contract
    pattern). Fast rollback = deploy the previous known-good artifact.'
- id: cicd-005
  topic: cicd
  level: L1
  question: What are deployment safety patterns to prevent bad releases?
  answer: '1) Canary: route small % of traffic to new version first. 2) Blue-green: run old and new side by side, switch traffic.
    3) Feature flags: deploy code disabled, enable incrementally. 4) Automated smoke tests post-deploy. 5) Auto-rollback on
    error rate spike.'
- id: cicd-006
  topic: cicd
  level: L2
  question: Why should CI pipelines be fast and what is a good target?
  answer: 'Slow CI means slow feedback and context switching. Target: under 10 minutes for the core loop (build + unit tests
    + lint). Use parallelism, caching (dependencies, Docker layers), and split slow integration tests into a separate stage.
    Developers should get feedback before they move on.'
- id: cicd-007
  topic: cicd
  level: L1
  question: What should you NOT store in your CI/CD pipeline config?
  answer: Secrets (API keys, passwords, tokens). Use your CI platform's secret management (GitHub Actions secrets, GitLab
    CI variables marked protected/masked). Never echo secrets in logs. Rotate CI secrets on the same schedule as production
    secrets.
- id: helm-003
  topic: helm
  level: L1
  question: What files make up a minimal Helm chart?
  answer: 'Chart.yaml (metadata: name, version, appVersion), values.yaml (default config), and templates/ directory with at
    least one template (e.g., deployment.yaml). charts/ holds dependencies.'
- id: helm-004
  topic: helm
  level: L1
  question: How does Helm values precedence work when multiple sources are provided?
  answer: 'Left to right, last wins: chart values.yaml < parent chart values < -f file1.yaml < -f file2.yaml < --set flags.
    --set always wins. Use helm get values to see the final merged result.'
- id: helm-005
  topic: helm
  level: L1
  question: What does helm template do and why is it useful?
  answer: Renders templates locally without contacting the cluster. Shows the exact YAML that would be applied. Essential
    for debugging template logic, CI validation, and code review of chart changes.
- id: helm-006
  topic: helm
  level: L2
  question: What is the difference between helm upgrade and helm install?
  answer: install creates a new release (fails if it exists). upgrade updates an existing release (fails if it doesn't exist).
    upgrade --install does both — idempotent, preferred in CI/CD pipelines.
- id: helm-007
  topic: helm
  level: L1
  question: How do you roll back a failed Helm release?
  answer: helm history <release> shows revisions. helm rollback <release> <revision> reverts to that state. Helm keeps release
    history as secrets in the namespace (default 10 revisions).
- id: helm-008
  topic: helm
  level: L2
  question: A helm upgrade succeeded but the pods are crashlooping. Why didn't Helm catch it?
  answer: By default Helm only waits for resources to be submitted to the API server, not for pods to become ready. Use --wait
    to block until pods are Ready, and --timeout to set a deadline. Without --wait, Helm marks success even if pods fail.
- id: helm-009
  topic: helm
  level: L1
  question: How do you pass secrets to a Helm chart without putting them in values files?
  answer: 1) Use --set from CI env vars. 2) Use external secret operators (External Secrets, Sealed Secrets). 3) Reference
    existing K8s secrets in templates. Never commit plaintext secrets in values files.
- id: helm-010
  topic: helm
  level: L2
  question: What are Helm hooks and when would you use them?
  answer: 'Hooks are resources annotated with helm.sh/hook that run at specific lifecycle points (pre-install, post-upgrade,
    pre-delete, etc.). Common uses: DB migrations before upgrade, smoke tests after install, cleanup on delete.'
- id: helm-011
  topic: helm
  level: L2
  question: What is a Helm library chart?
  answer: 'A chart with type: library in Chart.yaml. It contains only named templates (helpers) and no deployable resources.
    Other charts declare it as a dependency and call its templates. Useful for sharing boilerplate (labels, annotations, resource
    templates) across charts.'
- id: helm-012
  topic: helm
  level: L1
  question: How do you manage environment-specific config in Helm?
  answer: 'Use multiple values files (values-dev.yaml, values-staging.yaml, values-prod.yaml) with environment-specific overrides.
    Deploy with: helm upgrade -f values.yaml -f values-<env>.yaml. Keep base defaults in values.yaml.'
- id: helm-013
  topic: gitops
  level: L1
  question: What is GitOps and how does it differ from traditional CI/CD?
  answer: GitOps uses a Git repo as the single source of truth for desired infrastructure state. A controller (Argo CD, Flux)
    continuously reconciles live state to match Git. Traditional CI/CD pushes changes; GitOps pulls desired state. Git history
    becomes the audit log.
- id: helm-014
  topic: gitops
  level: L1
  question: What is drift detection in GitOps?
  answer: The GitOps controller compares live cluster state against the desired state in Git. Any difference is drift — caused
    by manual kubectl edits, other controllers, or admission webhooks mutating resources. The controller reports or auto-corrects
    drift.
- id: helm-015
  topic: gitops
  level: L2
  question: What happens when a GitOps sync fails?
  answer: 'The controller marks the application as OutOfSync or Degraded. It does not keep retrying destructive operations.
    Check: 1) Rendered manifests for errors. 2) Resource validation failures. 3) Webhook rejections. 4) Insufficient RBAC.
    Fix in Git and push — the controller will retry.'
- id: helm-016
  topic: gitops
  level: L2
  question: How do you safely roll back in a GitOps workflow?
  answer: Revert the commit in Git (git revert, not force-push). The GitOps controller detects the new desired state and syncs.
    Alternatively, use the controller's rollback feature (Argo CD UI) for emergencies, but follow up with a Git revert to
    keep Git as source of truth.
- id: helm-017
  topic: gitops
  level: L1
  question: What is the difference between desired state and live state in GitOps?
  answer: Desired state is what's declared in Git (manifests, Helm values). Live state is what's actually running in the cluster.
    The GitOps controller's job is to continuously converge live state toward desired state.
- id: helm-018
  topic: gitops
  level: L2
  question: How do you handle secrets in a GitOps repository?
  answer: 'Never store plaintext secrets in Git. Options: 1) Sealed Secrets (encrypt with public key, controller decrypts).
    2) External Secrets Operator (syncs from Vault/AWS SM). 3) SOPS-encrypted files in Git. The GitOps controller applies
    the decrypted secret.'
- id: helm-019
  topic: gitops
  level: L2
  question: What is a safe rollout pattern in GitOps for a risky change?
  answer: '1) Progressive delivery: Canary or blue-green via Argo Rollouts or Flagger. 2) Sync only to staging first; promote
    to prod after validation. 3) Use sync waves or hooks for ordering. 4) Manual sync approval gates for production.'
- id: helm-020
  topic: gitops
  level: L1
  question: Why is manual kubectl apply discouraged in a GitOps workflow?
  answer: It creates drift — live state diverges from Git. The GitOps controller will either revert the change (if auto-sync)
    or show OutOfSync. All changes should go through Git so they are reviewed, versioned, and auditable.
- id: helm-021
  topic: gitops
  level: L2
  question: How do GitOps sync waves work?
  answer: 'Sync waves (Argo CD) order resource application. Resources with lower wave numbers are applied first and must be
    healthy before higher waves proceed. Use for: namespaces before deployments, CRDs before CRs, config before apps.'
- id: helm-022
  topic: helm
  level: L2
  question: How do you debug a Helm template rendering issue?
  answer: 1) helm template --debug to see rendered output with debug info. 2) helm lint to catch syntax errors. 3) Add {{
    fail }} to test conditionals. 4) Use helm get manifest <release> to see what was actually deployed vs what you expected.
- id: net-014
  topic: arp
  level: L1
  question: What does ARP do and when is it used?
  answer: ARP (Address Resolution Protocol) maps an IP address to a MAC address on a local network. When a host wants to send
    a frame to an IP on the same subnet, it broadcasts an ARP request. The owner replies with its MAC. Results are cached
    in the ARP table.
- id: net-015
  topic: arp
  level: L2
  question: A server can ping its gateway but not hosts on the same subnet. ARP table shows incomplete entries. What's wrong?
  answer: 'The target host is not responding to ARP requests. Check: 1) Target is actually up and on the same VLAN. 2) No
    arp filtering or proxy ARP misconfiguration. 3) Switch port is up and in the correct VLAN. 4) Duplicate IP address conflict.'
- id: net-016
  topic: routing
  level: L1
  question: How does a Linux host decide where to send a packet?
  answer: It checks the routing table (ip route show). The most specific matching prefix wins. If no specific route matches,
    the default gateway (0.0.0.0/0) is used. Routes come from static config, DHCP, or dynamic routing protocols.
- id: net-017
  topic: routing
  level: L2
  question: Traffic between two subnets is failing. Both hosts have correct IPs. What do you check?
  answer: '1) Routing: does each host have a route to the other subnet? 2) Gateway: is the router forwarding (ip_forward=1)?
    3) Firewall rules on the router. 4) Return path: the destination must have a route back. Use traceroute to find where
    packets stop.'
- id: net-018
  topic: nat
  level: L1
  question: What is NAT and why is it used?
  answer: 'NAT (Network Address Translation) rewrites source or destination IPs as packets cross a boundary. SNAT: many internal
    hosts share one public IP for internet access. DNAT: external traffic is forwarded to an internal server (port forwarding).
    NAT also conserves IPv4 addresses.'
- id: net-019
  topic: nat
  level: L2
  question: An application behind NAT can reach the internet but inbound connections fail. Why?
  answer: 'NAT is stateful. Outbound connections create a state entry so replies work. Inbound connections have no state entry
    and are dropped. Fix: add a DNAT/port-forwarding rule, or use a reverse proxy or load balancer with a public IP.'
- id: net-020
  topic: dns
  level: L1
  question: Walk through the DNS resolution flow when a browser requests example.com.
  answer: 1) Browser/OS cache check. 2) Stub resolver queries configured DNS server (from /etc/resolv.conf or DHCP). 3) Recursive
    resolver checks its cache, else queries root -> TLD (.com) -> authoritative NS for example.com. 4) Answer is cached at
    each layer with TTL.
- id: net-021
  topic: dns
  level: L2
  question: DNS resolves correctly from the server but the application gets NXDOMAIN. What do you check?
  answer: '1) App may use a different resolver (e.g., container DNS vs host DNS). 2) /etc/nsswitch.conf order (files before
    dns?). 3) In K8s: ndots setting and search domains cause partial names to be tried with cluster.local suffix first. 4)
    DNS caching layer (systemd-resolved, dnsmasq) may be stale.'
- id: net-022
  topic: mtu
  level: L1
  question: What is MTU and what happens when a packet exceeds it?
  answer: MTU (Maximum Transmission Unit) is the largest frame a link can carry (typically 1500 bytes for Ethernet). If a
    packet exceeds MTU and DF (Don't Fragment) is set, the router drops it and sends ICMP Fragmentation Needed. If DF is not
    set, the packet is fragmented.
- id: net-023
  topic: mtu
  level: L2
  question: Large file transfers fail but small requests work. What network issue should you suspect?
  answer: 'MTU/PMTUD (Path MTU Discovery) problem. Small packets fit in any MTU; large ones hit a link with smaller MTU. If
    ICMP is blocked by a firewall, the sender never learns to reduce packet size. Fix: allow ICMP type 3 code 4, or reduce
    MTU on the sender''s interface.'
- id: net-024
  topic: tcp_ip
  level: L1
  question: Describe the TCP three-way handshake.
  answer: '1) Client sends SYN (picks initial sequence number). 2) Server responds SYN-ACK (acknowledges client''s SYN, picks
    its own sequence number). 3) Client sends ACK. Connection is now ESTABLISHED. If step 2 fails: connection timeout. If
    step 3 fails: server has half-open connection.'
- id: net-025
  topic: tcp_ip
  level: L2
  question: You see many connections in TIME_WAIT on a server. Is this a problem?
  answer: 'TIME_WAIT is normal — it lasts 2*MSL (typically 60s) after active close to handle late packets. It''s a problem
    only if you exhaust ephemeral ports. Mitigate: enable tcp_tw_reuse (safe for clients), use connection pooling, or increase
    the ephemeral port range.'
- id: net-026
  topic: tls_pki
  level: L1
  question: What is TLS termination and where does it typically happen?
  answer: 'TLS termination is where encrypted traffic is decrypted. Typically at the load balancer or ingress controller,
    so backend services handle plain HTTP. Benefits: centralizes cert management, offloads crypto from app servers. Tradeoff:
    traffic between LB and backend is unencrypted unless you use re-encryption.'
- id: net-027
  topic: tls_pki
  level: L2
  question: A TLS handshake fails with 'certificate verify failed'. What do you check?
  answer: '1) Certificate expired (openssl x509 -enddate). 2) Wrong CA bundle on the client. 3) CN/SAN doesn''t match the
    hostname. 4) Intermediate cert missing from the chain. 5) Clock skew between client and server. Use: openssl s_client
    -connect host:443 to inspect the chain.'
- id: net-029
  topic: load_balancing
  level: L2
  question: Some backends are slow but the load balancer keeps sending them traffic. Why?
  answer: 'Default round-robin doesn''t consider backend health or latency. Fix: 1) Enable active health checks so unhealthy
    backends are removed. 2) Use least-connections algorithm. 3) Set request timeouts so slow backends don''t hold connections.
    4) Check if keep-alive is pinning connections.'
- id: net-030
  topic: firewalls
  level: L1
  question: How do you troubleshoot a firewall blocking traffic on Linux?
  answer: 1) iptables -L -n -v or nft list ruleset to see rules and hit counters. 2) Check the LOG target or nftables log
    for dropped packets. 3) Temporarily add an ACCEPT rule to confirm the firewall is the issue. 4) Check security groups
    / NACLs if in cloud.
- id: net-031
  topic: firewalls
  level: L2
  question: A service works from one host but not another. Both are on the same subnet. What do you check?
  answer: 1) Host firewall rules differ (iptables/nftables on the target). 2) Source-based rules (only certain IPs allowed).
    3) SELinux or AppArmor blocking the port. 4) Network policies (in K8s). 5) Check with tcpdump on both sides to see if
    packets arrive but are dropped.
- id: net-033
  topic: packet_path
  level: L2
  question: How do you trace the path of a packet through a Linux system?
  answer: '1) tcpdump on the interface to confirm arrival. 2) conntrack -L to check NAT/state table. 3) iptables -L -v counters
    to see which chain processes it. 4) ip route get <dst> to check routing decision. 5) ss -tlnp to verify the listening
    process. Trace: NIC -> iptables PREROUTING -> routing -> FORWARD or INPUT -> app.'
- id: net-032
  topic: packet_path
  level: L1
  question: A curl request times out. How do you systematically narrow down where the problem is?
  answer: '1) DNS: does dig resolve? 2) Connectivity: does ping/nc reach the port? 3) Routing: does traceroute show where
    packets stop? 4) Firewall: check iptables on both ends. 5) Service: is the process listening (ss -tlnp)? 6) TLS: does
    openssl s_client connect? Narrow from L3 up to L7.'
- id: storage-001
  topic: raid
  level: L1
  question: What is the difference between RAID 1, RAID 5, and RAID 10?
  answer: 'RAID 1: mirroring, 50% usable capacity, survives 1 disk loss. RAID 5: striping with parity, (N-1) usable disks,
    survives 1 disk loss, write penalty from parity calc. RAID 10: striped mirrors, 50% capacity, survives 1 disk per mirror
    pair, best write performance.'
- id: storage-002
  topic: raid
  level: L2
  question: Why is RAID 5 risky with large modern disks?
  answer: Rebuild time on large disks (4TB+) can take hours to days. During rebuild, a second disk failure or an unrecoverable
    read error (URE) destroys the array. RAID 6 (dual parity) or RAID 10 is safer for large disks.
- id: storage-003
  topic: raid
  level: L1
  question: RAID is not a backup. Explain why.
  answer: RAID protects against disk failure, not data loss. Accidental deletion, corruption, ransomware, and controller failure
    affect all RAID members. Backups are separate copies stored independently, ideally offsite.
- id: storage-004
  topic: filesystems_storage
  level: L1
  question: What are the key differences between ext4 and XFS?
  answer: 'ext4: mature, supports online resize (grow only), max 1EB volume. XFS: better for large files and parallel I/O,
    supports online defrag, no shrink. Both are journaling filesystems. XFS is default on RHEL; ext4 on Debian/Ubuntu.'
- id: storage-005
  topic: filesystems_storage
  level: L1
  question: What is a journaling filesystem and why does it matter?
  answer: A journal logs pending writes before committing them to disk. On crash, the journal replays or discards incomplete
    transactions, preventing filesystem corruption. Without journaling, fsck must scan the entire disk after an unclean shutdown.
- id: storage-007
  topic: filesystems_storage
  level: L2
  question: How do you find which directory is consuming the most inodes?
  answer: 'find / -xdev -printf ''%h\n'' | sort | uniq -c | sort -rn | head -20. This counts files per directory. Also: for
    d in /*; do echo $(find $d -xdev | wc -l) $d; done for a quick top-level breakdown.'
- id: storage-008
  topic: filesystems_storage
  level: L1
  question: A server is reporting 'No space left on device' but df shows free space. What do you check?
  answer: 1) Inode exhaustion (df -i). 2) Deleted files still held open by processes (lsof +D /mount | grep deleted) — space
    is not freed until the process closes the file handle. 3) Reserved blocks (tune2fs -l, typically 5% reserved for root).
- id: storage-009
  topic: filesystems_storage
  level: L1
  question: How do you troubleshoot a filesystem that won't mount?
  answer: '1) Check dmesg for errors. 2) Verify the device exists (lsblk). 3) Check filesystem type matches mount command
    (-t). 4) Run fsck on unmounted filesystem. 5) Check /etc/fstab for typos. 6) For NFS: verify server is reachable and export
    exists (showmount -e).'
- id: storage-010
  topic: filesystems_storage
  level: L2
  question: A server hangs at boot with a mount error. How do you recover?
  answer: 'An /etc/fstab entry with default options will block boot if the device is missing. Fix: 1) Boot to rescue/single-user
    mode. 2) Edit /etc/fstab — add nofail option to non-critical mounts. 3) For NFS: add nofail,bg so mounts retry in background.'
- id: storage-011
  topic: backup_restore
  level: L1
  question: What is the difference between a backup and a snapshot?
  answer: 'Snapshot: point-in-time copy, usually on the same storage (fast, but shares failure domain). Backup: independent
    copy on separate media/location (slower, but survives hardware failure). Snapshots complement but do not replace backups.'
- id: storage-012
  topic: backup_restore
  level: L2
  question: What are the differences between full, incremental, and differential backups?
  answer: 'Full: copies everything (slow, large). Incremental: copies only changes since last backup of any type (fast, small,
    but restore requires full + all incrementals). Differential: copies changes since last full (medium, restore needs full
    + latest differential).'
- id: storage-013
  topic: backup_restore
  level: L1
  question: How do you validate that a backup is restorable?
  answer: Regularly perform test restores to a non-production environment. Verify data integrity (checksums, row counts).
    Confirm application can start and serve traffic on restored data. Automate restore tests on a schedule. An untested backup
    is not trustworthy.
- id: storage-014
  topic: replication
  level: L1
  question: What is the difference between synchronous and asynchronous replication?
  answer: 'Synchronous: write is acknowledged only after replica confirms — zero data loss but higher latency. Asynchronous:
    write is acknowledged immediately, replica catches up later — lower latency but risk of data loss on primary failure.'
- id: storage-015
  topic: replication
  level: L2
  question: A database replica shows increasing replication lag. What do you investigate?
  answer: 1) Replica hardware (CPU, IO, network) may be undersized. 2) Long-running write queries on primary generating huge
    WAL/binlog. 3) Replica applying single-threaded (enable parallel replication). 4) Network bandwidth between primary and
    replica. 5) Heavy read queries on replica competing for IO.
- id: storage-016
  topic: database_internals
  level: L1
  question: What are the ACID properties of a database transaction?
  answer: 'Atomicity: all or nothing. Consistency: transaction leaves DB in valid state. Isolation: concurrent transactions
    don''t interfere. Durability: committed data survives crashes. Together they guarantee reliable transaction processing.'
- id: storage-017
  topic: database_internals
  level: L2
  question: What are common database isolation levels and their tradeoffs?
  answer: 'Read Uncommitted: fastest, sees dirty reads. Read Committed: no dirty reads, but non-repeatable reads possible.
    Repeatable Read: consistent reads within transaction, but phantom rows possible. Serializable: full isolation, lowest
    concurrency. Most apps use Read Committed as default.'
- id: storage-018
  topic: database_internals
  level: L1
  question: Why do database indexes speed up reads but slow down writes?
  answer: Indexes are additional data structures (B-trees, hash maps) that the DB must update on every INSERT/UPDATE/DELETE.
    More indexes = more write overhead. But queries can use indexes to avoid full table scans, dramatically improving read
    performance.
- id: storage-019
  topic: database_internals
  level: L2
  question: How do you identify missing indexes in a slow database?
  answer: '1) EXPLAIN/EXPLAIN ANALYZE on slow queries — look for sequential scans on large tables. 2) Check slow query log.
    3) pg_stat_user_tables (PostgreSQL) shows seq_scan vs idx_scan ratios. 4) MySQL: performance_schema or SHOW STATUS LIKE
    ''Handler_read%''.'
- id: storage-020
  topic: database_internals
  level: L1
  question: What causes database lock contention and how do you detect it?
  answer: 'Lock contention occurs when multiple transactions compete for the same rows/tables. Symptoms: slow queries, timeouts,
    deadlocks. Detect: pg_stat_activity (PostgreSQL), SHOW PROCESSLIST (MySQL), or SHOW ENGINE INNODB STATUS for deadlock
    info.'
- id: storage-021
  topic: database_internals
  level: L2
  question: How do you resolve a database deadlock?
  answer: 'The DB automatically kills one transaction (the victim). To prevent: 1) Access tables/rows in consistent order.
    2) Keep transactions short. 3) Use lower isolation level if acceptable. 4) Add appropriate indexes to reduce lock scope.
    5) Retry logic in the application for deadlock errors.'
- id: storage-022
  topic: replication
  level: L1
  question: What is the operational difference between a read replica and the primary?
  answer: Primary handles all writes and reads. Read replica receives replicated data and serves only read queries — reduces
    primary load. Replicas have lag (seconds to minutes). Don't read from a replica when you need write-after-read consistency.
- id: storage-023
  topic: replication
  level: L2
  question: When should you NOT use a read replica for a query?
  answer: 'When the query needs up-to-the-second consistency (e.g., reading data just written). Also: when the query is heavy
    enough to impact replica replication (lag increases). And: for any write operations — replicas are read-only.'
- id: storage-024
  topic: database_internals
  level: L1
  question: What are common operational database mistakes?
  answer: 1) No backups or untested backups. 2) Running ALTER TABLE on a large table during peak hours (locks). 3) Missing
    indexes on frequently queried columns. 4) Not monitoring replication lag. 5) Storing secrets in plaintext columns. 6)
    No connection pooling (exhausting max_connections).
- id: storage-025
  topic: database_internals
  level: L2
  question: How do you safely run a schema migration on a production database?
  answer: 1) Test migration on a copy of production data first. 2) Use online DDL tools (pt-online-schema-change, gh-ost for
    MySQL) to avoid locking. 3) Run during low-traffic window. 4) Have a rollback plan. 5) Monitor replication lag and application
    errors during migration. 6) Take a backup before starting.
- id: gitops-001
  topic: gitops
  level: L1
  question: What is the core principle of GitOps?
  answer: Git is the single source of truth for desired state. An operator (ArgoCD, Flux) continuously reconciles the live
    cluster to match the declared state in Git. Changes happen via pull requests, not manual kubectl commands.
- id: gitops-002
  topic: gitops
  level: L1
  question: What is the difference between push-based and pull-based GitOps?
  answer: 'Push: CI pipeline applies changes to the cluster (e.g., kubectl apply in Jenkins). Pull: an in-cluster operator
    polls Git and applies changes itself (ArgoCD, Flux). Pull is more secure — no external system needs cluster credentials.'
- id: gitops-003
  topic: gitops
  level: L1
  question: What is 'drift' in GitOps and how is it handled?
  answer: 'Drift = live state differs from desired state in Git. Causes: manual kubectl edits, external controllers, failed
    syncs. The GitOps operator detects drift and either auto-corrects or alerts. ArgoCD shows OutOfSync status; Flux logs
    drift events.'
- id: gitops-004
  topic: gitops
  level: L2
  question: An ArgoCD application shows OutOfSync but auto-sync is enabled. What do you check?
  answer: 1) Sync errors in the app status (failed hooks, resource conflicts). 2) Retry policy — auto-sync retries may be
    exhausted. 3) Resource exclusions in ArgoCD config. 4) Mutating webhooks or controllers modifying resources after sync
    (causes perpetual drift). 5) Diff shows fields ArgoCD can't control — add ignoreDifferences.
- id: gitops-005
  topic: gitops
  level: L1
  question: How do you safely roll back a deployment in GitOps?
  answer: Revert the commit in Git (git revert) and let the operator reconcile. Do NOT manually kubectl rollout undo — that
    creates drift. In an emergency, you can sync to a specific Git revision in ArgoCD, but follow up with a proper Git revert.
- id: gitops-006
  topic: gitops
  level: L2
  question: How do you handle secrets in a GitOps workflow?
  answer: 'Options: 1) Sealed Secrets — encrypt in Git, controller decrypts in cluster. 2) External Secrets Operator — references
    secrets from Vault/AWS SM. 3) SOPS — encrypt YAML values, decrypt during sync. Never store plaintext secrets in Git, even
    in private repos.'
- id: gitops-007
  topic: gitops
  level: L1
  question: What is the difference between ArgoCD Application and ApplicationSet?
  answer: Application = one ArgoCD app managing one set of manifests for one target. ApplicationSet = a template that generates
    multiple Applications dynamically (e.g., one per cluster, per environment, or per team). Reduces boilerplate for multi-cluster
    deployments.
- id: gitops-008
  topic: gitops
  level: L2
  question: What happens if you delete a resource from Git in a GitOps workflow?
  answer: 'Depends on prune policy. With pruning enabled, the operator deletes the resource from the cluster. Without pruning,
    the resource becomes an orphan (exists in cluster but not in Git). ArgoCD shows it as ''OutOfSync — missing in Git''.
    Best practice: enable pruning with caution.'
- id: gitops-009
  topic: gitops
  level: L2
  question: How do you implement progressive delivery with GitOps?
  answer: Use Argo Rollouts or Flagger alongside ArgoCD/Flux. Define canary or blue-green strategy in Rollout resources. The
    rollout controller manages traffic shifting and promotion. Integrate with metrics (Prometheus) for automated analysis
    and rollback on error rate thresholds.
- id: gitops-010
  topic: gitops
  level: L1
  question: Why is it important to separate app config repos from app code repos in GitOps?
  answer: 1) Deployment frequency differs from code change frequency. 2) Avoids triggering unnecessary CI builds when only
    config changes. 3) Different access controls — SRE team manages config, dev team manages code. 4) Clear audit trail for
    infrastructure changes.
- id: gitops-011
  topic: gitops
  level: L2
  question: How do you manage multiple environments (dev/staging/prod) in GitOps?
  answer: 'Options: 1) Directory per environment (envs/dev/, envs/prod/) with Kustomize overlays. 2) Branch per environment
    (not recommended — merge conflicts). 3) Helm values files per environment. 4) ApplicationSet generators with cluster/env
    labels. Best practice: directory or overlay approach.'
- id: gitops-012
  topic: gitops
  level: L2
  question: What are common causes of GitOps sync failures?
  answer: 1) Invalid YAML/manifests (syntax errors). 2) Namespace doesn't exist. 3) CRD not installed (resource type unknown).
    4) RBAC — operator service account lacks permissions. 5) Resource conflicts (another controller owns the resource). 6)
    Immutable field changes (e.g., Job spec). 7) Webhook rejections.
- id: gitops-013
  topic: gitops
  level: L1
  question: What is reconciliation in GitOps?
  answer: The continuous loop where the operator compares desired state (Git) with actual state (cluster) and takes action
    to converge them. Reconciliation runs on a schedule (e.g., every 3 minutes) and on Git webhook events. It is the core
    feedback loop that makes GitOps self-healing.
- id: gitops-014
  topic: gitops
  level: L2
  question: How do you debug why an ArgoCD sync is slow?
  answer: 1) Check if many resources are being synced (break into smaller apps). 2) Look for sync waves/hooks that block progression.
    3) Check ArgoCD controller resource usage (CPU/memory). 4) Verify Git repo is accessible and not rate-limited. 5) Check
    for large manifests or Helm charts with many templates.
- id: gitops-015
  topic: gitops
  level: L1
  question: What are sync waves and hooks in ArgoCD?
  answer: 'Sync waves control the order of resource creation (lower wave number = applied first). Hooks run at specific phases:
    PreSync, Sync, PostSync, SyncFail. Use waves for dependencies (namespace before deployment). Use hooks for migrations,
    tests, or notifications.'
- id: cloud-aws-001
  topic: aws_troubleshooting
  level: L1
  question: An EC2 instance can't reach the internet. What do you check?
  answer: 1) Public IP or Elastic IP assigned? 2) Route table has 0.0.0.0/0 pointing to an Internet Gateway. 3) Security group
    allows outbound traffic. 4) NACL allows outbound AND return inbound traffic (NACLs are stateless). 5) Instance is in a
    public subnet. For private subnets, check NAT gateway.
- id: cloud-aws-002
  topic: aws_troubleshooting
  level: L2
  question: IAM policy simulator says Allow but the API call returns Access Denied. What is happening?
  answer: 'Policy simulator does not evaluate: 1) Service Control Policies (SCPs). 2) VPC endpoint policies. 3) S3 bucket
    policies with conditions. 4) Permission boundaries. 5) Session policies. 6) Resource-based policy conditions (aws:SourceIp,
    aws:SourceVpc). Check CloudTrail for the exact deny reason.'
- id: cloud-aws-003
  topic: aws_troubleshooting
  level: L1
  question: What is the difference between Security Groups and NACLs?
  answer: 'Security Groups: stateful (return traffic auto-allowed), instance-level, allow rules only, evaluated as a group.
    NACLs: stateless (must allow both directions), subnet-level, allow AND deny rules, evaluated in order. Most issues come
    from NACLs blocking return traffic.'
- id: cloud-aws-004
  topic: aws_troubleshooting
  level: L2
  question: An EKS pod can't reach an RDS instance in the same VPC. What do you check?
  answer: 1) RDS security group allows inbound from the pod's security group or CIDR. 2) Pod is in a subnet that can route
    to the RDS subnet. 3) DNS resolution works (RDS endpoint resolves). 4) NACLs between subnets. 5) If using IAM auth, the
    pod's service account/IRSA role has rds-db:connect permission.
- id: cloud-aws-005
  topic: aws_troubleshooting
  level: L1
  question: An S3 PutObject call fails with Access Denied. The IAM policy allows s3:PutObject. What else could block it?
  answer: 1) Bucket policy with explicit deny. 2) Bucket has Block Public Access enabled and the request looks public. 3)
    Object-level ACL conflicts. 4) AWS Organizations SCP. 5) VPC endpoint policy restricting the bucket. 6) Wrong account
    — bucket is in a different account and cross-account access isn't configured.
- id: cloud-aws-006
  topic: aws_troubleshooting
  level: L1
  question: ALB returns 504 Gateway Timeout. What do you investigate?
  answer: 1) Backend targets are healthy? Check target group health. 2) Backend is actually responding within the ALB idle
    timeout (default 60s). 3) Security group allows traffic from ALB to target on the correct port. 4) Application is listening
    on the port the target group expects. 5) Backend is overloaded and not responding in time.
- id: cloud-aws-007
  topic: aws_troubleshooting
  level: L2
  question: EC2 instance fails to start with InsufficientInstanceCapacity. What do you do?
  answer: 1) Try a different Availability Zone. 2) Try a different instance type in the same family. 3) Use a capacity reservation
    if the instance type is critical. 4) Wait and retry — capacity is dynamic. 5) For spot instances, diversify instance types
    and AZs. 6) Consider On-Demand Capacity Reservations for consistent availability.
- id: cloud-aws-008
  topic: aws_troubleshooting
  level: L1
  question: How do you debug DNS resolution issues in AWS?
  answer: '1) Check if the VPC has DNS resolution enabled (enableDnsSupport). 2) Check if DNS hostnames are enabled (enableDnsHostnames).
    3) Verify Route 53 private hosted zone is associated with the VPC. 4) Check DHCP options set for custom DNS. 5) From EC2:
    dig @169.254.169.253 hostname to test VPC resolver directly.'
- id: cloud-aws-009
  topic: aws_troubleshooting
  level: L2
  question: CloudWatch shows high CPU on an RDS instance but the app team says query volume hasn't changed. What do you check?
  answer: 1) Slow query log — a missing index or bad query plan can spike CPU. 2) Check for lock contention (deadlocks cause
    retries). 3) Maintenance window running (vacuum, analyze, backups). 4) Parameter group change causing recomputation. 5)
    Replication lag causing replay pressure on a read replica. 6) Check Performance Insights for top SQL.
- id: cloud-aws-010
  topic: aws_troubleshooting
  level: L1
  question: What is the difference between EBS and instance store?
  answer: 'EBS: persistent network-attached storage, survives stop/start, supports snapshots. Instance store: ephemeral local
    NVMe/SSD, lost on stop/terminate/hardware failure, highest IOPS. Use EBS for data that must persist. Use instance store
    for caches, temp files, or when you replicate at the application layer.'
- id: cloud-gcp-001
  topic: gcp_troubleshooting
  level: L1
  question: A GCE instance can't reach the internet. What do you check?
  answer: 1) Instance has an external IP or Cloud NAT is configured for the subnet. 2) VPC firewall rules allow egress (default
    allows all egress, but custom rules may deny). 3) Routes exist for 0.0.0.0/0 to the internet gateway. 4) The instance's
    service account has no org policy blocking internet access.
- id: cloud-gcp-002
  topic: gcp_troubleshooting
  level: L2
  question: A GKE pod gets Permission Denied when calling a GCP API. What do you check?
  answer: 1) Workload Identity is configured — pod's KSA is bound to a GSA. 2) The GSA has the required IAM roles. 3) The
    KSA annotation matches the GSA email exactly. 4) Workload Identity pool is enabled on the cluster. 5) The node pool has
    the correct scope (if not using Workload Identity, check node SA).
- id: cloud-gcp-003
  topic: gcp_troubleshooting
  level: L1
  question: What is the difference between GCP firewall rules and Cloud Armor?
  answer: 'Firewall rules: VPC-level, filter by IP/port/protocol/tags/service accounts, apply to instances. Cloud Armor: WAF/DDoS
    protection at the load balancer layer, supports geo-blocking, rate limiting, and OWASP rules. Use firewall rules for network
    segmentation; Cloud Armor for application-layer protection.'
- id: cloud-gcp-004
  topic: gcp_troubleshooting
  level: L1
  question: How do you debug IAM permission issues in GCP?
  answer: 1) Use Policy Troubleshooter in Cloud Console (explains allow/deny). 2) Check IAM bindings at project, folder, and
    org levels. 3) Look for deny policies (newer feature, explicit denies). 4) Verify the correct service account is being
    used. 5) Check org policies that may restrict permissions.
- id: cloud-gcp-005
  topic: gcp_troubleshooting
  level: L2
  question: Cloud SQL connectivity fails from a GKE cluster. What do you investigate?
  answer: '1) Cloud SQL Auth Proxy sidecar is running and healthy. 2) The proxy uses the correct instance connection name.
    3) The GKE workload''s SA has roles/cloudsql.client. 4) Private IP: Cloud SQL and GKE are in the same VPC or peered VPC.
    5) Public IP: authorized networks include the GKE node/pod IPs.'
- id: cloud-gcp-006
  topic: gcp_troubleshooting
  level: L1
  question: A GCE instance starts but SSH fails with 'Connection refused'. What do you check?
  answer: 1) Firewall rule allows tcp:22 from your IP (default-allow-ssh may have been deleted). 2) Instance has an external
    IP or you're using IAP tunnel. 3) sshd is running (check serial console output). 4) OS Login is configured and your user
    has the login role. 5) Disk is not full (prevents sshd from accepting sessions).
- id: cloud-gcp-007
  topic: gcp_troubleshooting
  level: L2
  question: GCE instance metadata shows the correct startup script but it didn't run. What do you check?
  answer: 1) Check serial port output (console log) for startup script errors. 2) Verify the script is in the correct metadata
    key (startup-script vs startup-script-url). 3) Check if the script has execution errors (missing dependencies, wrong shebang).
    4) Startup scripts run as root — check for permission issues in the script logic.
- id: cloud-gcp-008
  topic: gcp_troubleshooting
  level: L1
  question: What is Cloud NAT and when do you need it?
  answer: Cloud NAT provides outbound internet access for instances without external IPs. It's a managed NAT gateway at the
    VPC level. You need it when instances in private subnets must reach external APIs, package repos, or services but should
    not be directly reachable from the internet.
- id: cloud-gcp-009
  topic: gcp_troubleshooting
  level: L2
  question: A Pub/Sub subscription has increasing unacked message backlog. What do you investigate?
  answer: 1) Subscriber is running and processing messages. 2) Subscriber is acking messages (check for processing errors
    that skip ack). 3) Ack deadline is sufficient — messages redeliver if not acked in time. 4) Subscriber throughput vs publish
    rate. 5) Dead letter topic configured for poison messages. 6) Subscriber autoscaling is working.
- id: cloud-gcp-010
  topic: gcp_troubleshooting
  level: L1
  question: How do you investigate failed requests in GCP?
  answer: '1) Cloud Logging: filter by resource type, severity, and time range. 2) Error Reporting: auto-groups exceptions
    from supported languages. 3) Cloud Trace: distributed tracing for latency analysis. 4) Cloud Monitoring: metrics dashboards
    and alerting. 5) Load balancer logs for HTTP errors.'
- id: cloud-az-001
  topic: azure_troubleshooting
  level: L1
  question: An Azure VM can't reach the internet. What do you check?
  answer: '1) VM has a public IP or outbound NAT rule. 2) NSG allows outbound traffic on the required port. 3) Route table
    has a default route to the internet. 4) Azure Firewall or NVA is not blocking traffic. 5) Note: Azure default outbound
    access is being deprecated — use NAT Gateway or LB outbound rules.'
- id: cloud-az-002
  topic: azure_troubleshooting
  level: L2
  question: An AKS pod can't connect to an Azure SQL Database. What do you investigate?
  answer: 1) Azure SQL firewall allows the AKS subnet or VNet. 2) Private endpoint is configured if using private connectivity.
    3) AKS pod identity (workload identity) has the correct RBAC. 4) Connection string uses the correct server FQDN. 5) NSG
    on AKS subnet allows outbound to port 1433. 6) DNS resolves the private endpoint correctly.
- id: cloud-az-003
  topic: azure_troubleshooting
  level: L1
  question: What is the difference between NSG and Azure Firewall?
  answer: 'NSG: basic L3/L4 filtering (IP, port, protocol) at subnet or NIC level, free. Azure Firewall: managed L3-L7 firewall
    with FQDN filtering, threat intelligence, TLS inspection, centralized logging, paid service. Use NSG for basic segmentation;
    Azure Firewall for advanced inspection and centralized policy.'
- id: cloud-az-004
  topic: azure_troubleshooting
  level: L1
  question: How do you debug RBAC permission issues in Azure?
  answer: 1) Check role assignments at resource, resource group, and subscription scope. 2) Use 'Check access' in the portal
    on the specific resource. 3) Look for deny assignments. 4) Verify the correct identity (user, SP, managed identity) is
    being used. 5) Check if a custom role has the required actions/dataActions.
- id: cloud-az-005
  topic: azure_troubleshooting
  level: L2
  question: Azure VM boots but RDP/SSH fails. What do you check?
  answer: 1) NSG allows inbound on port 22 (SSH) or 3389 (RDP) from your IP. 2) VM is running (not stopped/deallocated). 3)
    Boot diagnostics — check serial console for OS-level errors. 4) Azure Bastion as alternative if direct access is blocked.
    5) VM guest agent is healthy. 6) OS-level firewall (Windows Firewall, iptables) isn't blocking.
- id: cloud-az-006
  topic: azure_troubleshooting
  level: L1
  question: What is the difference between Azure Load Balancer and Application Gateway?
  answer: 'Load Balancer: L4 (TCP/UDP), no SSL termination, no path-based routing, very fast. Application Gateway: L7 (HTTP/HTTPS),
    SSL termination, path/host-based routing, WAF integration, URL rewrites. Use LB for non-HTTP or internal traffic; App
    Gateway for web applications.'
- id: cloud-az-007
  topic: azure_troubleshooting
  level: L2
  question: An Azure Function times out sporadically. What do you investigate?
  answer: '1) Check execution timeout setting (Consumption plan default: 5 min, max 10 min). 2) Cold start — function is initializing
    from scratch. 3) Downstream dependency latency (database, API calls). 4) Premium plan for pre-warmed instances. 5) Application
    Insights for execution traces and dependency call durations.'
- id: cloud-az-008
  topic: azure_troubleshooting
  level: L1
  question: How do you troubleshoot Azure storage account access issues?
  answer: 1) Check network rules — storage firewall may restrict to specific VNets/IPs. 2) Verify SAS token or access key
    is valid and not expired. 3) Check container/blob access level (private, blob, container). 4) RBAC role assignments for
    Azure AD auth. 5) Private endpoint DNS resolution if using private connectivity.
- id: cloud-az-009
  topic: azure_troubleshooting
  level: L2
  question: VNet peering is configured but traffic between VNets doesn't flow. What do you check?
  answer: 1) Peering status is 'Connected' on BOTH sides. 2) 'Allow forwarded traffic' and 'Allow gateway transit' settings
    match on both peers. 3) Route tables don't have conflicting UDRs. 4) NSGs allow traffic between the VNets. 5) Address
    spaces don't overlap. 6) If using hub-spoke, check 'Use remote gateways' setting.
- id: cloud-az-010
  topic: azure_troubleshooting
  level: L1
  question: How do you investigate application errors in Azure?
  answer: '1) Application Insights: exception telemetry, dependency tracking, request traces. 2) Azure Monitor Logs (Log Analytics):
    KQL queries on collected logs. 3) Diagnostic settings on the resource to route logs to Log Analytics. 4) Activity Log
    for control-plane operations. 5) Resource Health for platform-level issues.'
- id: crt-001
  topic: container_runtime
  level: L1
  question: What is the relationship between containerd, runc, and the shim?
  answer: containerd is the high-level runtime (image management, container lifecycle). runc is the low-level runtime that
    creates the actual container (sets up namespaces, cgroups). The shim (containerd-shim) sits between them — it parents
    the container process so containerd can restart without killing containers.
- id: crt-002
  topic: container_runtime
  level: L1
  question: What Linux kernel features do containers rely on?
  answer: 'Namespaces (isolation: PID, network, mount, UTS, IPC, user) and cgroups (resource limits: CPU, memory, I/O). Namespaces
    make the container think it''s alone; cgroups prevent it from consuming all host resources. Containers are NOT VMs — they
    share the host kernel.'
- id: crt-003
  topic: container_runtime
  level: L2
  question: A container is killed with OOMKilled but the application reports using less memory than the limit. Why?
  answer: 1) The limit applies to the entire cgroup, not just the app heap — includes page cache, tmpfs, kernel buffers. 2)
    Child processes in the same cgroup count toward the limit. 3) Memory accounting includes RSS + cache. Check /sys/fs/cgroup/memory.current
    vs memory.max inside the container.
- id: crt-004
  topic: container_runtime
  level: L1
  question: What happens when you docker exec into a running container?
  answer: A new process is started inside the container's existing namespaces (PID, network, mount, etc.). It joins the same
    cgroup. The exec'd process sees the same filesystem and network as the main process. It does NOT create a new container
    — it adds a process to an existing one.
- id: crt-005
  topic: container_runtime
  level: L2
  question: How do container image layers work and why do they matter for image size?
  answer: Each Dockerfile instruction creates a layer (read-only). Layers are stacked using overlay filesystems (overlayfs).
    Shared base layers are pulled only once. A writable layer is added at runtime. Large layers (installing then deleting
    packages in separate RUN instructions) waste space — combine in a single RUN to keep images small.
- id: crt-006
  topic: container_runtime
  level: L1
  question: Where do container stdout/stderr logs go?
  answer: The container runtime captures stdout/stderr from PID 1 and writes to a log file (e.g., /var/log/containers/ on
    Kubernetes nodes). The logging driver determines format and destination. In Kubernetes, kubectl logs reads these files.
    Applications should log to stdout/stderr, not to files inside the container.
- id: crt-007
  topic: container_runtime
  level: L2
  question: A container image pull fails with 'manifest unknown' or 'not found'. What do you check?
  answer: 1) Image tag exists in the registry (tags are mutable — it may have been overwritten or deleted). 2) Correct registry
    URL and repository path. 3) Architecture mismatch (amd64 vs arm64 manifest). 4) Registry authentication (private repo,
    expired token). 5) Image was built but never pushed.
- id: crt-008
  topic: container_runtime
  level: L1
  question: What is the OCI specification?
  answer: Open Container Initiative defines standards for container images (image-spec) and runtimes (runtime-spec). Ensures
    images built with any tool (Docker, Buildah, kaniko) run on any OCI-compliant runtime (runc, crun, gVisor). It's what
    makes the container ecosystem interoperable.
- id: crt-009
  topic: container_runtime
  level: L2
  question: What is seccomp in the context of containers?
  answer: Seccomp (Secure Computing Mode) filters which syscalls a process can make. Docker's default seccomp profile blocks
    ~44 dangerous syscalls (e.g., reboot, mount, kernel module loading). Custom profiles can be stricter. In Kubernetes, set
    via securityContext.seccompProfile. Running without seccomp (Unconfined) increases attack surface.
- id: crt-010
  topic: container_runtime
  level: L1
  question: Why should containers run as non-root?
  answer: 'Root in a container is UID 0 on the host. A container breakout as root gives host-level root access. Run as non-root
    (USER directive in Dockerfile) to limit blast radius. Kubernetes can enforce this with runAsNonRoot: true and pod security
    standards.'
- id: crt-011
  topic: container_runtime
  level: L2
  question: How does container networking work at a low level?
  answer: Each container gets its own network namespace with a virtual ethernet pair (veth). One end is in the container namespace,
    the other is on the host bridge (e.g., docker0, cbr0). NAT/iptables rules handle port mapping and inter-container routing.
    In Kubernetes, the CNI plugin manages this (Calico, Cilium, Flannel).
- id: crt-012
  topic: container_runtime
  level: L2
  question: What is the difference between ENTRYPOINT and PID 1 signal handling in containers?
  answer: 'PID 1 in Linux has special signal behavior — it ignores signals unless it explicitly handles them. If your app
    runs as PID 1 (ENTRYPOINT), SIGTERM may be ignored and the container gets killed after the grace period. Fix: use tini
    or dumb-init as PID 1 to properly forward signals, or handle signals in your app.'
- id: crt-013
  topic: container_runtime
  level: L1
  question: What are common causes of container runtime failures?
  answer: 1) Disk full on the node (image storage, container logs). 2) containerd/dockerd is down or unresponsive. 3) Image
    pull failures (auth, network, missing tag). 4) Resource exhaustion (too many containers, PID limits). 5) Corrupted image
    layers. 6) Socket permission issues (/var/run/containerd/containerd.sock).
- id: crt-014
  topic: container_runtime
  level: L2
  question: How do you debug a container that exits immediately after starting?
  answer: '1) Check logs: docker logs / kubectl logs (may be empty if crash is instant). 2) Check exit code: 0 = normal exit
    (CMD finished), 1 = app error, 137 = OOMKilled/SIGKILL, 139 = segfault. 3) Run interactively: docker run -it --entrypoint
    /bin/sh image. 4) Check if CMD/ENTRYPOINT is correct. 5) Check for missing env vars or config files.'
- id: crt-015
  topic: container_runtime
  level: L1
  question: What is the difference between a container image and a running container?
  answer: 'Image: read-only template with filesystem layers, metadata, and default commands. Container: a running instance
    of an image with a writable layer, network, PID namespace, and state. Multiple containers can run from the same image.
    Images are stored in registries; containers exist on hosts.'
- id: kafka-001
  topic: kafka
  level: L1
  question: What is a Kafka partition and why does partition count matter?
  answer: A partition is an ordered, immutable log within a topic. Partitions enable parallelism — each partition can be consumed
    by one consumer in a group. More partitions = higher throughput but more overhead (file handles, memory, leader elections).
    You can increase partitions but never decrease them.
- id: kafka-002
  topic: kafka
  level: L1
  question: What is a Kafka consumer group and how does rebalancing work?
  answer: A consumer group is a set of consumers that divide partitions among themselves. Each partition is assigned to exactly
    one consumer in the group. Rebalancing occurs when a consumer joins/leaves — partitions are redistributed. During rebalance,
    consumption pauses briefly, which can cause lag spikes.
- id: kafka-003
  topic: kafka
  level: L2
  question: Consumer lag is increasing steadily. What do you investigate?
  answer: 1) Consumer throughput vs producer rate. 2) Consumer processing time per message (slow downstream calls?). 3) Consumer
    group rebalancing too frequently. 4) Not enough consumers (fewer than partitions). 5) GC pauses in the consumer. 6) Deserialization
    errors causing retries. 7) max.poll.records too high causing session timeouts.
- id: kafka-004
  topic: kafka
  level: L1
  question: How does Kafka guarantee message ordering?
  answer: Ordering is guaranteed within a single partition only. Messages with the same key go to the same partition (via
    hash). Cross-partition ordering is NOT guaranteed. If you need global ordering, use a single partition (but lose parallelism).
    Design your key strategy around ordering requirements.
- id: kafka-005
  topic: kafka
  level: L2
  question: What is the difference between at-least-once, at-most-once, and exactly-once in Kafka?
  answer: 'At-most-once: commit offset before processing (may lose messages). At-least-once: process then commit (may duplicate
    — default). Exactly-once: use idempotent producer (enable.idempotence=true) + transactional consumer-producer. Exactly-once
    has performance overhead. Most systems use at-least-once with idempotent consumers.'
- id: kafka-006
  topic: kafka
  level: L1
  question: What is Kafka retention and how does it differ from compaction?
  answer: 'Retention: messages deleted after a time (retention.ms) or size (retention.bytes) threshold — entire log segments
    are dropped. Compaction: keeps only the latest value per key — useful for changelog/state topics. A topic can use either
    or both. Compaction never deletes the latest message for any key.'
- id: kafka-007
  topic: kafka
  level: L2
  question: A Kafka broker is under-replicated. What do you check?
  answer: 1) Broker is up and connected to the cluster. 2) Network between brokers is healthy (latency, packet loss). 3) Broker
    disk I/O — slow disks delay replication. 4) Broker is overloaded (too many partitions as leader). 5) Check ISR (in-sync
    replicas) shrinkage in broker logs. 6) replica.lag.time.max.ms may be too tight.
- id: kafka-008
  topic: kafka
  level: L1
  question: What happens when a Kafka broker fails?
  answer: Partitions led by that broker elect new leaders from the in-sync replica set (ISR). Producers and consumers switch
    to the new leaders automatically. If the failed broker was the only ISR member, the partition is unavailable until it
    recovers (or unclean leader election is enabled, risking data loss).
- id: kafka-009
  topic: kafka
  level: L2
  question: How do you safely increase Kafka partitions for a topic?
  answer: kafka-topics --alter --partitions N. Existing data is NOT redistributed — only new messages go to new partitions.
    Key-based routing changes (messages with the same key may go to a different partition). Consumer group must rebalance.
    You cannot decrease partitions. Plan partition count carefully upfront.
- id: kafka-010
  topic: kafka
  level: L1
  question: What is the role of ZooKeeper in Kafka (and what replaces it)?
  answer: 'ZooKeeper: stores cluster metadata, manages broker registration, elects controllers, tracks ISR lists. KRaft (Kafka
    Raft) replaces ZooKeeper (GA in Kafka 3.3+) — metadata is stored in an internal Kafka topic, simplifying operations. New
    clusters should use KRaft; existing clusters should plan migration.'
- id: kafka-011
  topic: kafka
  level: L2
  question: A Kafka producer reports NotLeaderForPartitionException intermittently. What is happening?
  answer: 'The partition leader changed (broker restart, rebalance, or preferred leader election) and the producer''s metadata
    cache is stale. The producer should refresh metadata and retry automatically (retries > 0). If persistent: check broker
    stability, controller logs, and under-replicated partitions for frequent leader changes.'
- id: kafka-012
  topic: kafka
  level: L1
  question: What is the minimum configuration for a production Kafka cluster?
  answer: 'At least 3 brokers (for replication factor 3). replication.factor=3 and min.insync.replicas=2 on critical topics.
    Dedicated disks (not shared with OS). JVM heap tuned (6-8GB typical). Monitoring: under-replicated partitions, consumer
    lag, broker disk/CPU. Separate ZooKeeper ensemble (3 or 5 nodes) or use KRaft.'
- id: kafka-013
  topic: kafka
  level: L2
  question: How do you handle poison messages (messages that cause consumer failures)?
  answer: 1) Wrap processing in try-catch and send failures to a dead-letter topic (DLT). 2) Log the problematic message for
    debugging. 3) Commit the offset to skip past the poison message. 4) Set up alerts on DLT message count. 5) Never let a
    single bad message block an entire partition indefinitely.
- id: kafka-014
  topic: kafka
  level: L1
  question: What are acks settings in Kafka producers and their tradeoffs?
  answer: 'acks=0: fire-and-forget, fastest, may lose messages. acks=1: leader acknowledges, good throughput, may lose if
    leader fails before replication. acks=all (-1): all ISR replicas acknowledge, safest, slower. For critical data use acks=all
    with min.insync.replicas=2.'
- id: kafka-015
  topic: kafka
  level: L2
  question: How do you monitor a Kafka cluster effectively?
  answer: 'Key metrics: 1) Under-replicated partitions (> 0 = problem). 2) Consumer group lag. 3) Request latency (produce,
    fetch). 4) Broker disk usage and I/O. 5) Active controller count (exactly 1). 6) ISR shrink/expand rate. 7) Network handler
    idle ratio. Tools: Burrow, Kafka Exporter + Prometheus, Confluent Control Center.'
- id: es-001
  topic: elasticsearch
  level: L1
  question: What is the difference between shards and replicas in Elasticsearch?
  answer: 'Shards: horizontal partitions of an index — data is distributed across shards for parallelism. Replicas: copies
    of primary shards on different nodes for redundancy and read throughput. An index with 5 primary shards and 1 replica
    has 10 total shards (5 primary + 5 replica).'
- id: es-002
  topic: elasticsearch
  level: L1
  question: Elasticsearch cluster health shows yellow. What does it mean?
  answer: 'Yellow = all primary shards are allocated but some replica shards are not. Common cause: single-node cluster (no
    other node for replicas) or node failure/maintenance. Data is safe (primaries exist) but there is no redundancy. Green
    = all shards allocated. Red = some primaries are unassigned.'
- id: es-003
  topic: elasticsearch
  level: L2
  question: Cluster health is red. What do you do?
  answer: '1) Check which indices are red: GET _cluster/health?level=indices. 2) Find unassigned shards: GET _cat/shards?v&h=index,shard,prims,state,unassigned.reason.
    3) Common causes: disk watermark exceeded, node lost, corrupted shard. 4) For disk: clear space or raise watermark temporarily.
    5) For lost nodes: bring them back or reroute shards.'
- id: es-004
  topic: elasticsearch
  level: L1
  question: What are Elasticsearch disk watermarks?
  answer: 'Low watermark (85%): ES stops allocating new shards to that node. High watermark (90%): ES relocates shards away
    from that node. Flood stage (95%): ES makes indices on that node read-only. Monitor disk usage proactively. Clear old
    indices or add nodes before hitting watermarks.'
- id: es-005
  topic: elasticsearch
  level: L2
  question: Indexing throughput has degraded significantly. What do you investigate?
  answer: 1) Bulk queue rejections (thread pool stats). 2) Merge throttling — too many segments being merged. 3) GC pressure
    — heap too small or too many field data structures. 4) Disk I/O saturation. 5) Mapping explosion (too many fields). 6)
    refresh_interval too low (default 1s). For bulk loads, set refresh_interval to 30s or -1 temporarily.
- id: es-006
  topic: elasticsearch
  level: L1
  question: What are common Elasticsearch mapping mistakes?
  answer: '1) Dynamic mapping on — random fields auto-create fields (mapping explosion). 2) Using text type for fields you
    only filter on (use keyword). 3) Not setting explicit mappings upfront. 4) Changing field types on an existing index (requires
    reindex). 5) Too many fields per index (default limit: 1000).'
- id: es-007
  topic: elasticsearch
  level: L2
  question: Elasticsearch heap usage is consistently above 75%. What do you do?
  answer: 1) Check fielddata usage — use doc_values instead of fielddata where possible. 2) Reduce shard count per node (each
    shard uses heap for metadata). 3) Avoid large aggregations that load data into heap. 4) Set indices.fielddata.cache.size
    limit. 5) Don't set heap above 50% of RAM or 31GB (compressed OOPs threshold).
- id: es-008
  topic: elasticsearch
  level: L1
  question: What is the difference between text and keyword field types?
  answer: 'text: analyzed (tokenized, lowercased) — use for full-text search (match queries). keyword: exact value, not analyzed
    — use for filtering, sorting, aggregations. A common pattern: multi-field mapping with both (field.raw as keyword). Wrong
    choice = poor search results or wasted resources.'
- id: es-009
  topic: elasticsearch
  level: L2
  question: How do you reindex data in Elasticsearch without downtime?
  answer: 1) Create the new index with updated mappings. 2) Use the _reindex API to copy data. 3) Use an alias pointing to
    the old index. 4) When reindex completes, atomically switch the alias to the new index. 5) Delete the old index. The alias
    swap is atomic — clients see no downtime.
- id: es-010
  topic: elasticsearch
  level: L1
  question: How do you manage index lifecycle in Elasticsearch?
  answer: 'Use Index Lifecycle Management (ILM). Define phases: hot (actively written/queried), warm (read-only, less frequent),
    cold (infrequent access, cheaper storage), delete. ILM automates rollover (size/age triggers), force-merge, shrink, and
    deletion. Essential for log/metrics use cases.'
- id: es-011
  topic: elasticsearch
  level: L2
  question: Search queries are slow on a large index. What do you check?
  answer: 1) Number of shards — too many shards = overhead per query. 2) Shard size — ideal is 10-50GB per shard. 3) Query
    complexity — avoid wildcards on large text fields. 4) Slow log (index.search.slowlog.threshold). 5) Node resources (CPU,
    RAM, disk I/O). 6) Use query profiling API to find bottlenecks.
- id: es-012
  topic: elasticsearch
  level: L1
  question: What is the difference between an index and an alias in Elasticsearch?
  answer: 'Index: the actual data store. Alias: a pointer (name) that maps to one or more indices. Aliases enable zero-downtime
    reindexing, time-based index management, and query routing. Applications should always use aliases, not raw index names,
    so you can swap the underlying index transparently.'
- id: es-013
  topic: elasticsearch
  level: L2
  question: How do you size an Elasticsearch cluster?
  answer: 1) Estimate daily data volume and retention period. 2) Target 10-50GB per shard. 3) Replica count based on availability
    needs. 4) Each node handles ~20-25 shards per GB of heap. 5) Set heap to 50% of RAM (max 31GB). 6) Separate master-eligible,
    data, and coordinating nodes for large clusters. 7) Plan for burst indexing capacity.
- id: es-014
  topic: elasticsearch
  level: L1
  question: What is the Elasticsearch refresh interval and when should you change it?
  answer: refresh_interval (default 1s) controls when new documents become searchable. Lower = near-real-time but more overhead.
    For bulk ingestion, set to 30s or -1 (disable) to improve throughput, then restore after. For search-heavy workloads,
    1s is appropriate.
- id: es-015
  topic: elasticsearch
  level: L2
  question: How do you troubleshoot unassigned shards?
  answer: '1) GET _cluster/allocation/explain to see why a shard is unassigned. 2) Common reasons: disk watermark, node count
    < replica count, shard allocation filtering, awareness attributes. 3) Fixes: clear disk space, add nodes, reduce replica
    count, remove allocation filters. 4) Manual reroute as last resort.'
- id: tf-008
  topic: terraform
  level: L2
  question: What are Terraform workspaces and when should you use them?
  answer: 'Workspaces maintain separate state files for the same config. Good for: minor variations (dev/staging with same
    infra). Bad for: fundamentally different environments (use separate root modules instead). Each workspace has its own
    state. Use terraform.workspace in config to vary parameters.'
- id: tf-009
  topic: terraform
  level: L1
  question: What does terraform taint do and what replaced it?
  answer: taint marks a resource for destruction and recreation on next apply. Replaced by terraform apply -replace=RESOURCE
    (Terraform 1.0+). Use when a resource is in a bad state that can't be fixed by normal apply. Be cautious — replace can
    cause downtime if the resource has dependents.
- id: tf-011
  topic: terraform
  level: L1
  question: What is the difference between terraform plan output symbols + - ~ ?
  answer: + = create new resource. - = destroy resource. ~ = update in place. -/+ = destroy and recreate (replacement). <=
    = read data source. Pay special attention to -/+ and - in plan output — they can cause downtime. Always count destroys
    before applying.
- id: tf-012
  topic: terraform
  level: L2
  question: How do you prevent accidental resource deletion in Terraform?
  answer: 1) lifecycle { prevent_destroy = true } on critical resources. 2) Review plan output carefully — grep for 'destroy'.
    3) Use state locking. 4) Require plan approval in CI/CD (not auto-apply). 5) Separate stateful resources (databases, S3)
    from ephemeral ones. 6) Use protect_from_deletion on the cloud side too (AWS deletion protection).
- id: tf-013
  topic: terraform
  level: L2
  question: What are Terraform data sources and when do you use them?
  answer: 'Data sources read existing infrastructure without managing it. Use to: reference resources created outside Terraform,
    look up AMI IDs, get account info, read secrets from Vault. They are read-only — Terraform never modifies or destroys
    data source targets. Refresh on every plan.'
- id: tf-014
  topic: terraform
  level: L1
  question: What is the difference between variable, local, and output in Terraform?
  answer: 'variable: input parameter (set by user/tfvars/env). local: computed intermediate value (DRY helper, not exposed).
    output: value exported for other modules or human consumption. Use variables for things that change per deployment; locals
    for repeated expressions; outputs for cross-module data flow.'
- id: tf-015
  topic: terraform
  level: L2
  question: A terraform apply hangs on a resource that is taking too long. What do you do?
  answer: 1) Check the cloud console — the resource may be stuck (e.g., RDS creating, ASG scaling). 2) Check provider timeouts
    (configurable in resource block). 3) Do NOT Ctrl+C and re-run — state may be locked or partially updated. 4) If you must
    interrupt, check state with terraform show and reconcile manually. 5) Some providers support custom timeouts blocks.
- id: ans-007
  topic: ansible
  level: L1
  question: What are Ansible roles and why use them?
  answer: Roles are reusable units of automation with a standard directory structure (tasks, handlers, defaults, vars, templates,
    files). They organize complex playbooks into composable parts. Use roles for repeatable components (nginx setup, monitoring
    agent install). Share via Ansible Galaxy.
- id: ans-008
  topic: ansible
  level: L2
  question: How do you debug a failing Ansible playbook?
  answer: 1) -v / -vvv / -vvvv for increasing verbosity. 2) --start-at-task to skip to the failing task. 3) --step to execute
    one task at a time. 4) debug module to print variables. 5) Register task results and display with debug. 6) Check the
    failed host's state and compare with task expected state.
- id: ans-009
  topic: ansible
  level: L1
  question: What is the difference between vars, defaults, and extra vars in Ansible?
  answer: 'defaults (roles/x/defaults/): lowest precedence, easily overridden. vars (roles/x/vars/, playbook vars): higher
    precedence. extra vars (-e): highest precedence, override everything. Precedence order (highest to lowest): extra vars
    > task vars > playbook vars > role vars > role defaults > inventory vars.'
- id: ans-010
  topic: ansible
  level: L2
  question: How do you handle failures gracefully in Ansible?
  answer: '1) ignore_errors: yes to continue on failure (use sparingly). 2) failed_when to customize failure conditions. 3)
    block/rescue/always for try-catch-finally patterns. 4) any_errors_fatal to stop all hosts on first failure. 5) max_fail_percentage
    to tolerate partial failures in rolling updates.'
- id: ans-011
  topic: ansible
  level: L1
  question: What is Ansible's connection model and how does it differ from agent-based tools?
  answer: 'Ansible is agentless — connects via SSH (Linux) or WinRM (Windows), pushes tasks, and disconnects. No agent to
    install, update, or monitor. Pros: simple, no persistent process. Cons: slower than agents for large fleets, requires
    SSH access. Compare with Puppet/Chef which use persistent agents.'
- id: ans-012
  topic: ansible
  level: L2
  question: How do you optimize Ansible playbook performance for large inventories?
  answer: '1) Use SSH pipelining (pipelining = True). 2) Increase forks (default 5). 3) Use async tasks for long operations.
    4) Gather only needed facts (gather_subset). 5) Use strategy: free (don''t wait for slowest host). 6) Cache facts (fact_caching).
    7) Use mitogen plugin for faster task execution.'
- id: ans-013
  topic: ansible
  level: L1
  question: What is an Ansible dynamic inventory and when do you use it?
  answer: 'Dynamic inventory queries external sources (AWS EC2, Azure, GCP, CMDB) at runtime to build the host list. Use when
    your infrastructure changes frequently (cloud, auto-scaling). Plugins: aws_ec2, azure_rm, gcp_compute. Avoids maintaining
    a static file that drifts from reality.'
- id: ans-014
  topic: ansible
  level: L2
  question: How do you implement rolling updates with Ansible?
  answer: 'Use serial keyword to limit how many hosts are updated at once (serial: 2 or serial: ''25%''). Combined with pre/post
    tasks (health checks, LB drain). Add max_fail_percentage to stop if too many hosts fail. Pattern: drain from LB, update,
    health check, add back to LB.'
- id: ans-015
  topic: ansible
  level: L1
  question: What is Ansible's check mode and how is it useful?
  answer: check mode (--check) is a dry run — shows what would change without making changes. Modules report 'changed' or
    'ok' status. Useful for verifying intent before running in production. Not all modules support check mode (shell/command
    don't). Combine with --diff to see file content changes.
- id: ans-016
  topic: ansible
  level: L2
  question: What is the difference between include_tasks and import_tasks, and when does the distinction bite you?
  answer: 'import_tasks is static — parsed at playbook load time. Tags, when conditions, and --list-tasks all work as expected.
    include_tasks is dynamic — evaluated at runtime. Tags applied to include_tasks only affect the include statement itself,
    NOT the tasks inside it (use apply keyword to propagate). It bites you when: 1) You tag an include_tasks and expect inner
    tasks to inherit the tag. 2) You use --list-tasks and dynamic includes are invisible. 3) You use notify on a handler inside
    an include — the handler name must be fully resolved at parse time for imports but can be dynamic for includes.'
- id: ans-017
  topic: ansible
  level: L2
  question: How does Ansible fact caching work, and what are the trade-offs of each backend?
  answer: 'Fact caching stores gathered facts between runs so subsequent plays skip gather_facts. Backends: 1) jsonfile —
    simple, writes per-host JSON to a directory. Fast reads, but stale if hosts change. 2) redis — shared across control nodes,
    supports TTL, good for multi-user environments. 3) memcached — similar to redis but no persistence. Configure in ansible.cfg:
    fact_caching = redis, fact_caching_timeout = 86400. Trade-offs: caching speeds up large inventories dramatically but risks
    acting on stale facts (e.g., a disk was replaced but facts still show the old device). Always set a reasonable TTL and
    use gather_facts: yes on plays that need current data.'
- id: ans-018
  topic: ansible
  level: L3
  question: How do you write a custom Ansible module, and when is it worth the effort vs. using shell/command?
  answer: 'Write a Python script under library/ in your role or playbook directory. The module receives JSON args on stdin
    (via AnsibleModule helper), performs work, and returns JSON with changed, failed, and msg keys. Use the AnsibleModule
    class from ansible.module_utils.basic for argument parsing, check_mode support, and idempotent diff reporting. Worth it
    when: 1) You call the same shell commands in 5+ playbooks — wrap them in a module for idempotency and error handling.
    2) You need check_mode and diff support (shell/command cannot provide this). 3) You interact with an API — a module gives
    clean parameters instead of curl commands. Not worth it for one-off tasks or when an existing module covers 90% of the
    need.'
- id: ans-019
  topic: ansible
  level: L2
  question: What is the Ansible callback plugin system and how do you use it operationally?
  answer: 'Callback plugins hook into playbook events (task start, task failure, play recap) to customize output or send notifications.
    Built-in callbacks: 1) default — standard output. 2) json — machine-readable output for CI. 3) profile_tasks — adds per-task
    timing (essential for performance tuning). 4) timer — total playbook duration. 5) mail — sends email on failure. Enable
    via ansible.cfg: callbacks_enabled = profile_tasks, timer (note: callback_whitelist was renamed to callbacks_enabled in Ansible 2.15). Operationally: use profile_tasks to identify slow tasks, json
    callback for pipeline integration, and custom callbacks to push run results to Slack or PagerDuty. Write custom callbacks
    by subclassing CallbackBase in callback_plugins/ directory.'
- id: ans-020
  topic: ansible
  level: L3
  question: How does Ansible's strategy plugin system work, and when would you use strategy other than linear?
  answer: The strategy controls how tasks are dispatched across hosts. 1) linear (default) — runs each task on all hosts before
    moving to the next task. Simple, predictable, but slow (waits for slowest host). 2) free — each host proceeds independently
    through the task list as fast as it can. Faster overall but harder to debug (output is interleaved). 3) host_pinned —
    like free but keeps connection to each host open. 4) debug — interactive debugger on failure. Use free for large fleets
    where hosts have variable task durations (e.g., package installs that are cached on some hosts). Avoid free when task
    ordering across hosts matters (e.g., rolling DB migrations). You can write custom strategy plugins for complex orchestration
    like canary deploys with feedback loops.
- id: ans-021
  topic: ansible
  level: L2
  question: Explain how Ansible connection plugins work and when you would use something other than SSH.
  answer: 'Connection plugins define how Ansible talks to managed nodes. 1) ssh (default) — OpenSSH, supports ControlPersist
    for connection reuse. 2) paramiko — pure Python SSH, fallback for old SSH versions. 3) local — runs on the control node
    itself (for localhost tasks). 4) docker — connects to Docker containers via docker exec. 5) kubectl — connects to Kubernetes
    pods. 6) winrm — for Windows hosts. 7) network_cli — for network devices (Cisco, Juniper). 8) httpapi — REST API-based
    for modern network gear. Set per-host with ansible_connection variable or per-play with connection keyword. Common mistake:
    using ssh to manage containers when docker connection is faster and does not require sshd in the container.'
- id: ans-022
  topic: ansible
  level: L3
  question: How do you implement Ansible content collections, and what problems do they solve compared to the pre-collections
    era?
  answer: 'Collections bundle modules, plugins, roles, and playbooks into a namespace (e.g., community.general, amazon.aws).
    They solve: 1) Dependency hell — pin collection versions independently of ansible-core. 2) Release velocity — collections
    release on their own schedule, not tied to ansible-core releases. 3) Namespace collisions — FQCN (ansible.builtin.copy
    vs community.general.copy) prevents ambiguity. Create a collection: ansible-galaxy collection init mynamespace.mycollection.
    Structure: plugins/modules/, plugins/inventory/, roles/, playbooks/. Publish to Galaxy or private Automation Hub. In CI:
    pin collections in requirements.yml with version constraints. Operationally, always use FQCN in production playbooks to
    avoid breakage when the default module resolution changes between ansible-core versions.'
- id: ans-023
  topic: ansible
  level: L2
  question: How does Ansible Automation Platform (AAP) differ from running ansible-playbook on a jump box, and when is AAP
    justified?
  answer: 'AAP (formerly Tower/AWX) adds: 1) RBAC — fine-grained access control (who can run what against which inventory).
    2) Credential management — stores SSH keys, cloud creds, vault passwords without exposing them to operators. 3) Job scheduling
    and workflows — chain playbooks with conditional branching. 4) Audit trail — every job run is logged with who triggered
    it, what changed, and the full output. 5) API-driven — integrate with ticketing systems, ChatOps, CI/CD. 6) Inventory
    sync — auto-import from cloud providers on a schedule. Justified when: >3 operators share automation, compliance requires
    audit logging, or you need self-service automation for non-Ansible users. Overkill for: single admin, small fleet, or
    CI-only automation where the pipeline already provides RBAC and logging.'
- id: ans-024
  topic: ansible
  level: L3
  question: What are Ansible filter plugins and lookup plugins, and how do they differ in execution context?
  answer: 'Filter plugins transform data in Jinja2 expressions (e.g., {{ mylist | map("upper") | list }}). They run on the
    control node during template rendering. Built-in filters include ipaddr, regex_search, combine (merge dicts), to_json,
    from_yaml. Lookup plugins fetch data from external sources (e.g., {{ lookup("file", "/etc/hostname") }}, {{ lookup("env",
    "HOME") }}, {{ lookup("hashi_vault", "secret/data/app") }}). Key difference: lookups always run on the CONTROL node (not
    the managed host), while filters process data already in memory. This means lookup("file") reads files from the control
    node, not the target. To read files on the target, use the slurp module. Custom filter plugins go in filter_plugins/ directory;
    custom lookups in lookup_plugins/.'
- id: ans-025
  topic: ansible
  level: L2
  question: How do you test Ansible roles with Molecule, and what does a typical test matrix look like?
  answer: 'Molecule provides create/converge/verify/destroy lifecycle for role testing. Typical setup: 1) molecule init role
    myrole --driver-name docker. 2) molecule/default/molecule.yml defines platforms (e.g., Ubuntu 22.04, RHEL 9 containers).
    3) converge.yml applies the role. 4) verify.yml runs assertions (Ansible assert module or testinfra Python tests). Test
    matrix: multiple OS families × role parameters (e.g., with/without TLS, different package versions). In CI, run molecule
    test (full lifecycle) per matrix entry. Common pitfalls: 1) Docker containers lack systemd — use geerlingguy/docker-*
    images that include it. 2) Molecule caches images — stale base images cause flaky tests. 3) Side effects between scenarios
    if not using molecule destroy between them.'
- id: ans-027
  topic: ansible
  level: L2
  question: What is ansible-pull and when would you use it instead of the standard push model?
  answer: 'ansible-pull inverts the model — each managed node pulls its playbook from a git repo and runs it locally. Use
    cron or systemd timer to schedule pulls. Advantages: 1) Scales to thousands of nodes without SSH fan-out bottleneck. 2)
    New nodes self-configure on first boot (cloud-init runs ansible-pull). 3) No control node infrastructure needed. Disadvantages:
    1) Every node needs git and ansible installed. 2) No central run visibility (each node logs locally). 3) Harder to orchestrate
    cross-host tasks (rolling updates, drain/undrain). Best for: large, homogeneous fleets (web servers, build agents) where
    each node converges independently. Bad for: complex orchestration, heterogeneous environments, or environments that need
    centralized audit logging.'
- id: ans-028
  topic: ansible
  level: L2
  question: How do you handle multi-tier application deployments with Ansible where order matters across host groups?
  answer: 'Use multiple plays in a single playbook, each targeting a different group. Example: Play 1 targets db servers (migrate
    schema), Play 2 targets app servers with serial (rolling deploy), Play 3 targets LB (update backend pool). Within each
    play, pre_tasks/roles/post_tasks control order. For complex dependencies: 1) Use delegate_to to run a task on a different
    host from within a play. 2) Use run_once: true for tasks that should execute on only one host (e.g., DB migration). 3)
    Use wait_for to block until a service on another tier is ready. 4) Use meta: refresh_inventory if hosts change mid-playbook
    (e.g., after scaling). Anti-pattern: putting everything in one play with when conditions — this is hard to read and error-prone.'
- id: ans-029
  topic: ansible
  level: L3
  question: How does Ansible's execution environment (EE) work and why was it introduced?
  answer: 'Execution Environments are container images that bundle ansible-core, Python dependencies, collections, and system
    libraries into a reproducible runtime. Built with ansible-builder from an execution-environment.yml that specifies: 1)
    base image (EE-minimal or EE-supported). 2) Galaxy requirements (collections). 3) Python requirements (pip). 4) System
    packages (bindep). Introduced because: dependency conflicts were the #1 support issue — different collections needing
    different Python library versions on the same control node. EEs provide: 1) Reproducibility across teams and CI. 2) No
    more "works on my laptop" — same container runs everywhere. 3) Clean separation between ansible-core and collection dependencies.
    ansible-navigator (replacement for ansible-playbook) runs playbooks inside EEs by default. In AAP, every job template
    references an EE, ensuring consistent execution.'
- id: ans-030
  topic: ansible
  level: L2
  question: What are Ansible inventory plugins and how do they differ from dynamic inventory scripts?
  answer: 'Inventory plugins are the modern replacement for dynamic inventory scripts. Key differences: 1) Plugins are configured
    via YAML files (e.g., aws_ec2.yml) instead of executable scripts with CLI args. 2) Plugins support caching natively (cache:
    true, cache_plugin: jsonfile). 3) Plugins can be composed — use multiple plugins in a single inventory directory. 4) Plugins
    integrate with the collection system (amazon.aws.aws_ec2 vs a standalone Python script). 5) Scripts return JSON on stdout;
    plugins use the Ansible inventory API. Migrating: old scripts still work via the script inventory plugin, but new projects
    should use native plugins. Common plugins: aws_ec2, azure_rm, gcp_compute, vmware_vm_inventory, kubernetes.core.k8s. Write
    custom plugins by subclassing BaseInventoryPlugin.'
- id: cicd-008
  topic: cicd
  level: L2
  question: How do you secure a CI/CD pipeline?
  answer: 1) Pin dependencies and action versions (not @latest). 2) Use least-privilege credentials scoped to the pipeline.
    3) Never echo secrets in logs. 4) Run in ephemeral environments (no persistent build agents). 5) Sign artifacts and verify
    before deploy. 6) Review third-party actions/plugins for supply chain risk. 7) Enable branch protection and require reviews.
- id: cicd-009
  topic: cicd
  level: L1
  question: What is the difference between a build artifact and a container image in CI/CD?
  answer: 'Build artifact: any output of the build step (JAR, binary, test report). Container image: a packaged artifact with
    its runtime environment, ready to deploy anywhere. The CI pipeline typically builds the artifact, packages it into an
    image, pushes to a registry, and deploys the image.'
- id: cicd-010
  topic: cicd
  level: L2
  question: How do you implement trunk-based development with CI/CD?
  answer: 'All developers commit to main/trunk frequently (daily+). Short-lived feature branches (< 2 days). Feature flags
    decouple deploy from release. CI runs on every commit to trunk. Deploy from trunk to production. Benefits: reduced merge
    conflicts, faster feedback, simpler release process.'
- id: cicd-011
  topic: cicd
  level: L1
  question: What is the purpose of a staging environment in CI/CD?
  answer: 'Staging mirrors production as closely as possible (same infra, config, data shape). It validates that the build
    works in a production-like setting before deploying for real. Catches issues that unit tests miss: configuration errors,
    integration failures, performance regressions.'
- id: cicd-012
  topic: cicd
  level: L2
  question: A CI pipeline is flaky — tests pass sometimes and fail other times. How do you fix it?
  answer: '1) Identify flaky tests (re-run reports, test quarantine). 2) Common causes: timing/race conditions, shared state,
    network dependencies, order-dependent tests. 3) Fix: use mocks/stubs, isolate test state, add retries with backoff for
    network calls. 4) Never suppress flaky tests permanently — fix or delete them.'
- id: cicd-013
  topic: cicd
  level: L1
  question: What is the expand-contract pattern for database changes in CI/CD?
  answer: 'Expand: add new column/table alongside old (backward-compatible). Migrate: update app code to use new schema. Contract:
    remove old column/table after all code uses the new one. This allows safe rollback at every stage — the old schema and
    old code always work together.'
- id: cicd-014
  topic: cicd
  level: L2
  question: How do you implement infrastructure-as-code testing in CI/CD?
  answer: '1) Lint: terraform fmt, tflint, yamllint. 2) Static analysis: checkov, tfsec for security misconfigurations. 3)
    Unit tests: Terratest or pytest + localstack. 4) Plan: terraform plan in CI, require approval for apply. 5) Integration:
    spin up ephemeral infra, run smoke tests, tear down. 6) Drift detection: scheduled plan runs.'
- id: cicd-015
  topic: cicd
  level: L1
  question: What are GitHub Actions reusable workflows and why use them?
  answer: Reusable workflows are called from other workflows using workflow_call trigger. They centralize common CI logic
    (build, test, deploy) in one place. Changes propagate automatically. Pin the calling reference to a tag/SHA for stability.
    Reduces duplication across repos in an organization.
- id: regex-001
  topic: regex
  level: L0
  question: What is the difference between BRE (Basic Regular Expressions) and ERE (Extended Regular Expressions) when using
    grep?
  answer: In BRE (default grep), metacharacters like +, ?, |, and () must be escaped with backslashes to be special. In ERE
    (grep -E), they are special by default without escaping. ERE is generally preferred for readability.
  distractor: People often forget that plain grep uses BRE where + means a literal plus sign, not 'one or more'.
- id: regex-002
  topic: regex
  level: L1
  question: You need a portable regex to match IP addresses in a log file. Why should you avoid \d and use [0-9] instead?
  answer: \d is PCRE-only (grep -P). Standard grep -E and sed -E do not support \d. For portability across BRE/ERE/PCRE, use
    [0-9] or the POSIX class [[:digit:]].
- id: regex-003
  topic: regex
  level: L2
  question: 'Write a sed one-liner that extracts just the HTTP status code from an Nginx access log line like: ''192.168.1.1
    - - [15/Mar/2024:14:23:01 +0000] "GET /api HTTP/1.1" 200 1234''.'
  answer: sed -E 's/.* "[A-Z]+ [^ ]+ HTTP\/[0-9.]+" ([0-9]+) .*/\1/' — this captures the three-digit status code after the
    request line using a capture group.
  distractor: A common mistake is not escaping the forward slashes or trying to use \d which does not work in sed.
- id: regex-004
  topic: regex
  level: L3
  question: 'You have a 50GB log file and need to find all lines where a request took longer than 1 second (field format:
    duration=0.XXXs). How do you approach this efficiently?'
  answer: Use grep -P 'duration=[1-9][0-9]*\.' for whole-second matches, or grep -E 'duration=[0-9]+\.[0-9]+s' piped through
    awk to filter numerically. For 50GB files, use ripgrep (rg) for speed or split the file and search in parallel. Avoid
    loading into memory.
- id: oncall-001
  topic: on_call
  level: L0
  question: What is the role of an Incident Commander (IC) during a production outage?
  answer: 'The IC coordinates the response: declares severity, opens the war room, assigns roles (comms lead, technical lead),
    sets investigation direction, approves risky actions, calls for status updates, and declares resolution. The IC does NOT
    debug the problem directly.'
- id: oncall-002
  topic: on_call
  level: L1
  question: What is the difference between SEV-1 and SEV-2 incidents, and how does the response differ?
  answer: SEV-1 means major customer impact (service down or data loss) requiring all-hands, war room, and exec notification.
    SEV-2 means significant degradation for many users, requiring on-call team plus service owners. SEV-1 gets statuspage
    + customer email; SEV-2 gets a statuspage update.
  distractor: People often over-classify incidents as SEV-1 when they are really SEV-2 (degraded but not down).
- id: oncall-003
  topic: on_call
  level: L2
  question: Your on-call rotation has 4 engineers and one of them gets paged 3x more than others. What systemic issues might
    cause this and how do you fix it?
  answer: 'Likely causes: (1) Noisy alerts for services they own, (2) alert routing rules that over-map to one person, (3)
    follow-the-sun gaps, (4) uneven service ownership. Fix: audit alert frequency per person, tune noisy alerts, rebalance
    service ownership across the team, ensure fair rotation scheduling.'
- id: oncall-004
  topic: on_call
  level: L3
  question: During a SEV-1, the IC assigns you as technical lead. You discover the root cause is a bad deploy, but rolling
    back will cause 5 minutes of additional downtime. The current state is degraded but serving 60% of traffic. What framework
    do you use to decide?
  answer: 'Compare: (1) cost of staying degraded (60% capacity, growing user impact, potential cascade) vs (2) cost of rollback
    (5 min full outage, then full recovery). Factor in: is the degradation stable or worsening? Will the bad deploy self-heal?
    Is there a mitigation short of rollback? Present options and tradeoffs to the IC — the IC decides, not the technical lead.'
- id: pyauto-001
  topic: python_automation
  level: L0
  question: Why would you choose Python over Bash for an infrastructure automation script?
  answer: 'Python is better when you need: proper error handling (try/except), data structures (dicts, lists), API integration
    (requests, boto3), parallel execution, testing, or the script exceeds ~100 lines. Bash is fine for simple file operations
    and command chaining.'
- id: pyauto-002
  topic: python_automation
  level: L1
  question: When using boto3 to list all S3 objects in a bucket with millions of objects, why must you use a paginator instead
    of calling list_objects_v2 directly?
  answer: list_objects_v2 returns a maximum of 1000 objects per call. Without pagination, you only see the first 1000 and
    silently miss the rest. Use s3.get_paginator('list_objects_v2') to iterate through all pages automatically.
  distractor: A common mistake is assuming the API returns everything in one call and not checking IsTruncated.
- id: pyauto-003
  topic: python_automation
  level: L2
  question: You are writing a Python script that restarts services across 200 servers via SSH. How do you handle parallelism
    and error isolation?
  answer: Use concurrent.futures.ThreadPoolExecutor (or ProcessPoolExecutor) with a bounded pool (e.g., 20 workers). Wrap
    each server call in try/except so one failure does not abort the batch. Collect results with futures and report successes/failures
    at the end. Consider using paramiko or fabric for SSH.
- id: pyauto-004
  topic: python_automation
  level: L3
  question: You need to write a Python tool that safely performs rolling restarts of a Kubernetes deployment, waiting for
    each pod to be ready before proceeding. What approach and libraries do you use?
  answer: 'Use the kubernetes Python client. Get the deployment''s pod list, then for each pod: delete it, wait for the replacement
    to reach Ready condition (poll pod status with a timeout), then proceed to the next. Respect PodDisruptionBudgets by checking
    allowed disruptions first. Add --dry-run, progress output, and a configurable timeout.'
- id: sre-001
  topic: sre
  level: L0
  question: What is toil in the SRE context, and what is the target threshold?
  answer: Toil is manual, repetitive, automatable work that scales linearly with service growth and has no enduring value
    (e.g., manually restarting pods, rotating certs by hand). The SRE target is no more than 50% of an SRE's time should be
    spent on toil.
- id: sre-002
  topic: sre
  level: L1
  question: What is an error budget and how does it drive engineering decisions?
  answer: If your SLO is 99.9%, the error budget is 0.1% of allowed failure. When the budget is healthy (>50%), ship freely.
    When it is low (<25%), prioritize reliability work and reduce deploy frequency. When exhausted, feature-freeze until reliability
    improves. It bridges product velocity and operational stability.
- id: sre-003
  topic: sre
  level: L2
  question: Your team spends 70% of time on toil. What concrete steps do you take to bring it below 50%?
  answer: 1) Catalog all toil tasks with time estimates. 2) Rank by frequency x time-cost. 3) Automate the top offenders first
    (e.g., replace manual cert rotation with cert-manager, add auto-remediation for known alerts). 4) Eliminate false/noisy
    alerts. 5) Track toil percentage weekly. 6) Negotiate with management to protect automation time.
- id: sre-004
  topic: sre
  level: L3
  question: A product team wants to launch a new service in production. What does an SRE production readiness review cover?
  answer: 'A PRR covers: (1) SLOs defined and measured, (2) monitoring and alerting in place, (3) runbooks for known failure
    modes, (4) capacity planning and load testing done, (5) graceful degradation strategy, (6) rollback plan, (7) on-call
    rotation staffed, (8) disaster recovery tested, (9) dependency mapping, (10) security review complete. The service should
    not launch without passing the PRR.'
- id: crashloop-001
  topic: crashloop
  level: L0
  question: What does the CrashLoopBackOff status mean in Kubernetes?
  answer: CrashLoopBackOff is a status (not an error) meaning the kubelet tried to start a container, the container exited,
    and the kubelet is now waiting with exponential backoff before retrying. The backoff starts at 10s and caps at 5 minutes.
    The container keeps restarting indefinitely.
- id: crashloop-002
  topic: crashloop
  level: L1
  question: A pod shows CrashLoopBackOff with exit code 1 and the logs show 'connection refused to postgres:5432'. What is
    the likely cause and what do you check?
  answer: 'Exit code 1 means the application exited with an error. The app cannot reach its database. Check: (1) Is the postgres
    service/pod running? (2) Is the service DNS resolving correctly? (3) Are network policies blocking the connection? (4)
    Is the database port correct? (5) Are credentials valid? The app likely has no retry logic on startup.'
  distractor: Do not assume it is a container image issue when the app clearly started but failed to connect.
- id: crashloop-003
  topic: crashloop
  level: L2
  question: A pod crashes with exit code 137 immediately on startup, then enters CrashLoopBackOff. The logs are empty. What
    is happening and how do you diagnose it?
  answer: 'Exit code 137 = SIGKILL (128+9), usually OOMKilled. Empty logs mean the process was killed before it could write
    output. Check: (1) kubectl describe pod — look for OOMKilled in Last State. (2) Check resource limits — the memory limit
    is too low for the container to even start. (3) Raise the memory limit or profile the application''s startup memory usage.'
  distractor: Empty logs does not mean the container did not start — it means it was killed too fast to output anything.
- id: crashloop-004
  topic: crashloop
  level: L3
  question: A deployment with 3 replicas is in CrashLoopBackOff after a config change. Only the new pods crash; old pods from
    the previous ReplicaSet are healthy. How do you diagnose and recover with minimal customer impact?
  answer: '1) Do NOT delete old pods — they are still serving traffic. 2) Check new pod logs and describe for the crash cause
    (likely bad ConfigMap/Secret). 3) Compare the new config with the working config. 4) Roll back: kubectl rollout undo deployment/<name>.
    5) Fix the config, test in staging, then re-deploy. The deployment strategy (RollingUpdate) should prevent full outage
    if maxUnavailable is configured properly.'
- id: etcd-001
  topic: etcd
  level: L0
  question: What does etcd store in a Kubernetes cluster?
  answer: 'etcd stores all Kubernetes cluster state: resource definitions (Pods, Deployments, Services), RBAC policies, Secrets,
    ConfigMaps, leases, and CRD instances. It does NOT store container images, logs, metrics, or persistent volume data. The
    API server is the only component that communicates with etcd directly.'
- id: etcd-002
  topic: etcd
  level: L1
  question: Why should you always run an odd number of etcd members (3 or 5), not an even number like 4?
  answer: 'etcd uses Raft consensus requiring a quorum (majority) to commit writes. A 4-member cluster needs quorum of 3 and
    tolerates 1 failure — same tolerance as a 3-member cluster but with higher cost and latency. Odd numbers maximize fault
    tolerance per member: 3 members tolerate 1 failure, 5 tolerate 2.'
  distractor: People assume more members always means better fault tolerance, but 4 members tolerates the same failures as
    3.
- id: etcd-003
  topic: etcd
  level: L2
  question: How do you perform a backup and restore of etcd in a Kubernetes cluster?
  answer: 'Backup: etcdctl snapshot save /backup/etcd-snapshot.db --endpoints=https://127.0.0.1:2379 --cacert --cert --key
    (with TLS certs). Verify: etcdctl snapshot status /backup/etcd-snapshot.db. Restore: stop kube-apiserver, run etcdctl
    snapshot restore with --data-dir pointing to a new directory, update etcd config to use the new data dir, restart etcd
    and kube-apiserver.'
- id: etcd-004
  topic: etcd
  level: L3
  question: Your 3-member etcd cluster has one member with latency spikes causing leader election churn. How do you diagnose
    and resolve this without downtime?
  answer: '1) Check etcdctl endpoint status --write-out=table for leader changes and Raft term increments. 2) Check disk I/O
    on the slow member — etcd is latency-sensitive and requires low-latency storage (SSD). 3) Check network latency between
    members. 4) If disk: migrate the member to SSD storage. 5) If persistent: remove the slow member (etcdctl member remove),
    fix the underlying issue, add a new member (etcdctl member add). Quorum of 2 maintains availability during single-member
    replacement.'
- id: k8sdebug-001
  topic: k8s_debugging
  level: L0
  question: What are the first three kubectl commands you run when a pod is not working?
  answer: 1) kubectl get pods -n <ns> -o wide — see status, restarts, node. 2) kubectl describe pod <name> -n <ns> — read
    Events section for what Kubernetes tried and where it failed. 3) kubectl logs <name> -n <ns> — see application output.
    These three answer 80% of questions.
- id: k8sdebug-002
  topic: k8s_debugging
  level: L1
  question: A pod is stuck in Pending state. What are the most common causes and how do you identify which one?
  answer: 'Common causes: (1) Insufficient resources — Events show ''Insufficient cpu/memory''. (2) No matching node for nodeSelector/affinity
    — Events show ''FailedScheduling''. (3) PVC not bound — Events show ''unbound PersistentVolumeClaims''. (4) Taints without
    tolerations. Check kubectl describe pod Events section for the specific scheduling failure reason.'
- id: k8sdebug-003
  topic: k8s_debugging
  level: L2
  question: A pod is Running but the application is returning 503 errors. kubectl logs shows the app started successfully.
    How do you debug this?
  answer: 'The pod is running but not receiving or handling traffic correctly. Check: (1) Readiness probe — is the pod marked
    Ready? (2) Service selector — does the Service selector match pod labels? (3) Endpoints — kubectl get endpoints <svc>
    — is the pod listed? (4) Port mapping — does the Service targetPort match the container''s listening port? (5) Network
    policies — is traffic allowed? Use kubectl port-forward to test the pod directly.'
- id: k8sdebug-004
  topic: k8s_debugging
  level: L3
  question: Intermittent 502 errors are hitting your service. Some requests succeed, some fail. Pods look healthy. How do
    you systematically narrow down the cause?
  answer: 1) Check if specific pods are unhealthy — curl each pod IP directly via port-forward. 2) Check readiness probe —
    a pod might be flapping between Ready/NotReady. 3) Check if the issue correlates with deployments (new pods not ready
    yet, old pods terminating). 4) Check ingress/load balancer health check settings vs actual readiness timing. 5) Check
    for connection draining issues — terminationGracePeriodSeconds and preStop hooks. 6) Use kubectl get events and pod logs
    with timestamps to correlate errors.
- id: k8sstor-001
  topic: k8s_storage
  level: L0
  question: What is the relationship between a PersistentVolume (PV), PersistentVolumeClaim (PVC), and StorageClass in Kubernetes?
  answer: A PV is a cluster-level storage resource (the 'disk'). A PVC is a namespace-scoped request for storage (the 'claim').
    A StorageClass defines how storage is dynamically provisioned. Pods reference PVCs, Kubernetes binds PVCs to matching
    PVs. With dynamic provisioning, creating a PVC with a StorageClass automatically creates the PV.
- id: k8sstor-002
  topic: k8s_storage
  level: L1
  question: What are the three access modes for PersistentVolumes and when would you use each?
  answer: 'ReadWriteOnce (RWO): mounted read-write by a single node — use for databases. ReadOnlyMany (ROX): mounted read-only
    by many nodes — use for shared config or static assets. ReadWriteMany (RWX): mounted read-write by many nodes — use for
    shared file storage. Most cloud block storage only supports RWO; RWX requires NFS or a distributed filesystem.'
  distractor: RWO means one node, not one pod. Multiple pods on the same node can share an RWO volume.
- id: k8sstor-003
  topic: k8s_storage
  level: L2
  question: A PVC is stuck in Pending state. What are the possible causes and how do you diagnose?
  answer: 'Causes: (1) No StorageClass matches — check PVC''s storageClassName vs available StorageClasses. (2) No PV matches
    (static provisioning) — check capacity, access mode, labels. (3) Provisioner is failing — check StorageClass provisioner
    and its controller pod logs. (4) Quota exceeded — check ResourceQuota in the namespace. Run kubectl describe pvc to see
    Events for the specific failure reason.'
- id: k8sstor-004
  topic: k8s_storage
  level: L3
  question: You need to migrate a StatefulSet's data from one StorageClass to another (e.g., HDD to SSD) with minimal downtime.
    How?
  answer: '1) Scale StatefulSet to 0. 2) For each PVC: create a temporary pod that mounts both old PVC and a new PVC (on the
    target StorageClass), then cp -a the data. 3) Delete old PVCs. 4) Create new PVCs with the original names bound to the
    new PVs (or let dynamic provisioning create them). 5) Scale StatefulSet back up. Alternative: use a tool like velero for
    backup/restore. Test the procedure in staging first.'
- id: oom-001
  topic: oom
  level: L0
  question: What does OOMKilled mean and what exit code does it produce?
  answer: OOMKilled means the Linux kernel's OOM killer terminated the container's process because it exceeded its cgroup
    memory limit. The process receives SIGKILL (signal 9), which cannot be caught. Exit code is 137 (128 + 9). The container
    had no chance to shut down gracefully.
- id: oom-002
  topic: oom
  level: L1
  question: What is the difference between memory requests and memory limits, and how do they affect OOMKilled behavior?
  answer: Requests are scheduling guarantees — the kubelet reserves this memory on the node. Limits are hard ceilings enforced
    by the kernel cgroup. If the container exceeds its limit, it is OOMKilled. If no limits are set, the container can consume
    unbounded memory and may cause the node's OOM killer to target other pods as well.
  distractor: Setting requests equal to limits gives Guaranteed QoS, making the pod the last to be evicted under node memory
    pressure.
- id: oom-003
  topic: oom
  level: L2
  question: A Java application keeps getting OOMKilled even though you set the memory limit to 2Gi and the JVM heap to 1.5G
    (-Xmx1536m). Why?
  answer: 'JVM memory is not just heap. Total JVM memory includes: heap (1.5G) + metaspace + thread stacks (1MB per thread
    x N threads) + direct buffers + code cache + GC overhead. A JVM with -Xmx1536m can easily use 1.8-2.0G total. Set the
    limit to at least 1.5x the heap or use -XX:MaxRAMPercentage=75 to let the JVM auto-size to 75% of the container limit.'
  distractor: People set -Xmx equal to the container limit, leaving no room for non-heap JVM memory.
- id: oom-004
  topic: oom
  level: L3
  question: Your cluster is experiencing node-level OOM kills where the kernel kills pods that are within their own limits.
    How is this possible and how do you prevent it?
  answer: 'This happens when pods without memory limits (BestEffort QoS) or with requests much lower than limits (Burstable
    QoS) collectively overcommit node memory. The kernel OOM killer picks victims based on oom_score. Prevention: (1) Always
    set memory limits on all pods. (2) Use LimitRange to enforce default limits per namespace. (3) Use ResourceQuota to cap
    total namespace consumption. (4) Set requests close to limits to reduce overcommit. (5) Monitor node memory with Prometheus
    and alert before pressure triggers kills.'
- id: rbac-001
  topic: k8s_rbac
  level: L0
  question: What are the four RBAC object types in Kubernetes and what scope does each have?
  answer: Role (namespace-scoped permissions), ClusterRole (cluster-wide permissions), RoleBinding (grants Role/ClusterRole
    to subjects in one namespace), ClusterRoleBinding (grants ClusterRole to subjects across the entire cluster). Roles define
    what is allowed; bindings connect roles to users, groups, or service accounts.
- id: rbac-002
  topic: k8s_rbac
  level: L1
  question: How do you give a CI/CD pipeline read-only access to pods and logs in the 'staging' namespace only?
  answer: '1) Create a ServiceAccount in the staging namespace. 2) Create a Role with rules: apiGroups [''''], resources [''pods'',
    ''pods/log''], verbs [''get'', ''list'', ''watch'']. 3) Create a RoleBinding that binds the Role to the ServiceAccount.
    4) Configure the CI/CD pipeline to use the ServiceAccount''s token. This limits access to staging only.'
- id: rbac-003
  topic: k8s_rbac
  level: L2
  question: A developer reports 'forbidden' errors when trying to create deployments in the 'dev' namespace, but can list
    pods. How do you diagnose and fix this?
  answer: '1) Check their permissions: kubectl auth can-i create deployments --as=<user> -n dev. 2) List their bindings: kubectl
    get rolebindings -n dev -o yaml and check which roles are bound. 3) The existing role likely allows pods but not deployments.
    Fix: add apiGroups [''apps''], resources [''deployments''], verbs [''create'', ''update'', ''patch''] to their Role. 4)
    Verify: kubectl auth can-i --list --as=<user> -n dev.'
- id: rbac-004
  topic: k8s_rbac
  level: L3
  question: You discover a service account in the 'default' namespace has cluster-admin privileges via a ClusterRoleBinding.
    What is the risk and how do you safely remediate?
  answer: 'Risk: Any pod using the default service account in that namespace has full cluster access — reads secrets, deletes
    namespaces, modifies RBAC. An attacker who compromises any pod there owns the cluster. Remediation: (1) Identify all pods
    using that SA. (2) Create least-privilege Roles/ClusterRoles for each workload''s actual needs. (3) Create dedicated ServiceAccounts
    per workload. (4) Update deployments to use the new SAs. (5) Remove the ClusterRoleBinding. (6) Set automountServiceAccountToken:
    false on the default SA.'
- id: logpipe-001
  topic: log_pipelines
  level: L0
  question: What is the difference between structured and unstructured logging, and why does it matter for log pipelines?
  answer: Unstructured logs are free-text lines (e.g., Nginx default format) that require regex parsing to extract fields.
    Structured logs use JSON or key-value pairs where fields are already labeled. Structured logs are far easier to process,
    route, and query in a pipeline because no fragile parsing step is needed.
- id: logpipe-002
  topic: log_pipelines
  level: L1
  question: What are the four stages of a log pipeline and what tool handles each?
  answer: 1) Collection — agents on each node collect logs (Fluentbit, Promtail, Filebeat). 2) Processing — parse, filter,
    enrich, and transform (Fluentd, Vector, Logstash). 3) Buffering — hold logs when the destination is slow or down (memory/disk
    buffers in the pipeline tool). 4) Delivery — send to destinations (Elasticsearch, Loki, S3, Datadog). Many tools combine
    multiple stages.
- id: logpipe-003
  topic: log_pipelines
  level: L2
  question: Your log pipeline is dropping logs during traffic spikes. What is backpressure and how do you configure the pipeline
    to handle it?
  answer: 'Backpressure occurs when the pipeline produces data faster than the destination can consume it. Solutions: (1)
    Add disk-based buffering so logs are not lost when memory fills. (2) Increase destination write capacity. (3) Configure
    retry with exponential backoff. (4) Set up a dead-letter queue for undeliverable logs. (5) In Fluentbit/Vector, tune buffer_size
    and flush intervals. The goal is at-least-once delivery — accept potential duplicates over data loss.'
- id: logpipe-004
  topic: log_pipelines
  level: L3
  question: You are designing a log pipeline for a 500-node Kubernetes cluster producing 10TB/day of logs. What architecture
    do you use?
  answer: 'Two-tier architecture: (1) Lightweight agents per node (Fluentbit as DaemonSet) for collection and basic filtering
    — drop debug logs, add metadata. (2) Aggregation layer (Fluentd or Vector as a separate Deployment) for heavy parsing,
    enrichment, routing. Route: hot logs (errors, security) to Elasticsearch/Loki for real-time query, cold logs to S3 with
    lifecycle policies. Use Kafka as a buffer between tiers for durability. Set resource limits on DaemonSet to prevent log
    agents from starving application pods.'
- id: secretsmgmt-001
  topic: secrets_management
  level: L0
  question: Why are Kubernetes Secrets not truly secure by default?
  answer: Kubernetes Secrets are only base64-encoded, not encrypted. Anyone with kubectl get secret access can decode them
    instantly. If the Secret YAML is committed to Git, the credential is in repo history forever. You need additional tooling
    (Sealed Secrets, SOPS, Vault, External Secrets Operator) for real secrets management.
- id: secretsmgmt-002
  topic: secrets_management
  level: L1
  question: How does Bitnami Sealed Secrets solve the 'secrets in Git' problem?
  answer: Sealed Secrets encrypts secrets with a cluster-specific public key. The developer creates a regular Secret, pipes
    it through kubeseal to produce a SealedSecret YAML, and commits that to Git. Only the Sealed Secrets controller running
    in the cluster has the private key to decrypt it. The SealedSecret is safe in Git because it can only be decrypted in
    that specific cluster.
- id: secretsmgmt-003
  topic: secrets_management
  level: L2
  question: What is the External Secrets Operator and when would you choose it over Sealed Secrets?
  answer: 'ESO syncs secrets from external stores (AWS Secrets Manager, Vault, GCP Secret Manager) into Kubernetes Secrets.
    Choose ESO when: (1) you already have a centralized secret store, (2) you need dynamic/rotating secrets, (3) you manage
    secrets across multiple clusters, (4) you want a single source of truth outside Kubernetes. Sealed Secrets is simpler
    if you only need Git-safe secrets for one cluster.'
- id: secretsmgmt-004
  topic: secrets_management
  level: L3
  question: Design a secrets management strategy for a multi-cluster production environment using HashiCorp Vault. How do
    secrets get into pods?
  answer: 'Architecture: (1) Central Vault cluster with Kubernetes auth backend configured per cluster. (2) Each cluster''s
    service accounts authenticate to Vault via JWT. (3) Vault policies grant least-privilege access per service account. (4)
    Delivery options: Vault Agent Injector (sidecar writes secrets to shared volume), External Secrets Operator (syncs to
    K8s Secrets), or application-level Vault SDK calls. (5) Enable dynamic secrets for databases so credentials auto-rotate.
    (6) Audit log all secret access.'
- id: secscan-001
  topic: security_scanning
  level: L0
  question: What does a container image vulnerability scanner like Trivy check for?
  answer: 'Trivy scans container images for: (1) known CVEs in OS packages (apt, yum), (2) vulnerable application dependencies
    (Python pip, Node npm, Go modules), (3) misconfigurations in Dockerfiles, and (4) exposed secrets/credentials in the image
    layers.'
- id: secscan-002
  topic: security_scanning
  level: L1
  question: In a CI pipeline, how do you configure Trivy to fail the build only on CRITICAL and HIGH vulnerabilities?
  answer: 'Set exit-code to 1 and severity to CRITICAL,HIGH: trivy image --exit-code 1 --severity CRITICAL,HIGH <image>. This
    lets the pipeline pass when only MEDIUM or LOW CVEs are found, while blocking builds with serious vulnerabilities. In
    GitHub Actions, use the trivy-action with these parameters.'
  distractor: Failing on all severities creates too much noise and blocks builds for low-risk issues that may not have fixes
    available.
- id: secscan-003
  topic: security_scanning
  level: L2
  question: What is an SBOM (Software Bill of Materials) and why is it important for security scanning?
  answer: 'An SBOM is a complete inventory of all software components, libraries, and dependencies in an image or application.
    It enables: (1) tracking which images are affected when a new CVE is published, (2) compliance requirements (US Executive
    Order 14028), (3) supply chain security auditing. Generate with: trivy image --format spdx-json or syft. Without an SBOM,
    you cannot answer ''which of our services use log4j?'' quickly.'
- id: secscan-004
  topic: security_scanning
  level: L3
  question: 'Design a container security scanning strategy that covers the full lifecycle: build, registry, and runtime.'
  answer: 'Build: Trivy in CI fails on CRITICAL/HIGH, generates SBOM, scans Dockerfile for misconfigurations. Registry: scheduled
    re-scans of stored images (new CVEs appear after build), admission controller (OPA/Kyverno) blocks unscanned images from
    deploying. Runtime: Falco or Sysdig for runtime anomaly detection (unexpected shell, network connections, file access).
    Alert pipeline integrates with PagerDuty. Policy: images older than 30 days must be rebuilt to pick up base image patches.'
- id: tlspki-001
  topic: tls_pki
  level: L0
  question: What is a certificate chain and why does order matter?
  answer: 'A certificate chain links a server certificate to a trusted root CA through intermediate CAs: Root CA -> Intermediate
    CA -> Server Certificate. The server must send its certificate plus the intermediate(s). If the chain is incomplete (missing
    intermediate), clients cannot verify trust and the connection fails. Root CAs are pre-installed in client trust stores.'
- id: tlspki-002
  topic: tls_pki
  level: L1
  question: What is the difference between the CN (Common Name) and SAN (Subject Alternative Names) fields in a certificate?
  answer: CN is the legacy identity field (e.g., app.example.com). SAN is the modern standard supporting multiple identities
    (multiple domains, wildcards, IP addresses). Modern browsers and clients require SAN — some ignore CN entirely if SAN
    is present. Always populate SAN when issuing certificates.
  distractor: People still create certs with only CN and wonder why Chrome rejects them — CN-only is deprecated.
- id: tlspki-003
  topic: tls_pki
  level: L2
  question: How does cert-manager automate certificate lifecycle in Kubernetes?
  answer: 'cert-manager watches Certificate resources, requests certs from configured Issuers (Let''s Encrypt, Vault, self-signed
    CA), stores them as Kubernetes Secrets, and automatically renews before expiry (default: 2/3 through the validity period).
    Flow: Certificate CR -> cert-manager creates Order/Challenge -> ACME validation (HTTP-01 or DNS-01) -> cert stored in
    Secret -> referenced by Ingress or application. ClusterIssuer works across namespaces.'
- id: tlspki-004
  topic: tls_pki
  level: L3
  question: You have 200 microservices using mTLS via cert-manager. Certificates are valid for 90 days. One Monday, 40 services
    fail simultaneously with TLS errors. What happened and how do you prevent recurrence?
  answer: 'Likely cause: cert-manager renewed certificates but pods were not restarted to pick up the new certs (most apps
    load certs at startup). Or cert-manager itself was down/stuck when renewals were due, causing mass expiry. Prevention:
    (1) Use shorter cert lifetimes (24h) with aggressive renewal so individual failures are smaller. (2) Ensure apps reload
    certs without restart (inotify on cert files). (3) Monitor cert-manager health and certificate expiry as Prometheus metrics.
    (4) Alert when any cert is within 7 days of expiry. (5) Stagger certificate issuance to avoid thundering herd.'
- id: capplan-001
  topic: capacity_planning
  level: L1
  question: What is the difference between utilization and saturation, and why does it matter for capacity planning?
  answer: Utilization is the percentage of a resource being used. Saturation is whether work is queuing because the resource
    cannot keep up. A system can be at 70% utilization with zero saturation (steady load) or massive saturation (bursty load).
    Plan on saturation, not utilization, because bursts cause queuing even when average utilization is low.
- id: capplan-002
  topic: capacity_planning
  level: L2
  question: How does Prometheus predict_linear help with capacity planning, and what is its key limitation?
  answer: predict_linear extrapolates a metric's trend into the future. For example, predict_linear(node_filesystem_avail_bytes[7d],
    30*24*3600) < 0 predicts whether disk will fill within 30 days based on the last 7 days. Its limitation is that it assumes
    linear growth — it fails for seasonal patterns, step-function changes (marketing campaigns), or logarithmic saturation.
- id: capplan-003
  topic: capacity_planning
  level: L2
  question: In an N+1 headroom model, a 4-node cluster handles 1000 rps per node with a current peak of 2800 rps. Can it survive
    a single node failure? What should you do?
  answer: With 1 node down, 3 remaining nodes must handle 2800 rps — 933 rps each (93% utilization). This is too tight. Add
    a 5th node so each handles 700 rps at peak. Losing 1 node means 4 nodes at 700 rps each, which is safe. N+1 means you
    should always be able to lose one node without exceeding safe utilization thresholds (typically 60-70% for CPU).
- id: chaos-001
  topic: chaos_engineering
  level: L1
  question: What is a steady-state hypothesis in chaos engineering, and why must you define it before injecting any failure?
  answer: A steady-state hypothesis defines what 'normal' looks like using measurable indicators (e.g., success rate >99.5%,
    p99 latency <500ms, error rate <0.5%). You must define it before the experiment so you have an objective baseline to compare
    against. Without it, you cannot determine whether the system maintained acceptable behavior during the failure injection.
- id: chaos-002
  topic: chaos_engineering
  level: L2
  question: What is the blast radius progression in chaos engineering, and why should you never skip levels?
  answer: 'The progression goes: (1) single pod in staging, (2) multiple pods in staging, (3) single pod in production, (4)
    percentage of production pods, (5) entire availability zone, (6) full region failure. You should never skip levels because
    each level validates assumptions needed for the next. A team that has not confirmed their service survives a single pod
    kill has no business testing AZ failure — they would risk a real outage with unknown failure modes.'
- id: chaos-003
  topic: chaos_engineering
  level: L0
  question: What is the difference between chaos engineering and just breaking things?
  answer: Chaos engineering starts with a hypothesis, defines steady state, controls blast radius, uses automated experiments,
    and documents results. Just breaking things has no hypothesis, no baseline, no controlled scope, uses manual destruction,
    and keeps no record. Chaos engineering builds confidence in system resilience; random destruction creates fear.
- id: finops-001
  topic: finops
  level: L1
  question: In Kubernetes, what is the single biggest cost optimization opportunity, and why?
  answer: The request/limit gap. You pay for requested resources, not actual usage. If a container requests 500m CPU but only
    uses 100m, you are paying for 400m of idle capacity. Right-sizing requests to match actual usage (using VPA recommendations)
    is the highest-impact cost optimization because it directly reduces the compute you are billed for across every pod.
- id: finops-002
  topic: finops
  level: L2
  question: What workloads are safe to run on spot/preemptible instances, and what workloads are not?
  answer: 'Safe for spot: stateless web apps behind Deployments with multiple replicas, retryable batch jobs, dev/staging
    environments, and CI/CD runners. Not safe: single-replica databases, stateful workloads without graceful shutdown, and
    long-running jobs that cannot checkpoint. Spot instances cost 60-90% less but can be reclaimed with 2-minute notice.'
- id: finops-003
  topic: finops
  level: L1
  question: What are the three phases of the FinOps framework?
  answer: Inform, Optimize, Operate. Inform means gaining visibility into who spends what and why (cost allocation, tagging,
    dashboards). Optimize means right-sizing resources, using committed-use discounts, and eliminating waste. Operate means
    continuous governance through budgets, alerts, and policies that prevent cost regression.
- id: incpsy-001
  topic: incident_psychology
  level: L1
  question: What is anchoring bias during an incident, and how do you counter it?
  answer: 'Anchoring bias occurs when the first piece of information encountered (e.g., someone says ''it is the database'')
    dominates all subsequent investigation, even when later evidence contradicts it. Counter it by writing down three hypotheses
    before investigating any single one, and setting a 15-minute timer to re-evaluate: ''Are we still pursuing the right theory?
    What evidence do we have against it?'''
- id: incpsy-002
  topic: incident_psychology
  level: L2
  question: What is plan continuation bias, and why is it especially dangerous during incident remediation?
  answer: Plan continuation bias is the reluctance to abort a remediation once started, even when signals indicate it is not
    working or making things worse. For example, continuing a database failover that is 60% complete even though the replica
    is degraded. It is dangerous because the sunk effort feels wasted if you stop. Counter it by defining abort criteria BEFORE
    starting any remediation action.
- id: incpsy-003
  topic: incident_psychology
  level: L1
  question: Why should the postmortem be scheduled 24-48 hours after a major incident, not immediately?
  answer: Immediately after an incident, people feel relief, guilt, anger, exhaustion, and anxiety. Running the postmortem
    while emotions are raw turns it into blame or defensiveness rather than learning. Waiting 24-48 hours allows emotional
    processing. In the meantime, acknowledge the stress, give people time to decompress, and check in privately with the person
    closest to the cause.
- id: plateng-001
  topic: platform_engineering
  level: L1
  question: What is a golden path in platform engineering, and why is it not called the 'only path'?
  answer: A golden path is an opinionated, well-supported, recommended way to accomplish a common task (e.g., deploying a
    new service). It is not the only path because some teams have legitimate reasons to diverge. The golden path provides
    templates, CI/CD, observability, and deployment automation out of the box. Teams that go off-path can, but their deviations
    should be tracked.
- id: plateng-002
  topic: platform_engineering
  level: L2
  question: What DORA metrics should a platform team track to know if their platform is working?
  answer: Lead time for changes (commit to production), deployment frequency (how often teams deploy), time to onboard (new
    service to production), self-service ratio (percentage of infra requests handled without a ticket), mean time to recover
    (how quickly teams fix production issues), platform adoption (percentage of teams on golden paths), and developer satisfaction
    (NPS or survey).
- id: plateng-003
  topic: platform_engineering
  level: L0
  question: What is the fundamental difference between a platform and an ops ticket queue?
  answer: A platform is a self-service product — developers run a CLI or click a UI and get infrastructure provisioned in
    minutes. A ticket queue means developers file a Jira ticket, an ops engineer provisions manually, and it takes 3-5 days.
    If every request still needs a platform team member to act, you have just renamed 'ops' to 'platform' without changing
    the bottleneck.
- id: postmortem-001
  topic: postmortem_slo
  level: L1
  question: What is an error budget, and what should happen when it is exhausted?
  answer: 'Error budget equals 1 minus the SLO. For a 99.9% SLO, the error budget is 0.1%, which equals 43.2 minutes per 30-day
    window. When the budget is exhausted, the error budget policy kicks in: typically a feature freeze until the budget recovers,
    all engineering effort on reliability, and mandatory postmortems for budget-depleting incidents.'
- id: postmortem-002
  topic: postmortem_slo
  level: L2
  question: What makes an SLI 'good' versus 'bad'? Give an example of each.
  answer: 'Good SLIs measure what users experience. Bad SLIs measure internal infrastructure metrics. Good: percentage of
    successful HTTP requests (availability), p99 response time (latency). Bad: CPU utilization (does not reflect user experience),
    average response time (hides tail latency), test pass rate (internal metric). SLIs should map to user-visible quality.'
- id: postmortem-003
  topic: postmortem_slo
  level: L1
  question: In a blameless postmortem, what does 'blameless' actually mean? Does it mean no one is accountable?
  answer: Blameless does NOT mean accountable-less. It means focusing on systems and processes rather than individuals. Instead
    of 'John pushed bad code,' write 'the deploy pipeline lacked a canary step.' Instead of 'the on-call should have known,'
    write 'the runbook was outdated.' The goal is organizational learning. Individuals are not punished for following the
    process — the process is fixed instead.
- id: systhink-001
  topic: systems_thinking
  level: L1
  question: What is a positive (reinforcing) feedback loop in infrastructure? Give an example.
  answer: 'A positive feedback loop amplifies change rather than stabilizing the system. Example: a retry storm — Service
    A times out on B, retries double the load on B, B slows further, more timeouts cause more retries, load quadruples, B
    crashes, A''s queues fill, A crashes too. The loop has no natural stopping point and amplifies until something breaks.
    Fix with circuit breakers, backoff, and rate limits.'
- id: systhink-002
  topic: systems_thinking
  level: L2
  question: Explain Little's Law (L = lambda * W) and why a 'small' latency increase can cause a total outage.
  answer: L (concurrent requests) = lambda (arrival rate) * W (average latency). If your API handles 100 rps at 200ms, L =
    20 concurrent requests. If latency increases to 2 seconds (database hiccup), L jumps to 200. Your connection pool of 50
    is exhausted, requests queue, latency increases further, L grows more — a positive feedback loop. A 10x latency increase
    requires 10x capacity to handle the same throughput.
- id: systhink-003
  topic: systems_thinking
  level: L2
  question: Why can adding retries to a failing service make the failure worse? What is the systems-aware alternative?
  answer: 'If Service B is failing at 10% because it is overloaded, adding 3 retries from Service A increases load on B by
    up to 3x. B''s failure rate rises from 10% to 40% or more, and with retries the effective load is 4x original — B crashes
    entirely. The fix looks correct in component thinking but is catastrophic in systems thinking. The alternative is a retry
    budget: only retry if total retry rate is below 10% of requests. Otherwise, fail fast.'
- id: apigw-001
  topic: api_gateway
  level: L0
  question: What is the role of an ingress controller in Kubernetes, and how does it differ from a LoadBalancer service per
    app?
  answer: An ingress controller is a reverse proxy running inside the cluster that routes external traffic to the correct
    backend service based on hostnames and paths. Instead of each service getting its own cloud load balancer (expensive and
    unmanageable), one ingress controller handles routing for all services, terminates TLS, and can apply rate limiting and
    authentication at the edge.
- id: apigw-002
  topic: api_gateway
  level: L1
  question: What are the three TLS modes at an ingress controller, and when would you use each?
  answer: 'Termination: TLS ends at the ingress, HTTP to backend — most common and simplest. Re-encryption: TLS at ingress,
    new TLS connection to backend — when backends require TLS. Passthrough: ingress forwards raw TCP, backend handles TLS
    — for end-to-end encryption when the ingress must not see plaintext. Use termination by default unless you have a specific
    reason for passthrough.'
- id: apigw-003
  topic: api_gateway
  level: L2
  question: How does the Kubernetes Gateway API improve over the traditional Ingress resource?
  answer: Gateway API is role-oriented (separates Gateway objects managed by infra teams from Route objects managed by app
    teams), supports native traffic splitting for canary and blue-green deployments, header-based routing, request/response
    manipulation, and cross-namespace references. Traditional Ingress relies on controller-specific annotations for advanced
    features, which are non-portable and fail silently on typos.
- id: k8sops-101
  topic: k8s_operators
  level: L1
  question: What is the reconciliation loop in a Kubernetes operator, and what are its steps?
  answer: 'The reconciliation loop is the core pattern: (1) Watch for changes to custom resources, (2) Compare desired state
    (CR spec) with actual state in the cluster, (3) Act by creating, updating, or deleting resources to match desired state,
    (4) Update the CR status subresource with current state, (5) Repeat. The loop must be idempotent — calling Reconcile multiple
    times for the same state must produce the same result.'
- id: k8sops-102
  topic: k8s_operators
  level: L2
  question: Why are owner references important for operator-managed resources, and what problem do finalizers solve?
  answer: 'Owner references let Kubernetes garbage collect child resources (StatefulSets, Services, etc.) when the parent
    custom resource is deleted. Without them, child resources become orphans. Finalizers solve the opposite problem: they
    let the operator run cleanup logic (e.g., take a final backup) before the CR is deleted. The operator detects the deletion
    timestamp, runs cleanup, removes the finalizer, and then Kubernetes completes deletion.'
- id: k8sops-103
  topic: k8s_operators
  level: L0
  question: What is a CRD (Custom Resource Definition) and what does it enable?
  answer: A CRD extends the Kubernetes API with your own resource types. After creating a CRD for, say, 'Database', you can
    kubectl get databases, kubectl describe db my-database, etc. It lets you define a schema with validation. Combined with
    a controller (operator), CRDs let you manage complex stateful workloads like databases or message brokers through declarative
    YAML, the same way you manage Deployments and Services.
- id: multiten-001
  topic: multi_tenancy
  level: L1
  question: Why must you create a default-deny NetworkPolicy before any allow rules in a multi-tenant cluster?
  answer: By default, all pods can talk to all pods in Kubernetes. In a multi-tenant cluster, this means tenant A's web server
    can reach tenant B's database. A default-deny NetworkPolicy (empty podSelector, both Ingress and Egress policy types)
    blocks all traffic in the namespace, then you add specific allow rules on top. Without default-deny, network policies
    only add rules — they never restrict what was already open.
  distractor: 'Note: NetworkPolicies require a CNI that supports them (Calico, Cilium). On default kubenet, policies exist
    as objects but have zero enforcement effect.'
- id: multiten-002
  topic: multi_tenancy
  level: L1
  question: What happens when a ResourceQuota exists in a namespace but a pod does not declare resource requests and limits?
  answer: The pod is rejected by the API server. Once a ResourceQuota exists in a namespace, every pod in that namespace must
    declare resource requests and limits. This forces tenants to think about their resource needs. To prevent this from breaking
    existing workloads, combine ResourceQuota with a LimitRange that provides default requests and limits for pods that omit
    them.
- id: multiten-003
  topic: multi_tenancy
  level: L2
  question: What are the three multi-tenancy models in Kubernetes, and when would you choose each?
  answer: Namespace per tenant (most common, low cost, moderate isolation — good starting point for most teams), virtual cluster
    per tenant using tools like vCluster (stronger isolation, tenants can install CRDs and have independent cluster-admin,
    higher complexity), and dedicated cluster per tenant (maximum isolation, no noisy-neighbor risk, but expensive and requires
    fleet management). Start with namespace-per-tenant and upgrade when the isolation model breaks.
- id: nodelife-001
  topic: k8s_node_lifecycle
  level: L0
  question: What is the difference between cordoning and draining a Kubernetes node?
  answer: Cordoning marks the node as unschedulable — no new pods will be placed on it, but existing pods continue running.
    Draining evicts all pods from the node (respecting PodDisruptionBudgets), moving workloads to other nodes. The typical
    maintenance sequence is cordon first (stop new work), then drain (move existing work), then perform maintenance.
- id: nodelife-002
  topic: k8s_node_lifecycle
  level: L2
  question: Why can a PodDisruptionBudget (PDB) cause a drain to get stuck, and how do you resolve it?
  answer: 'A PDB sets a minimum number of available pods (e.g., minAvailable: 2). If draining a node would reduce available
    pods below the PDB minimum and there are not enough other nodes to reschedule, the drain blocks indefinitely. Resolution:
    add capacity (more nodes) so pods can be rescheduled while respecting the PDB, or temporarily relax the PDB if the drain
    is urgent and the risk is accepted.'
- id: nodelife-003
  topic: k8s_node_lifecycle
  level: L1
  question: What does a 'NotReady' node condition mean, and what are common causes?
  answer: 'NotReady means the kubelet on that node has stopped reporting healthy status to the control plane. Common causes:
    kubelet process crashed or is not running, node ran out of disk space (DiskPressure), node ran out of memory (MemoryPressure),
    network partition between the node and the API server, or the node''s certificate expired. Check with kubectl describe
    node and journalctl -u kubelet on the node.'
- id: poleng-001
  topic: policy_engines
  level: L1
  question: What problem do policy engines solve that RBAC alone cannot?
  answer: 'RBAC controls who can do what (identity-based: ''can this user create a Deployment?''). Policy engines control
    what can exist (content-based: ''does this specific Deployment have resource limits, use an approved image registry, and
    run as non-root?''). RBAC cannot inspect the content of a resource being created. Policy engines validate the actual specification
    against organizational standards at admission time.'
- id: poleng-002
  topic: policy_engines
  level: L2
  question: What is the recommended rollout strategy for a new Kyverno or Gatekeeper policy, and why?
  answer: Deploy in Audit mode first. Review violations with kubectl get policyreport -A (Kyverno) or kubectl get constraint
    -o yaml (Gatekeeper). Fix existing resources that violate the policy. Only then switch to Enforce mode. Enforcing immediately
    will reject creation and updates for all non-compliant resources, potentially breaking existing workloads and deployments.
- id: poleng-003
  topic: policy_engines
  level: L1
  question: What are the key differences between OPA Gatekeeper and Kyverno?
  answer: OPA Gatekeeper uses Rego (a custom policy DSL with a steep learning curve), supports validation well but has limited
    mutation, and requires two objects (ConstraintTemplate + Constraint). Kyverno uses native YAML (low learning curve), has
    first-class support for validation, mutation, and resource generation, and is defined in a single ClusterPolicy. Kyverno
    is easier for Kubernetes-native teams; Gatekeeper is better for complex cross-platform logic.
- id: svcmesh-001
  topic: service_mesh
  level: L1
  question: How does a service mesh provide mutual TLS (mTLS) without changing application code?
  answer: The control plane acts as a Certificate Authority and issues short-lived TLS certificates to each sidecar proxy
    (identity based on ServiceAccount). Every connection between proxies is automatically encrypted and mutually authenticated.
    Applications communicate over localhost to their sidecar; the sidecar handles all TLS negotiation and certificate rotation
    transparently. No code changes needed.
- id: svcmesh-002
  topic: service_mesh
  level: L0
  question: What are the two planes of a service mesh, and what does each do?
  answer: The data plane consists of sidecar proxies (usually Envoy or linkerd2-proxy) injected alongside every pod that intercept
    all network traffic between services. The control plane (Istiod for Istio, Linkerd destination/identity for Linkerd) configures
    those proxies, issues certificates, and collects telemetry. The data plane handles traffic; the control plane manages
    policy and configuration.
- id: svcmesh-003
  topic: service_mesh
  level: L2
  question: What observability signals does a service mesh provide for free, and what is a common pitfall with sidecar injection?
  answer: 'A mesh gives you request rate, error rate (4xx/5xx), latency (p50/p95/p99), and live service topology — all without
    application instrumentation. A common pitfall is that sidecar injection requires the namespace to be labeled (Istio: istio-injection=enabled)
    or annotated (Linkerd: linkerd.io/inject=enabled). Pods created before injection was enabled need to be restarted to get
    the sidecar.'
- id: otel-001
  topic: opentelemetry
  level: L1
  question: What are the three components of an OTel Collector pipeline, and in what order do they execute?
  answer: 'Receivers (ingest data from sources like OTLP, Prometheus scrape, or filelog), Processors (transform data in flight
    — batch, filter, tail sample, memory limit), and Exporters (send data to backends like Tempo, Prometheus, Jaeger, Loki).
    They execute in order: receivers -> processors -> exporters. Each signal type (traces, metrics, logs) has its own pipeline
    definition.'
- id: otel-002
  topic: opentelemetry
  level: L2
  question: What is the difference between head sampling and tail sampling in OpenTelemetry, and when would you use each?
  answer: Head sampling decides at trace creation whether to sample (e.g., sample 10% of all traces). It is simple and low
    overhead but may drop interesting traces. Tail sampling decides after the trace completes, based on its content — keeping
    all errors, all slow requests, plus a percentage baseline. Tail sampling requires the collector to buffer complete traces
    (costs memory) but preserves the most valuable signals. Use head sampling for low-overhead environments; tail sampling
    for production observability.
- id: otel-003
  topic: opentelemetry
  level: L0
  question: What problem does OpenTelemetry solve, and what are the three telemetry signals it unifies?
  answer: OTel solves observability fragmentation — instead of separate agents, config languages, and SDKs for each telemetry
    type, OTel provides a single vendor-neutral standard. The three signals are traces (request journey across services, composed
    of spans), metrics (counters, gauges, histograms), and logs (structured events with severity and trace context). Instrument
    once, route to any backend.
- id: tempo-001
  topic: tempo
  level: L1
  question: Grafana Tempo shows no traces but the Tempo pod is healthy and /ready returns 200. What is the most likely cause?
  answer: Tempo is purely receive-side — unlike Promtail which pulls logs, Tempo waits for traces to be pushed to it. If the
    application is not instrumented with OpenTelemetry or the OTEL_EXPORTER_OTLP_ENDPOINT is misconfigured, Tempo will be
    healthy but empty. Check whether the app has the OTLP endpoint set and whether that endpoint is reachable from the app
    pod.
- id: tempo-002
  topic: tempo
  level: L0
  question: What is Tempo's role in an observability stack, and how does it receive trace data?
  answer: Tempo is a distributed tracing backend (part of the Grafana stack alongside Prometheus, Loki, and Grafana). It stores
    and queries traces. It receives trace data via push protocols — primarily OTLP (from OpenTelemetry Collector or SDK) on
    gRPC port 4317 or HTTP port 4318. Applications or OTel Collectors export spans to Tempo's receiver endpoint.
- id: tempo-003
  topic: tempo
  level: L2
  question: When troubleshooting missing traces in Tempo, what is the correct order of checks from application to backend?
  answer: 1) Verify the application has OTel SDK configured and is creating spans. 2) Check OTEL_EXPORTER_OTLP_ENDPOINT points
    to the correct collector or Tempo host:port. 3) Verify network reachability from the app pod to the endpoint. 4) Check
    the OTel Collector logs for export errors (if using a collector). 5) Check Tempo pod health and logs. 6) Verify the Grafana
    Tempo data source URL is correct (typically http://tempo:3200).
- id: comply-001
  topic: compliance
  level: L1
  question: What are the five levels of compliance maturity, and what level should a production environment target?
  answer: 'Level 0 (Manual): spreadsheets and screenshots. Level 1 (Scripted): one-off scan scripts before audit. Level 2
    (Scheduled): cron-based weekly scans. Level 3 (Pipeline): compliance checks in CI/CD that block bad builds. Level 4 (Continuous):
    real-time monitoring plus auto-remediation. Level 5 (Codified): compliance profiles versioned in git with auditable diffs.
    Production should target Level 3 minimum, Level 4-5 for regulated environments.'
- id: comply-002
  topic: compliance
  level: L2
  question: What are STIG severity categories (CAT I, II, III), and how should each be treated?
  answer: 'CAT I (High): direct data loss or system compromise — must fix with no exceptions without a formal waiver (e.g.,
    no password on root). CAT II (Medium): potential degraded security — should fix, waivers possible with justification (e.g.,
    audit log not configured). CAT III (Low): minor security concerns — fix when practical (e.g., warning banner not displayed).
    Do not ignore CAT III findings — 50 unfixed ones signal systemic neglect to auditors.'
- id: comply-003
  topic: compliance
  level: L1
  question: Why is scanning only at build time insufficient for compliance, and what should you do instead?
  answer: Build-time scanning verifies the golden image, but production drifts from that image over time through configuration
    changes, package updates, and manual interventions. You should run compliance scans continuously in production, not just
    in CI. Additionally, every evidence artifact must have a timestamp, hostname, and scan profile version — an undated scan
    result is worthless to an auditor.
- id: forensic-001
  topic: forensics
  level: L1
  question: As a first responder to a suspected security incident, what should you do and what should you absolutely NOT do?
  answer: 'DO: detect and confirm the anomaly, preserve volatile evidence (RAM, connections, processes), document what you
    see, contain the damage (isolate, do not destroy), notify the security/IR team, and maintain chain of custody. DO NOT:
    reboot the system (destroys volatile data), kill suspicious processes (destroys evidence), delete suspicious files, run
    unknown cleanup scripts, log in with shared credentials, or discuss the incident on public channels.'
- id: forensic-002
  topic: forensics
  level: L2
  question: What is the evidence preservation priority order when responding to a compromised system, and why?
  answer: 'Priority 1: Volatile data (lost on reboot) — running processes, network connections, open files, memory info, routing
    table, ARP cache, loaded kernel modules. Priority 2: Semi-volatile data (may rotate) — log files, temp files, user command
    histories. Priority 3: Non-volatile data (persistent) — filesystem timeline, disk image, configuration files. Capture
    in this order because volatile evidence disappears first and is often the most revealing.'
- id: forensic-003
  topic: forensics
  level: L1
  question: How do you verify whether system binaries have been tampered with on a Linux system?
  answer: 'On RHEL/CentOS: rpm -Va | grep ''^..5'' lists files with changed MD5 checksums. On Debian/Ubuntu: debsums -c lists
    changed conffiles. For specific critical binaries (ssh, sshd, sudo, ps, ls), check with file (should be ELF binary, not
    script), sha256sum (compare against known-good hashes), and stat (check modification time). Also search for unexpected
    SUID binaries with find / -type f -perm -4000, as new SUID files are highly suspicious.'
- id: ldap-001
  topic: ldap
  level: L0
  question: What is a Distinguished Name (DN) in LDAP, and what are its components?
  answer: 'A DN is the full path to an entry in the LDAP directory tree, read from most specific to least specific. Example:
    uid=alice,ou=People,dc=example,dc=com. Components: uid (user ID), ou (Organizational Unit — a container), dc (Domain Component
    — builds the domain). The RDN (Relative Distinguished Name) is just the entry''s own name component (e.g., uid=alice).'
- id: ldap-002
  topic: ldap
  level: L1
  question: Describe the Linux authentication chain from user login to LDAP, naming each component.
  answer: User types password -> PAM (Pluggable Authentication Modules, configured in /etc/pam.d/) handles the authentication
    flow -> NSS (Name Service Switch, /etc/nsswitch.conf) maps identities (uid to username) -> SSSD (System Security Services
    Daemon) acts as the cache and backend connector -> LDAP/AD/FreeIPA backend validates credentials and provides identity
    data. Understanding this chain is essential for debugging login failures.
- id: ldap-003
  topic: ldap
  level: L2
  question: What do the PAM control flags 'required', 'requisite', 'sufficient', and 'optional' mean, and why does their order
    matter?
  answer: 'required: must pass, failure is fatal but continues checking remaining modules. requisite: must pass, failure stops
    immediately (no more modules checked). sufficient: if it passes, skip remaining modules in this stack (success short-circuits).
    optional: result only matters if it is the only module. Order matters because a misplaced ''sufficient'' can bypass all
    subsequent security checks, and ''requisite'' stops evaluation early.'
- id: fd-001
  topic: fd
  level: L0
  question: How does fd differ from find in handling .gitignore files?
  answer: fd respects .gitignore by default, automatically skipping ignored files and directories. find has no awareness of
    .gitignore and searches everything.
- id: fd-002
  topic: fd
  level: L1
  question: What is the difference between fd --exec and fd --exec-batch, and when would you use each?
  answer: --exec runs the command once per match (in parallel). --exec-batch runs the command once with all matches as arguments
    (like xargs). Use --exec for per-file operations (e.g., compiling), --exec-batch for tools that accept multiple files
    at once (e.g., shellcheck, ruff).
- id: fd-003
  topic: fd
  level: L2
  question: You need to find all shell scripts modified in the last 7 days, excluding node_modules, and verify they pass syntax
    checks. Write the fd command.
  answer: fd -e sh -E node_modules --changed-within 7d --exec-batch bash -n. This uses extension filter, exclusion, time filter,
    and batch execution to syntax-check all matching scripts in one pass.
- id: moderncli-001
  topic: modern_cli
  level: L0
  question: What modern CLI tool replaces grep -r for recursive code search, and what is its key speed advantage?
  answer: ripgrep (rg). It is multi-threaded, respects .gitignore by default, and is significantly faster than grep -r on
    large codebases.
- id: moderncli-002
  topic: modern_cli
  level: L1
  question: How does zoxide decide which directory to jump to when you type 'z grok'?
  answer: zoxide uses frecency — a combination of frequency and recency. It tracks which directories you visit and how recently
    you visited them, then jumps to the best match. More frequent and more recent visits rank higher.
- id: moderncli-003
  topic: modern_cli
  level: L2
  question: Describe a pipeline combining rg, fzf, and bat to interactively browse files containing a pattern with a syntax-highlighted
    preview.
  answer: rg --files | fzf --preview 'bat --color=always {}' — this lists all files via ripgrep, pipes them into fzf for interactive
    fuzzy selection, and uses bat to show a syntax-highlighted preview of the selected file in the fzf preview pane.
- id: virt-001
  topic: virtualization
  level: L0
  question: What are the three components of the standard Linux virtualization stack, and what does each do?
  answer: KVM provides hardware-accelerated CPU and memory virtualization via a kernel module. QEMU emulates devices (disk,
    network, USB) in userspace. libvirt provides a unified management API so tools like virsh and virt-manager don't need
    to know QEMU internals.
- id: virt-002
  topic: virtualization
  level: L1
  question: Why should you always use VirtIO devices instead of emulated legacy devices (e.g., e1000 NIC) in production VMs?
  answer: VirtIO is a paravirtualized framework where the guest OS cooperates with the hypervisor, reducing overhead. Emulated
    legacy devices (e1000, IDE) carry significant CPU overhead because the guest doesn't know it's virtual. VirtIO-net is
    2-10x faster than e1000, and virtio-blk is 2-5x faster than emulated IDE/SATA.
- id: virt-003
  topic: virtualization
  level: L2
  question: A VM on a dual-socket server has high memory access latency despite having enough RAM. What is the likely cause
    and how do you fix it?
  answer: 'The VM''s vCPUs and memory are likely split across NUMA nodes, causing cross-node memory access with 40-100ns additional
    latency per access. Fix by pinning the VM to a single NUMA node: ''virsh numatune web01 --mode strict --nodeset 0'' and
    pin vCPUs to cores on the same node with ''virsh vcpupin''.'
- id: aitools-001
  topic: ai_devops_tools
  level: L0
  question: What are three things you should never paste into an AI tool like ChatGPT or Claude when asking for DevOps help?
  answer: 1) Secrets, API keys, or credentials. 2) Unsanitized logs containing internal IPs, usernames, or hostnames. 3) Sensitive
    compliance data (SOC2, HIPAA-relevant information). Always sanitize before sharing.
- id: aitools-002
  topic: ai_devops_tools
  level: L1
  question: Explain the prompt engineering technique of 'prompt chaining' and give a DevOps example.
  answer: 'Prompt chaining breaks a complex task into a sequence of smaller prompts where each builds on the previous output.
    DevOps example: 1) ''Read this Terraform state and list all resources.'' 2) ''Design a migration plan to split into three
    state files.'' 3) ''Generate the terraform state mv commands for phase 1.'' 4) ''Write a validation script to verify after
    migration.'''
- id: aitools-003
  topic: ai_devops_tools
  level: L2
  question: When would you choose Claude Code over GitHub Copilot, and when would Copilot be the better choice?
  answer: Claude Code is better for interactive debugging with live terminal commands, learning a new codebase by reading
    files, and writing one-off scripts with iterative refinement. Copilot is better for inline code completion as you type
    in the editor, boilerplate generation, and completing patterns with zero friction. Claude Code excels at multi-step tasks
    requiring terminal access; Copilot excels at in-editor flow.
- id: mlops-001
  topic: ml_ops
  level: L1
  question: 'Why is mounting /dev/shm as an emptyDir with medium: Memory critical for PyTorch training jobs in Kubernetes?'
  answer: 'PyTorch DataLoader uses shared memory (/dev/shm) for multiprocess data loading. The default /dev/shm in Kubernetes
    is only 64MB. A training job with multiple data workers will crash when it exceeds this limit. Mounting an emptyDir with
    medium: Memory provides adequate shared memory backed by RAM.'
- id: mlops-002
  topic: ml_ops
  level: L2
  question: What is the difference between GPU time-slicing and MIG (Multi-Instance GPU), and when would you use each?
  answer: Time-slicing shares a GPU by rapidly switching between workloads but provides no memory isolation — all workloads
    share GPU memory, creating OOM risk. MIG (available on A100/H100) partitions the GPU into hardware-isolated instances
    with dedicated memory. Use time-slicing for development environments where cost matters more than isolation. Use MIG for
    production inference where each model needs predictable, isolated GPU memory.
- id: mlops-003
  topic: ml_ops
  level: L3
  question: A GPU training job shows low GPU utilization (15%) despite requesting a full A100. What are three likely causes
    and how do you diagnose each?
  answer: 1) Data loading bottleneck — the CPU/disk can't feed data fast enough. Diagnose with nvidia-smi showing GPU idle
    between bursts, and check CPU utilization and disk I/O. Fix with more DataLoader workers or faster storage. 2) Small batch
    size — GPU finishes quickly and waits. Diagnose by correlating batch size with utilization. Fix by increasing batch size.
    3) PCIe bottleneck — data transfer between CPU and GPU is the bottleneck. Diagnose with nvidia-smi showing low PCIe throughput.
    Fix by using NVLink for multi-GPU or ensuring PCIe Gen4 bandwidth.
- id: career-001
  topic: career
  level: L0
  question: What is the 'impact formula' for writing strong resume bullet points as an ops engineer?
  answer: '[Action verb] + [what you built/changed] + [quantified result]. The result should include measurable metrics: time
    saved, scale (number of servers/services), reliability improvement (uptime %, MTTR reduction), cost savings, or risk reduction
    (incidents prevented, compliance achieved).'
- id: career-002
  topic: career
  level: L1
  question: What is 'title arbitrage' in the ops job market, and how should you account for it when job hunting?
  answer: Title arbitrage refers to the fact that identical work carries different titles at different companies — a 'Senior
    SysAdmin' at one company may do the same work as a 'DevOps Engineer' at another but at 60% of the salary. When job hunting,
    search across all equivalent titles (SysAdmin, DevOps Engineer, SRE, Platform Engineer, Infrastructure Engineer, Cloud
    Engineer) to find the best opportunities.
- id: career-003
  topic: career
  level: L2
  question: What differentiates a Staff Engineer from a Senior Engineer in the ops career ladder?
  answer: The differentiator is not deeper technical skill — it is broader organizational influence. Staff engineers do not
    just solve problems; they identify which problems are worth solving. They influence architecture across teams, set technical
    direction, and drive systemic improvements rather than individual system fixes. The Senior-to-Staff transition is where
    most ops engineers stall because they focus on technical depth rather than organizational impact.
- id: edgeiot-001
  topic: edge_iot
  level: L0
  question: What is the A/B partition scheme for OTA updates, and why is it essential for edge devices?
  answer: 'The A/B partition scheme keeps two OS partitions: one active and one for updates. Updates are written to the inactive
    partition. On reboot, the device tries the new partition. If it fails to boot (3 consecutive failures), it automatically
    reverts to the previous partition. This is essential because edge devices cannot be physically accessed for recovery if
    an update bricks them.'
- id: edgeiot-002
  topic: edge_iot
  level: L1
  question: Why is standard Prometheus scraping unsuitable for edge devices on metered cellular connections, and what are
    two alternative strategies?
  answer: 'Standard Prometheus pull-based scraping requires constant network availability and generates significant traffic
    that is expensive on metered cellular. Alternatives: 1) Edge-local Prometheus with remote_write that batches and compresses
    metrics before pushing to a central server. 2) MQTT-based metrics where the edge device publishes tiny payloads to a broker,
    which feeds into Telegraf and then Prometheus. Both reduce bandwidth and handle intermittent connectivity.'
- id: edgeiot-003
  topic: edge_iot
  level: L2
  question: You manage 500 edge devices on cellular. An update bricked 3 devices in your canary group. What update safety
    rules should have prevented wider damage, and what is the correct phased rollout pattern?
  answer: 'Safety rules: 1) Never update all devices at once — use canary deployment. 2) Every update must have automatic
    rollback (boot counter: if new version fails 3 times, revert; watchdog timer: if device does not phone home within N minutes,
    revert). 3) Never update the bootloader unless absolutely necessary. Correct phased pattern: 1% canary with 24-hour soak,
    then 5%, then 25%, then 100%, with observation and health checks at each phase before proceeding.'
- id: homelab-001
  topic: homelab
  level: L0
  question: What is Proxmox VE and what does it replace in a homelab environment?
  answer: Proxmox VE is a free, open-source hypervisor built on KVM/QEMU with a web UI. It replaces VMware vSphere for homelab
    virtualization. It supports VMs, LXC containers, ZFS storage, clustering with HA, and live migration.
- id: homelab-002
  topic: homelab
  level: L1
  question: Why should you set up VLAN segmentation in a homelab even though it is 'just a lab'?
  answer: Network segmentation is a core production skill that you should practice in a homelab. IoT devices should not be
    on the same network as your Proxmox management interface. VLANs prevent untrusted devices from reaching management planes,
    and practicing VLAN configuration (management, servers, IoT/untrusted, Kubernetes) builds muscle memory for real datacenter
    and cloud network design.
- id: homelab-003
  topic: homelab
  level: L2
  question: Describe the process to create a cloud-init VM template in Proxmox and use it to rapidly provision a 3-node k3s
    cluster.
  answer: '1) Create a VM shell: qm create 9000 --name ubuntu-cloud --memory 2048 --cores 2 --net0 virtio,bridge=vmbr0. 2)
    Import a cloud image as disk: qm importdisk 9000 ubuntu-cloud.img local-zfs. 3) Attach the disk and cloud-init drive:
    qm set 9000 --scsi0 local-zfs:vm-9000-disk-0 --ide2 local-zfs:cloudinit. 4) Convert to template: qm template 9000. 5)
    Clone 3 nodes: qm clone 9000 100 --name k3s-node-1 --full (repeat for nodes 2 and 3). Each clone gets a unique VM ID and
    can be customized via cloud-init (IP, SSH keys, hostname).'
- id: legacysys-001
  topic: legacy_systems
  level: L0
  question: When you inherit a system on your first day, what is the very first survey you should run before changing anything?
  answer: 'Run: hostname && uname -a && cat /etc/os-release (identity), uptime (stability), systemctl list-units --type=service
    --state=running (purpose), ss -tlnp (network listeners), ss -tnp to map connections, crontab listings for all users, du
    -sh /* for disk usage, and awk -F: ''$3 >= 1000'' /etc/passwd for human users. Observe before touching anything.'
- id: legacysys-002
  topic: legacy_systems
  level: L1
  question: The config in git says max_connections=100 but the running server has max_connections=500. Which is the real config
    and how do you find what the process is actually using?
  answer: 'The server is always the real config — git shows intent, not reality. Find what the process actually uses by: 1)
    Check the process command line for config file paths: cat /proc/<PID>/cmdline | tr ''\0'' '' ''. 2) Use lsof -p <PID>
    to see which config files are open. 3) Use strace -e openat on the process to trace file opens. 4) For services that support
    it, dump running config (e.g., nginx -T, postconf -n, sshd -T).'
- id: legacysys-003
  topic: legacy_systems
  level: L2
  question: You discover a cron job running a binary with no source code in the repo, as user 'jsmith' who left 2 years ago.
    How do you investigate what it does and whether it is safe to disable?
  answer: '1) Read the cron entry for schedule, command, and output destination. 2) Examine the binary: file <binary>, strings
    <binary> to find clues. 3) Use strace or lsof to trace its system calls and network connections when it runs. 4) Check
    git log --all --author=jsmith for context. 5) Check if anything depends on its output (files it writes, services it signals).
    6) Do NOT delete — disable first by commenting the cron entry. Wait at least one full cycle (month if monthly) to see
    if anything breaks. Document your findings for the next person.'
- id: warstory-001
  topic: ops_war_stories
  level: L0
  question: What single question resolves approximately 40% of production incidents within minutes?
  answer: '''Was anything deployed or changed in the last 4 hours?'' Recent changes (deploys, config changes, infrastructure
    changes) are the number one cause of incidents at roughly 40% frequency. If the answer is yes, there is a strong correlation
    — rollback first, investigate second.'
- id: warstory-002
  topic: ops_war_stories
  level: L1
  question: df shows 100% disk usage but du -sh /* totals to only 60%. What are the most likely causes of the missing 40%?
  answer: 1) Deleted files still held open by a running process (most common) — check with lsof +D /var/log | grep deleted,
    fix by restarting the process. 2) Filesystem reserved blocks — ext4 reserves 5% for root by default, check with tune2fs
    -l. 3) A mount point covering a directory that has data underneath it — umount and check. 4) Large filesystem journal
    consuming space that du does not report.
- id: warstory-003
  topic: ops_war_stories
  level: L2
  question: API response time is 2 seconds but server CPU is at 10%, memory is fine, and disk is fine. Walk through the differential
    diagnosis.
  answer: 1) DNS resolution delays (extremely common) — test with 'time nslookup api.dependency.com', fix with local DNS cache.
    2) Connection pool exhaustion — application waiting for database/Redis/HTTP connections, check pool metrics and ss -tnp
    ESTABLISHED count. 3) Upstream service is slow — your service is fast but blocks on a dependency, add timeouts and circuit
    breakers. 4) TCP retransmissions from packet loss — check 'netstat -s | grep retransmit', even 0.5% loss causes massive
    latency. 5) GC pauses — application frozen during garbage collection, CPU looks idle during stop-the-world pauses.
- id: vscode-001
  topic: vscode
  level: L0
  question: What VS Code feature lets you edit files on a remote server as if they were local, and how do you connect?
  answer: 'The Remote-SSH extension. Connect via Ctrl+Shift+P -> ''Remote-SSH: Connect to Host'', enter user@hostname (it
    uses your ~/.ssh/config). Once connected, you can open folders, use the terminal, and debug — all running on the remote
    machine.'
- id: vscode-002
  topic: vscode
  level: L1
  question: How do Dev Containers solve the 'works on my machine' problem for a DevOps team?
  answer: Dev Containers define the development environment as code in a .devcontainer/devcontainer.json file that specifies
    the base image, installed tools (docker, kubectl, helm, terraform), VS Code extensions, and post-create setup commands.
    Every contributor who opens the project gets an identical environment with the same tool versions and extensions, eliminating
    configuration drift between developer machines.
- id: vscode-003
  topic: vscode
  level: L2
  question: How would you configure VS Code terminal profiles to visually distinguish staging from production Kubernetes contexts
    and prevent accidental production commands?
  answer: 'Create named terminal profiles in settings.json with different KUBECONFIG paths and visual indicators. Set the
    staging profile with ''path: bash, args: [-c, export KUBECONFIG=~/.kube/staging; exec bash]'' and a server icon. Set the
    production profile with the same pattern but ''icon: warning'' and ''color: terminal.ansiRed'' so the terminal tab is
    visually red, making it immediately obvious when you are in a production context.'
- id: lacp-001
  topic: lacp
  level: L0
  question: What are the two LACP modes and what happens if both sides are set to passive?
  answer: Active mode sends LACP PDUs and actively tries to form a bond. Passive mode responds to LACP PDUs but does not initiate.
    If both sides are set to passive, no bond is formed because neither side initiates negotiation. At least one side must
    be active.
- id: lacp-002
  topic: lacp
  level: L1
  question: Why does a single TCP flow not benefit from the increased bandwidth of a LACP bond, and what hash policy gives
    the best traffic distribution for IP-based workloads?
  answer: Traffic distribution across bond members uses hashing, not round-robin. A single TCP flow always hashes to the same
    link, so it is limited to one link's bandwidth. Aggregate bandwidth only benefits from many concurrent flows. The layer3+4
    hash policy (source/destination IP + port) gives the best distribution for IP traffic because it incorporates both endpoints
    and ports, spreading different connections across links.
- id: lacp-003
  topic: lacp
  level: L2
  question: A Linux server has a mode 4 (802.3ad) bond with two interfaces, but only one link carries traffic. How do you
    diagnose and fix this?
  answer: '1) Check bond status: cat /proc/net/bonding/bond0 — verify both interfaces show as ''up'' and ''Aggregator ID''
    matches on both. 2) Check LACP partner info to confirm the switch is participating. 3) Verify switch-side LACP config
    matches (both sides must agree on LAG membership). 4) Check hash policy — with layer2 hashing and only one destination
    MAC, all traffic hashes to one link. Fix by setting xmit_hash_policy to layer3+4: ip link set bond0 type bond xmit_hash_policy
    layer3+4. 5) Ensure miimon is set for link monitoring: ip link set bond0 type bond miimon 100.'
- id: stp-001
  topic: stp
  level: L0
  question: Why is Spanning Tree Protocol necessary on a network with redundant Layer 2 links?
  answer: 'Ethernet has no TTL at Layer 2, so a broadcast frame entering a loop circulates forever, multiplying at each pass.
    Within seconds this causes a broadcast storm: switch CPUs saturate, MAC tables overflow and thrash, and all hosts on the
    VLAN become unreachable. STP prevents this by logically disabling redundant paths while keeping them available for failover.'
- id: stp-002
  topic: stp
  level: L1
  question: What is PortFast and BPDU Guard, and why should they be used together on access ports?
  answer: PortFast skips the normal STP convergence (30-50 seconds of blocking/listening/learning) on access ports connected
    to hosts, bringing them to forwarding immediately. BPDU Guard shuts down a PortFast-enabled port if it receives a BPDU,
    which indicates someone plugged in a switch (creating a potential loop). Together they provide fast host connectivity
    while protecting against rogue switches on access ports.
- id: stp-003
  topic: stp
  level: L2
  question: Classic STP (802.1D) takes 30-50 seconds to converge. How does RSTP (802.1w) reduce this to 1-3 seconds?
  answer: 'RSTP makes three key improvements: 1) Edge ports (equivalent to PortFast) skip to forwarding immediately for host-facing
    ports. 2) Proposal/agreement mechanism allows switches to negotiate directly with neighbors instead of waiting through
    timer-based states. 3) Alternate and backup ports are pre-computed failover paths that can activate immediately without
    recalculating the tree. RSTP also simplifies port states from five (blocking, listening, learning, forwarding, disabled)
    to three (discarding, learning, forwarding).'
- id: vpn-001
  topic: vpn
  level: L0
  question: What is the difference between split tunneling and full tunneling in a VPN, and when would you choose each?
  answer: 'Full tunneling routes ALL traffic through the VPN (WireGuard: AllowedIPs = 0.0.0.0/0). Split tunneling routes only
    specific subnets through the VPN while internet traffic goes direct. Choose full tunneling for compliance requirements
    or untrusted networks (coffee shop WiFi). Choose split tunneling for developer access to internal resources where you
    want fast internet browsing without VPN overhead.'
- id: vpn-002
  topic: vpn
  level: L1
  question: In WireGuard, what does the AllowedIPs field do, and why is it described as serving a dual purpose?
  answer: 'AllowedIPs serves as both a routing table and an access control list. For outgoing traffic, it determines which
    destination IPs get routed through that peer. For incoming traffic, it acts as a filter — only packets with source IPs
    matching AllowedIPs are accepted from that peer. For example, AllowedIPs = 10.0.0.0/24 means: send traffic destined for
    10.0.0.0/24 to this peer, and only accept traffic from this peer if its source is in 10.0.0.0/24.'
- id: vpn-003
  topic: vpn
  level: L2
  question: You need to give a developer temporary access to a PostgreSQL database behind a firewall. The database is at db.internal:5432,
    accessible only from a bastion host. What is the fastest secure approach and the exact command?
  answer: 'Use an SSH local port forward: ssh -fN -L 5432:db.internal:5432 -o ServerAliveInterval=60 bastion.example.com.
    The developer then connects to localhost:5432, which tunnels through the bastion to db.internal:5432. The -f backgrounds
    the tunnel, -N skips opening a shell, and ServerAliveInterval prevents timeout. This avoids setting up a full VPN for
    temporary single-service access.'
- id: clouddd-001
  topic: cloud_deep_dive
  level: L0
  question: What is the difference between a Security Group and a Network ACL (NACL) in AWS?
  answer: Security Groups are stateful firewalls attached per ENI (return traffic auto-allowed). NACLs are stateless firewalls
    per subnet (you must explicitly allow return traffic). Security Groups only allow rules; NACLs support allow and deny.
- id: clouddd-002
  topic: cloud_deep_dive
  level: L1
  question: How does IRSA (IAM Roles for Service Accounts) let Kubernetes pods assume AWS IAM roles without static credentials?
  answer: The EKS cluster has an OIDC provider. A K8s ServiceAccount is annotated with an IAM role ARN. When a pod uses that
    SA, it receives temporary AWS credentials via a projected volume token. The IAM role's trust policy allows the OIDC provider
    to assume it. No access keys are stored or rotated.
- id: clouddd-003
  topic: cloud_deep_dive
  level: L2
  question: Your EKS cluster is running out of pod IP addresses in a /24 subnet. What is the root cause and what are two solutions?
  answer: 'EKS VPC CNI assigns a real VPC IP to every pod, so a /24 (254 IPs) fills fast with many pods per node. Solutions:
    1) Use larger subnets (/20 or /18). 2) Enable VPC CNI prefix delegation to assign /28 prefixes per ENI slot instead of
    individual IPs, dramatically increasing per-node pod capacity.'
- id: clouddd-004
  topic: cloud_deep_dive
  level: L3
  question: You notice NAT Gateway costs are 40% of your AWS bill. Describe a strategy to reduce them without changing application
    code.
  answer: Deploy VPC Gateway Endpoints for S3 and DynamoDB (free, no NAT needed). Deploy VPC Interface Endpoints for ECR,
    CloudWatch, STS, and other frequently used AWS services. This routes traffic privately within the VPC instead of through
    the NAT Gateway, eliminating the $0.045/GB processing charge for those services.
- id: stor-001
  topic: storage
  level: L0
  question: Why should you use UUIDs instead of /dev/sdX names in /etc/fstab?
  answer: Device names like /dev/sda can change between reboots if disks are added, removed, or detected in a different order.
    UUIDs are unique and stable identifiers tied to the filesystem. Use 'blkid' to find UUIDs.
- id: stor-002
  topic: storage
  level: L1
  question: What are the three layers of LVM and how do they relate?
  answer: Physical Volumes (PVs) are raw block devices or partitions. Volume Groups (VGs) pool one or more PVs into a single
    storage pool. Logical Volumes (LVs) are carved from VGs and are what you format with a filesystem and mount. This layering
    enables resizing, snapshots, and spanning multiple disks.
- id: stor-003
  topic: storage
  level: L2
  question: A server shows 'df -h' at 90% usage but 'du -sh /' only accounts for 60%. What is the most likely cause?
  answer: Deleted files are still held open by running processes. The filesystem reports the space as used (df), but the files
    no longer appear in the directory tree (du). Use 'lsof +D / | grep deleted' to find the processes holding deleted files.
    Restarting those processes or truncating via /proc/<pid>/fd/<fd> reclaims the space.
- id: stor-004
  topic: storage
  level: L3
  question: You need to add a new disk to an existing LVM volume group, extend a logical volume, and grow the filesystem online.
    List the exact commands.
  answer: '1) pvcreate /dev/sdb  2) vgextend myvg /dev/sdb  3) lvextend -l +100%FREE /dev/myvg/mylv  4) For ext4: resize2fs
    /dev/myvg/mylv. For XFS: xfs_growfs /mountpoint. All steps are online — no unmount required.'
- id: chgmgmt-001
  topic: change_management
  level: L0
  question: What are the three categories of changes and how do they differ in approval process?
  answer: Standard changes are pre-approved, low-risk, and repeatable (e.g., scaling replicas). Normal changes require peer
    review and scheduling (e.g., schema migration). Emergency changes have expedited approval and are used only to restore
    service during active incidents.
- id: chgmgmt-002
  topic: change_management
  level: L1
  question: Why should rollback criteria be defined before executing a change, not during the incident?
  answer: During an incident, stress and time pressure impair judgment. Pre-defined rollback triggers (e.g., error rate >
    1%, p99 latency > 500ms, any 5xx from changed service) remove the need for real-time decision-making. They also define
    who can trigger rollback, the exact commands, and the time window after which rollback may no longer be safe.
- id: chgmgmt-003
  topic: change_management
  level: L2
  question: Why is Friday afternoon a bad time for production changes, and what is the ideal change window?
  answer: 'Friday afternoon means reduced staff over the weekend to detect and respond to delayed failures. Some problems
    manifest hours later (cache expiry, connection pool exhaustion, slow memory leak). Ideal window: Tuesday through Thursday
    during business hours when the full team is available. High-risk changes should use late-night maintenance windows when
    traffic is lowest.'
- id: chgmgmt-004
  topic: change_management
  level: L3
  question: How would you enforce a change freeze at the pipeline level rather than just announcing it in Slack?
  answer: 'Add a date-check gate in the CI/CD pipeline that blocks deployments during the freeze window. Example: if the current
    date falls within the freeze range, the deploy job exits with a clear message and non-zero exit code. Exceptions require
    incident commander approval and a manual override flag. This is more reliable than a Slack message because it prevents
    accidental deploys by anyone, including automation.'
- id: debugmeth-001
  topic: debugging_methodology
  level: L0
  question: What are the five steps of the scientific method applied to debugging?
  answer: 1) Observe — identify actual symptoms, not assumptions. 2) Hypothesize — generate multiple possible causes. 3) Predict
    — if hypothesis X is true, what else should be true? 4) Test — check the prediction, changing one variable at a time.
    5) Conclude — confirmed or eliminated? Repeat until root cause found.
- id: debugmeth-002
  topic: debugging_methodology
  level: L1
  question: Explain the divide-and-conquer approach to debugging a request that fails between a client and a database through
    6 components.
  answer: Test the midpoint of the request path first. If the midpoint works, the problem is between the client and the midpoint.
    If it fails, the problem is between the midpoint and the database. Continue bisecting the remaining half. This is binary
    search applied to infrastructure — for a 6-component pipeline, you need at most 3 tests instead of 6.
- id: debugmeth-003
  topic: debugging_methodology
  level: L2
  question: A service started failing at 14:00 and a deployment happened at 13:55. How do you determine if the deployment
    caused the failure vs mere correlation?
  answer: 'Three tests for causation: 1) Revert the deployment — if the problem goes away, strong evidence of causation. 2)
    Reproduce in isolation — can you trigger the failure by making only that change in staging? 3) Explain the mechanism —
    trace step by step from the change to the symptom. Also check for other events at 14:00: certificate expiry, traffic spikes,
    cronjobs, or upstream deploys.'
- id: debugmeth-004
  topic: debugging_methodology
  level: L3
  question: Explain the Five Whys technique and why stopping at the first 'why' is insufficient.
  answer: 'Keep asking ''why'' until you reach the systemic cause. Example: DB ran out of connections (why?) -> query held
    connections for 30 min (why?) -> missing index caused full table scan (why?) -> migration dropped and recreated table
    without index (why?) -> no automated index validation in migration pipeline. The first why gives you the symptom fix (kill
    query). The fifth why gives the systemic fix (add CI step comparing indexes before/after migrations) that prevents recurrence.'
- id: fleetop-001
  topic: fleet_ops
  level: L0
  question: What is the difference between treating servers as 'pets' vs 'cattle'?
  answer: Pets are unique, hand-configured servers that are repaired when sick (e.g., db-master-01). Cattle are identical,
    automated servers that are replaced when sick (e.g., web-042). Fleet operations requires the cattle mindset — every server
    in a role should be interchangeable.
- id: fleetop-002
  topic: fleet_ops
  level: L1
  question: Why should fleet changes use a rolling strategy with a canary batch instead of deploying to all servers at once?
  answer: Deploying to all servers at once means a bad change takes down the entire fleet. A rolling strategy (e.g., 1 canary
    -> 1% -> 10% -> remaining) limits blast radius. If the canary fails, you stop and only 1 server is affected. You validate
    between batches using health checks, error rates, and latency metrics.
- id: fleetop-003
  topic: fleet_ops
  level: L2
  question: How would you detect configuration drift across a fleet of 500 servers?
  answer: 'Run parallel commands to compare actual state: ''ansible webservers -f 50 -m command -a "rpm -q nginx"'' piped
    through sort | uniq -c shows version distribution. For config files: collect checksums with ''ansible -m stat -a "path=/etc/nginx/nginx.conf"''
    and compare. Any host with a different version or checksum has drifted. Automate this as a scheduled check with alerting
    on unexpected differences.'
- id: fleetop-004
  topic: fleet_ops
  level: L3
  question: Design the Ansible playbook strategy for a rolling update of 1,500 servers with automatic abort if too many fail.
  answer: 'Use serial: [1, ''5%'', ''25%''] to start with a canary of 1, then 5% batches, then 25% batches. Set max_fail_percentage:
    2 to abort if more than 2% of any batch fails. Add pre_tasks to drain from load balancer, post_tasks to validate health
    and re-add, with retries and delays. The combination of graduated batch sizes and fail percentage provides both canary
    testing and automatic abort.'
- id: gitq-001
  topic: git
  level: L0
  question: What are the three local areas in Git where changes live?
  answer: 'Working directory (your actual files on disk), staging area/index (changes queued for next commit via ''git add''),
    and local repository (committed snapshots stored in .git/). Changes flow: working dir -> staging -> repository -> remote.'
- id: gitq-002
  topic: git
  level: L1
  question: What is the golden rule of rebase, and what happens if you violate it?
  answer: Never rebase commits that have been pushed to a shared branch. Rebase rewrites commit hashes, so if others have
    already pulled those commits, their history diverges from the rebased history. This causes duplicate commits, merge conflicts,
    and confusion. Rebase is safe only for local branches that have not been shared.
- id: gitq-003
  topic: git
  level: L2
  question: Something broke between Monday and Friday across 25 commits. How do you efficiently find the breaking commit?
  answer: 'Use git bisect: ''git bisect start'', ''git bisect bad HEAD'' (current broken state), ''git bisect good <monday-commit>''.
    Git checks out the midpoint — test it, mark good or bad, and repeat. Binary search finds the exact commit in log2(25)
    = ~5 tests instead of 25. Run ''git bisect reset'' when done.'
- id: gitq-004
  topic: git
  level: L3
  question: You accidentally committed an API key 3 commits ago. The key has been rotated, but how do you remove it from Git
    history entirely?
  answer: 'Use ''git filter-branch'' or the modern ''git filter-repo'' tool to rewrite history and remove the file/line containing
    the key. This changes all subsequent commit hashes. Force-push to the remote and have all collaborators re-clone or reset.
    Also check: GitHub/GitLab cache (may need repo support to purge), any forks, and CI build logs. Prevention: use pre-commit
    hooks with git-secrets or detect-secrets.'
- id: nginxq-001
  topic: nginx
  level: L0
  question: Why must you always run 'nginx -t' before 'nginx -s reload'?
  answer: nginx -t tests the configuration syntax without applying it. If the config has errors and you reload without testing,
    Nginx may fail to reload and in some cases the workers can crash, causing downtime. Testing first is a zero-cost safety
    check that prevents config errors from reaching production.
- id: nginxq-002
  topic: nginx
  level: L1
  question: 'Explain the proxy_pass trailing slash behavior: what is the difference between ''proxy_pass http://backend''
    and ''proxy_pass http://backend/''?'
  answer: 'Without trailing slash: the location path is appended to the backend URL. Request to /app/page proxies to backend/app/page.
    With trailing slash: the location path is replaced. Request to /app/page (in a ''location /app/'' block) proxies to backend/page.
    This is a top-5 Nginx misconfiguration — getting it wrong sends mangled paths to the backend.'
- id: nginxq-003
  topic: nginx
  level: L2
  question: Describe the Nginx location matching priority order. If you have 'location /api' and 'location ~ /api', which
    wins?
  answer: 'Priority order: 1) Exact match (=) — highest. 2) Prefix with ^~ — stops regex evaluation. 3) Regex (~ or ~*) —
    first match in config order wins. 4) Plain prefix — longest match, lowest priority. So ''location ~ /api'' (regex) beats
    ''location /api'' (plain prefix) because regex is evaluated after prefix matching and takes precedence unless the prefix
    uses ^~.'
- id: nginxq-004
  topic: nginx
  level: L3
  question: How do you configure Nginx upstream health checks and keepalive connections for a backend pool?
  answer: 'Define an upstream block with servers using max_fails=3 and fail_timeout=30s for passive health checks. Add ''keepalive
    32'' for persistent backend connections. In the location block, set proxy_http_version 1.1 and proxy_set_header Connection
    '''' (empty string, required for keepalive). Choose a load balancing method: least_conn for uneven request costs, ip_hash
    for sticky sessions.'
- id: rnbk-001
  topic: runbook_craft
  level: L0
  question: What are the five sections every effective runbook should have?
  answer: 1) Trigger — what alert or event activates this runbook. 2) Diagnose — commands to run and questions to answer before
    acting. 3) Act — the fix, using decision trees for multiple scenarios. 4) Verify — confirm the fix worked with specific
    checks and thresholds. 5) Escalate — when and how to call for help.
- id: rnbk-002
  topic: runbook_craft
  level: L1
  question: What are the five runbook automation levels (L0-L4) and which level should be your minimum target?
  answer: 'L0: Fully manual prose instructions. L1: Copy-paste commands. L2: Scripts with parameters. L3: Triggered scripts
    requiring human approval. L4: Fully automated self-healing. Target L1 minimum — copy-paste commands beat prose every time.
    L1 is achievable immediately and prevents mistyped commands at 3 AM.'
- id: rnbk-003
  topic: runbook_craft
  level: L2
  question: Why are metrics-driven thresholds better than vague descriptions in runbooks? Give an example.
  answer: 'Vague: ''Check if latency is high.'' The on-call engineer does not know what ''high'' means. Metrics-driven: ''Check
    p99 latency. If > 500ms (normal baseline: 80-120ms), proceed.'' This removes ambiguity, sets a concrete trigger, and provides
    the baseline so the responder knows what healthy looks like. Every runbook check should include: what to check, the threshold,
    and the normal value.'
- id: rnbk-004
  topic: runbook_craft
  level: L3
  question: How should you test runbooks, and why is having the author test their own runbook insufficient?
  answer: 'Test with game days: inject a real failure and have someone who did NOT write the runbook follow it. The author
    has implicit knowledge that did not make it into the document. Success criteria: responder completes without asking for
    help, resolution under time target, all commands work as documented. Also do tabletop exercises (verbal walkthrough) and
    review after every incident to catch stale commands.'
- id: vendmgmt-001
  topic: vendor_management
  level: L0
  question: What are the four tiers of vendor support and what can each tier typically do?
  answer: 'L1 (Frontline): script-driven triage, basic config checks. L2 (Technical Support Engineer): deeper log analysis,
    can reproduce in lab. L3 (Escalation Engineering): access to source code/firmware, can create patches. L4 (Product Engineering/R&D):
    developers who wrote the code, design-level changes. Your goal is to bypass L1 by providing L2-quality information upfront.'
- id: vendmgmt-002
  topic: vendor_management
  level: L1
  question: What is the difference between functional and hierarchical escalation?
  answer: 'Functional escalation is technical: moving the case to a higher-skill tier because the current tier lacks expertise
    (e.g., L1 to L2 when workarounds do not apply). Hierarchical escalation is management: engaging the vendor''s management
    chain because the process is failing (e.g., SLA violated, case stalled for days). Use functional for technical gaps and
    hierarchical for process failures.'
- id: vendmgmt-003
  topic: vendor_management
  level: L2
  question: What makes a support ticket bypass L1 triage and go directly to L2 investigation?
  answer: 'Include: environment details (product version, hardware serial, cluster topology), specific problem description
    with impact (users affected, capacity risk), timeline with timestamps, troubleshooting already performed (with results),
    attached logs/dumps, a hypothesis, and a specific requested action. This proves you have done L1 work yourself and gives
    L2 enough information to start immediately.'
- id: vendmgmt-004
  topic: vendor_management
  level: L3
  question: How do you use accumulated support case data as leverage during contract renewal?
  answer: 'Track all cases with timestamps, SLA violations, escalation counts, and resolution times. At renewal, present data:
    ''47 cases last year, 12 required L3 escalation, average MTTR was 8 hours.'' Use this to negotiate a named TAM (Technical
    Account Manager), designated support engineer, premium SLA, or training credits. Evidence-based negotiation is more effective
    than complaining.'
- id: cronq-001
  topic: cron
  level: L0
  question: What are the five fields in a cron schedule expression and what does '*/5 * * * *' mean?
  answer: 'The five fields are: minute (0-59), hour (0-23), day of month (1-31), month (1-12), day of week (0-7). ''*/5 *
    * * *'' means every 5 minutes — the step value */5 in the minute field triggers at 0, 5, 10, 15, etc.'
- id: cronq-002
  topic: cron
  level: L1
  question: Why does a script work when run manually but fail in cron, and how do you fix it?
  answer: 'Cron runs with a minimal environment: PATH is only /usr/bin:/bin, SHELL is /bin/sh, and no .bashrc or .profile
    is loaded. Fix by: 1) using absolute paths for all commands, 2) setting PATH at the top of the crontab, 3) sourcing the
    profile in the command line, or 4) using a wrapper script that sets up the environment.'
- id: cronq-003
  topic: cron
  level: L2
  question: How do you prevent a cron job from overlapping with a previous run that has not finished?
  answer: 'Use flock: ''*/5 * * * * flock -n /var/lock/myjob.lock /usr/local/bin/myjob.sh''. The -n flag makes flock non-blocking
    — if the lock exists from a previous run, it exits immediately. For systemd timers, overlap prevention is built in with
    Type=oneshot. For Kubernetes CronJobs, set concurrencyPolicy: Forbid.'
- id: cronq-004
  topic: cron
  level: L3
  question: Compare cron, systemd timers, and Kubernetes CronJobs. When would you choose each?
  answer: 'Cron: simple scheduled commands on a single host, managed by config management via /etc/cron.d/. Systemd timers:
    when you need structured logging (journald), dependency management (After=), resource limits (CPUQuota=, MemoryMax=),
    missed-run recovery (Persistent=true), or random delay to spread load. Kubernetes CronJobs: when the job runs in a container,
    needs concurrency control, or must execute in the cluster. Systemd timers are the modern replacement for cron on individual
    hosts.'
- id: ebpfq-001
  topic: ebpf
  level: L0
  question: What is eBPF and why is it safer than loading a kernel module for observability?
  answer: 'eBPF lets you run sandboxed programs inside the kernel without writing kernel modules or rebooting. A verifier
    checks every eBPF program before loading: it guarantees memory safety, provable termination (bounded loops), and restricted
    function calls. This means an eBPF program cannot crash the kernel, unlike a kernel module which can cause a panic.'
- id: ebpfq-002
  topic: ebpf
  level: L1
  question: You suspect network packet loss is causing application slowness. Which BCC tool would you use and what does it
    show?
  answer: Use tcpretrans-bpfcc. It traces TCP retransmissions in real-time, showing the timestamp, PID, local/remote addresses,
    ports, and TCP state for every retransmitted segment. A high retransmit rate indicates network congestion or packet loss.
    This is far more efficient than tcpdump because it only captures retransmit events, not all traffic.
- id: ebpfq-003
  topic: ebpf
  level: L2
  question: API latency spikes occur every 2 minutes. CPU, memory, and disk metrics look normal. How would you use eBPF to
    find the root cause?
  answer: Start with runqlat-bpfcc to check scheduler run queue latency. If you see latency spikes every 2 minutes, something
    is hogging the CPU and displacing your app. Then use 'bpftrace -e "profile:hz:99 { @[comm] = count(); }"' during a spike
    to identify which process is consuming CPU cycles. This commonly reveals things like logrotate compressing large files
    or a cron job consuming an entire core.
- id: ebpfq-004
  topic: ebpf
  level: L3
  question: Write a bpftrace one-liner to trace which files nginx is opening in real-time.
  answer: bpftrace -e 'tracepoint:syscalls:sys_enter_openat /comm == "nginx"/ { printf("%s opened %s\n", comm, str(args->filename));
    }' — This attaches to the openat syscall tracepoint, filters for processes named nginx, and prints the filename argument
    for each open call. Always filter by comm or PID on busy servers to avoid overwhelming output.
- id: kerndbg-001
  topic: kernel_troubleshooting
  level: L0
  question: What command shows kernel error messages with human-readable timestamps, and what patterns should you grep for?
  answer: 'dmesg -T -l err,crit,alert,emerg shows kernel errors with readable timestamps. Key patterns to grep for: ''oom''
    or ''out of memory'' (memory issues), ''i/o error'' or ''medium error'' (disk problems), ''link down'' (network), ''mce''
    or ''machine check'' (CPU/hardware), and ''ext4'' or ''xfs'' with ''corrupt'' (filesystem issues).'
- id: kerndbg-002
  topic: kernel_troubleshooting
  level: L1
  question: What is the difference between a kernel oops and a kernel panic?
  answer: An oops is a kernel bug detection — the offending process is killed and the kernel continues running (degraded,
    marked tainted). A panic is fatal — the kernel cannot continue and the system halts or reboots. An oops can escalate to
    a panic if panic_on_oops=1 is set. Both produce stack traces in dmesg, but only a panic requires an immediate reboot.
- id: kerndbg-003
  topic: kernel_troubleshooting
  level: L2
  question: What is the REISUB sequence and when would you use it?
  answer: 'REISUB is the SysRq safe reboot sequence for a completely hung system: R (un-Raw keyboard), E (tErminate all processes
    with SIGTERM), I (kIll all with SIGKILL), S (Sync disk buffers), U (Unmount/remount read-only), B (reBoot). Wait 2-5 seconds
    between each key. This is the cleanest possible reboot when the system is unresponsive to normal commands. Requires kernel.sysrq=1.'
- id: kerndbg-004
  topic: kernel_troubleshooting
  level: L3
  question: How does kdump work and what are the key commands to analyze a crash dump?
  answer: 'kdump reserves memory at boot for a secondary kernel. When the main kernel panics, the crash kernel activates via
    kexec, captures the memory state to /var/crash/ as a vmcore file, then reboots. Analysis: ''crash /usr/lib/debug/lib/modules/$(uname
    -r)/vmlinux /var/crash/*/vmcore''. Inside crash: ''bt'' for backtrace (read bottom-up), ''log'' for kernel log, ''ps''
    for process list, ''kmem -i'' for memory summary.'
- id: linprf-001
  topic: linux_performance
  level: L0
  question: What is the USE method for performance analysis?
  answer: 'For every resource (CPU, memory, disk, network), check three things: Utilization (how busy is it?), Saturation
    (is work queuing?), and Errors (are there error events?). High utilization is not automatically a problem; saturation
    always is. Tools: mpstat/iostat for utilization, vmstat run queue for saturation, dmesg/ethtool for errors.'
- id: linprf-002
  topic: linux_performance
  level: L1
  question: What is the difference between 'free' and 'available' memory in 'free -h' output, and why does low 'free' not
    mean a problem?
  answer: Free is truly unused memory. Available is free plus reclaimable page cache. Linux aggressively uses spare RAM for
    page cache (buffering disk reads), which is automatically reclaimed when applications need it. So 512MB free but 11GB
    available means the system has 11GB of usable memory. Low 'free' with high 'available' is normal and healthy.
- id: linprf-003
  topic: linux_performance
  level: L2
  question: How do you read iostat output to determine if a disk is the bottleneck?
  answer: 'Key columns: %util > 70% on spinning disk means saturated (on NVMe, %util is misleading due to parallel queues).
    ''await'' is average I/O latency in ms — this is what applications feel. High await with low %util suggests the disk is
    slow per-operation. High ''r/s'' or ''w/s'' with high await means IOPS-limited. Check ''rrqm/s'' and ''wrqm/s'' for request
    merging efficiency.'
- id: linprf-004
  topic: linux_performance
  level: L3
  question: Describe the correct methodology for sysctl tuning instead of copying values from blog posts.
  answer: 1) Baseline — measure current performance with a realistic workload. 2) Identify bottleneck — USE method across
    CPU, memory, disk, network. 3) Research the knob — read kernel documentation, not Medium posts. 4) Change one thing —
    single variable at a time. 5) Measure again — same workload, same measurement method. 6) Persist or revert — if improvement
    confirmed, add to /etc/sysctl.d/. Never cargo-cult values without measuring before and after.
- id: pkgmgt-001
  topic: package_management
  level: L0
  question: What is the difference between dpkg/rpm and apt/dnf?
  answer: dpkg and rpm are low-level tools that operate on individual package files without resolving dependencies. apt (Debian)
    and dnf (RHEL) are high-level tools that resolve dependencies, fetch from repositories, and handle upgrades automatically.
    Use apt/dnf for 99% of operations; use dpkg/rpm for inspection, forensics, and emergencies.
- id: pkgmgt-002
  topic: package_management
  level: L1
  question: How do you prevent a critical package from being accidentally upgraded in production?
  answer: 'Debian/Ubuntu: ''apt-mark hold nginx'' prevents upgrades (check with ''apt-mark showhold''). RHEL: use the versionlock
    plugin: ''dnf versionlock add nginx-1.24.0-1.el9''. Alternatively, use excludepkgs=nginx* in /etc/dnf/dnf.conf. Warning:
    a held package can block apt upgrade if other packages depend on a newer version.'
- id: pkgmgt-003
  topic: package_management
  level: L2
  question: A dpkg install left a package in a half-configured broken state. What is the triage sequence to fix it?
  answer: '1) dpkg --audit — identify what is broken. 2) apt --fix-broken install — let apt resolve dependencies. 3) dpkg
    --configure -a — finish any pending configurations. 4) If still broken: dpkg --remove --force-remove-reinstreq <package>
    then reinstall cleanly. 5) Check /var/log/dpkg.log and /var/log/apt/history.log for the timeline of what happened.'
- id: pkgmgt-004
  topic: package_management
  level: L3
  question: Why is dnf history undo a strong advantage over Debian for production rollbacks, and what is the Debian workaround?
  answer: 'dnf tracks every transaction with an ID. ''dnf history undo 127'' reverts all changes from transaction 127 (downgrades,
    removes additions). Debian has no native transaction rollback. Workarounds: track changes externally with Ansible, use
    etckeeper for /etc changes, parse /var/log/apt/history.log to manually identify and downgrade packages. This is why RHEL-family
    distributions are often preferred for production.'
- id: procmgt-001
  topic: process_management
  level: L0
  question: What is the difference between SIGTERM and SIGKILL, and why should you always send SIGTERM first?
  answer: SIGTERM (15) asks the process to shut down gracefully — it can catch the signal, flush buffers, close connections,
    and clean up. SIGKILL (9) terminates immediately — the process cannot catch it, so shared memory, temp files, and locks
    are left behind. Always SIGTERM first, wait, then SIGKILL only if needed. This is what Docker and Kubernetes do during
    pod termination.
- id: procmgt-002
  topic: process_management
  level: L1
  question: What is a zombie process and how do you eliminate one?
  answer: A zombie is a process that has exited but whose parent has not called wait() to collect its exit status. It holds
    a PID slot but uses no CPU or memory. You cannot kill a zombie — it is already dead. Fix by killing or fixing the parent
    process so it reaps children properly. When the parent dies, zombies are adopted by PID 1 (init/systemd) which reaps them.
- id: procmgt-003
  topic: process_management
  level: L2
  question: A process is stuck in D-state (uninterruptible sleep) and cannot be killed even with SIGKILL. What does this mean
    and what can you do?
  answer: 'D-state means the process is waiting for a kernel-level I/O operation that cannot be interrupted. Common causes:
    NFS server unreachable, failing disk, hung FUSE filesystem, or lost iSCSI target. You cannot kill D-state processes. You
    must fix the underlying I/O problem (restore NFS, fix the disk) or reboot. Check what it is waiting on with ''cat /proc/<PID>/wchan''
    and ''cat /proc/<PID>/stack''.'
- id: procmgt-004
  topic: process_management
  level: L3
  question: A container accumulates zombie processes over time. What is the root cause and what are two solutions?
  answer: 'The container''s PID 1 is not a proper init process — it does not reap adopted orphan/zombie children. When child
    processes are orphaned, they are reparented to PID 1, but if PID 1 never calls wait(), zombies accumulate. Solutions:
    1) Use tini or dumb-init as the ENTRYPOINT (e.g., ENTRYPOINT ["tini", "--"]) to act as a minimal init. 2) On Docker, use
    --init flag which injects tini automatically.'
- id: ciscoq-001
  topic: cisco
  level: L0
  question: 'What do the two parts of ''show interface'' status mean: ''is up, line protocol is down'' vs ''is up, line protocol
    is up''?'
  answer: 'The first part is Layer 1 (physical): is the link electrically/optically active? The second part is Layer 2 (data
    link): is the protocol negotiation successful? ''Up/down'' means the physical link is good but L2 failed — usually a speed/duplex
    mismatch or encapsulation mismatch. ''Up/up'' means both layers are working. ''Administratively down'' means someone shut
    the port.'
- id: ciscoq-002
  topic: cisco
  level: L1
  question: A server gets DHCP from the wrong subnet after being moved to a new rack. What Cisco command sequence diagnoses
    this?
  answer: '1) ''show vlan brief'' — verify which VLAN the server''s port is assigned to. 2) ''show interface <port> switchport''
    — confirm access vs trunk mode and the assigned VLAN. 3) ''show interface trunk'' — if it is a trunk, check which VLANs
    are allowed. The server port is likely still in the old VLAN. Fix: ''interface Gi0/1; switchport access vlan <correct-vlan>''.'
- id: ciscoq-003
  topic: cisco
  level: L2
  question: What is PortFast and BPDU Guard, and why do server-facing ports need both?
  answer: PortFast skips the STP Listening->Learning stages (30 seconds on classic STP), moving the port directly to Forwarding.
    Without it, servers time out on DHCP or PXE boot. BPDU Guard protects PortFast ports — if a BPDU is received (someone
    plugged in a switch), the port goes err-disabled immediately, preventing an accidental loop. Both should be enabled on
    every server-facing access port.
- id: ciscoq-004
  topic: cisco
  level: L3
  question: Explain how an unexpected root bridge election can cause a network-wide outage and how to prevent it.
  answer: 'STP elects one root bridge per VLAN based on lowest bridge priority (then lowest MAC as tiebreaker). If someone
    connects a switch with a lower priority, it becomes root and all traffic paths recalculate globally, causing 30+ seconds
    of packet loss during reconvergence. Prevention: set explicit low priority on intended root bridges (spanning-tree vlan
    X priority 4096), enable root guard on non-root ports, and use BPDU guard on access ports.'
- id: dhcpq-001
  topic: dhcp
  level: L0
  question: What are the four steps of the DHCP process (DORA) and what transport protocol does it use?
  answer: 'DORA uses UDP: 1) Discover — client broadcasts asking for an IP (src 0.0.0.0:68, dst 255.255.255.255:67). 2) Offer
    — server offers an IP. 3) Request — client broadcasts acceptance (broadcast so other servers retract their offers). 4)
    Acknowledge — server confirms the lease with IP, gateway, DNS, and lease duration.'
- id: dhcpq-002
  topic: dhcp
  level: L1
  question: How does a DHCP relay agent work, and why is it necessary?
  answer: DHCP uses broadcast, which does not cross routers. A relay agent on the router receives the broadcast Discover,
    sets the giaddr field to its own IP on that subnet, and forwards it as unicast to the DHCP server. The server uses giaddr
    to determine which scope/pool to allocate from and sends the reply back through the relay. On Cisco, this is configured
    with 'ip helper-address'.
- id: dhcpq-003
  topic: dhcp
  level: L2
  question: What are the T1 and T2 lease renewal timers and why does a client not wait for lease expiry?
  answer: T1 is at 50% of lease time — the client sends a unicast RENEW to the original server. T2 is at 87.5% — the client
    broadcasts a REBIND to any server (in case the original is down). This ensures continuous connectivity. Waiting until
    expiry would mean losing the IP and having to restart DORA, causing a network outage for the client.
- id: dhcpq-004
  topic: dhcp
  level: L3
  question: Compare split-scope and active failover for DHCP redundancy, including the tradeoff of each approach.
  answer: 'Split scope: divide the pool between two servers (e.g., 60/40). No communication needed between servers. Tradeoff:
    if one server fails, its portion of the pool is unavailable until it returns. Active failover (ISC DHCP/Kea): both servers
    share state and can serve the full pool. Tradeoff: requires configuration of failover peering (ports, MCLT, load balance),
    more complex setup, and if peer communication fails, behavior depends on the MCLT timer.'
- id: monfun-001
  topic: monitoring_fundamentals
  level: L0
  question: What are the Four Golden Signals from Google SRE and what does each measure?
  answer: 'Latency: how long requests take. Traffic: how many requests per second. Errors: how many requests fail. Saturation:
    how full your resources are. These four signals tell you if a service is available, fast, correct, and has capacity. They
    apply to any service regardless of monitoring tool.'
- id: monfun-002
  topic: monitoring_fundamentals
  level: L1
  question: What is the difference between Prometheus counter and gauge metric types, and when do you use rate() vs direct
    query?
  answer: A counter only goes up (resets on restart) — use rate() to get per-second values (e.g., rate(http_requests_total[5m])).
    A gauge goes up and down — query directly for current value (e.g., node_memory_MemFree_bytes). Never use rate() on a gauge.
    Counters are for things you count (requests, errors, bytes). Gauges are for things you measure (temperature, queue depth,
    memory).
- id: monfun-003
  topic: monitoring_fundamentals
  level: L2
  question: What makes a good alert vs a bad alert? Give specific characteristics of each.
  answer: 'Good alerts are: actionable (someone needs to do something), timely (fires before customer impact), relevant (affects
    users or SLO), and symptom-based (e.g., error rate > 5%). Bad alerts are: noisy (fires constantly, gets ignored), unactionable
    (''CPU at 60%'' — so what?), stale (threshold from 2018 on 2026 hardware), and cause-based without business context. Focus
    on symptoms over causes.'
- id: monfun-004
  topic: monitoring_fundamentals
  level: L3
  question: Why should you monitor your monitoring system, and how would you implement this?
  answer: 'If your Nagios/Prometheus crashes, nobody gets alerted because the alerting system is the thing that died. Implement
    external monitoring: a separate lightweight check (e.g., Uptime Robot, Pingdom, or a cron job on a different server) that
    pings your monitoring system''s health endpoint. If it gets no response, it alerts via a completely independent channel
    (SMS, separate PagerDuty account). This is the dead-man''s switch for your monitoring.'
- id: monmig-001
  topic: monitoring_migration
  level: L0
  question: What are three key differences between legacy monitoring (Nagios/Zabbix) and modern monitoring (Prometheus)?
  answer: '1) Data model: legacy is check-based (pass/fail); Prometheus is metric-based (continuous values with labels). 2)
    Collection: legacy pushes or actively polls; Prometheus pulls/scrapes HTTP endpoints. 3) Querying: legacy uses static
    thresholds; Prometheus uses PromQL for dynamic, dimensional queries. Additionally, Prometheus is config-as-code (YAML)
    while legacy often uses GUI/custom config files.'
- id: monmig-002
  topic: monitoring_migration
  level: L1
  question: What is the Nagios check_disk equivalent in Prometheus and how would you write the alert rule?
  answer: 'Nagios check_disk maps to node_exporter metrics: node_filesystem_avail_bytes and node_filesystem_size_bytes. Alert
    rule: expr: (node_filesystem_avail_bytes{mountpoint=''/''} / node_filesystem_size_bytes{mountpoint=''/''}) * 100 < 20,
    for: 5m, severity: warning. This fires when free space on / drops below 20%, sustained for 5 minutes.'
- id: monmig-003
  topic: monitoring_migration
  level: L2
  question: Why must monitoring migrations include a parallel-run phase, and how long should it last?
  answer: 'Parallel running (both old and new systems active simultaneously) is essential for comparing alert fidelity: does
    the new system catch the same incidents as the old one? Run for at least 4-8 weeks to cover enough incident variety. During
    this phase, tune Prometheus thresholds, train the team on PromQL and Grafana, and track any incidents the legacy system
    catches that Prometheus misses (gaps to fix before cutover).'
- id: monmig-004
  topic: monitoring_migration
  level: L3
  question: During a Nagios-to-Prometheus migration, how do you handle custom NRPE plugins and network SNMP monitoring?
  answer: 'Custom NRPE plugins cannot be ported directly. Options: write a custom Prometheus exporter (expose metrics at /metrics),
    use the Pushgateway for batch jobs that run periodically, or use the script_exporter. For SNMP network devices: deploy
    snmp_exporter with MIB configuration files that map OIDs to Prometheus metrics. Do not leave network devices unmonitored
    during the transition — this is a common gap.'
- id: drq-001
  topic: disaster_recovery
  level: L0
  question: Explain the 3-2-1 backup rule and give a concrete example of how to implement it for a production database.
  answer: '3 copies of data, 2 different storage media, 1 offsite copy. Example: Copy 1 is the live production database. Copy
    2 is a borg repository on a local backup server (different host/disk). Copy 3 is a restic backup to an offsite S3 bucket.
    This protects against single-site disasters, single-media failures, and ensures recoverability even if the primary datacenter
    is lost.'
- id: drq-002
  topic: disaster_recovery
  level: L1
  question: What is the difference between RPO and RTO, and how do they drive backup strategy?
  answer: 'RPO (Recovery Point Objective): how much data you can afford to lose — determines backup frequency. RTO (Recovery
    Time Objective): how long you can be down — determines recovery method. RPO < 1 hour requires real-time replication. RPO
    < 24 hours allows daily backups. RTO < 1 hour requires hot standby. RTO < 24 hours allows cold restore from backup.'
- id: drq-003
  topic: disaster_recovery
  level: L2
  question: Why is 'we have backups' not the same as 'we have disaster recovery'?
  answer: 'Backups are only one component. DR requires: tested restore procedures (untested backups are hopes, not backups),
    documented RTO/RPO per service, verified backup integrity (automated restore tests), offsite copies (local backups die
    with the server), encryption on offsite copies, and regular DR drills. If you have never restored from your backups, you
    do not know if they work.'
- id: drq-004
  topic: disaster_recovery
  level: L3
  question: Compare borg and restic for backup engineering. When would you choose each?
  answer: 'Both do deduplication and encryption. Borg: faster for local repos, excellent compression, mature. Choose for local/NFS
    backup targets. Restic: native cloud backend support (S3, B2, GCS, Azure), simpler setup for offsite backups, snapshot
    tagging. Choose for offsite/cloud backups. Common pattern: use borg for fast local backups and restic for offsite copies.
    Both support prune policies for retention management.'
- id: selinuxq-001
  topic: selinux
  level: L0
  question: What are the three SELinux modes and which one should be used in production?
  answer: 'Enforcing: blocks and logs policy violations — the only mode for production. Permissive: logs violations but does
    not block — use for debugging. Disabled: no enforcement, no logging — never in production. Check with ''getenforce'' or
    ''sestatus''. Temporary switch with ''setenforce 0/1''. Permanent change in /etc/selinux/config.'
- id: selinuxq-002
  topic: selinux
  level: L1
  question: You moved web content to /srv/myapp/ but Nginx cannot read it despite correct file permissions. What is happening?
  answer: 'When you move (mv) files, they keep their original SELinux label. Files in /srv/ have default_t label, but Nginx
    (httpd_t) can only read files labeled httpd_sys_content_t. Fix: ''semanage fcontext -a -t httpd_sys_content_t "/srv/myapp(/.*)?"''
    then ''restorecon -Rv /srv/myapp/''. Always use semanage + restorecon instead of chcon, which is temporary.'
- id: selinuxq-003
  topic: selinux
  level: L2
  question: Nginx needs to make outbound network connections to a backend API but SELinux blocks it. How do you diagnose and
    fix this?
  answer: 'Diagnose: ''ausearch -m AVC -ts recent'' or ''grep "avc:  denied" /var/log/audit/audit.log'' to see the denial.
    The denial will show httpd_t trying to connect. Fix: check if a boolean exists first — ''getsebool httpd_can_network_connect''.
    Enable it: ''setsebool -P httpd_can_network_connect on''. The -P flag makes it persistent across reboots. Booleans are
    the first stop before writing custom policy.'
- id: selinuxq-004
  topic: selinux
  level: L3
  question: Describe the process of creating a custom SELinux policy module using audit2allow, including the critical safety
    step most people skip.
  answer: '1) Reproduce the denial in permissive mode. 2) ''ausearch -m AVC -ts recent | audit2allow -M myfix'' generates
    myfix.te (human-readable) and myfix.pp (compiled module). 3) CRITICAL: read myfix.te before installing — audit2allow may
    grant far more than intended (e.g., allowing all file access instead of one specific path). 4) If the .te looks correct,
    install with ''semodule -i myfix.pp''. Never blindly pipe audit2allow output into policy.'
- id: rhce-001
  topic: rhce
  level: L1
  question: What is the precedence order for Ansible configuration files?
  answer: 'Highest to lowest: 1) ANSIBLE_CONFIG environment variable, 2) ./ansible.cfg in current directory, 3) ~/.ansible.cfg
    in home directory, 4) /etc/ansible/ansible.cfg system-wide. The first file found wins — Ansible does NOT merge config
    files.'
  distractor: Many people assume config files are merged. They are not — the highest-precedence file found is used exclusively.
- id: rhce-002
  topic: rhce
  level: L1
  question: How do you install roles and collections from a requirements.yml file?
  answer: 'For roles: ''ansible-galaxy role install -r requirements.yml''. For collections: ''ansible-galaxy collection install
    -r requirements.yml''. The file can contain both roles and collections sections with optional version pinning.'
- id: rhce-003
  topic: rhce
  level: L1
  question: What does FQCN mean and why is it important on the RHCE exam?
  answer: 'FQCN = Fully Qualified Collection Name. Format: namespace.collection.module (e.g., ansible.builtin.copy, ansible.posix.firewalld).
    It prevents ambiguity when multiple collections provide same-named modules. Always use FQCN in playbooks.'
- id: rhce-004
  topic: rhce
  level: L1
  question: You need to encrypt sensitive variables for your playbook. Show how to create an encrypted file and use it at
    runtime.
  answer: 'Create: ''ansible-vault create vars/secrets.yml''. Reference in playbook via vars_files: - vars/secrets.yml. Run
    with: ''ansible-playbook site.yml --ask-vault-pass'' or ''--vault-password-file .vault_pass''. To encrypt a single string:
    ''ansible-vault encrypt_string "secret" --name "var_name"''.'
- id: rhce-005
  topic: rhce
  level: L2
  question: What is the complete directory structure of an Ansible role and what goes in each directory?
  answer: 'roles/name/ contains: defaults/main.yml (default vars, lowest precedence), vars/main.yml (role vars, high precedence),
    tasks/main.yml (task list), handlers/main.yml (handlers), templates/ (Jinja2 templates), files/ (static files), meta/main.yml
    (dependencies and metadata). Create with ''ansible-galaxy role init name''.'
- id: rhce-006
  topic: rhce
  level: L2
  question: Explain the difference between include_role and import_role.
  answer: 'import_role is static — parsed at playbook load time. Tags are inherited by all role tasks. Cannot be used in loops.
    include_role is dynamic — parsed at runtime. Tags only apply to the include task itself. Can be used in loops and conditionals.
    Default approach: use the roles: section. Use include_role only for conditional/looped inclusion.'
  distractor: This distinction matters for tags — with import_role, tagging the import tags ALL tasks inside the role. With
    include_role, only the include itself is tagged.
- id: rhce-007
  topic: rhce
  level: L2
  question: How do you implement rolling updates in Ansible and what is the canary pattern?
  answer: 'Use serial in the play: ''serial: 2'' runs on 2 hosts at a time. Percentage: ''serial: 25%''. Canary pattern with
    stepped serial: ''serial: [1, 5, "100%"]'' — first 1 host as canary, then 5, then all remaining. Combine with max_fail_percentage
    to abort if the canary fails.'
- id: rhce-008
  topic: rhce
  level: L2
  question: How do you automate LVM storage setup (VG, LV, filesystem, mount) with Ansible?
  answer: 'Four modules in sequence: 1) community.general.lvg (vg: datavg, pvs: /dev/sdb), 2) community.general.lvol (vg:
    datavg, lv: datalv, size: 5g), 3) community.general.filesystem (fstype: xfs, dev: /dev/datavg/datalv), 4) ansible.posix.mount
    (path: /mnt/data, src: /dev/datavg/datalv, fstype: xfs, state: mounted). The mount module also updates /etc/fstab.'
- id: rhce-009
  topic: rhce
  level: L2
  question: How do you manage SELinux file contexts and booleans with Ansible? What step do people forget?
  answer: 'Booleans: ansible.posix.seboolean (name: httpd_can_network_connect, state: true, persistent: true). File contexts:
    community.general.sefcontext (target: ''/srv/app(/.*)?'', setype: httpd_sys_content_t). CRITICAL: after sefcontext you
    must run ''restorecon -Rv /path'' to apply the policy to existing files. Ports: community.general.seport.'
  distractor: The most common mistake is forgetting restorecon after sefcontext. sefcontext updates the policy database but
    does NOT relabel existing files.
- id: rhce-010
  topic: rhce
  level: L2
  question: What is the Ansible variable precedence order? Where should role defaults vs role vars go?
  answer: 'Lowest to highest: role defaults → inventory group_vars/all → group_vars/<group> → host_vars/<host> → play vars_files
    → play vars → task vars → set_fact/registered → role vars → extra vars (-e, always win). Use defaults/main.yml for variables
    users should override. Use vars/main.yml only for internal constants that should not be overridden.'
- id: rhce-011
  topic: rhce
  level: L3
  question: How do you run async tasks in Ansible with fire-and-forget, and how do you check their status later?
  answer: 'Fire and forget: set async: 3600 (max seconds) and poll: 0 (don''t wait), register: job. Check later with ansible.builtin.async_status:
    jid: ''{{ job.ansible_job_id }}'', register: result, until: result.finished, retries: 60, delay: 10. Useful for long-running
    tasks like large package updates or database migrations.'
- id: rhce-012
  topic: rhce
  level: L1
  question: How do you use ansible-doc on the exam to find module information?
  answer: ansible-doc ansible.builtin.dnf — full docs for a module. ansible-doc -s ansible.builtin.user — short snippet. ansible-doc
    -l — list all modules. ansible-doc -l | grep firewall — search. ansible-doc -t callback -l — list by plugin type. This
    is your ONLY reference on the exam (no internet access).
- id: rhce-013
  topic: rhce
  level: L2
  question: How do you configure firewalld rules with Ansible that persist across reboots?
  answer: 'Use ansible.posix.firewalld with BOTH permanent: true (survives reboot) AND immediate: true (applies now). For
    services: service: http, state: enabled. For ports: port: 8080/tcp. For port ranges: port: 5000-5100/tcp. Forgetting permanent:
    true means rules disappear on reboot — the exam reboots systems to verify.'
- id: rhce-014
  topic: rhce
  level: L1
  question: What are Ansible handlers and when do they run?
  answer: 'Handlers are tasks triggered by the ''notify'' keyword. They run ONLY when the notifying task reports ''changed''
    status, and they run at the END of the play (not immediately after the task). A handler runs only once even if notified
    multiple times. Force mid-play execution with: ansible.builtin.meta: flush_handlers.'
  distractor: 'Common gotcha: if a task reports ''ok'' (no change), the handler will NOT run, even if you expect it to.'
- id: rhce-015
  topic: rhce
  level: L3
  question: Explain block/rescue/always error handling in Ansible with a practical example.
  answer: 'block: contains tasks to try. rescue: runs if any task in block fails (like catch). always: runs regardless (like
    finally). Example: block deploys new config and restarts service; rescue rolls back to backup config; always sends notification.
    Also available: ignore_errors: true (continue on failure), failed_when/changed_when (custom conditions).'
- id: debian-001
  topic: debian_ubuntu
  level: L0
  question: What is the difference between 'apt update' and 'apt upgrade'?
  answer: '''apt update'' refreshes the package index (downloads the list of available packages and versions). ''apt upgrade''
    installs newer versions of installed packages. Always run update before upgrade, otherwise upgrade sees nothing to do.'
- id: debian-002
  topic: debian_ubuntu
  level: L1
  question: How does AppArmor differ from SELinux in approach and coverage?
  answer: 'AppArmor is path-based (restricts by filename), SELinux is label-based (restricts by inode label). AppArmor only
    protects processes with loaded profiles — unconfined processes have zero MAC protection. SELinux covers ALL processes
    by default. AppArmor is simpler; SELinux is more comprehensive. Debugging: aa-complain/aa-logprof (AppArmor) vs audit2why/audit2allow
    (SELinux).'
  distractor: 'The biggest trap coming from RHEL: assuming if AppArmor isn''t blocking, nothing is wrong. Unconfined processes
    have no protection at all.'
- id: debian-003
  topic: debian_ubuntu
  level: L1
  question: How does Docker bypass UFW firewall rules, and how do you fix it?
  answer: 'Docker manipulates iptables directly, inserting its own DOCKER chain before UFW rules. A port published with -p
    3306:3306 is open to the world even if UFW denies 3306. Fix: bind to localhost with -p 127.0.0.1:3306:3306, or set DOCKER_IPTABLES=false
    and manage rules manually.'
- id: debian-004
  topic: debian_ubuntu
  level: L1
  question: How do you configure a static IP using Netplan on Ubuntu?
  answer: 'Create /etc/netplan/01-config.yaml with: network: version: 2, ethernets: eth0: addresses: [192.168.1.100/24], routes:
    [{to: default, via: 192.168.1.1}], nameservers: {addresses: [8.8.8.8]}. Apply with ''sudo netplan apply''. Use ''sudo
    netplan try'' first for safe testing (auto-reverts after 120s).'
- id: debian-005
  topic: debian_ubuntu
  level: L2
  question: How do you properly add a third-party APT repository on modern Ubuntu (22.04+)?
  answer: '1) Download and dearmor GPG key: curl -fsSL https://example.com/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/example.gpg.
    2) Add repo with signed-by: echo ''deb [signed-by=/usr/share/keyrings/example.gpg] https://repo.example.com/apt stable
    main'' | sudo tee /etc/apt/sources.list.d/example.list. 3) sudo apt update. The old apt-key method is deprecated.'
- id: distro-001
  topic: linux_distros
  level: L0
  question: What are the key differences between the Red Hat and Debian Linux families?
  answer: 'Red Hat (RHEL, Fedora, Alma, Rocky): dnf/rpm packages, SELinux, firewalld, NetworkManager/nmcli. Debian (Debian,
    Ubuntu): apt/dpkg packages, AppArmor, ufw, Netplan (Ubuntu) or ifupdown (Debian). Both use systemd. Log locations differ:
    /var/log/messages vs /var/log/syslog.'
- id: distro-002
  topic: linux_distros
  level: L1
  question: When should you choose Ubuntu LTS vs RHEL for production servers?
  answer: 'RHEL: enterprise/regulated environments, vendor support SLAs, compliance (FIPS, STIG), certified hardware. Ubuntu
    LTS: cloud-native workloads (default AWS AMI), developer-friendly, wide software support, cost-sensitive (free or cheap
    ESM). Both offer 10+ year support. Choice often depends on existing ecosystem and compliance requirements.'
- id: distro-003
  topic: linux_distros
  level: L1
  question: How do you handle mixed Debian/RHEL fleets in Ansible automation?
  answer: 'Use ansible_os_family fact for conditionals: when: ansible_os_family == ''Debian''. Use ansible.builtin.package
    (generic) instead of apt/dnf. Use variables for package names (httpd vs apache2). Separate group_vars per distro family.
    Best practice: standardize on ONE distro per environment role.'
  distractor: 'Common mistake: hardcoding dnf or apt module — breaks on the other family. Use the generic ''package'' module
    or conditional blocks.'
- id: distro-004
  topic: linux_distros
  level: L2
  question: What is the difference between rolling release and fixed release distributions, and when to use each?
  answer: 'Fixed (Debian Stable, Ubuntu LTS, RHEL): major versions with backported security fixes, predictable, stable. Upgrade
    between versions. Rolling (Arch, Tumbleweed): continuous updates, always latest packages, occasional breakage. Rule: fixed
    for production servers (stability), rolling for dev workstations (latest features). Never use rolling release for production.'
- id: lfcs-001
  topic: lpic_lfcs
  level: L1
  question: What are setuid, setgid, and sticky bit, and how do you set them?
  answer: 'setuid (4xxx): binary runs as file owner (e.g., /usr/bin/passwd runs as root). setgid (2xxx): on directories, new
    files inherit group; on binaries, runs as file group. Sticky bit (1xxx): on directories, only file owner can delete their
    files (e.g., /tmp). Set with: chmod u+s (setuid), chmod g+s (setgid), chmod +t (sticky).'
- id: lfcs-002
  topic: lpic_lfcs
  level: L1
  question: How do POSIX ACLs work and when should you use them instead of standard permissions?
  answer: 'ACLs provide fine-grained access beyond owner/group/other. Set: setfacl -m u:alice:rwx file. View: getfacl file.
    Remove: setfacl -x u:alice file. Files with ACLs show + in ls -l output. Use when: multiple users/groups need different
    access to the same file, or project directories need team-specific permissions beyond what standard Unix permissions support.'
- id: lfcs-003
  topic: lpic_lfcs
  level: L2
  question: How do you extend an LVM logical volume and resize its filesystem?
  answer: 'Extend LV: lvextend -L +5G /dev/datavg/datalv. Then resize filesystem: resize2fs /dev/datavg/datalv (ext4) or xfs_growfs
    /mnt/data (xfs). Shortcut: lvextend -r -L +5G /dev/datavg/datalv (-r auto-resizes filesystem). Common mistake: extending
    the LV but forgetting to resize the filesystem — df still shows old size.'
- id: lfcs-004
  topic: lpic_lfcs
  level: L2
  question: How do you persist iptables rules across reboots on Debian/Ubuntu?
  answer: 'Install: apt install iptables-persistent. Save current rules: netfilter-persistent save. Rules saved to /etc/iptables/rules.v4
    and rules.v6. Manual save: iptables-save > /etc/iptables/rules.v4. Manual restore: iptables-restore < /etc/iptables/rules.v4.
    Without this, all iptables rules are lost on reboot.'
- id: container-001
  topic: container_base_images
  level: L0
  question: What are the main container base image options and their key tradeoffs?
  answer: 'Alpine (~7MB): tiny, musl libc, good for Go. Debian-slim (~75MB): glibc, good compatibility, best all-around. Distroless
    (~20MB): no shell/pkg manager, maximum security. scratch (0MB): for static binaries only. UBI (~95MB): RHEL-compatible,
    enterprise use. Key tradeoff: smaller = more secure but harder to debug.'
- id: container-002
  topic: container_base_images
  level: L1
  question: Why does Alpine cause problems with Python C extensions and Kubernetes DNS?
  answer: 'Python: Alpine uses musl libc, so no pre-built wheels exist — packages like numpy/pandas must compile from source
    (10-30 min vs seconds on Debian). DNS: musl''s resolver doesn''t handle K8s ndots:5 default well, causing 10x more DNS
    queries that can overwhelm CoreDNS. Fix: use Debian-slim for Python apps, or set ndots:1 in Pod dnsConfig.'
- id: container-003
  topic: container_base_images
  level: L2
  question: How do you debug a container that uses a distroless or scratch base image with no shell?
  answer: kubectl debug -it pod/myapp --image=busybox (ephemeral container). kubectl debug --image=nicolaka/netshoot (network
    tools). kubectl logs pod/myapp (always available). kubectl cp for extracting files. Build a --target debug stage in your
    Dockerfile with a shell. Use distroless :debug variant temporarily. Plan your debugging strategy BEFORE going distroless.
- id: personal-dev-022
  topic: career
  level: L0
  question: What is the impact formula for ops resume bullets and what six types of quantification can be used?
  answer: 'Formula: [Action verb] + [what you built or changed] + [quantified result]. Six quantification types: (1) time
    saved (hours/week, minutes per deploy), (2) scale (servers, services, users affected), (3) reliability (uptime %, MTTR
    reduction), (4) cost (dollars saved, resources reduced), (5) risk (incidents prevented, compliance achieved), (6) speed
    (deployment frequency, lead time improvement).'
- id: personal-dev-026
  topic: career
  level: L0
  question: What is title arbitrage in ops job hunting, and why does searching only one title leave money on the table?
  answer: 'Title arbitrage: the same skill set is labeled differently across companies — ''Senior SysAdmin,'' ''DevOps Engineer,''
    ''Infrastructure Engineer,'' ''Platform Engineer,'' ''SRE'' often describe the same work but at different salary bands.
    Searching only one title means missing roles at higher comp. Solution: search all equivalent titles and negotiate on total
    compensation including signing bonus, equity, remote work stipend, training budget, and on-call pay — not just base.'
- id: personal-dev-027
  topic: career
  level: L2
  question: What differentiates a Staff Engineer from a Senior Engineer in ops contexts, and why do most senior engineers
    stall at this transition?
  answer: 'Senior engineers solve hard technical problems assigned to them. Staff engineers identify which problems are worth
    solving across teams and set technical direction for the organization. The differentiator is not deeper technical skill
    — it is organizational scope. Most ops engineers stall because the transition is invisible: it requires influencing architecture
    decisions across teams, mentoring senior engineers, and operating at organizational scope. The skills are not new; the
    leverage point shifts from execution to direction.'
- id: cli-005
  topic: jq
  level: L1
  question: How do you use jq to merge two JSON objects and handle key collisions?
  answer: 'Use the * operator: jq -n ''{a:1, b:2} * {b:3, c:4}'' produces {a:1, b:3, c:4}. The right-hand side wins on collisions.
    For arrays, use + to concatenate. For deep merge, use * recursively.'
- id: cli-006
  topic: jq
  level: L1
  question: How do you use jq select() with multiple conditions?
  answer: 'Chain with ''and''/''or'': jq ''.items[] | select(.status == "Running" and .metadata.namespace == "prod")''. Parentheses
    group conditions. select() passes the input through if the expression is truthy, drops it otherwise.'
- id: cli-007
  topic: jq
  level: L2
  question: How do you reshape JSON with jq to produce a CSV-like output from nested data?
  answer: 'Use @csv with an array: jq -r ''.items[] | [.metadata.name, .status.phase, .spec.nodeName] | @csv''. The -r flag
    outputs raw strings (no outer quotes). Use @tsv for tab-separated. For headers, prepend a static array before the data
    rows.'
- id: cli-008
  topic: bash_scripting
  level: L0
  question: What does 'set -euo pipefail' do and why should every production script start with it?
  answer: '-e: exit immediately on any command failure. -u: treat unset variables as errors (catches typos). -o pipefail:
    a pipeline fails if any command in it fails (not just the last). Without these, scripts silently continue after errors,
    producing corrupt state.'
- id: cli-009
  topic: bash_scripting
  level: L1
  question: What is a bash trap and how do you use it for cleanup?
  answer: 'trap ''cleanup_function'' EXIT runs cleanup_function whenever the script exits (normal, error, or signal). Common
    pattern: trap ''rm -f "$tmpfile"'' EXIT. You can trap specific signals: trap ''echo interrupted'' INT TERM. Traps execute
    in LIFO order if multiple are set for the same signal.'
- id: cli-010
  topic: bash_scripting
  level: L2
  question: What is process substitution in bash and when is it useful?
  answer: 'Syntax: <(command) creates a file descriptor from command output. Example: diff <(sort file1) <(sort file2) compares
    sorted versions without temp files. Also: comm <(sort a.txt) <(sort b.txt) finds unique/common lines. It avoids subshell
    variable scoping issues that pipes cause.'
- id: cli-011
  topic: regex
  level: L0
  question: What is the difference between .* (greedy) and .*? (lazy) in regex?
  answer: 'Greedy (.*) matches as much as possible, then backtracks. Lazy (.*?) matches as little as possible. Example: on
    ''<a>text</a>'', ''<.*>'' matches the entire string, while ''<.*?>'' matches just ''<a>''. Use lazy quantifiers when you
    want the shortest match.'
- id: cli-012
  topic: regex
  level: L1
  question: How do lookahead and lookbehind assertions work in regex?
  answer: 'Lookahead (?=pattern) asserts what follows without consuming. Lookbehind (?<=pattern) asserts what precedes. Negative
    forms: (?!pattern) and (?<!pattern). Example: \d+(?= USD) matches digits only when followed by '' USD''. They are zero-width
    — they check but don''t include in the match.'
- id: cli-013
  topic: regex
  level: L1
  question: What are named capture groups and backreferences in regex?
  answer: 'Named groups: (?P<name>pattern) in Python/PCRE, (?<name>pattern) in others. Reference with \k<name> or \1 for numbered
    groups. Example: (?P<word>\w+)\s+(?P=word) matches repeated words like ''the the''. In sed: \(pattern\) and \1 for backreferences.'
- id: cli-014
  topic: fzf
  level: L1
  question: How do you use fzf with a preview window for file selection?
  answer: 'fzf --preview ''cat {}'' shows file contents while browsing. Customize: --preview-window=right:60% for layout.
    Combine with fd: fd -t f | fzf --preview ''head -50 {}''. For git: git log --oneline | fzf --preview ''git show {1}''.
    The {} placeholder is replaced with the selected line.'
- id: cli-015
  topic: fzf
  level: L1
  question: What are the default fzf keybindings in a shell and how do you customize them?
  answer: 'Defaults: Ctrl-T (paste file path), Ctrl-R (search command history), Alt-C (cd into directory). Set FZF_DEFAULT_COMMAND
    to change the file source (e.g., fd instead of find). Set FZF_DEFAULT_OPTS for global options like --height 40% --layout=reverse.
    Keybindings are installed via the fzf shell integration script.'
- id: cli-016
  topic: fd
  level: L0
  question: What are the key differences between fd and find?
  answer: 'fd is faster (parallel directory traversal), has sane defaults (ignores .gitignore, hidden files), uses regex by
    default, and has simpler syntax. Example: fd ''test.*\.py$'' vs find . -name ''test*.py''. fd respects .gitignore; find
    does not. fd colorizes output. Use find when you need POSIX portability or -exec with complex logic.'
- id: cli-017
  topic: ripgrep
  level: L1
  question: How does ripgrep handle binary files, symlinks, and .gitignore compared to grep?
  answer: 'rg skips binary files by default (override with -a or --binary). It respects .gitignore, .rgignore, and .ignore
    files. Symlinks are not followed by default (use -L/--follow). grep searches everything, follows no ignore files, and
    includes binary matches. rg uses -g/--glob for include/exclude patterns: rg pattern -g ''*.py'' -g ''!test*''.'
- id: cli-018
  topic: modern_cli
  level: L1
  question: How does xargs handle filenames with spaces and special characters safely?
  answer: 'Use null delimiters: find . -name ''*.log'' -print0 | xargs -0 rm. The -print0/xargs -0 pair uses \0 as separator
    instead of whitespace. For parallel execution: xargs -0 -P 4 -n 1 command runs 4 processes at once. Without -0, filenames
    containing spaces, quotes, or newlines break silently.'
- id: cli-019
  topic: modern_cli
  level: L2
  question: How do you use awk to process fields with a custom delimiter and perform calculations?
  answer: 'awk -F: ''{sum += $3} END {print sum/NR}'' /etc/passwd averages all UIDs. -F sets the field separator (default:
    whitespace). $1..$NF are fields; NR is record number; NF is field count. For multiple delimiters: -F''[,;:]''. For output
    formatting: awk -F, ''{printf "%-20s %10.2f\n", $1, $3}'' data.csv.'
- id: dc-014
  topic: raid
  level: L1
  question: What is the practical difference between RAID 5 and RAID 6 for fault tolerance?
  answer: 'RAID 5 tolerates 1 disk failure (single parity). RAID 6 tolerates 2 simultaneous failures (double parity). With
    modern large disks (4TB+), RAID 5 rebuilds take hours — during which a second failure destroys the array. RAID 6 is strongly
    recommended for drives >1TB. Trade-off: RAID 6 loses 2 disks of capacity vs 1 for RAID 5.'
- id: dc-015
  topic: raid
  level: L2
  question: A RAID 5 array is rebuilding after a disk replacement. What is the risk and how do you mitigate it?
  answer: 'During rebuild, every sector of every surviving disk is read. Unrecoverable Read Errors (URE) on large disks (spec:
    1 per 10^14 bits ~= 1 per 12TB read) can cause a second failure, destroying the array. Mitigations: 1) Use RAID 6 or RAID
    10. 2) Use enterprise disks with lower URE rates. 3) Patrol reads to detect bad sectors proactively. 4) Maintain hot spares
    for immediate rebuild.'
- id: dc-016
  topic: oob_management
  level: L1
  question: How do you use ipmitool to check server health and power cycle remotely?
  answer: ipmitool -I lanplus -H <bmc-ip> -U admin -P <pass> chassis status (power state). sensor list (temps, fans, voltages).
    sel list (system event log — hardware errors). chassis power cycle (hard reboot). sol activate (serial-over-LAN console).
    Always use lanplus (encrypted) over lan. The SEL is the first place to check for hardware faults.
- id: dc-017
  topic: oob_management
  level: L2
  question: Why are default BMC credentials a critical security risk and how do you mitigate it?
  answer: 'BMC/iDRAC/iLO default credentials (admin/admin, root/calvin) give full remote hardware control: power, console,
    virtual media (boot from attacker ISO), firmware flash. BMCs are often on a management VLAN but still reachable. Mitigations:
    1) Change all defaults before racking. 2) Isolate BMC on a dedicated management network. 3) Disable IPMI-over-LAN if not
    needed. 4) Enable HTTPS-only for web console. 5) Audit BMC firmware versions.'
- id: dc-018
  topic: pxe
  level: L1
  question: What is the PXE boot sequence and what services does it depend on?
  answer: '1) Server BIOS/UEFI sends DHCP discover with PXE option. 2) DHCP server responds with IP + TFTP server address
    (next-server) + boot filename. 3) Client downloads bootloader (pxelinux.0 or grubx64.efi) via TFTP. 4) Bootloader fetches
    kernel + initrd per config. 5) Kernel boots and may fetch full image via HTTP. Dependencies: DHCP, TFTP, HTTP/NFS for
    images. If any fails, the server gets no OS.'
- id: dc-019
  topic: pxe
  level: L2
  question: What changes when PXE booting in UEFI mode vs legacy BIOS mode?
  answer: UEFI PXE uses grubx64.efi (or shimx64.efi for Secure Boot) instead of pxelinux.0. DHCP must return the correct bootloader
    filename per client architecture (option 93 / client-arch). UEFI uses HTTP boot as an alternative to TFTP (faster, more
    reliable). Config files are in grub.cfg format instead of pxelinux.cfg/. Mixing UEFI and BIOS clients requires DHCP vendor-class
    matching to serve different bootloaders.
- id: dc-020
  topic: server_hardware
  level: L0
  question: What do amber and blue LED indicators mean on most server hardware?
  answer: Amber/orange LED = fault or warning (failed disk, degraded PSU, over-temp). Blue LED = identification (lit by admin
    via iDRAC/iLO/ipmitool to locate a server in a rack). Blinking amber often indicates a predictive failure. Solid amber
    = component has failed. Green = healthy. No LED on a PSU = no power input. Check vendor docs for exact meanings — they
    vary by manufacturer.
- id: dc-021
  topic: server_hardware
  level: L1
  question: How do you diagnose ECC memory errors and map them to a physical DIMM slot for replacement?
  answer: '1) Check system event log: ipmitool sel list | grep -i mem. 2) Check dmesg: dmesg | grep -iE ''edac|ecc|memory|mce''.
    3) Check EDAC counters: find /sys/devices/system/edac/ -name ce_count -exec cat {} + (correctable errors). 4) Use dmidecode
    --type 17 to list all DIMMs with locator strings (e.g., DIMM_A1). 5) Cross-reference the EDAC channel/slot with dmidecode
    output to identify the physical slot. Correctable ECC errors accumulating on one DIMM = replace it proactively before
    it becomes uncorrectable.'
- id: dc-022
  topic: firmware
  level: L1
  question: Why is firmware patching critical and what is the risk of skipping it?
  answer: 'Firmware (BIOS/UEFI, BMC/iDRAC, disk controller, NIC) has security vulnerabilities just like OS software. Unpatched
    BMC firmware can allow remote takeover. Unpatched disk controller firmware can cause data loss during rebuild. Risks of
    patching: requires maintenance window, some updates need reboot, failed flash can brick hardware. Mitigate: stage updates,
    test on non-prod first, keep recovery media available.'
- id: dc-023
  topic: rack_ops
  level: L1
  question: What factors determine how you position equipment in a rack and why does weight distribution matter?
  answer: 'Place heaviest equipment (UPS, storage arrays) at the bottom to lower center of gravity and prevent tipping. Network
    switches go at top-of-rack (ToR) for shortest cable runs. Leave 1-2U gaps for airflow where needed. Keep cable management
    arms on the rear. Weight limits: a 42U rack typically supports 1000-1500 kg — check floor tile load ratings in raised-floor
    datacenters. Unbalanced racks are a physical safety hazard during seismic events or when rolling on casters.'
- id: dc-024
  topic: rack_ops
  level: L1
  question: What is the purpose of blanking panels and what happens without them?
  answer: 'Blanking panels fill empty U-spaces in a rack to prevent hot exhaust air from recirculating around the rack to
    the cold intake side. Without them, hot air takes the path of least resistance through gaps, raising intake temperatures
    and causing uneven cooling. Effects: servers at the top of the rack overheat, fans spin faster (more power, more noise),
    and thermal throttling degrades performance.'
- id: dc-025
  topic: power
  level: L1
  question: What are the differences between basic, metered, and switched PDUs?
  answer: 'Basic PDU: power distribution only (no monitoring). Metered PDU: shows total amperage/wattage per PDU (helps prevent
    overload). Switched PDU: remote outlet-level power control + metering (can power cycle individual servers remotely). Monitored
    per-outlet PDU adds per-outlet metering. Always use at least metered PDUs in production. Redundant power: each server''s
    PSUs on different PDUs fed from different circuits/UPS.'
- id: dc-026
  topic: power
  level: L2
  question: How do you calculate power budgeting for a rack and what limits should you watch?
  answer: 'Sum the nameplate wattage of all devices (servers, switches, storage). Apply a de-rating factor (typically 0.7-0.8x
    nameplate for actual draw). Check against circuit capacity: a 30A 208V circuit provides ~6.2kW but should not exceed 80%
    continuous (4.9kW). Also budget for cooling (roughly 1:1 with IT load in traditional datacenters). Watch for: phase imbalance
    on 3-phase power, in-rush current on startup, and peak vs average draw.'
- id: dc-027
  topic: server_hardware
  level: L2
  question: What is the difference between UEFI and legacy BIOS boot and why does it matter for automation?
  answer: 'BIOS: 16-bit real mode, MBR partition table (max 2TB, 4 primary partitions), no Secure Boot. UEFI: 64-bit, GPT
    partition table (128+ partitions, >2TB), supports Secure Boot, has EFI System Partition. For automation: UEFI provides
    standardized boot variables (efibootmgr), HTTP boot for PXE replacement, and Secure Boot chain verification. Mixing BIOS
    and UEFI in a fleet complicates provisioning — standardize on UEFI for new deployments.'
- id: dc-028
  topic: firmware
  level: L2
  question: How do you plan and execute a firmware update campaign across a fleet of servers?
  answer: '1) Inventory current versions: query BMC/iDRAC via redfish API or vendor tools. 2) Identify targets: compare against
    vendor-recommended versions and CVE lists. 3) Stage updates: download and validate checksums. 4) Test on non-prod: update
    1-2 servers, verify functionality. 5) Rolling update in batches: drain workload, update, reboot, verify, proceed. 6) Rollback
    plan: know if firmware is reversible (some BMC updates are not). 7) Document: log all versions before/after.'
- id: obs-011
  topic: prometheus
  level: L1
  question: What is the difference between rate() and irate() in PromQL?
  answer: rate() calculates per-second average increase over the full range vector (e.g., rate(http_requests_total[5m]) averages
    over 5 minutes). irate() uses only the last two data points for an instantaneous rate. rate() is smoother and better for
    alerting. irate() is spikier and better for dashboards where you want to see sudden changes. Never use irate() for alerting
    — it is too volatile.
- id: obs-014
  topic: grafana
  level: L0
  question: How do you use Grafana template variables to make dashboards dynamic?
  answer: 'Variables are defined in Dashboard Settings > Variables. Syntax in queries: $variable or ${variable}. Types: Query
    (populated from data source, e.g., label_values(up, job)), Custom (static list), Interval (time bucketing). Reference
    in panel queries like: rate(http_requests_total{job="$job"}[5m]). Multi-value variables use regex: {job=~"$job"} with
    Include All option.'
- id: obs-015
  topic: grafana
  level: L1
  question: A Grafana dashboard shows gaps in metric data. What are the common causes?
  answer: '1) Scrape target was down (Prometheus could not reach it). 2) Time range includes periods before the metric existed.
    3) Query uses rate() on a counter that reset (shows as gap unless using increase()). 4) Stale markers: target removed,
    series goes stale after 5 minutes. 5) Step/resolution mismatch: query step larger than scrape interval. 6) Null values:
    use ''connect null values'' panel option to bridge gaps.'
- id: obs-016
  topic: loki
  level: L1
  question: What are LogQL pipeline stages and how do they work?
  answer: 'LogQL has two phases: log stream selector ({job="app"}) and pipeline. Pipeline stages: 1) Line filters: |= (contains),
    != (not contains), |~ (regex match). 2) Parser: | json, | logfmt, | regexp to extract labels from log lines. 3) Label
    filter: | status >= 400. 4) Formatting: | line_format, | label_format. Stages execute left to right. Example: {job="app"}
    |= "error" | json | status >= 500 | line_format "{{.message}}".'
- id: obs-017
  topic: loki
  level: L2
  question: How does Loki handle high-cardinality labels differently from Prometheus?
  answer: 'Loki indexes only labels (not log content), so high-cardinality labels create many small index entries and chunks,
    degrading query performance. Loki rejects streams exceeding max_streams_per_user. Unlike Prometheus, Loki can grep through
    unindexed content at query time using pipeline filters. Best practice: keep label cardinality low (job, namespace, pod)
    and use |= or | json for high-cardinality fields in the log line itself.'
- id: obs-018
  topic: tempo
  level: L1
  question: How do you look up a trace by trace ID in Tempo and what can it tell you?
  answer: 'In Grafana: go to Explore, select the Tempo data source, enter the trace ID. Tempo returns the full trace: all
    spans across all services, with timing, status, and attributes. Each span shows: service name, operation, duration, status
    code, and parent span. This reveals: where latency is spent, which service errored, fan-out patterns, and gaps between
    spans (network/queue time).'
- id: obs-019
  topic: tempo
  level: L2
  question: What is the difference between head-based and tail-based trace sampling?
  answer: 'Head-based: sampling decision made at trace start (e.g., sample 10% of requests). Simple but misses rare errors
    (a 500 error in the unsampled 90% is lost). Tail-based: decision made after trace completes, so you can keep 100% of errors
    and slow traces while sampling routine ones. Tail-based requires a collector that buffers complete traces before deciding
    (more infrastructure). Use tail-based when debugging rare failures matters.'
- id: obs-020
  topic: alerting
  level: L1
  question: How does Alertmanager route and group alerts?
  answer: 'route: defines a tree of matchers. Each alert matches the first route whose labels match. group_by: aggregates
    alerts with the same label values into one notification (e.g., group_by: [alertname, cluster]). group_wait: initial delay
    before sending (to batch). group_interval: wait before sending updates. repeat_interval: how often to re-notify. Receivers
    define where alerts go (Slack, PagerDuty, email). inhibit_rules suppress alerts when a broader alert is firing.'
- id: obs-021
  topic: alerting
  level: L2
  question: What is the RED method and how do you implement it?
  answer: 'RED = Rate (requests/sec), Errors (failed requests/sec), Duration (latency distribution). Applicable to every request-driven
    service. Implementation: instrument with a histogram for duration and counters for total/error requests. PromQL: Rate
    = rate(http_requests_total[5m]), Errors = rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]),
    Duration = histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])). Dashboard one RED panel per service.'
- id: obs-022
  topic: tracing
  level: L1
  question: When should you use metrics, logs, or traces for debugging?
  answer: 'Metrics: detect and alert on symptoms (high error rate, latency spike). Good for dashboards, trends, and capacity
    planning. Logs: understand what happened in a specific component (error messages, stack traces). Good for debugging known
    services. Traces: understand how a request flowed across services and where it slowed down. Good for debugging cross-service
    latency and dependency issues. Start with metrics to detect, traces to locate, logs to diagnose.'
- id: obs-023
  topic: monitoring_fundamentals
  level: L0
  question: What is the difference between blackbox and whitebox monitoring?
  answer: 'Blackbox monitoring tests externally visible behavior (HTTP health checks, ping, synthetic transactions) — sees
    what users see. Whitebox monitoring uses internal instrumentation (application metrics, logs, traces) — sees internal
    state. You need both: blackbox catches issues whitebox misses (DNS failures, network path problems), whitebox catches
    internal problems before they become user-visible (queue depth growing, cache hit rate dropping).'
- id: obs-024
  topic: monitoring_fundamentals
  level: L1
  question: What are the Four Golden Signals and which services does each apply to?
  answer: 'From Google SRE: 1) Latency — time to service a request (distinguish success vs error latency). 2) Traffic — demand
    on the system (requests/sec, sessions). 3) Errors — rate of failed requests (explicit 5xx and implicit: wrong content,
    slow response). 4) Saturation — how full the system is (CPU, memory, disk, queue depth). Apply to every user-facing service.
    For storage/batch systems, saturation and errors are most critical.'
- id: obs-025
  topic: monitoring_fundamentals
  level: L2
  question: How do you instrument a new service for observability from scratch?
  answer: '1) Add a metrics library (prometheus-client, OpenTelemetry SDK). 2) Instrument RED metrics: request counter with
    status label, histogram for latency, error counter. 3) Add structured logging (JSON) with request ID, trace ID, and key
    fields. 4) Add distributed tracing (propagate trace context, create spans for external calls). 5) Expose /metrics endpoint.
    6) Create ServiceMonitor for Prometheus scraping. 7) Build a dashboard with RED panels. 8) Define SLO-based alerts (error
    budget burn rate).'
- id: linux-006
  topic: systemd
  level: L0
  question: What are the main systemd unit types and when do you use each?
  answer: 'service: long-running daemons (nginx, postgresql). timer: scheduled tasks (replaces cron). socket: socket-activated
    services (on-demand start). target: groups of units (multi-user.target replaces runlevels). mount/automount: filesystem
    mounts. path: trigger on file/directory changes. slice: resource control grouping (cgroups). Most daily work involves
    .service and .timer units.'
- id: linux-007
  topic: systemd
  level: L1
  question: How do you troubleshoot a systemd service that keeps restarting?
  answer: '1) systemctl status <service> — see last exit code and restart count. 2) journalctl -u <service> -e —no-pager —
    see recent logs for the crash reason. 3) Check Restart= and RestartSec= in the unit file (systemctl cat <service>). 4)
    Check resource limits: LimitNOFILE, MemoryMax. 5) Run the binary manually to reproduce. 6) Check for dependency failures:
    systemctl list-dependencies <service>. StartLimitBurst and StartLimitIntervalSec control how many rapid restarts before
    systemd gives up.'
- id: linux-008
  topic: systemd
  level: L2
  question: How do you create a systemd timer to replace a cron job?
  answer: 'Create two files: a .timer and a matching .service. Timer: [Timer] OnCalendar=*-*-* 02:00:00 (daily at 2am) or
    OnBootSec=5min (5 min after boot). Persistent=true reruns missed executions after downtime. Service: [Service] Type=oneshot,
    ExecStart=/path/to/script. Enable with: systemctl enable --now mytask.timer. Advantages over cron: dependency ordering,
    resource limits, logging via journal, calendar expressions with randomized delay.'
- id: linux-009
  topic: linux_fundamentals
  level: L1
  question: What useful information is in /proc and how do you read it?
  answer: '/proc is a virtual filesystem exposing kernel and process state. Key entries: /proc/PID/status (process memory,
    state), /proc/PID/fd/ (open file descriptors), /proc/cpuinfo (CPU details), /proc/meminfo (memory breakdown), /proc/loadavg
    (load averages), /proc/mounts (mounted filesystems), /proc/net/tcp (open sockets). Read with cat — these are pseudo-files
    generated on demand. /proc/PID/environ shows process environment variables.'
- id: linux-010
  topic: process_management
  level: L1
  question: How do you use strace to debug a failing process?
  answer: 'strace -p PID attaches to a running process. strace -f command traces child processes too. Key flags: -e trace=open,read,write
    (filter syscalls), -T (show time spent in each call), -c (summary of call counts and times). Common uses: find which config
    file a program is reading, see why a connect() fails (wrong IP/port), discover missing library paths. Use -o file to avoid
    mixing output with stderr.'
- id: linux-011
  topic: process_management
  level: L2
  question: How does the OOM killer decide which process to kill and how do you influence it?
  answer: 'The kernel computes an oom_score for each process (0-1000) based on memory usage, age, and privileges. Higher score
    = more likely to be killed. Influence via /proc/PID/oom_score_adj: range -1000 to +1000. Set -1000 to exempt (e.g., database).
    Set +1000 to prefer killing. For systemd services: OOMScoreAdjust=-900 in the unit file. Also: oom_kill_disable on cgroups
    (dangerous — can cause system hang). Check current scores: cat /proc/*/oom_score | sort -rn.'
- id: linux-012
  topic: linux_performance
  level: L1
  question: How do you use dmesg to diagnose kernel-level issues?
  answer: 'dmesg --human (timestamps) or dmesg -T (readable dates). Key patterns: OOM killer messages (Out of memory: Kill
    process), disk I/O errors (I/O error, dev sdX), ECC memory errors (EDAC), NIC link state changes (link up/down), filesystem
    errors (EXT4-fs error). Use dmesg -l err,warn for errors/warnings only. After a crash: dmesg -r shows raw priority levels.
    The kernel ring buffer is finite — old messages get overwritten.'
- id: linux-013
  topic: linux_performance
  level: L2
  question: What are cgroups v2 and how do you set resource limits with them?
  answer: 'cgroups v2 is the unified hierarchy for resource control (CPU, memory, I/O, PIDs). Mounted at /sys/fs/cgroup. Set
    limits: echo 500000 100000 > /sys/fs/cgroup/mygroup/cpu.max (50% of one CPU). echo 1G > /sys/fs/cgroup/mygroup/memory.max.
    Key controllers: cpu (bandwidth), memory (usage + swap), io (blkio throttle), pids (fork bomb prevention). Systemd uses
    cgroups v2 natively: CPUQuota=50%, MemoryMax=1G in unit files. Check usage: cat /sys/fs/cgroup/mygroup/memory.current.'
- id: linux-014
  topic: filesystems_storage
  level: L1
  question: How do you diagnose and resolve inode exhaustion?
  answer: 'Symptoms: ''No space left on device'' but df shows free space. Verify: df -i shows inode usage. Diagnosis: find
    the directory with millions of tiny files: find / -xdev -printf ''%h\n'' | sort | uniq -c | sort -rn | head. Common culprits:
    mail queues, session files, log fragments, /tmp. Resolution: delete the files (often a runaway process creating temp files).
    Prevention: monitor inode usage in your alerting system. Some filesystems (XFS) allocate inodes dynamically; ext4 fixes
    them at mkfs time.'
- id: linux-015
  topic: filesystems_storage
  level: L2
  question: How do LVM snapshots work and what are their performance implications?
  answer: 'LVM snapshots use copy-on-write (COW): the snapshot volume starts empty and only stores original blocks that are
    overwritten after snapshot creation. Read from snapshot: if block unchanged, read from origin; if changed, read from snapshot
    copy. Performance impact: every write to the origin triggers a read-old-block + write-to-snapshot + write-new-block sequence
    (triple I/O penalty). Snapshots that fill up become invalid. Use for: pre-upgrade backups, consistent database dumps (freeze
    + snap + thaw). Not a replacement for real backups — they depend on the origin volume.'
- id: linux-016
  topic: kernel_troubleshooting
  level: L1
  question: What is a kernel panic and how do you capture and analyze the crash dump?
  answer: 'Kernel panic = unrecoverable kernel error (null pointer dereference, corrupted data structures, hardware fault).
    Configure kdump: install kdump-tools or kexec-tools, set crashkernel=256M boot parameter. On panic, kdump captures memory
    to /var/crash/. Analyze with crash utility: crash /usr/lib/debug/vmlinux /var/crash/vmcore — then use bt (backtrace),
    log (dmesg), ps (process list). Common causes: bad RAM, driver bugs, filesystem corruption.'
- id: linux-017
  topic: kernel_troubleshooting
  level: L2
  question: How do you use /proc/PID/oom_score_adj and cgroup memory limits together to protect critical services?
  answer: 'Layer both: 1) Set oom_score_adj=-900 on critical processes (database, control plane) so the OOM killer targets
    other processes first. 2) Set cgroup memory.max on non-critical services to cap their memory and trigger OOM within their
    cgroup before system-wide OOM. 3) Set memory.low on critical services for best-effort memory protection (kernel reclaims
    from others first). In systemd: OOMScoreAdjust=-900, MemoryMax=2G, MemoryLow=512M. Monitor with memory.events for oom_kill
    counts.'
- id: linux-018
  topic: linux_performance
  level: L0
  question: What do the three load average numbers mean and when is load 'too high'?
  answer: 'Load averages (from uptime or /proc/loadavg) show the average number of processes in runnable or uninterruptible
    sleep state over 1, 5, and 15 minutes. On a 4-core system, load 4.0 means fully utilized. Load > number of cores means
    processes are queuing. Compare 1-min vs 15-min: 1-min much higher = recent spike; 15-min higher = recovering. High load
    with low CPU = I/O wait (check with vmstat or iostat). Include uninterruptible I/O in the count — disk-bound processes
    inflate load.'
- id: linux-019
  topic: linux_fundamentals
  level: L2
  question: How does the Linux virtual memory system work and what happens when RAM is full?
  answer: 'Linux uses virtual memory with demand paging. Each process gets a virtual address space; pages are loaded into
    physical RAM on first access (page fault). The kernel maintains page cache (file data), anonymous pages (heap/stack),
    and mapped pages. When RAM is full: 1) Kernel reclaims page cache (safe — can re-read from disk). 2) Swaps anonymous pages
    to swap space (slow). 3) If still insufficient, the OOM killer activates. Check: free -h (available includes reclaimable
    cache), /proc/meminfo (detailed breakdown), vmstat (swap in/out rates).'
- id: linux-020
  topic: process_management
  level: L0
  question: What is the difference between SIGTERM and SIGKILL and why does it matter?
  answer: 'SIGTERM (15) asks a process to terminate gracefully — the process can catch it, clean up (close files, release
    locks, save state), and exit. SIGKILL (9) forces immediate termination — the process cannot catch or ignore it, so no
    cleanup happens. Always try SIGTERM first (kill PID or kill -15 PID). Only use SIGKILL (kill -9 PID) if the process is
    stuck. Consequences of SIGKILL: orphaned lock files, corrupted state, unfinished transactions, zombie children.'
- id: email-infra-001
  topic: email_infrastructure
  level: L1
  question: What are SPF, DKIM, and DMARC, and why do you need all three for reliable email delivery?
  answer: SPF validates the sending server's IP is authorized (DNS TXT record listing allowed IPs). DKIM signs the message
    body with a private key so recipients can verify it was not tampered with (public key in DNS). DMARC ties them together
    with a policy (none/quarantine/reject) and alignment rules. You need all three because SPF alone does not prevent body
    tampering, DKIM alone does not prevent envelope spoofing, and DMARC enforces that at least one aligns with the From domain.
- id: email-infra-002
  topic: email_infrastructure
  level: L1
  question: Your application sends email via SMTP relay and users report messages going to spam. What do you check first?
  answer: 1) Check SPF/DKIM/DMARC alignment — run headers through a tool like mxtoolbox. 2) Check if the sending IP is on
    any blocklist (RBL/DNSBL lookup). 3) Verify reverse DNS (PTR record) matches the HELO/EHLO hostname. 4) Check the DMARC
    aggregate reports for failures. 5) Review email content for spam-trigger patterns (all caps, suspicious links, missing
    unsubscribe header for bulk mail).
- id: email-infra-003
  topic: email_infrastructure
  level: L2
  question: How does an MTA like Postfix handle mail routing, and what is the difference between transport maps and relay
    hosts?
  answer: 'Postfix uses a multi-stage pipeline: smtpd receives, cleanup processes headers, qmgr manages the queue, smtp delivers.
    Transport maps route specific domains to specific next-hop servers (e.g., route internal.corp to an internal relay). Relay
    host is the default next-hop for all outbound mail (relayhost = [smtp-relay.example.com]:587). Transport maps override
    relayhost for matched domains. Use transport maps for split routing (internal vs external), relayhost for centralizing
    all outbound through a smarthost.'
- id: email-infra-004
  topic: email_infrastructure
  level: L1
  question: What is the difference between an MTA, MDA, and MUA, and how do they interact?
  answer: 'MTA (Mail Transfer Agent, e.g., Postfix, Exim) routes and transfers email between servers using SMTP. MDA (Mail
    Delivery Agent, e.g., Dovecot LDA, procmail) delivers mail to the recipient''s mailbox. MUA (Mail User Agent, e.g., Thunderbird,
    Outlook) is the client users interact with. Flow: sender MUA -> sender MTA -> recipient MTA -> MDA -> recipient mailbox
    -> recipient MUA (via IMAP/POP3).'
- id: email-infra-005
  topic: email_infrastructure
  level: L2
  question: You need to migrate an organization's email from on-prem Exchange to a cloud provider with zero downtime. What
    is your approach?
  answer: '1) Set up coexistence: configure mail flow so both systems can receive mail. 2) Lower MX record TTL days in advance.
    3) Migrate mailboxes in batches using IMAP sync or provider migration tools. 4) Update MX records to point to the new
    provider. 5) Keep the old server running as a fallback relay for the TTL window. 6) Verify SPF, DKIM, and DMARC records
    are updated for the new provider''s sending infrastructure. 7) Monitor DMARC reports and bounce logs for a week post-migration.'
- id: email-infra-006
  topic: email_infrastructure
  level: L1
  question: What is STARTTLS vs implicit TLS for email, and which ports are used?
  answer: 'STARTTLS upgrades a plaintext connection to TLS on the standard port (port 25 for server-to-server, port 587 for
    submission). Implicit TLS starts the connection as TLS immediately (port 465 for submission, port 993 for IMAPS, port
    995 for POP3S). STARTTLS on port 25 is opportunistic — a MITM can strip it. Implicit TLS on 465 is always encrypted. Modern
    best practice: use port 465 with implicit TLS for submission, enforce TLS on port 25 with MTA-STS.'
- id: email-infra-007
  topic: email_infrastructure
  level: L2
  question: What is MTA-STS and how does it prevent TLS downgrade attacks on email in transit?
  answer: MTA-STS (RFC 8461) publishes a policy via HTTPS (at .well-known/mta-sts.txt) declaring that the domain's MX servers
    support TLS and listing valid MX hostnames. Sending MTAs that support MTA-STS will refuse to deliver over plaintext or
    to MX servers with invalid certificates. This prevents MITM attackers from stripping STARTTLS or redirecting to rogue
    MX servers. Complemented by TLSRPT (RFC 8460) which sends daily TLS failure reports to the domain owner.
- id: distributed-systems-001
  topic: distributed_systems
  level: L1
  question: What is the CAP theorem and how does it apply to choosing a database for a microservices architecture?
  answer: 'CAP states a distributed system can guarantee at most two of: Consistency (every read sees the latest write), Availability
    (every request gets a response), Partition tolerance (system works despite network splits). Since network partitions are
    unavoidable, the real choice is CP (consistent but may reject requests during partition, e.g., etcd, ZooKeeper) vs AP
    (available but may serve stale data, e.g., Cassandra, DynamoDB in eventual-consistency mode). Choose based on your tolerance
    for stale reads vs failed writes.'
- id: distributed-systems-002
  topic: distributed_systems
  level: L2
  question: What is the difference between Raft and Paxos consensus algorithms, and why is Raft more commonly used in modern
    infrastructure tools?
  answer: 'Both achieve consensus in distributed systems but differ in design philosophy. Paxos is theoretically elegant but
    notoriously hard to implement correctly — it separates the protocol into phases that are difficult to map to real code.
    Raft was designed for understandability: it breaks consensus into leader election, log replication, and safety, with a
    single strong leader. Raft is used in etcd, Consul, CockroachDB, and TiKV because engineers can reason about and debug
    it. The performance difference is negligible for most workloads.'
- id: distributed-systems-003
  topic: distributed_systems
  level: L1
  question: What is the split-brain problem and how do distributed systems prevent it?
  answer: 'Split-brain occurs when a network partition causes two subsets of nodes to each believe they are the active cluster,
    leading to conflicting writes and data divergence. Prevention mechanisms: quorum-based voting (majority required to accept
    writes — a 3-node cluster tolerates 1 failure), fencing (STONITH/fence agents power off unreachable nodes), lease-based
    leadership (leader must renew lease within timeout), and witness/tiebreaker nodes in even-numbered clusters.'
- id: distributed-systems-004
  topic: distributed_systems
  level: L2
  question: Explain the difference between strong consistency, eventual consistency, and causal consistency. When would you
    choose each?
  answer: 'Strong consistency: reads always return the latest write (linearizability). Use for financial transactions, distributed
    locks. Eventual consistency: given no new writes, all replicas converge to the same value. Use for DNS, social media feeds,
    caches. Causal consistency: preserves cause-and-effect ordering (if A causes B, everyone sees A before B) but allows concurrent
    operations to be seen in different orders. Use for collaborative editing, comment threads. Each step down trades consistency
    for lower latency and higher availability.'
- id: distributed-systems-005
  topic: distributed_systems
  level: L1
  question: What are idempotent operations and why are they critical in distributed systems?
  answer: 'An idempotent operation produces the same result regardless of how many times it is executed. Critical because
    in distributed systems, network failures force retries — without idempotency, a retry could create a duplicate order,
    charge a card twice, or increment a counter extra times. Techniques: use unique request IDs (idempotency keys) that the
    server deduplicates, prefer PUT (set to value) over POST (create new), design state machines where re-applying a transition
    is a no-op if already applied.'
- id: distributed-systems-006
  topic: distributed_systems
  level: L2
  question: What is a vector clock and how does it differ from a Lamport timestamp for tracking causality?
  answer: 'Lamport timestamps assign a single incrementing counter to events — they establish a total order but cannot distinguish
    concurrent events from causally related ones. Vector clocks maintain a counter per node (e.g., [A:3, B:2, C:1]) so you
    can determine if event X happened-before event Y (X''s vector <= Y''s component-wise) or if they are concurrent (neither
    dominates). Trade-off: vector clocks grow with the number of nodes. Used in Dynamo-style databases for conflict detection.
    Modern alternatives include dotted version vectors and hybrid logical clocks.'
- id: distributed-systems-007
  topic: distributed_systems
  level: L1
  question: What is a circuit breaker pattern and when should you use it in a microservices architecture?
  answer: 'A circuit breaker monitors calls to a downstream service and trips open when failures exceed a threshold (e.g.,
    50% failure rate over 10 seconds). When open, calls fail immediately without contacting the service, preventing cascade
    failures and giving the downstream time to recover. After a timeout, it enters half-open state and allows a test request.
    Use it for any synchronous call to another service, external API, or database. Libraries: Hystrix (deprecated), resilience4j,
    Polly. Always pair with fallback behavior (cached data, degraded response, queue for later).'
- id: feature-flags-001
  topic: feature_flags
  level: L1
  question: What is the difference between a release flag, an experiment flag, and an operational flag?
  answer: Release flags control feature rollout (enable feature for 10% of users, then ramp up). Experiment flags support
    A/B testing (variant A vs B, measure conversion). Operational flags are kill switches for runtime behavior (disable a
    feature under load, toggle between backends). Release flags are temporary (remove after full rollout). Experiment flags
    are temporary (remove after experiment concludes). Operational flags may be long-lived. Failing to categorize leads to
    tech debt — stale flags accumulate.
- id: feature-flags-002
  topic: feature_flags
  level: L1
  question: How do you implement a feature flag system that does not add latency to every request?
  answer: 'Use local evaluation with periodic sync: the SDK fetches flag configurations from the server at startup and polls
    for updates every 30-60 seconds (or uses server-sent events / streaming for near-real-time). Flags are evaluated locally
    in-process against cached rules — no network call per evaluation. Fallback to hardcoded defaults if the flag service is
    unreachable. This is how LaunchDarkly, Unleash, and Flagsmith work. Never make a synchronous API call per flag check in
    the request path.'
- id: feature-flags-003
  topic: feature_flags
  level: L2
  question: A feature flag rollout to 5% of users caused a 3x increase in database queries. How do you investigate and remediate
    without a full rollback?
  answer: '1) Confirm correlation: check if the affected database load aligns with the flagged user segment. 2) Reduce exposure:
    lower the rollout to 1% or target only internal users. 3) Profile: enable query logging or APM tracing for flagged users
    to identify the new code path''s query pattern. 4) Fix: add missing indexes, batch queries, or add caching in the new
    code path. 5) Validate: re-enable at 5% with monitoring, then ramp. The flag gave you a safe way to isolate and debug
    without rolling back the entire deployment.'
- id: feature-flags-004
  topic: feature_flags
  level: L1
  question: What is flag debt and how do you prevent it from accumulating?
  answer: 'Flag debt is the accumulation of stale feature flags that are no longer needed — they clutter code with conditional
    branches, confuse new developers, and create untested code paths. Prevention: 1) Set an expiration date when creating
    every flag. 2) Add automated lint rules that flag stale flags (e.g., flag created > 90 days ago and still in code). 3)
    Track flags in a central registry with ownership. 4) Include flag cleanup in the definition of done for feature work.
    5) Run periodic flag audits (quarterly).'
- id: feature-flags-005
  topic: feature_flags
  level: L2
  question: How do feature flags interact with database migrations, and what can go wrong?
  answer: 'If a feature flag controls code that reads new database columns or tables, you must ensure the migration is deployed
    and backfilled before the flag is enabled for any users. Otherwise, the flagged code path hits missing columns. Strategy:
    deploy migration first (additive, backward-compatible), deploy code with flag off, enable flag gradually. For rollback
    safety: the old code path must work with the new schema too. Never gate a destructive migration (column removal) behind
    a flag — the flag could be turned off after the column is gone.'
- id: feature-flags-006
  topic: feature_flags
  level: L1
  question: What is percentage-based rollout vs user-segment targeting, and when do you use each?
  answer: Percentage-based rollout enables a feature for a random N% of users — good for gradual ramp-up to catch performance
    issues. User-segment targeting enables it for specific groups (internal employees, beta testers, users in a region) —
    good for targeted testing and compliance. Use percentage for general availability rollouts. Use segments for dogfooding
    (internal first), geographic compliance (GDPR features for EU users), and A/B experiments (specific cohorts). Most flag
    systems support both and they can be combined.
- id: mongodb-001
  topic: mongodb_ops
  level: L1
  question: What is a MongoDB replica set and what happens when the primary goes down?
  answer: A replica set is a group of mongod instances (typically 3+) maintaining the same dataset. One is primary (accepts
    writes), others are secondaries (replicate from the oplog). When the primary goes down, secondaries hold an election using
    Raft-like consensus. A new primary is elected within 10-12 seconds. During election, writes fail but reads can continue
    if readPreference is set to secondaryPreferred. An arbiter can break ties in even-numbered sets but holds no data.
- id: mongodb-002
  topic: mongodb_ops
  level: L2
  question: How does MongoDB sharding work and what are the trade-offs between range-based and hash-based shard keys?
  answer: Sharding distributes data across multiple replica sets (shards) based on a shard key. Range-based sharding keeps
    sequential values on the same shard — good for range queries but causes hotspots if writes are sequential (e.g., timestamps).
    Hash-based sharding distributes writes evenly but makes range queries scatter across all shards. Choose range for read-heavy
    workloads with range queries. Choose hash for write-heavy workloads needing even distribution. A compound shard key can
    balance both. The shard key is immutable once set — choose carefully.
- id: mongodb-003
  topic: mongodb_ops
  level: L1
  question: What is the MongoDB oplog and why is its size important for operations?
  answer: The oplog (operations log) is a capped collection in the local database that records all write operations. Secondaries
    tail the oplog to replicate changes. If a secondary falls behind by more than the oplog window (time between oldest and
    newest entry), it cannot catch up and requires a full resync. Size the oplog based on write volume — a 50GB oplog on a
    system doing 1GB/hour of writes gives a ~50-hour window. Monitor oplog lag (rs.printReplicationInfo()) and increase size
    if secondaries frequently lag.
- id: mongodb-004
  topic: mongodb_ops
  level: L2
  question: How do you diagnose and fix slow queries in MongoDB?
  answer: '1) Enable the profiler: db.setProfilingLevel(1, {slowms: 100}) to log queries >100ms. 2) Check system.profile collection
    for slow queries. 3) Use explain(''executionStats'') on slow queries — look for COLLSCAN (full collection scan), high
    docsExamined vs docsReturned ratio. 4) Create appropriate indexes (compound indexes matching query predicates + sort).
    5) Check for index intersection vs compound index (compound is almost always better). 6) Monitor with mongostat and mongotop
    for real-time metrics.'
- id: mongodb-005
  topic: mongodb_ops
  level: L1
  question: What is the WiredTiger storage engine's journaling and how does it affect crash recovery?
  answer: WiredTiger writes changes to an in-memory cache, then periodically flushes to disk via checkpoints (every 60 seconds
    by default). The journal (write-ahead log) records all changes between checkpoints. On crash, MongoDB replays the journal
    from the last checkpoint to recover committed writes. Journal commits happen every 50ms by default (configurable). With
    journaling enabled, you can lose at most 50ms of writes. Disable journaling only for ephemeral data where loss is acceptable.
- id: mongodb-006
  topic: mongodb_ops
  level: L2
  question: What are MongoDB read concern and write concern, and how do they affect consistency and durability?
  answer: 'Write concern controls how many nodes must acknowledge a write: w:1 (primary only, fast but risky), w:majority
    (majority of replica set, durable), w:0 (fire-and-forget). Read concern controls the consistency of read data: local (latest
    from this node, may be rolled back), majority (only data committed to majority, durable), linearizable (strongest, waits
    for all prior writes). Use w:majority + readConcern:majority for strong consistency. Use w:1 + readConcern:local for performance
    when some data loss is acceptable.'
- id: mysql-001
  topic: mysql_ops
  level: L1
  question: What is the difference between InnoDB and MyISAM, and why is InnoDB the default in modern MySQL?
  answer: InnoDB supports transactions (ACID), row-level locking, foreign keys, and crash recovery via redo/undo logs. MyISAM
    uses table-level locking, has no transaction support, and is prone to corruption on crash. InnoDB is the default because
    it handles concurrent writes safely, recovers automatically after crashes, and supports referential integrity. MyISAM's
    only advantage was full-text search (now supported by InnoDB) and slightly faster bulk reads on read-only workloads.
- id: mysql-002
  topic: mysql_ops
  level: L2
  question: How does MySQL replication work and what is the difference between statement-based, row-based, and mixed replication?
  answer: 'MySQL replication streams the binary log (binlog) from primary to replica. Statement-based (SBR) logs SQL statements
    — compact but non-deterministic functions (NOW(), RAND()) cause drift. Row-based (RBR) logs actual row changes — deterministic
    but verbose for bulk updates. Mixed mode uses SBR by default and switches to RBR for non-deterministic statements. Modern
    best practice: use ROW format (binlog_format=ROW) for consistency. GTID-based replication (gtid_mode=ON) simplifies failover
    by giving each transaction a global ID.'
- id: mysql-003
  topic: mysql_ops
  level: L1
  question: You need to run ALTER TABLE on a 500GB production table. How do you do it without downtime?
  answer: 'Use an online schema change tool: pt-online-schema-change (Percona) or gh-ost (GitHub). These create a new table
    with the desired schema, copy data in chunks using triggers or binlog tailing, then atomically swap the table names. Direct
    ALTER TABLE would lock the table for hours. gh-ost is preferred because it uses binlog streaming instead of triggers (less
    write amplification). Always test on a replica first and run during low-traffic windows.'
- id: mysql-004
  topic: mysql_ops
  level: L2
  question: What is the InnoDB buffer pool and how do you size it correctly?
  answer: 'The InnoDB buffer pool caches data and index pages in memory. It is the single most impactful MySQL performance
    setting. Size it to 70-80% of available RAM on a dedicated database server. Monitor buffer pool hit ratio: SHOW ENGINE
    INNODB STATUS — look for buffer pool hit rate. If it drops below 99%, the pool is too small. Use innodb_buffer_pool_instances
    (one per GB, up to 64) to reduce mutex contention on large pools. Warm it after restart with innodb_buffer_pool_dump_at_shutdown
    and innodb_buffer_pool_load_at_startup.'
- id: mysql-005
  topic: mysql_ops
  level: L1
  question: How do you create and verify a MySQL backup that you can actually restore from?
  answer: 'Use xtrabackup (Percona) for physical hot backups — it copies InnoDB data files without locking. For logical backups
    use mysqldump --single-transaction (consistent snapshot without locks for InnoDB). Critical: always test restores. Run
    a weekly restore-verification job that loads the backup into a test instance and runs validation queries. A backup you
    have never restored is not a backup — it is a hope. Also back up the binlogs for point-in-time recovery.'
- id: mysql-006
  topic: mysql_ops
  level: L2
  question: What is a MySQL deadlock and how do you diagnose and prevent them?
  answer: 'A deadlock occurs when two transactions each hold a lock the other needs. InnoDB detects deadlocks and rolls back
    the smaller transaction (fewer undo log records). Diagnose: SHOW ENGINE INNODB STATUS shows the latest deadlock details
    (locks held and waited for). Prevention: 1) Access tables and rows in a consistent order across all transactions. 2) Keep
    transactions short. 3) Use SELECT ... FOR UPDATE only when necessary. 4) Add appropriate indexes so queries lock fewer
    rows. 5) Consider READ COMMITTED isolation level to reduce gap locking.'
- id: mysql-007
  topic: mysql_ops
  level: L1
  question: What is the MySQL slow query log and how do you use it to find performance problems?
  answer: 'Enable with slow_query_log=ON and long_query_time=1 (log queries >1 second). Use pt-query-digest (Percona Toolkit)
    to aggregate the slow log and rank queries by total time, frequency, and lock time. Focus on the top 5 queries by total
    time — these have the biggest impact. For each: run EXPLAIN to check for full table scans, add missing indexes, and check
    for N+1 query patterns in the application. Also enable log_queries_not_using_indexes to catch queries that work now but
    will degrade as data grows.'
- id: grpc-001
  topic: grpc
  level: L1
  question: What are the four types of gRPC service methods and when would you use each?
  answer: '1) Unary: single request, single response — standard RPC calls (most common). 2) Server streaming: single request,
    stream of responses — real-time feeds, large result sets. 3) Client streaming: stream of requests, single response — file
    upload, batch processing. 4) Bidirectional streaming: both sides stream — chat, real-time collaboration. Choose based
    on data flow pattern. Most services start with unary and add streaming only when needed.'
- id: grpc-002
  topic: grpc
  level: L1
  question: Why does gRPC use Protocol Buffers instead of JSON, and what are the trade-offs?
  answer: 'Protocol Buffers (protobuf) provide: binary serialization (5-10x smaller than JSON), schema enforcement (proto
    files define the contract), code generation (type-safe clients in any language), backward/forward compatibility (field
    numbers allow evolution). Trade-offs: not human-readable (need tools to inspect), requires proto compilation step, harder
    to debug with curl. Use gRPC for internal service-to-service communication where performance matters. Use JSON/REST for
    public APIs and browser clients.'
- id: grpc-003
  topic: grpc
  level: L2
  question: How does gRPC handle load balancing and why is it more complex than HTTP/1.1 load balancing?
  answer: 'gRPC uses HTTP/2, which multiplexes many requests over a single long-lived TCP connection. Traditional L4 load
    balancers (TCP) assign all requests on one connection to the same backend — defeating load balancing. Solutions: 1) L7
    load balancing (Envoy, nginx with grpc_pass) that inspects HTTP/2 frames and distributes per-request. 2) Client-side load
    balancing (gRPC name resolver + pick_first/round_robin). 3) Look-aside load balancing (external service like xDS/Envoy).
    In Kubernetes, use headless services + client-side LB or an Envoy sidecar.'
- id: grpc-004
  topic: grpc
  level: L2
  question: How do you implement deadlines and cancellation propagation in gRPC?
  answer: 'Set a deadline (absolute time) or timeout (relative duration) on every gRPC call — never make an RPC without one.
    The deadline propagates through the call chain: if service A calls B with a 5-second deadline, and B calls C, the remaining
    budget propagates to C. If the deadline expires, all in-flight RPCs in the chain are cancelled (DEADLINE_EXCEEDED). Servers
    should check ctx.Err() or context.is_active() and abort expensive work early. Without deadlines, a slow downstream causes
    thread/goroutine pile-up across all upstream services.'
- id: grpc-005
  topic: grpc
  level: L1
  question: What are gRPC interceptors and how are they used for cross-cutting concerns?
  answer: 'Interceptors (middleware) wrap every RPC call to add cross-cutting behavior. Unary interceptors handle single request/response;
    stream interceptors handle streaming calls. Common uses: logging (log every call with method, duration, status), authentication
    (validate tokens in metadata), metrics (count calls, measure latency), retry logic, and tracing (inject/extract trace
    context). Chain multiple interceptors in order. They are the gRPC equivalent of HTTP middleware and keep business logic
    clean of infrastructure concerns.'
- id: grpc-006
  topic: grpc
  level: L2
  question: How do you evolve a protobuf schema without breaking existing clients?
  answer: 'Rules: 1) Never change a field number — they are the wire identity. 2) Never change a field type (int32 to string).
    3) Add new fields with new field numbers — old clients ignore unknown fields. 4) Mark removed fields as reserved to prevent
    reuse. 5) Rename fields freely (wire format uses numbers, not names). 6) Use optional for new fields so old code gets
    default values. For major changes: create a new service version (v2) and run both until migration is complete. Test with
    old-client/new-server and new-client/old-server combinations.'
- id: graphql-001
  topic: graphql
  level: L1
  question: What is the N+1 query problem in GraphQL and how do you solve it?
  answer: 'When a query requests a list of items with nested relationships (e.g., users and their posts), a naive resolver
    fetches each user, then makes a separate database query per user for their posts — 1 query for users + N queries for posts.
    Solution: use a DataLoader (batching library) that collects all requested IDs in a single tick, then makes one batch query
    (WHERE user_id IN (...)). DataLoader also deduplicates repeated IDs. Without it, a single GraphQL query can generate hundreds
    of database queries.'
- id: graphql-002
  topic: graphql
  level: L1
  question: How do you prevent a malicious or careless client from sending an extremely expensive GraphQL query?
  answer: '1) Query depth limiting — reject queries nested deeper than N levels. 2) Query complexity analysis — assign cost
    to each field and reject queries exceeding a budget. 3) Timeout — abort queries running longer than a threshold. 4) Persisted
    queries — clients can only send pre-approved query hashes, not arbitrary queries. 5) Rate limiting per client. Use a combination:
    depth + complexity + timeout for internal APIs, persisted queries for public APIs.'
- id: graphql-003
  topic: graphql
  level: L2
  question: What is the difference between schema-first and code-first GraphQL development, and when would you choose each?
  answer: 'Schema-first: write the .graphql SDL schema file first, then implement resolvers to match it. Benefits: schema
    is the contract, non-developers can review it, great for API-first design. Drawbacks: schema and code can drift. Code-first:
    define the schema programmatically in code (e.g., using decorators or builder patterns). Benefits: single source of truth,
    type-safe, no drift. Drawbacks: harder for non-developers to review. Choose schema-first for multi-team APIs where the
    schema is a shared contract. Choose code-first for single-team rapid iteration.'
- id: graphql-004
  topic: graphql
  level: L2
  question: How do you implement pagination in GraphQL and what is Relay-style cursor pagination?
  answer: 'Two approaches: offset-based (skip/limit — simple but breaks with concurrent inserts and is slow for large offsets)
    and cursor-based (encode a pointer into the result set). Relay-style cursor pagination uses a connection pattern: query
    returns edges (node + cursor) and pageInfo (hasNextPage, endCursor). Client passes ''after: cursor, first: N'' for the
    next page. The cursor is typically a base64-encoded primary key or timestamp. Cursor-based is more stable and performant
    for large datasets.'
- id: graphql-005
  topic: graphql
  level: L1
  question: What are GraphQL subscriptions and how do they work under the hood?
  answer: 'Subscriptions allow clients to receive real-time updates when data changes. The client sends a subscription query
    over a persistent connection (typically WebSocket using graphql-ws protocol). The server pushes events matching the subscription
    filter. Implementation: the server maintains a pub/sub system — when a mutation occurs, it publishes an event, and the
    subscription resolver filters and delivers it to connected clients. Use for: live dashboards, chat, notifications. Do
    not use for polling-replaceable use cases — subscriptions have higher server cost per connection.'
- id: graphql-006
  topic: graphql
  level: L1
  question: What is the difference between a GraphQL query, mutation, and the resolver pattern?
  answer: 'Queries read data (GET equivalent), mutations modify data (POST/PUT/DELETE equivalent). Both are defined in the
    schema and backed by resolvers — functions that fetch or modify the data for each field. The resolver chain: a top-level
    resolver fetches the root object, then child resolvers fetch nested fields. Each resolver receives (parent, args, context,
    info). Context carries request-scoped data (auth, DataLoader instances). Keep resolvers thin — delegate business logic
    to service layers.'
- id: message-queues-001
  topic: message_queues
  level: L1
  question: What is the difference between a message queue (RabbitMQ) and a log-based broker (Kafka), and when do you choose
    each?
  answer: 'Message queue: messages are consumed and deleted (each message delivered once to one consumer in a group). Good
    for task distribution, work queues, RPC. Log-based broker: messages are appended to a persistent log and retained for
    a configurable period. Consumers track their offset. Good for event sourcing, stream processing, replay. Choose RabbitMQ
    when you need complex routing (exchanges, bindings, dead-letter queues) and message-level acknowledgment. Choose Kafka
    when you need high throughput, replay capability, and multiple consumers reading the same stream independently.'
- id: message-queues-002
  topic: message_queues
  level: L2
  question: How do you handle poison messages (messages that repeatedly fail processing) in a message queue?
  answer: '1) Set a maximum retry count (delivery count or redelivery limit). 2) After max retries, route the message to a
    dead-letter queue (DLQ). 3) Monitor the DLQ — alert when messages appear. 4) Build tooling to inspect, fix, and replay
    DLQ messages. 5) Add structured error metadata on each failure (timestamp, error message, stack trace) as message headers.
    Never silently discard failed messages. In Kafka: use a retry topic with backoff, then a DLQ topic. In RabbitMQ: configure
    x-dead-letter-exchange on the queue.'
- id: message-queues-003
  topic: message_queues
  level: L1
  question: What does 'at-least-once' vs 'at-most-once' vs 'exactly-once' delivery mean, and which should you design for?
  answer: 'At-most-once: message may be lost but never duplicated (ack before processing). At-least-once: message is never
    lost but may be duplicated (ack after processing, retry on failure). Exactly-once: message delivered and processed exactly
    once (requires idempotent consumers or transactional processing). Design for at-least-once with idempotent consumers —
    it is the practical sweet spot. True exactly-once is extremely expensive and often achieved by making at-least-once processing
    idempotent (deduplication keys, upserts instead of inserts).'
- id: message-queues-004
  topic: message_queues
  level: L2
  question: How do Kafka consumer groups work and what happens during a rebalance?
  answer: 'A consumer group is a set of consumers that cooperatively consume a topic. Each partition is assigned to exactly
    one consumer in the group. When a consumer joins or leaves (crash, scale up/down), a rebalance occurs: the group coordinator
    reassigns partitions. During rebalance, consumption pauses — this can cause latency spikes. Mitigation: use cooperative
    sticky rebalancing (incremental rebalance, only moved partitions pause), tune session.timeout.ms and heartbeat.interval.ms,
    and minimize consumer group churn. Static group membership (group.instance.id) prevents rebalance on brief disconnects.'
- id: message-queues-005
  topic: message_queues
  level: L1
  question: What is backpressure in a messaging system and how do you handle it?
  answer: 'Backpressure occurs when a consumer cannot process messages as fast as they arrive. The queue grows, memory fills,
    and eventually messages are dropped or the broker destabilizes. Handling: 1) Scale consumers horizontally (add more workers/partitions).
    2) Set queue length limits with reject or dead-letter policies. 3) Implement consumer-side rate limiting with prefetch
    count (RabbitMQ: prefetch_count=10). 4) Use flow control (producer slows down when queue is full). 5) Monitor queue depth
    and consumer lag — alert before critical thresholds.'
- id: message-queues-006
  topic: message_queues
  level: L2
  question: How do you implement the outbox pattern to ensure reliable message publishing alongside database transactions?
  answer: 'Problem: writing to both a database and a message broker is not atomic — one can succeed while the other fails.
    Outbox pattern: 1) Write the business data AND the outgoing message to the same database in one transaction (message goes
    into an ''outbox'' table). 2) A separate process (poller or CDC connector) reads the outbox table and publishes messages
    to the broker. 3) Mark messages as published after broker acknowledgment. This guarantees at-least-once publishing without
    distributed transactions. Debezium with Kafka Connect is a popular CDC-based implementation.'
- id: consul-001
  topic: consul
  level: L1
  question: What is HashiCorp Consul and what are its primary use cases?
  answer: 'Consul is a service mesh and service discovery tool. Primary use cases: 1) Service discovery — services register
    themselves and others find them via DNS or HTTP API. 2) Health checking — Consul runs checks (HTTP, TCP, script) and only
    returns healthy instances. 3) KV store — hierarchical key-value storage for configuration. 4) Service mesh — sidecar proxies
    (Connect) enforce mutual TLS and intentions (authorization). 5) Multi-datacenter — built-in WAN federation for cross-DC
    service discovery. It uses Raft consensus for consistency and gossip (Serf) for membership.'
- id: consul-002
  topic: consul
  level: L2
  question: How does Consul's gossip protocol work and what is the difference between LAN and WAN gossip pools?
  answer: 'Consul uses Serf (based on SWIM) for gossip-based membership management. Each agent periodically pings random peers
    and propagates state changes (join, leave, fail) exponentially through the cluster. LAN gossip pool: all agents in a single
    datacenter — high frequency, low latency, uses LAN network. WAN gossip pool: only server agents across datacenters — lower
    frequency, tolerates higher latency, uses WAN links. The LAN pool detects local failures in seconds. The WAN pool enables
    cross-DC service discovery and failover.'
- id: consul-003
  topic: consul
  level: L1
  question: How do you use Consul for service discovery and what happens when a service instance becomes unhealthy?
  answer: 'Services register via agent config file or HTTP API (PUT /v1/agent/service/register). Clients query via DNS (web.service.consul)
    or HTTP API (GET /v1/health/service/web?passing). When a health check fails, Consul marks the instance as critical and
    stops returning it in DNS queries and passing-only API queries. After the deregister_critical_service_after timeout, it
    is automatically deregistered. Anti-caching: use blocking queries (long-poll) or watches for real-time updates instead
    of polling.'
- id: consul-004
  topic: consul
  level: L2
  question: What are Consul intentions and how do they provide service-to-service authorization?
  answer: 'Intentions define which services are allowed to communicate. They are identity-based ACLs: ''web can talk to api''
    or ''deny all to database except api''. With Connect (service mesh), Consul injects sidecar proxies that enforce intentions
    using mutual TLS — the proxy verifies the caller''s service identity from its TLS certificate before allowing the connection.
    Intentions can be managed via CLI, API, or Terraform. Default behavior is configurable: allow-all or deny-all. In production,
    use deny-all default and explicitly allow required paths.'
- id: consul-005
  topic: consul
  level: L1
  question: What is the difference between a Consul client agent and a server agent?
  answer: 'Server agents participate in the Raft consensus protocol, store all state (service catalog, KV, intentions), and
    replicate data. Run 3 or 5 servers per datacenter for fault tolerance. Client agents run on every node where services
    run — they handle local service registration, run health checks, and forward queries to servers via RPC. Clients are lightweight
    and stateless. The split reduces server load: health checks run locally, only results are forwarded. All agents participate
    in the LAN gossip pool.'
- id: consul-006
  topic: consul
  level: L2
  question: How do you configure Consul for multi-datacenter operation and what is WAN federation vs mesh gateways?
  answer: 'WAN federation (traditional): server agents in each DC join the WAN gossip pool, establishing direct server-to-server
    connections across DCs. Requires network connectivity between all servers. Mesh gateways (newer): designated gateway proxies
    in each DC handle cross-DC traffic. Only gateways need cross-DC connectivity — internal agents communicate via the local
    gateway. Mesh gateways are preferred when: DCs are in different cloud providers, network policies restrict direct server
    connectivity, or you want to minimize cross-DC connection points. Configure via mesh config entry with MeshGateway mode.'
- id: envoy-001
  topic: envoy
  level: L1
  question: What is Envoy proxy and why is it used as the data plane in most service meshes?
  answer: 'Envoy is a high-performance L7 proxy designed for microservices. It is the data plane in Istio, Consul Connect,
    and AWS App Mesh because: 1) It supports HTTP/2 and gRPC natively. 2) Dynamic configuration via xDS APIs (no restarts
    needed). 3) Built-in observability (detailed stats, distributed tracing, access logs). 4) Advanced load balancing (zone-aware,
    circuit breaking, outlier detection). 5) Extensible via WASM filters. It runs as a sidecar alongside each service, handling
    all network traffic transparently.'
- id: envoy-002
  topic: envoy
  level: L2
  question: What are the xDS APIs and how does Envoy receive its configuration dynamically?
  answer: 'xDS is a family of discovery service APIs: CDS (Cluster Discovery), EDS (Endpoint Discovery), LDS (Listener Discovery),
    RDS (Route Discovery), SDS (Secret Discovery). The control plane (Istio Pilot, Consul, custom) pushes configuration to
    Envoy via gRPC streams. Envoy subscribes at startup and receives updates in real-time — no restart or reload needed. This
    enables dynamic service discovery, traffic shifting, and policy changes. ADS (Aggregated Discovery Service) multiplexes
    all xDS types over a single stream for consistency.'
- id: envoy-003
  topic: envoy
  level: L1
  question: How does Envoy handle circuit breaking and outlier detection?
  answer: 'Circuit breaking: limits concurrent connections, pending requests, and retries to a cluster. When limits are hit,
    Envoy returns 503 immediately instead of overloading the backend. Configured per cluster (max_connections, max_pending_requests,
    max_retries). Outlier detection: Envoy tracks error rates per endpoint and ejects unhealthy ones from the load balancing
    pool (e.g., 5 consecutive 5xx errors triggers ejection for 30 seconds). They work together: outlier detection removes
    bad endpoints, circuit breaking prevents overload on remaining ones.'
- id: envoy-004
  topic: envoy
  level: L2
  question: How do you debug Envoy when requests are failing with 503 or NR (no route) errors?
  answer: '1) Check Envoy admin interface (/config_dump for current config, /clusters for endpoint health, /stats for metrics).
    2) For 503 with UF flag: upstream connection failure — check if backend is reachable. 3) For 503 with UO flag: upstream
    overflow — circuit breaker triggered, increase limits or fix the backend. 4) For NR: no route matched — check /config_dump
    routes section, verify domain and path match. 5) Enable access logging with %RESPONSE_FLAGS% to identify the cause. 6)
    Use /logging?level=debug temporarily for detailed connection logs.'
- id: envoy-005
  topic: envoy
  level: L1
  question: What is the difference between Envoy listeners, routes, clusters, and endpoints?
  answer: 'Listener: the address:port Envoy binds to receive traffic (e.g., 0.0.0.0:8080). Each listener has filter chains.
    Route: matches incoming requests (by host, path, headers) and sends them to a cluster. Cluster: a named group of upstream
    endpoints with load balancing and health check config. Endpoint: an individual backend instance (IP:port). Flow: client
    -> listener -> route match -> cluster selection -> load balance to endpoint. Think of it as: listeners receive, routes
    decide, clusters organize, endpoints serve.'
- id: envoy-006
  topic: envoy
  level: L2
  question: How does Envoy implement traffic shifting for canary deployments?
  answer: 'Configure a route with weighted clusters: route traffic to v1 cluster at 95% and v2 cluster at 5%. Gradually shift
    weight toward v2 as confidence builds. In Istio, this maps to VirtualService with weight-based routing. Envoy evaluates
    weights per-request, so it is statistically accurate over many requests. Combine with: header-based routing (route internal
    users to v2 regardless of weight), retry budget (limit retries to v2 to contain blast radius), and outlier detection (auto-eject
    v2 if error rate spikes). Monitor v2''s error rate and latency before shifting more traffic.'
- id: istio-001
  topic: istio
  level: L1
  question: What are the core components of Istio and what does each one do?
  answer: 'Istiod (control plane): combines Pilot (traffic management, xDS config to Envoy), Citadel (certificate management,
    mTLS), and Galley (config validation). Envoy sidecar (data plane): injected into each pod, handles all inbound/outbound
    traffic. Key resources: VirtualService (routing rules), DestinationRule (load balancing, circuit breaking), Gateway (ingress),
    PeerAuthentication (mTLS policy), AuthorizationPolicy (access control). Istiod pushes config to Envoy sidecars via xDS
    APIs.'
- id: istio-002
  topic: istio
  level: L2
  question: How does Istio implement mutual TLS (mTLS) and what is the difference between STRICT and PERMISSIVE mode?
  answer: 'Istio''s Citadel issues SPIFFE-compliant x509 certificates to each workload via the SDS API. Envoy sidecars use
    these for mutual TLS. PERMISSIVE mode: accepts both plaintext and mTLS connections — use during migration when not all
    services have sidecars. STRICT mode: requires mTLS for all connections — rejects plaintext. Apply per-namespace or per-workload
    via PeerAuthentication. Migration path: start PERMISSIVE, verify all services have sidecars (istioctl analyze), then switch
    to STRICT. Monitor with istio_requests_total metric filtered by connection_security_policy.'
- id: istio-003
  topic: istio
  level: L1
  question: How do you configure traffic routing in Istio for a canary deployment?
  answer: 'Create a VirtualService with weighted routing: route 95% to v1 subset and 5% to v2 subset. Define subsets in a
    DestinationRule using pod labels (version: v1, version: v2). Example: spec.http[0].route has two destinations with weight
    95 and 5. Shift weight gradually (95/5 -> 80/20 -> 50/50 -> 0/100). Combine with header-based routing to force internal
    testers to v2 (match headers, route to v2 with weight 100). Monitor with Kiali dashboard or Prometheus metrics per-version.'
- id: istio-004
  topic: istio
  level: L2
  question: What are the common causes of high latency introduced by Istio sidecars and how do you mitigate them?
  answer: 'Causes: 1) Two extra network hops per request (source sidecar -> destination sidecar). 2) TLS handshake overhead
    (mitigated by connection pooling). 3) Large xDS config push (hundreds of services means MB of config). 4) Envoy filter
    chain processing. Mitigation: use Sidecar resource to limit the scope of config each proxy receives (exportTo, egress
    hosts). Enable protocol sniffing to avoid full HTTP parsing on TCP services. Tune concurrency (proxy CPU). Use mTLS connection
    pooling (h2_upgrade_policy). Typical added latency is 1-3ms per hop — if higher, check sidecar resource limits.'
- id: istio-005
  topic: istio
  level: L1
  question: What is an Istio Gateway and how does it differ from a Kubernetes Ingress?
  answer: 'Istio Gateway configures an Envoy proxy at the edge of the mesh to handle inbound traffic. Unlike Kubernetes Ingress
    (which only supports basic HTTP routing), Gateway supports: TLS termination with SNI, HTTP/2 and gRPC, traffic shifting,
    fault injection, and fine-grained routing via VirtualService. The Gateway resource defines ports and TLS settings; the
    VirtualService defines routing rules and attaches to the Gateway. This separation of concerns is more flexible than Ingress''s
    combined model.'
- id: istio-006
  topic: istio
  level: L2
  question: How do you troubleshoot an Istio configuration that is not taking effect?
  answer: '1) Run istioctl analyze to check for configuration errors (missing destinations, conflicting rules). 2) Check proxy
    config: istioctl proxy-config routes <pod> to verify routes are pushed to the sidecar. 3) Check istiod logs for config
    rejection or push failures. 4) Verify label selectors: VirtualService host must match the service name, DestinationRule
    subsets must match pod labels. 5) Check namespace: is the VirtualService in the right namespace or using exportTo correctly?
    6) Use istioctl proxy-status to verify all proxies are in SYNCED state.'
- id: open-policy-agent-001
  topic: open_policy_agent
  level: L1
  question: What is Open Policy Agent (OPA) and how does it decouple policy from application code?
  answer: 'OPA is a general-purpose policy engine that evaluates policies written in Rego (a declarative query language).
    Instead of embedding authorization logic in each service''s code, services send a structured input (JSON) to OPA and receive
    a policy decision (allow/deny + reasons). This decouples policy from code: security teams write policies, developers write
    features. OPA can be deployed as a sidecar, library, or centralized service. Used for: Kubernetes admission control (Gatekeeper),
    API authorization, Terraform plan validation, and data filtering.'
- id: open-policy-agent-002
  topic: open_policy_agent
  level: L2
  question: How does OPA Gatekeeper enforce policies in Kubernetes and what is the difference between a ConstraintTemplate
    and a Constraint?
  answer: 'Gatekeeper runs as a Kubernetes admission webhook. ConstraintTemplate defines the policy logic in Rego (e.g., ''containers
    must not run as root'') and declares the parameters the policy accepts. Constraint instantiates a template with specific
    parameters and scope (which namespaces, resource kinds). Example: ConstraintTemplate ''K8sAllowedRepos'' has Rego checking
    image registries. Constraint ''allowed-repos'' applies it to Pods in namespace ''production'' with parameter registries:
    [''gcr.io/myproject'']. This separation lets platform teams write templates and cluster admins apply constraints.'
- id: open-policy-agent-003
  topic: open_policy_agent
  level: L1
  question: What is the Rego language and how does it differ from imperative programming languages?
  answer: 'Rego is a declarative query language designed for policy. Instead of writing step-by-step logic (if/else chains),
    you write rules that declare what is true. Rego evaluates all rules and returns the result. Key concepts: rules (name
    = value { conditions }), partial rules (set/object builders), comprehensions (set/array/object), unification (= for both
    assignment and comparison). It is closer to SQL or Prolog than Python. Common mistake: trying to write imperative code
    — instead, think in terms of ''what conditions must be true for this result to hold.'''
- id: open-policy-agent-004
  topic: open_policy_agent
  level: L2
  question: How do you test OPA policies and integrate them into a CI/CD pipeline?
  answer: '1) Write unit tests in Rego: test_ prefixed rules with mock input data. Run with ''opa test . -v''. 2) Use opa
    eval with sample inputs to verify behavior locally. 3) In CI: run ''opa test'' on every policy change, ''opa check --strict''
    for syntax validation, and ''opa fmt --diff'' for formatting. 4) For Gatekeeper: use gator test to validate constraints
    against sample resources. 5) Integration test: deploy to a staging cluster with audit mode (dryrun) before enforce. 6)
    Version policies in git alongside the infrastructure code they protect.'
- id: open-policy-agent-005
  topic: open_policy_agent
  level: L1
  question: What is the difference between running OPA as a sidecar vs a centralized service?
  answer: 'Sidecar: OPA runs alongside each service (in the same pod or as a daemon). Advantages: low latency (localhost call),
    no network dependency, scales with the service. Disadvantages: more resource usage, policy distribution needed to all
    instances. Centralized: single OPA service that all applications query. Advantages: easier to manage and monitor, single
    policy source. Disadvantages: network latency, single point of failure, must handle high throughput. For Kubernetes admission
    control, Gatekeeper runs centrally as a webhook. For service authorization, sidecar is preferred for latency-sensitive
    paths.'
- id: open-policy-agent-006
  topic: open_policy_agent
  level: L2
  question: How do you manage policy data (external data OPA needs for decisions) and keep it fresh?
  answer: 'OPA decisions often need external data (user roles, resource ownership, IP allowlists). Approaches: 1) Bundle API:
    OPA periodically fetches a data bundle (JSON + policies) from an HTTP server. Configure bundle service with polling interval.
    2) Push via API: POST data to OPA''s /v1/data endpoint. 3) Overload input: caller includes all needed data in the decision
    request input. Best practice: use bundles for data that changes infrequently (roles, config), push for real-time data
    (revocation lists), input for request-specific data (user context). Monitor bundle download failures and staleness.'
- id: chaos-004
  topic: chaos_engineering
  level: L1
  question: What are the most common chaos engineering tools and when would you use each?
  answer: 'Chaos Monkey (Netflix): randomly terminates instances — tests instance-level resilience. Litmus (CNCF): Kubernetes-native
    chaos with ChaosEngine CRDs — pod kill, network loss, disk fill. Gremlin: SaaS platform with broad attack types and safety
    controls — good for enterprises needing audit trails. Toxiproxy (Shopify): simulates network conditions (latency, packet
    loss) between services — great for integration tests. AWS Fault Injection Simulator: native AWS chaos (instance stop,
    AZ failure, API throttling). Start with pod/instance kill, graduate to network chaos, then infrastructure-level.'
- id: chaos-005
  topic: chaos_engineering
  level: L2
  question: How do you implement automated chaos experiments in a CI/CD pipeline without risking production stability?
  answer: '1) Run chaos tests in a dedicated staging environment that mirrors production topology. 2) Gate production deploys
    on chaos test pass (e.g., kill 1 pod during integration tests, verify SLO holds). 3) In production: use GameDay scheduling
    with explicit opt-in and runbook. 4) Implement automated abort conditions: if error rate exceeds 2x baseline, automatically
    halt the experiment and roll back. 5) Use canary analysis during chaos — compare control group vs experiment group metrics.
    6) Start with low-blast-radius experiments in production (single pod, short duration) and expand only after confidence
    is established.'
- id: chaos-006
  topic: chaos_engineering
  level: L1
  question: What is the difference between chaos engineering and traditional failure testing (disaster recovery drills)?
  answer: 'DR drills test known failure modes with known recovery procedures (failover to secondary DC, restore from backup).
    Chaos engineering explores unknown failure modes by injecting realistic faults and observing emergent behavior. DR asks
    ''can we recover from this known scenario?'' Chaos asks ''what happens to our system under this condition — and do we
    even know?'' DR is pass/fail. Chaos produces learning outcomes even when the system handles the fault perfectly. Both
    are needed: DR validates your runbooks, chaos discovers gaps your runbooks do not cover.'
- id: chaos-007
  topic: chaos_engineering
  level: L2
  question: How do you measure the value of a chaos engineering program and justify it to leadership?
  answer: 'Track: 1) Incidents prevented — chaos experiments that revealed weaknesses fixed before they caused outages (with
    estimated cost of avoided downtime). 2) Mean time to recovery (MTTR) improvement — teams with chaos practice recover faster
    because they have seen failures before. 3) Confidence level — percentage of services with validated resilience (passed
    chaos tests for their tier''s failure modes). 4) Findings backlog — number of resilience gaps discovered and their severity.
    5) Coverage — percentage of critical paths tested. Present in business terms: ''We found and fixed 12 resilience gaps
    that would have caused X hours of downtime at Y cost.'''
- id: capplan-004
  topic: capacity_planning
  level: L1
  question: What is the USE method and how do you apply it for capacity planning?
  answer: 'USE (Utilization, Saturation, Errors) — for every resource (CPU, memory, disk, network), measure all three. Utilization:
    percentage busy (e.g., CPU at 70%). Saturation: degree of queuing (e.g., CPU run queue length > core count). Errors: error
    count (e.g., disk I/O errors, NIC drops). For capacity planning: graph utilization trends over 30-90 days and extrapolate.
    Alert on saturation (it causes user-visible latency before utilization hits 100%). Errors often signal hardware failure
    that reduces effective capacity. Apply systematically to every resource in the stack.'
- id: capplan-005
  topic: capacity_planning
  level: L2
  question: How do you model capacity for a service with bursty traffic patterns that peak at 10x average?
  answer: '1) Characterize the burst: measure p50, p95, p99 request rates (not just average). 2) Size for p99 peak with headroom,
    not for average. 3) Use auto-scaling with pre-warming: HPA/KEDA for containers, ASG with scheduled scaling for VMs (pre-scale
    before known peaks like marketing campaigns). 4) Add a queue or rate limiter to absorb bursts beyond provisioned capacity
    (shed load gracefully). 5) Load test at 2x expected peak to find the breaking point. 6) Monitor saturation metrics (queue
    depth, p99 latency) not just utilization. A service sized for average load will fail at peak.'
- id: capplan-006
  topic: capacity_planning
  level: L1
  question: What is headroom and why should you never run infrastructure at high utilization?
  answer: 'Headroom is the unused capacity reserved for spikes, failures, and growth. At high utilization (>80% CPU, >85%
    memory), there is no buffer for: traffic spikes (organic growth, viral events), cascading failures (losing a node shifts
    load to survivors, pushing them over the edge), deployments (rolling updates temporarily reduce capacity), and batch jobs
    (backups, ETL). Queuing theory shows latency increases exponentially as utilization approaches 100%. Target 60-70% utilization
    at peak for compute, 70-80% for storage. Plan to add capacity when projected utilization will exceed targets in 30-60
    days.'
- id: capplan-007
  topic: capacity_planning
  level: L2
  question: How do you build a capacity model for a Kubernetes cluster and when should you add nodes?
  answer: '1) Track allocatable vs requested vs actual usage per resource (CPU, memory) at the cluster level. 2) Alert when
    total requests exceed 70% of total allocatable (not actual usage — requests are what the scheduler uses). 3) Monitor pod
    scheduling failures (FailedScheduling events). 4) Track namespace-level resource quotas vs usage. 5) Model growth: plot
    requested resources over 90 days, extrapolate to determine when you will hit allocatable limits. 6) Factor in node failure:
    in a 10-node cluster, losing 1 node shifts ~10% load to survivors — ensure survivors can absorb it. Add nodes before you
    need them, not after pods start failing to schedule.'
- id: tfdive-001
  topic: terraform_deep_dive
  level: L1
  question: You have 3 EC2 instances created with count. You need to rename index 1 without destroying and recreating the
    other two. What happens if you switch from count to for_each, and how do you migrate safely?
  answer: 'Switching from count to for_each changes the resource address from aws_instance.server[0] to aws_instance.server["name"].
    Terraform sees every old index-based resource as destroyed and every new key-based resource as created — full replacement.
    To migrate safely: 1) Use ''terraform state mv'' to rename each resource from its numeric index to its new map key before
    applying. 2) Run ''terraform plan'' to confirm zero changes after the moves. 3) Apply. This is why for_each is preferred
    from the start — keys are stable, indices shift when items are removed.'
  distractor: count creates implicit dependencies on index ordering. Removing index 1 from a list of 3 shifts index 2 to index
    1, causing Terraform to destroy and recreate the wrong instance.
- id: tfdive-002
  topic: terraform_deep_dive
  level: L1
  question: terraform plan hangs with 'Acquiring state lock'. The lock was created 4 hours ago by a crashed CI job. What is
    the correct recovery sequence?
  answer: 1) Verify no other apply is actually running (check CI, ask the team). 2) Note the Lock ID from the error message.
    3) Run 'terraform force-unlock <LOCK_ID>'. 4) Run 'terraform plan' to confirm state is consistent. Never force-unlock
    while another operation is genuinely running — two concurrent applies can corrupt state. If unsure, check the DynamoDB
    lock table (for S3 backend) to see the lock holder details. After recovery, add CI job timeouts and lock-retry logic to
    prevent recurrence.
- id: tfdive-003
  topic: terraform_deep_dive
  level: L2
  question: You need to reference an existing S3 bucket that was created manually. When should you use 'terraform import'
    vs a data source, and what are the long-term implications of each?
  answer: 'terraform import brings the resource under Terraform management — future plans will show drift if someone modifies
    it outside Terraform, and ''terraform destroy'' will delete it. A data source is read-only: it queries the bucket''s attributes
    at plan time but never modifies or destroys it. Use import when you want Terraform to own the lifecycle (enforce config,
    detect drift, control deletion). Use a data source when the resource is managed by another team or process and you just
    need its attributes (ARN, ID). Importing requires writing a matching resource block; data sources are simpler but give
    you no drift protection.'
- id: tfdive-004
  topic: terraform_deep_dive
  level: L2
  question: You use ignore_changes on tags because ASG modifies a 'LastModified' tag. A month later, someone manually changes
    the instance type in the console and terraform plan shows no drift. Why is this dangerous?
  answer: 'ignore_changes applies to the entire attribute lifecycle, not just tags. If you specified ignore_changes = [tags],
    only tags are ignored — instance type drift would still show. But if you used ignore_changes = [tags, instance_type] or
    the broad ignore_changes = all, Terraform stops tracking those attributes entirely. The danger: real infrastructure drift
    becomes invisible. The fix: be surgical — only ignore the specific attributes that legitimately change outside Terraform,
    never use ''all'', and pair ignore_changes with external drift detection (AWS Config rules or periodic ''terraform plan''
    in CI that flags any ignored-attribute drift).'
- id: tfdive-005
  topic: terraform_deep_dive
  level: L1
  question: Your state file in S3 is corrupt and S3 versioning is disabled. You have daily backups in another bucket. Walk
    through the recovery process.
  answer: '1) Do NOT run terraform apply — it will overwrite what remains. 2) Copy the most recent backup to a temporary location.
    3) Inspect the backup with ''terraform show'' against a local copy. 4) Replace the corrupt state file in S3 with the backup.
    5) Run ''terraform plan'' — it will show drift for any changes made between the backup time and now. 6) Review the drift
    carefully: for resources that were created after the backup, either import them or accept they''ll be recreated. 7) Apply
    when satisfied. Then enable S3 versioning and DynamoDB locking immediately. Without versioning, every state write is destructive
    and unrecoverable.'
- id: tfdive-006
  topic: terraform_deep_dive
  level: L2
  question: 'Two security groups need to reference each other: SG-A allows inbound from SG-B, and SG-B allows inbound from
    SG-A. Terraform throws a cycle error. How do you break the cycle?'
  answer: 'Create the security groups without rules, then attach rules as separate aws_security_group_rule resources. Security
    group rules are independent resources that reference existing SGs by ID, so the dependency graph becomes: SG-A → rule-on-A-from-B,
    SG-B → rule-on-B-from-A. No cycle because both SGs exist before either rule is created. This pattern is standard for any
    mutual-reference scenario in Terraform. Avoid putting ingress/egress blocks inline in the aws_security_group resource
    when cross-references exist.'
- id: ansdive-001
  topic: ansible_deep_dive
  level: L1
  question: You define app_version in inventory group_vars, playbook group_vars, and host_vars. All three conflict. Which
    value wins, and how would you override all of them for a single run?
  answer: 'Ansible has 22 levels of variable precedence. For these three: host_vars (most specific) beats playbook group_vars,
    which beats inventory group_vars. To override everything for a single run, use --extra-vars (-e) on the command line —
    extra vars have the highest precedence and override all other sources. The precedence order from lowest to highest: role
    defaults → inventory group_vars → playbook group_vars → inventory host_vars → playbook host_vars → play vars → role vars
    → task vars → extra vars. When debugging precedence issues, use ''ansible -m debug -a var=app_version'' against the target
    host.'
- id: ansdive-002
  topic: ansible_deep_dive
  level: L1
  question: A handler named 'restart nginx' is notified by a task, but the handler never executes even though the playbook
    succeeds. What are three possible reasons?
  answer: '1) The notifying task reported ''ok'' (no change) instead of ''changed'' — handlers only fire when the task actually
    changes something. Running the same playbook twice means the second run has no changes, so no handler fires. 2) The task
    failed before the handler could run, and the failure was caught by ignore_errors — handlers are skipped for failed tasks.
    3) The handler name doesn''t match exactly (whitespace, case) — Ansible matches handler names as strings. Fix: use ''listen''
    topics instead of exact name matching, or use ''meta: flush_handlers'' to force handler execution mid-play rather than
    waiting until end of play.'
- id: ansdive-003
  topic: ansible_deep_dive
  level: L2
  question: What is the practical difference between include_role and import_role, and when does it matter?
  answer: 'import_role is static: Ansible preprocesses it at playbook parse time. All tasks are visible upfront, tags and
    when conditions are inherited by all tasks, and errors are caught early. include_role is dynamic: it runs at task execution
    time. Tasks are loaded on-the-fly, variables can be computed at runtime to decide which role to include, and it supports
    loops. It matters when: 1) You need conditional role loading based on runtime facts — use include_role. 2) You want --list-tasks
    to show all tasks — use import_role (dynamic includes are invisible to list-tasks). 3) You need to loop over a role with
    different vars — use include_role (import_role cannot loop). Default to import_role for predictability; use include_role
    only when you need runtime dynamism.'
- id: ansdive-004
  topic: ansible_deep_dive
  level: L1
  question: 'You set async: 3600 and poll: 0 on a long-running backup task. The playbook finishes immediately. How do you
    verify the backup actually completed?'
  answer: 'With poll: 0, Ansible fires the task and moves on without waiting (fire-and-forget). The task returns a job ID
    in ansible_job_id. To check completion: 1) Register the result: ''register: backup_job''. 2) Add a later task using the
    async_status module: ''async_status: jid={{ backup_job.ansible_job_id }}'' with ''register: job_result'' and ''until:
    job_result.finished'' with ''retries: 120'' and ''delay: 30''. This polls every 30 seconds for up to an hour. Without
    this follow-up, you have no way to know if the backup succeeded, failed, or is still running.'
- id: ansdive-005
  topic: ansible_deep_dive
  level: L2
  question: A block of 3 tasks has a rescue section and an always section. Task 2 fails. In what order do remaining tasks
    execute, and what happens if a rescue task also fails?
  answer: 'Execution order: Task 1 (succeeds) → Task 2 (fails) → Task 3 is SKIPPED → rescue tasks execute in order → always
    tasks execute in order. If a rescue task fails: the remaining rescue tasks are skipped, but the always section STILL executes
    (always means always). The play is then marked as failed. This mirrors try/catch/finally in programming: rescue = catch,
    always = finally. The always block is guaranteed to run regardless of success, failure, or rescue failure. Use always
    for cleanup (removing temp files, releasing locks) that must happen no matter what.'
- id: ansdive-006
  topic: ansible_deep_dive
  level: L1
  question: Your dynamic inventory plugin for AWS EC2 returns instances grouped by tags, but a newly launched instance with
    the correct tags does not appear. What do you check?
  answer: '1) Cache: the aws_ec2 inventory plugin caches results. Run with ''--flush-cache'' or set ''cache: false'' in the
    plugin config. 2) Filters: check the plugin''s ''filters'' section — if you filter by instance-state-name=running and
    the instance is still ''pending'', it won''t appear. 3) Regions: the plugin only queries configured regions — verify the
    instance region matches. 4) IAM permissions: the credentials need ec2:DescribeInstances permission. 5) keyed_groups: if
    you use tag-based grouping, check that the tag key/value match exactly (case-sensitive). Debug with ''ansible-inventory
    --list --yaml'' to see what the plugin actually returns.'
- id: ansdive-007
  topic: ansible_deep_dive
  level: L2
  question: You need to deploy a config file that differs per host but shares 80% of its content. Jinja2 templates work but
    are becoming unreadable. What are your alternatives?
  answer: 'Options beyond monolithic Jinja2: 1) Template inheritance — use {% extends "base.conf.j2" %} with {% block %} overrides
    per host group. 2) assemble module — split config into fragments (00-header, 10-database, 20-cache) and assemble them
    per host. Each fragment can be conditionally included. 3) Template with defaults — define a base dict in group_vars/all
    with per-host overrides via host_vars, then use {{ config | combine(host_overrides, recursive=True) }}. 4) ini_file or
    lineinfile for surgical edits to a shipped default config instead of templating the whole file. 5) For complex configs
    (nginx, haproxy), use a role that generates config from structured data rather than a flat template.'
- id: ansdive-008
  topic: ansible_deep_dive
  level: L3
  question: Your playbook manages 2,000 hosts and takes 45 minutes. Profile shows gather_facts takes 12 minutes and the package
    install task takes 20 minutes. How do you cut this to under 15 minutes?
  answer: 'Attack both bottlenecks: Facts — 1) Enable fact caching (redis backend, TTL 4 hours). Subsequent runs skip gathering
    entirely. 2) Use gather_subset: min or gather_subset: [!all, !min, network] to collect only what you need. 3) For hosts
    where you never use facts, set gather_facts: false. Packages — 1) Increase forks from 5 to 50+ (ansible.cfg or -f 50).
    2) Use strategy: free so fast hosts do not wait for slow ones. 3) Use async with poll: 0 + async_status loop for package
    installs (fire all installs in parallel, poll for completion). 4) Enable SSH pipelining (pipelining = True) to eliminate
    per-task SSH handshake overhead. 5) Use mitogen strategy plugin (3-7x faster task execution). 6) If hosts have a local
    mirror, ensure the package manager hits it instead of upstream repos. Combined, this typically achieves 5-10x speedup.'
- id: ansdive-009
  topic: ansible_deep_dive
  level: L2
  question: You run a playbook that works in check mode but fails in real mode. The failing task is a template that writes
    to /etc/app/config.yml. What are the likely causes?
  answer: '1) A prior task creates the /etc/app/ directory but that task also reported "ok" in check mode because the directory
    already existed in a previous run — on a fresh host, the directory does not exist and the template fails with "No such
    file or directory." 2) The template uses a variable set by set_fact or register from a previous task that does not actually
    execute in check mode (set_fact in check mode still runs, but registered results from shell/command tasks will be skipped,
    leaving the variable undefined). 3) A handler that sets permissions or SELinux context runs only when notified, and check
    mode does not trigger handlers. 4) File ownership requires a user created by a prior task that was skipped in check mode.
    Fix: add check_mode: false to tasks that must run even in check mode (e.g., directory creation), or use the stat module
    with when: not ansible_check_mode to guard dependent tasks.'
- id: ansdive-010
  topic: ansible_deep_dive
  level: L3
  question: How do you implement a blue-green deployment pattern purely with Ansible (no external orchestrator)?
  answer: 'Pattern: maintain two host groups (blue, green). 1) Determine active group by querying LB (delegate_to LB host,
    check which backend pool is active). Store result in a fact. 2) Deploy to the inactive group (serial: "100%" — all at
    once, since they are not serving traffic). 3) Run smoke tests against the inactive group (uri module hitting health endpoints).
    4) If smoke tests pass, switch LB to point to the newly deployed group (update haproxy config, or call cloud LB API via
    uri module). 5) Run a canary period with both groups in the pool, then drain the old group. Implementation details: use
    group_vars to parameterize which group is blue vs green. Use run_once + delegate_to for LB operations. Store deployment
    state in a file or external KV store so the next run knows which group is active. Failure handling: if smoke tests fail,
    do not switch LB — the rescue block reverts the deploy on the inactive group.'
- id: ansdive-011
  topic: ansible_deep_dive
  level: L2
  question: Your Ansible vault-encrypted vars file works locally but fails in CI with "Decryption failed." The vault password
    is passed via environment variable. What do you check?
  answer: '1) The vault password file or script must be executable and output ONLY the password with no trailing newline.
    Check with: cat -A .vault_pass (should show password$ with no extra chars). 2) In CI, the env var may have a trailing
    newline from the secret injection mechanism — use printf "%s" "$VAULT_PASS" > .vault_pass instead of echo. 3) Vault ID
    mismatch — if you encrypted with --vault-id dev@prompt but decrypt without specifying the vault ID, it fails. Use --vault-id
    dev@.vault_pass. 4) The file was re-encrypted with a different password (someone rotated the vault password without updating
    CI). Verify with: ansible-vault view secrets.yml --vault-password-file .vault_pass. 5) File encoding issues — the encrypted
    file was modified by a Windows editor that added BOM or changed line endings.'
- id: ansdive-012
  topic: ansible_deep_dive
  level: L3
  question: You need to write a custom inventory plugin that queries your internal CMDB API. Walk through the implementation.
  answer: 'Create plugins/inventory/cmdb.py in your collection or playbook directory. 1) Subclass BaseInventoryPlugin (and
    optionally Constructable for keyed_groups/compose support). 2) Set NAME = "namespace.collection.cmdb". 3) Implement verify_file()
    to recognize your config file (e.g., ends with cmdb.yml). 4) Implement parse(inventory, loader, path, cache) — this is
    the main method. Read the config YAML with self._read_config_data(path). Call your CMDB API (use requests, handle pagination).
    For each host: self.inventory.add_host(hostname), self.inventory.set_variable(hostname, key, value), self.inventory.add_group(group),
    self.inventory.add_child(group, hostname). 5) Add caching: check self.cache before API call, populate on miss. 6) Config
    file (cmdb.yml): plugin: namespace.collection.cmdb, api_url: https://cmdb.internal, filters: {environment: prod}. 7) Test
    with ansible-inventory -i cmdb.yml --list --yaml. Common mistakes: forgetting to call super().parse() first, not handling
    API pagination, not setting ansible_host for hosts where hostname != IP.'
- id: ansdive-013
  topic: ansible_deep_dive
  level: L2
  question: What are the security implications of ansible_become and how do you harden privilege escalation in production?
  answer: '1) become: true runs tasks via sudo by default. If become_password is stored in plaintext in inventory, it is a
    security risk — encrypt with vault. 2) Limit sudoers — do not grant ALL permissions. Use /etc/sudoers.d/ with specific
    commands: "ansible ALL=(root) NOPASSWD: /usr/bin/systemctl restart nginx". 3) Use become_method: su or become_method:
    doas if sudo is not available. 4) become_user should be the minimum-privilege user needed (not always root). 5) For sensitive
    tasks, use become_flags: "-H -S" to sanitize the environment. 6) Audit trail: AAP logs which user triggered which become
    task. On the target, sudo logs to /var/log/secure. 7) Avoid become: true at the play level — set it per-task so only tasks
    that need root get root. 8) In CI, use a dedicated service account with scoped sudo rules, never a personal account.'
- id: ansdive-014
  topic: ansible_deep_dive
  level: L2
  question: How do you manage Ansible in a mono-repo with multiple teams, each owning different roles and inventories?
  answer: '1) Directory structure: inventories/{team-a,team-b}/ with separate group_vars/host_vars per team. Shared roles
    in roles/, team-specific roles in roles/team-a-*. 2) Use ansible.cfg per team directory or ANSIBLE_CONFIG env var in CI
    to point to team-specific config. 3) Collections: publish team-specific modules as internal collections to a private Automation
    Hub. 4) RBAC: in AAP, create organizations per team with separate credentials and job templates. 5) Testing: each team
    has their own Molecule test suite. CI runs only affected tests based on changed paths (e.g., paths: roles/team-a-** triggers
    team-a tests). 6) Linting: enforce ansible-lint profiles per team (some teams may have stricter rules). 7) Shared roles
    need an OWNERS file and require cross-team review. 8) Pin collection and role versions in requirements.yml per team to
    prevent one team''s updates from breaking another.'
- id: ansdive-015
  topic: ansible_deep_dive
  level: L3
  question: A playbook using delegate_to to configure a load balancer from within an app server play is causing tasks to run
    with the wrong variables. Explain why and how to fix it.
  answer: 'When you delegate_to a different host, Ansible runs the task on the delegated host but uses the DELEGATING host''s
    variables by default (the inventory_hostname context). This means: 1) ansible_host resolves to the delegated host (correct
    for SSH), but all other vars (group_vars, host_vars) come from the original host. 2) If the LB host has different vars
    (e.g., lb_vip, lb_backend_port), they are NOT available unless you explicitly reference hostvars[lb_host].lb_vip. Fix
    approaches: 1) Use hostvars[] to explicitly pull vars from the target: {{ hostvars[lb_hostname].lb_vip }}. 2) Use delegate_facts:
    true if the task gathers facts — stores facts under the delegated host, not the delegating host. 3) Consider a separate
    play targeting the LB group directly instead of delegation, which is cleaner for complex LB configuration. 4) If using
    loops with delegation, each loop iteration delegates independently — variables from the looping host are available, not
    from previous delegates.'
- id: promdive-001
  topic: prometheus_deep_dive
  level: L1
  question: You add a request_id label (unique per request) to your http_requests_total counter. Within hours, Prometheus
    memory spikes and queries slow to a crawl. What happened and how do you fix it?
  answer: 'You caused a cardinality explosion. Every unique label combination creates a new time series. With a unique request_id
    per request, you created millions of series. Prometheus stores each series independently with its own index entry, TSDB
    chunk, and memory overhead. Fix: 1) Remove the request_id label immediately. 2) Wait for old series to fall outside the
    retention window (or compact manually). 3) Use Prometheus metric relabel_configs to drop high-cardinality labels at scrape
    time as a safety net. Prevention: never use unbounded values (IDs, timestamps, emails, URLs) as label values. Bound label
    cardinality to hundreds, not thousands.'
- id: promdive-002
  topic: prometheus_deep_dive
  level: L2
  question: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) returns 0.45s, but your application logs
    show p99 is 0.62s. Why might the Prometheus value be inaccurate?
  answer: 'histogram_quantile interpolates linearly within the bucket that contains the quantile boundary. If your buckets
    are coarse (e.g., 0.1, 0.25, 0.5, 1.0), the p99 falls in the 0.25-0.5 bucket and Prometheus interpolates between those
    boundaries. With wide buckets, the interpolation is imprecise. Additionally: 1) Client-side quantile computation in application
    logs uses exact values; Prometheus uses bucket approximation. 2) The rate() window matters — 5m smooths out spikes that
    instantaneous measurements capture. Fix: add finer-grained buckets around your SLO target (e.g., 0.3, 0.4, 0.5, 0.6, 0.7
    for a 500ms SLO). More buckets = more series = more cost, so be selective.'
- id: promdive-003
  topic: prometheus_deep_dive
  level: L1
  question: A critical dashboard shows 'No Data' for a metric that was present yesterday. The scrape target shows UP. What
    are the most likely causes?
  answer: '1) Metric renamed or labels changed — the PromQL query references old metric/label names. Check /metrics on the
    target directly. 2) Relabel config dropped it — a new relabel_configs or metric_relabel_configs rule accidentally filters
    the metric. 3) Target restart reset counters — rate() over a window where the counter resets can produce NaN if the window
    is too short. 4) Recording rule changed — if the dashboard queries a recording rule, check if the rule was modified. 5)
    Retention expired — if you reduced retention, old data is compacted away. Debug: query the raw metric name in Prometheus
    UI, check the /targets page for scrape errors, and review recent config changes.'
- id: promdive-004
  topic: prometheus_deep_dive
  level: L2
  question: You deploy two Prometheus instances with identical configs for HA. Both fire the same alerts. How does AlertManager
    handle deduplication, and what external_labels should you set?
  answer: 'AlertManager deduplicates alerts based on the alert name + label set. If both Prometheus instances send identical
    alerts (same name, same labels), AlertManager treats them as one alert and sends one notification. Set external_labels
    to distinguish instances: e.g., external_labels: { replica: ''prometheus-1'' } and { replica: ''prometheus-2'' }. But
    then alerts won''t deduplicate because labels differ. The solution: use AlertManager''s group_by to group alerts by labels
    excluding ''replica'', or use Thanos/Cortex ruler for deduplication. In practice: keep external_labels for data identification
    but configure AlertManager grouping to ignore the replica label for notification dedup.'
- id: promdive-005
  topic: prometheus_deep_dive
  level: L1
  question: A counter metric resets to 0 (service restart). Your alert on rate(errors_total[5m]) > 0.1 fires briefly then
    clears. Should you tune the alert to ignore resets?
  answer: 'rate() already handles counter resets — it detects the decrease and treats the new value as a continuation from
    the last known value, not a spike. However, if the window is shorter than two scrape intervals after restart, rate() may
    produce unexpected results (NaN or a spike from extrapolation). The brief firing is likely from the rate calculation during
    the window where only one post-restart sample exists. Fix: 1) Use ''for: 5m'' on the alert to require sustained threshold
    breach. 2) Ensure the rate window is at least 4x the scrape interval. 3) Do NOT use increase() or resets() to try to compensate
    — rate() already accounts for resets correctly.'
- id: promdive-006
  topic: prometheus_deep_dive
  level: L1
  question: You have a PromQL query used in a critical alert that takes 30 seconds to execute across millions of time series.
    How do recording rules help, and how would you set one up?
  answer: 'Recording rules precompute PromQL expressions at regular intervals and store the result as a new time series. Instead
    of computing the expensive query every alert evaluation, the alert references the precomputed metric. Setup: in prometheus.yml
    rules file, add: groups: - name: precomputed, interval: 1m, rules: - record: job:http_errors:rate5m, expr: sum(rate(http_errors_total[5m]))
    by (job). Then alert on job:http_errors:rate5m > threshold. Benefits: alert evaluation drops from 30s to milliseconds,
    Grafana dashboards using the same expression also benefit, and you reduce load on Prometheus during peak query times.
    Trade-off: adds one more time series per recording rule and introduces up to one evaluation-interval of staleness.'
- id: k8ssched-001
  topic: k8s_pods_scheduling
  level: L1
  question: kubectl describe pod shows Pending with event 'Insufficient cpu'. Node CPU usage averages 40%. Why won't the scheduler
    place the pod?
  answer: 'The scheduler uses resource requests, not actual usage, for placement decisions. If nodes have 40% actual CPU usage
    but 95% of CPU is already requested by existing pods, there is no room for new requests even though actual usage is low.
    Check with: kubectl describe node — look at ''Allocated resources'' vs ''Capacity''. The fix depends on the cause: 1)
    Pods are over-requesting (requests >> actual usage) — right-size requests based on actual consumption. 2) Cluster genuinely
    needs more nodes — add capacity. 3) Low-priority pods can be evicted — use PriorityClasses to let the scheduler preempt
    less important pods. Never set requests to 0 as a workaround — this creates BestEffort QoS pods that are first to be evicted
    under pressure.'
- id: k8ssched-002
  topic: k8s_pods_scheduling
  level: L2
  question: Pod A has requests=limits (CPU 500m, memory 256Mi). Pod B has requests (CPU 100m, memory 128Mi) but no limits.
    Pod C has no requests or limits. The node runs out of memory. Which pod is killed first and why?
  answer: Pod C is killed first — it has QoS class BestEffort (no requests, no limits), which is the lowest priority for eviction.
    Pod B is killed next — it has QoS class Burstable (requests set, limits differ or missing). Pod A is killed last — it
    has QoS class Guaranteed (requests == limits for all containers), which is the highest eviction priority. Within the same
    QoS class, Kubernetes kills pods that exceed their requests by the largest margin. Guaranteed pods are only killed if
    the system itself needs memory (kernel, kubelet). This is why production workloads should set requests=limits for predictable
    behavior and eviction protection.
- id: k8ssched-003
  topic: k8s_pods_scheduling
  level: L1
  question: Your readinessProbe fails intermittently. Kubernetes removes the pod from the Service endpoints, causing traffic
    drops. The pod is actually healthy — the probe endpoint is just slow under load. How do you fix this?
  answer: 'Tune the probe parameters: 1) Increase timeoutSeconds (default 1s is too aggressive for a loaded app — try 3-5s).
    2) Increase failureThreshold (default 3 — increase to 5 so transient slowness doesn''t trigger removal). 3) Use a dedicated
    lightweight health endpoint that doesn''t share resources with the main request path. 4) Consider a separate startupProbe
    with generous timeouts for slow-starting apps — this prevents readinessProbe from running during startup. Do NOT remove
    the readinessProbe entirely — that means traffic hits pods that genuinely aren''t ready. The goal is to distinguish ''temporarily
    slow'' from ''genuinely unhealthy''.'
- id: k8ssched-004
  topic: k8s_pods_scheduling
  level: L2
  question: You have a PodDisruptionBudget with minAvailable=2 on a 3-pod Deployment. Cluster autoscaler wants to drain a
    node that runs 2 of your pods. What happens?
  answer: 'The drain is blocked. PDB with minAvailable=2 means at least 2 pods must be available at all times. Draining a
    node with 2 of your 3 pods would leave only 1 running (while the drained pods restart elsewhere), violating the PDB. The
    cluster autoscaler will skip this node or wait. Fix options: 1) Change PDB to maxUnavailable=1 (equivalent intent, but
    autoscaler can proceed if pods are spread correctly). 2) Ensure pods are spread across nodes using topology spread constraints
    or pod anti-affinity so no single node holds more than 1 pod. 3) Increase replicas to 4+ so losing 2 from one node still
    satisfies minAvailable=2. PDBs protect availability but can block infrastructure operations if not paired with good pod
    distribution.'
- id: k8ssched-005
  topic: k8s_pods_scheduling
  level: L1
  question: You create a StatefulSet named 'db' with 3 replicas but forget to create a headless Service. Pod db-0 boots successfully
    but cannot resolve db-1.db.default.svc.cluster.local. Why?
  answer: 'StatefulSets require a headless Service (clusterIP: None) to provide stable DNS names for each pod. Without it,
    Kubernetes does not create the individual pod DNS records (pod-name.service-name.namespace.svc.cluster.local). The StatefulSet
    controller still creates pods with stable names (db-0, db-1, db-2), but DNS resolution fails because no Service owns the
    DNS registration. Create a headless Service with the same name specified in the StatefulSet''s serviceName field. The
    Service selector must match the StatefulSet''s pod labels. After creating the Service, existing pods will get DNS records
    without restart.'
- id: k8ssched-006
  topic: k8s_pods_scheduling
  level: L2
  question: 'Your Deployment rolling update is stuck: 2 new pods are Pending (insufficient resources), 2 old pods are still
    Running. maxSurge=2, maxUnavailable=0. Why can''t the update make progress?'
  answer: 'With maxUnavailable=0, Kubernetes cannot terminate any old pod until a new pod is Ready. With maxSurge=2, it created
    2 new pods (total 6 desired: 4 old + 2 new), but those 2 are Pending because the cluster lacks capacity for 6 simultaneous
    pods. Deadlock: old pods can''t be removed (maxUnavailable=0) and new pods can''t start (no capacity). Fix options: 1)
    Set maxUnavailable=1 — allows killing an old pod to free resources for a new one. 2) Add cluster capacity. 3) Reduce maxSurge
    to 1 and set maxUnavailable=1 for a slower but resource-efficient rollout. The combination maxSurge>0 with maxUnavailable=0
    is dangerous when cluster capacity is tight.'
- id: s3dive-001
  topic: aws_s3_deep_dive
  level: L1
  question: You set a bucket policy denying all public access, but an object was uploaded with a public-read ACL. Can the
    public read that object?
  answer: 'No. An explicit Deny in the bucket policy overrides the public-read ACL. AWS policy evaluation: explicit Deny (from
    any policy) always wins over any Allow. However, relying on policy evaluation order is fragile. The robust fix: enable
    S3 Block Public Access at the bucket or account level. This ignores all public ACLs and public bucket policies regardless
    of what they say. Block Public Access has four settings: BlockPublicAcls (reject PUT with public ACLs), IgnorePublicAcls
    (ignore existing public ACLs), BlockPublicPolicy (reject policies that grant public access), RestrictPublicBuckets (restrict
    cross-account access). Enable all four for any bucket that should never be public.'
- id: s3dive-002
  topic: aws_s3_deep_dive
  level: L1
  question: You enable versioning, upload a file, then delete it. The file disappears from the console (default view). Is
    the data actually gone? How do you recover it?
  answer: 'The data is NOT gone. Deleting a versioned object inserts a ''delete marker'' — a zero-byte version that makes
    the object appear deleted. The previous version still exists. To recover: 1) In the S3 console, toggle ''Show versions''
    to see all versions including the delete marker. 2) Delete the delete marker itself — this restores the most recent previous
    version as the current version. 3) Via CLI: ''aws s3api delete-object --bucket BUCKET --key KEY --version-id DELETE_MARKER_VERSION_ID''.
    Important: this only works if the delete marker hasn''t been permanently deleted (e.g., via lifecycle policy). MFA Delete
    adds an extra protection layer requiring MFA to permanently delete versions.'
- id: s3dive-003
  topic: aws_s3_deep_dive
  level: L2
  question: You start a multipart upload for a 5 GB file but the upload process crashes after uploading 800 of 1000 parts.
    What happens to the uploaded parts, and what do they cost?
  answer: 'The 800 uploaded parts remain in S3 and you are billed for their storage at the standard rate (approximately 4
    GB of storage charges). They are invisible in normal ListObjects calls but consume storage. To find them: ''aws s3api
    list-multipart-uploads --bucket BUCKET''. To clean up: ''aws s3api abort-multipart-upload --bucket BUCKET --key KEY --upload-id
    ID''. Prevention: configure a lifecycle rule to automatically abort incomplete multipart uploads after N days: ''{"Rules":
    [{"ID": "AbortIncomplete", "Status": "Enabled", "AbortIncompleteMultipartUpload": {"DaysAfterInitiation": 7}}]}''. Without
    this rule, orphaned parts accumulate indefinitely and inflate your bill.'
- id: s3dive-004
  topic: aws_s3_deep_dive
  level: L1
  question: You generate a presigned URL valid for 1 hour. A user clicks it at minute 59 and begins downloading a 2 GB file.
    The download takes 20 minutes. Does it complete?
  answer: Yes, it completes. S3 validates the presigned URL's expiration at the time the request is initiated, not during
    data transfer. Once S3 accepts the request (at minute 59, within the 1-hour window), the download stream continues until
    completion regardless of how long the transfer takes. However, if the TCP connection drops and the client retries after
    the expiration time, the retry will fail with 403 Forbidden. This also applies to multipart downloads — each part request
    is validated independently. For very large files, generate URLs with longer expiration or use S3 Transfer Acceleration
    to reduce transfer time.
- id: s3dive-005
  topic: aws_s3_deep_dive
  level: L2
  question: You enable cross-region replication from us-east-1 to eu-west-1. A user writes an object to us-east-1 and immediately
    reads from eu-west-1. They get a 404. Why, and how long should they expect to wait?
  answer: 'Cross-region replication is asynchronous and eventual. The 404 occurs because the object hasn''t replicated yet.
    Typical replication time is seconds to minutes for most objects, but AWS only guarantees that 99.99% of objects replicate
    within 15 minutes (with S3 Replication Time Control / S3 RTC). Without RTC, there is no SLA on replication latency. Large
    objects take longer. Solutions: 1) Enable S3 RTC for predictable 15-minute SLA (additional cost). 2) Design applications
    to tolerate eventual consistency — read from the source region if immediate consistency is required. 3) Use S3 replication
    metrics to monitor lag. Do NOT assume replication is instant — this is a common cause of cross-region application bugs.'
- id: s3dive-006
  topic: aws_s3_deep_dive
  level: L2
  question: 'Your bucket policy has Principal: ''*'' with Allow on s3:GetObject. IAM policies in your account deny S3 access
    for most users. Will the IAM Deny override the bucket policy''s public Allow?'
  answer: 'For same-account access: yes, an explicit Deny in an IAM policy overrides the Allow in the bucket policy. But for
    cross-account or anonymous access: IAM policies in YOUR account don''t apply to external principals. Anonymous users (unauthenticated)
    are not subject to any IAM policy — they only see the bucket policy. So Principal: ''*'' with Allow effectively makes
    the bucket public to the internet, regardless of your IAM Deny policies. The fix: enable S3 Block Public Access (which
    overrides bucket policies granting public access), or change the Principal to specific account ARNs. Never rely on IAM
    Deny to compensate for an overly permissive bucket policy.'
- id: ec2-001
  topic: aws_ec2
  level: L1
  question: Your t3.micro runs at 15% CPU consistently. Initially responsive, after a week it becomes extremely slow. CPU
    metrics show 100% utilization in spikes. What is happening?
  answer: 't3.micro has a CPU baseline of 10%. At 15% sustained usage, you consume credits faster than you earn them. Initially,
    the instance has a starting credit balance (launch credits) that masks the deficit. Once credits deplete, the instance
    is throttled to baseline (10%), causing the slowdown. In ''standard'' mode, the instance cannot burst above baseline with
    zero credits. In ''unlimited'' mode, it can burst but you pay overage charges per vCPU-hour. Diagnosis: check the CPUCreditBalance
    CloudWatch metric — a downward trend toward zero confirms credit exhaustion. Fix: 1) Switch to unlimited mode if bursts
    are occasional. 2) Right-size to a larger t3 or switch to m-family (no credit system) if sustained load exceeds baseline.'
- id: ec2-002
  topic: aws_ec2
  level: L1
  question: You store application state on an i3.large NVMe instance store volume. During an AWS maintenance event, the instance
    is stopped and started on new hardware. Your data is gone. Was this preventable?
  answer: 'Instance store volumes are ephemeral — data is lost on stop, terminate, or host migration. This is by design and
    documented, but commonly overlooked. Preventable: yes. 1) Use EBS volumes for any data that must survive instance lifecycle
    events. 2) If you need instance store performance (high IOPS, low latency), use it as a cache or scratch space with data
    replicated to a durable store (EBS, S3, or another instance). 3) For databases on instance store, use replication (e.g.,
    a replica on another instance) so data survives single-instance loss. The i3 family is designed for high-performance local
    storage workloads that handle data durability at the application layer, not the infrastructure layer.'
- id: ec2-003
  topic: aws_ec2
  level: L2
  question: Your application fetches IAM role credentials from the instance metadata service at http://169.254.169.254. A
    vulnerability in your web app allows SSRF. What is the risk, and how does IMDSv2 mitigate it?
  answer: 'IMDSv1 responds to simple HTTP GET requests. An SSRF vulnerability allows an attacker to make the server request
    http://169.254.169.254/latest/meta-data/iam/security-credentials/ROLE_NAME and exfiltrate temporary IAM credentials (access
    key, secret key, session token). These credentials have the full permissions of the instance role. IMDSv2 mitigates this
    by requiring a session token: first PUT to /latest/api/token with a TTL header (hop limit = 1), then use the token in
    subsequent GET requests. The PUT request''s hop limit of 1 means it cannot traverse a proxy or be forwarded from an SSRF
    — the attacker''s request comes from outside the instance''s network stack and the hop count exceeds 1. Enforce IMDSv2
    by setting HttpTokens=required on the instance.'
- id: ec2-004
  topic: aws_ec2
  level: L1
  question: You need to create a custom AMI from a running instance. What steps should you take before creating the image
    to ensure it is clean and reusable?
  answer: '1) Remove instance-specific state: delete SSH host keys (/etc/ssh/ssh_host_*), clear /tmp, remove cloud-init state
    (rm -rf /var/lib/cloud/instances/*). 2) Remove credentials: delete ~/.aws/credentials, ~/.ssh/authorized_keys for non-default
    users, clear bash history. 3) Generalize the network config: remove /etc/udev/rules.d/70-persistent-net.rules if it exists.
    4) Stop unnecessary services and clear logs if size matters. 5) For the AMI creation: you can create from a running instance
    (AWS takes an EBS snapshot), but stopping the instance first ensures a consistent filesystem state — in-flight writes
    won''t be captured mid-transaction. 6) Tag the AMI with the source commit, build date, and base OS version for traceability.'
- id: ec2-005
  topic: aws_ec2
  level: L2
  question: You have a Reserved Instance for m5.large in us-east-1a. You want to use m5.xlarge in us-east-1b instead. Can
    you modify the RI, and what are the constraints?
  answer: 'You can modify a Standard RI within the same instance family and region. m5.large to m5.xlarge is the same family
    (m5), so the size change is allowed — but you must account for the normalization factor difference (large = 4 units, xlarge
    = 8 units, so one large RI only covers half an xlarge). AZ change within the same region is allowed (us-east-1a to us-east-1b).
    However: you cannot change the instance family (m5 to c5), OS platform (Linux to Windows), or tenancy (shared to dedicated).
    For those changes, you need to sell the RI on the Reserved Instance Marketplace and purchase a new one, or use Savings
    Plans instead which offer more flexibility across instance families.'
- id: ec2-006
  topic: aws_ec2
  level: L1
  question: A Spot Instance running your batch job is interrupted with a 2-minute warning. How do you handle this gracefully
    without losing work?
  answer: '1) Poll the instance metadata endpoint for the interruption notice: GET http://169.254.169.254/latest/meta-data/spot/instance-action
    — returns the action (terminate/stop/hibernate) and time. 2) Use a shutdown script or signal handler: when the notice
    appears, checkpoint current work to S3 or EBS, deregister from the load balancer, and flush logs. 3) Design for resumability:
    store job progress so another instance can resume from the last checkpoint, not restart from scratch. 4) Use Spot Instance
    interruption notices in EventBridge to trigger an external handler (Lambda) that starts a replacement instance before
    the current one terminates. 5) For ECS/EKS: use Spot Instance draining to gracefully remove tasks before termination.
    The 2-minute window is short — your checkpoint logic must be fast.'
- id: awsnet-001
  topic: aws_networking
  level: L1
  question: You create a /24 subnet and plan to run 250 instances. At 251, instance launch fails with 'InsufficientFreeAddressesInSubnet'.
    A /24 has 256 addresses. Where did the other 5 go?
  answer: 'AWS reserves 5 IP addresses in every subnet: 1) Network address (x.x.x.0). 2) VPC router (x.x.x.1). 3) DNS server
    (x.x.x.2). 4) Reserved for future use (x.x.x.3). 5) Broadcast address (x.x.x.255). So a /24 subnet gives 251 usable IPs,
    not 256. This scales with subnet size: a /28 (16 addresses) only has 11 usable. When planning CIDR blocks, account for
    these reservations plus any addresses consumed by load balancers, NAT gateways, and other AWS-managed resources that also
    consume subnet IPs.'
- id: awsnet-002
  topic: aws_networking
  level: L2
  question: Your NACL allows inbound TCP port 443 but does not have an outbound rule for ephemeral ports (1024-65535). HTTPS
    requests from the internet reach your instance but responses never arrive. Why?
  answer: 'NACLs are stateless — they evaluate inbound and outbound traffic independently, unlike Security Groups which are
    stateful. When a client sends a request to port 443, the response goes back on a random ephemeral port (1024-65535). The
    inbound rule allows the request in, but without an outbound rule allowing the ephemeral port range, the response packet
    is dropped by the NACL. Fix: add an outbound NACL rule allowing TCP ports 1024-65535 to 0.0.0.0/0 (or your specific CIDR).
    This is the most common NACL misconfiguration. Security Groups handle this automatically because they track connection
    state — response traffic is automatically allowed.'
- id: awsnet-003
  topic: aws_networking
  level: L1
  question: All private subnets in your VPC route through a single NAT Gateway in us-east-1a. AZ-a has an outage. What happens
    to outbound internet traffic from instances in us-east-1b and us-east-1c?
  answer: 'All outbound internet traffic from private subnets fails because the NAT Gateway in us-east-1a is unavailable.
    NAT Gateways are AZ-scoped resources — they only provide HA within their own AZ. When that AZ goes down, all subnets routing
    through it lose internet access. Fix: deploy one NAT Gateway per AZ and configure each AZ''s route table to use its local
    NAT Gateway. This costs more (NAT Gateway hourly charge per AZ) but provides true AZ independence. For cost savings in
    non-production: accept the single-AZ risk, or use a NAT Instance with a failover script (cheaper but more operational
    overhead).'
- id: awsnet-004
  topic: aws_networking
  level: L1
  question: 'You have two route table entries: 10.0.0.0/8 → Transit Gateway, and 10.0.1.0/24 → VPC Peering. Traffic to 10.0.1.50
    uses which route?'
  answer: The VPC Peering route wins. AWS route tables use longest-prefix match — the most specific (longest) CIDR prefix
    that matches the destination IP is selected. /24 is more specific than /8, so 10.0.1.50 matches 10.0.1.0/24 (VPC Peering).
    Traffic to 10.0.2.50 would match 10.0.0.0/8 (Transit Gateway) because there is no more specific route. If you added 10.0.1.0/25
    → VPN, traffic to 10.0.1.50 (which is in the 10.0.1.0-10.0.1.127 range) would use the /25 VPN route. This is the same
    longest-prefix-match algorithm used in traditional IP routing.
- id: awsnet-005
  topic: aws_networking
  level: L2
  question: You need private access to S3 from instances without internet. What is the difference between a Gateway endpoint
    and an Interface endpoint for S3, and when would you choose each?
  answer: 'Gateway endpoint: free, added as a route table entry, traffic stays on the AWS network, only works for S3 and DynamoDB,
    does not get a private IP (uses S3''s public IP ranges via the route table). Interface endpoint (PrivateLink): costs per
    hour + per GB, creates an ENI with a private IP in your subnet, works for any AWS service, supports DNS resolution to
    the private IP, and can be accessed from on-premises via VPN/Direct Connect. Choose Gateway for: simple S3 access from
    within the VPC (free, no config beyond route table). Choose Interface for: on-premises access to S3 via Direct Connect/VPN,
    when you need a fixed private IP for firewall rules, or when your architecture requires consistent DNS-based routing.
    Most VPCs should have both.'
- id: awsnet-006
  topic: aws_networking
  level: L1
  question: Your Security Group allows all outbound traffic (0.0.0.0/0 on all ports). A compromised EC2 instance begins exfiltrating
    data to an external server. Should you restrict egress rules, and what is the operational trade-off?
  answer: 'Yes, restricting egress is a defense-in-depth best practice. Allow only: 1) HTTPS (443) to known endpoints (AWS
    services, your CDN, package repositories). 2) DNS (53) to VPC resolver (10.0.0.2). 3) Internal traffic to your VPC CIDR.
    Block everything else. Trade-offs: 1) Operational overhead — every new external dependency requires a rule update. 2)
    Debugging difficulty — blocked outbound traffic causes subtle failures. 3) Service discovery — if you use many AWS services,
    you need VPC endpoints to avoid routing through the internet. Compromise: start with allow-all in dev, restrict to known
    destinations in staging/prod. Use VPC Flow Logs to identify required outbound destinations before tightening rules.'
- id: dbint-001
  topic: database_internals
  level: L1
  question: Your primary database has async replication to a replica with 10 minutes of lag. The primary crashes and you promote
    the replica. How much committed data could be lost?
  answer: 'Up to 10 minutes of committed transactions can be lost. With asynchronous replication, the primary acknowledges
    commits before the replica receives them. The replication lag represents the window of data that exists only on the primary.
    When the primary crashes, any transactions committed but not yet replicated are lost. This is the fundamental trade-off
    of async replication: better write performance (no waiting for replica acknowledgment) at the cost of potential data loss
    during failover. For zero data loss: use synchronous replication (every commit waits for replica confirmation), but this
    adds write latency equal to the network round-trip time. Semi-sync is a middle ground — waits for at least one replica
    to acknowledge.'
- id: dbint-002
  topic: database_internals
  level: L2
  question: EXPLAIN ANALYZE shows your query uses an index scan but runtime has doubled over 3 weeks despite no data growth
    or query changes. What is the most likely cause in PostgreSQL?
  answer: 'Table and index bloat from dead tuples. PostgreSQL''s MVCC creates new tuple versions for every UPDATE and DELETE.
    Dead tuples (old versions) accumulate until VACUUM reclaims them. If autovacuum is falling behind or disabled, the table
    and its indexes grow with dead tuples. Index scans visit more pages because the index points to dead tuples interspersed
    with live data, and the table''s physical size increases (more I/O per scan). Diagnosis: check pg_stat_user_tables for
    n_dead_tup and last_autovacuum. Fix: run VACUUM ANALYZE on the table. For severe bloat, pg_repack or VACUUM FULL (but
    VACUUM FULL locks the table). Prevention: tune autovacuum_vacuum_scale_factor and autovacuum_vacuum_cost_delay for tables
    with high update rates.'
- id: dbint-003
  topic: database_internals
  level: L1
  question: 'Two concurrent transactions deadlock: transaction A locks row 1 then requests row 2, transaction B locks row
    2 then requests row 1. The database kills one. How do you prevent this permanently?'
  answer: 'Enforce a consistent lock ordering across all application code — always lock rows in the same order (e.g., by primary
    key ascending). If transaction A and B both lock row 1 first, then row 2, they can never deadlock because they never hold
    conflicting locks. Implementation: 1) Sort the rows to be modified by primary key before beginning the transaction. 2)
    Use SELECT ... FOR UPDATE with ORDER BY to acquire locks in a deterministic sequence. 3) For complex cases, use advisory
    locks to serialize access to related row groups. Detection: monitor pg_stat_activity for lock waits, set deadlock_timeout
    (default 1s) to detect deadlocks quickly, and log_lock_waits=on to record waits in the PostgreSQL log.'
- id: dbint-004
  topic: database_internals
  level: L2
  question: You need to add a NOT NULL constraint to an existing column that has NULL values. You cannot modify the data and
    you cannot take downtime. What is the safe migration path?
  answer: 'Multi-step migration: 1) Add a DEFAULT value for the column (ALTER TABLE ... ALTER COLUMN ... SET DEFAULT ''value''
    — fast, metadata-only in PostgreSQL 11+). 2) Backfill NULLs in batches: UPDATE table SET col = default WHERE col IS NULL
    AND id BETWEEN X AND Y (batched to avoid long locks). 3) Add a CHECK constraint as NOT VALID first: ALTER TABLE ... ADD
    CONSTRAINT ... CHECK (col IS NOT NULL) NOT VALID — this is fast because it doesn''t scan existing rows. 4) VALIDATE the
    constraint: ALTER TABLE ... VALIDATE CONSTRAINT ... — this scans the table but only holds a ShareUpdateExclusiveLock (reads
    and writes continue). If validation passes, you can then add the formal NOT NULL constraint. This approach avoids the
    full table lock that ALTER TABLE ... SET NOT NULL requires.'
- id: dbint-005
  topic: database_internals
  level: L1
  question: All connection pool slots are occupied but pg_stat_activity shows most connections are idle. New requests queue
    and eventually time out. What is happening and how do you fix it?
  answer: 'Connection leak: application code acquires connections from the pool but fails to return them (missing connection.close()
    or context manager). Connections stay open and idle, consuming a pool slot indefinitely. Diagnosis: check pg_stat_activity
    for connections in ''idle'' state with old query_start times — these are leaked connections sitting unused. Fix: 1) Immediate:
    restart the application to release all connections. 2) Set idle_in_transaction_session_timeout in PostgreSQL to kill connections
    that are idle in a transaction too long. 3) Configure the pool''s maxLifetime and idleTimeout to reclaim unused connections
    (e.g., HikariCP maxLifetime=30m, idleTimeout=10m). 4) Fix application code to use try-with-resources or context managers.
    5) Add pool metrics (active/idle/waiting counts) to your monitoring.'
- id: dbint-006
  topic: database_internals
  level: L2
  question: Your database supports point-in-time recovery. You take daily full backups at midnight. At 11am, a developer accidentally
    runs DELETE FROM orders WHERE 1=1. Your RPO is 1 hour. Can you recover to 10:55am?
  answer: 'Yes, if WAL (Write-Ahead Log) archiving is enabled. PITR works by restoring the most recent full backup (midnight)
    and replaying WAL segments up to the target time (10:55am). Steps: 1) Restore the midnight base backup to a new instance.
    2) Configure recovery_target_time = ''2026-03-21 10:55:00'' in the recovery configuration. 3) Start PostgreSQL — it replays
    WAL from midnight to 10:55am, stopping just before the accidental DELETE. 4) Verify the data, then promote the instance.
    Without WAL archiving, you can only recover to the last full backup (midnight) — 11 hours of data lost, violating the
    1-hour RPO. WAL archiving is the critical component that enables PITR granularity down to individual transactions.'
- id: iam-001
  topic: aws_iam
  level: L1
  question: 'A bucket policy allows s3:GetObject for Principal: ''*''. An IAM policy attached to user Alice explicitly denies
    s3:GetObject. Can Alice read objects from the bucket?'
  answer: 'No. An explicit Deny in any policy always overrides an Allow from any other policy. Alice''s IAM Deny takes precedence
    over the bucket policy''s Allow. This is the fundamental rule of AWS policy evaluation: 1) If any policy explicitly Denies,
    the request is denied (final). 2) If any policy explicitly Allows and no policy Denies, the request is allowed. 3) If
    no policy addresses the action, the request is denied by default (implicit deny). However: this only applies to principals
    within the same AWS account. Anonymous (unauthenticated) users are not subject to Alice''s IAM policy — they would still
    be allowed by the bucket policy''s Principal: ''*''. To truly block public access, use S3 Block Public Access.'
- id: iam-002
  topic: aws_iam
  level: L1
  question: Alice in Account-A has an IAM policy allowing sts:AssumeRole for a role in Account-B. She cannot assume it and
    gets AccessDenied. What is missing?
  answer: 'The role in Account-B must have a trust policy (AssumeRolePolicyDocument) that explicitly allows Account-A (or
    Alice specifically) to assume it. Cross-account role assumption requires BOTH sides to agree: 1) The caller''s identity-based
    policy must allow sts:AssumeRole on the target role ARN (Alice has this). 2) The target role''s trust policy must allow
    the caller''s principal (account, user, or role ARN) in its Principal element. Without the trust policy allowing Account-A,
    the AssumeRole call is denied regardless of Alice''s permissions. This two-way handshake prevents one account from unilaterally
    accessing another account''s resources.'
- id: iam-003
  topic: aws_iam
  level: L2
  question: You create a delegated-admin role with a permission boundary that restricts actions to us-east-1. The admin creates
    an EC2 instance in us-west-2. Does it succeed?
  answer: 'No. Permission boundaries set the maximum permissions an IAM entity can have. The effective permissions are the
    intersection of the identity-based policy AND the permission boundary. Even if the delegated-admin role''s identity policy
    allows ec2:RunInstances in all regions, the permission boundary limiting to us-east-1 means the us-west-2 request is outside
    the intersection and is denied. Permission boundaries are designed for exactly this delegation use case: you grant broad
    EC2 management permissions in the identity policy but use the boundary to scope it to specific regions, accounts, or resource
    types. The admin can never exceed the boundary, even if they modify their own identity policies (which the boundary also
    restricts).'
- id: iam-004
  topic: aws_iam
  level: L1
  question: A Lambda function assumes an IAM role and receives temporary credentials. The function runs as a long-running
    batch job (15 minutes, the Lambda max). Halfway through, API calls start failing with ExpiredTokenException. What happened?
  answer: 'Lambda''s default execution role credentials are automatically refreshed by the Lambda runtime and typically last
    for the duration of the invocation (up to 6 hours). ExpiredTokenException in a Lambda usually means: 1) The function manually
    calls sts:AssumeRole to get a DIFFERENT role''s credentials, and those credentials expired (default STS token duration
    is 1 hour, but can be as short as 15 minutes). 2) The assumed role''s maximum session duration is set lower than expected.
    Fix: set DurationSeconds in the AssumeRole call to match your job''s runtime, ensure the role''s MaxSessionDuration allows
    it (default 1 hour, max 12 hours). For Lambda''s own execution role, credentials are managed automatically — you should
    not need to manually assume it.'
- id: iam-005
  topic: aws_iam
  level: L2
  question: Your Organization has an SCP that allows only s3:GetObject and s3:PutObject. An IAM policy in a member account
    grants s3:*. Can a user in that account perform s3:DeleteObject?
  answer: 'No. SCPs set the maximum permissions available to principals in member accounts. They function as a filter, not
    a grant. Even though the IAM policy allows s3:*, the SCP only permits s3:GetObject and s3:PutObject. The effective permission
    is the intersection: only GetObject and PutObject are allowed. s3:DeleteObject is outside the SCP''s allow list, so it
    is implicitly denied. Important nuance: SCPs do not affect the management account, only member accounts. And SCPs do not
    grant permissions — they only restrict what IAM policies in member accounts can allow. You still need both the SCP to
    permit the action AND an IAM policy to explicitly allow it.'
- id: iam-006
  topic: aws_iam
  level: L1
  question: IAM Access Analyzer finds a role with AdministratorAccess that hasn't been used in 90 days. Should you delete
    it immediately?
  answer: 'No. First investigate: 1) Check the role''s last-used data (IAM console > Role > Last activity) — 90 days unused
    could mean it''s for quarterly jobs (DR drills, annual audits, compliance scans). 2) Check if the role is referenced in
    automation (CloudFormation, Terraform, CI/CD) that hasn''t run recently. 3) Check if it''s a break-glass role for emergencies
    — these are intentionally rarely used. Safe approach: 1) Add a Deny-all inline policy to the role (effectively disabling
    it without deleting). 2) Wait 2-4 weeks and monitor for failures. 3) If nothing breaks, delete the role. For AdministratorAccess
    specifically: even if the role is legitimately needed, scope it down to the actual required permissions using the Access
    Advisor''s service-last-accessed data.'
- id: dcoob-001
  topic: oob_management
  level: L1
  question: A server fails to PXE boot. BIOS shows network as first boot device but it falls through to the hard disk. What
    do you check on the DHCP/TFTP side?
  answer: 'PXE boot sequence: NIC sends DHCP Discover → DHCP server responds with IP + next-server (TFTP IP) + filename (boot
    file). Failure points: 1) DHCP server not responding to the NIC''s MAC — check DHCP logs, verify the MAC is in the allowed
    pool or reservation. 2) DHCP response missing next-server or filename options — check dhcpd.conf for the PXE-specific
    options (option 66, option 67). 3) TFTP server unreachable or file missing — verify the boot file path exists on the TFTP
    server and permissions allow read. 4) BIOS vs UEFI mismatch — PXE BIOS expects pxelinux.0, UEFI expects grubx64.efi. If
    the wrong file is served, the boot silently fails. Debug: run tcpdump on the DHCP/TFTP server to see if the NIC''s requests
    arrive and what responses are sent.'
- id: dcoob-001b
  topic: oob_management
  level: L2
  question: Your RAID controller's battery-backed write cache shows 'degraded' status. A firmware update for the RAID controller
    is scheduled. What is the risk, and what should you do before proceeding?
  answer: 'Critical risk: the RAID controller firmware update may require a controller reset or reboot. If the write-back
    cache has uncommitted data and the battery is degraded, that data could be lost during the reset — the battery can''t
    preserve cache contents through a power interruption. Before proceeding: 1) Switch the write policy from write-back to
    write-through (megacli, storcli, or vendor tool) — this bypasses the cache entirely, writes go directly to disk. Performance
    drops but data is safe. 2) Wait for all pending cache flushes to complete. 3) Verify the cache is empty. 4) Proceed with
    the firmware update. 5) After update, replace the battery/capacitor. 6) Switch back to write-back only after the new battery
    is fully charged. Never update RAID firmware with dirty cache and degraded battery.'
- id: dcoob-002
  topic: oob_management
  level: L1
  question: You need console access to a server that is stuck in GRUB during boot. Serial-over-LAN (SOL) is configured but
    you see no GRUB output. How do you enable GRUB to output over the serial console?
  answer: 'GRUB needs explicit serial console configuration. Edit /etc/default/grub: 1) Set GRUB_TERMINAL=''serial console''
    (enables both serial and VGA). 2) Set GRUB_SERIAL_COMMAND=''serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1''.
    3) Add ''console=tty0 console=ttyS0,115200n8'' to GRUB_CMDLINE_LINUX to redirect kernel output to serial. 4) Run grub2-mkconfig
    -o /boot/grub2/grub.cfg to regenerate the config. The SOL connection must match the baud rate (115200). Common mistake:
    configuring only the kernel console but not GRUB itself — you see kernel output but can''t interact with the GRUB menu.
    For UEFI systems, the serial port number may differ (ttyS1 on some Dell servers).'
- id: dcoob-003
  topic: oob_management
  level: L1
  question: A compromised application on a server can reach the BMC management interface at 10.0.0.50. What can an attacker
    do, and how should BMC network access be restricted?
  answer: 'With BMC access, an attacker can: 1) Power cycle the server (denial of service). 2) Access the serial console (see
    boot output, potentially interact with OS login). 3) Mount virtual media (boot from attacker-controlled ISO, install rootkit).
    4) Read hardware sensor data and system event logs (information disclosure). 5) Update firmware (persistent compromise
    surviving OS reinstall). Restrict access: 1) Place BMCs on a dedicated, isolated management VLAN that application servers
    cannot reach. 2) Firewall rules: only management jump hosts can reach BMC IPs. 3) Change default BMC credentials. 4) Disable
    unused BMC services (SNMP, SSH, IPMI-over-LAN if not needed). 5) Use IPMI 2.0 with encryption. 6) Monitor BMC access logs.
    BMC compromise is especially dangerous because it survives OS reinstalls and operates below the OS security boundary.'
- id: dcoob-004
  topic: oob_management
  level: L2
  question: Your Kickstart installation fails halfway through network instability. When you retry, it starts from scratch.
    How do you make unattended provisioning more resilient?
  answer: '1) Use a local mirror: set up a local HTTP/NFS repository on the same subnet so package installation does not depend
    on WAN connectivity. 2) Two-phase provisioning: Kickstart installs only the minimal OS (base packages from local media/PXE),
    then a post-install script (Ansible, cloud-init, or a custom agent) handles application configuration with retry logic.
    3) Cache packages: configure a caching proxy (Squid, Nexus) between the provisioning server and external repos. 4) Idempotent
    post-install: ensure the post-install script can be re-run safely — check state before applying changes. 5) Pre-validate
    network: the Kickstart %pre section can test connectivity before proceeding. 6) Store provisioning state in BMC or IPMI
    OEM fields so a retry knows where the previous attempt stopped.'
- id: dcoob-005
  topic: oob_management
  level: L1
  question: You configure a server's iDRAC IP address using racadm from the host OS. After a hard power cycle, the iDRAC is
    unreachable. What went wrong?
  answer: 'racadm from the host OS modifies the iDRAC configuration via the host-to-BMC interface (typically IPMI over the
    system bus). Some racadm changes require a BMC reset to take effect, and a hard power cycle (pulling power) may interrupt
    the BMC configuration write before it is committed to non-volatile storage. The IP configuration is lost because it was
    in volatile memory during the transition. Prevention: 1) After racadm set, always run ''racadm racreset'' to ensure the
    BMC applies and persists the configuration. 2) Wait for the BMC to come back online and verify the IP with ''racadm getniccfg''.
    3) For initial setup, configure the BMC IP via BIOS/UEFI setup screen (F2 during boot) which writes directly to non-volatile
    storage. 4) Avoid hard power cycles during BMC configuration changes.'
- id: kerntune-001
  topic: linux_kernel_tuning
  level: L1
  question: 'A production server is dropping incoming TCP connections under load. `dmesg` shows ''TCP: request_sock_TCP: Possible
    SYN flooding on port 443''. What sysctl parameters should you check first and why?

    '
  answer: 'Check net.ipv4.tcp_max_syn_backlog (SYN queue size), net.core.somaxconn (listen backlog), and net.ipv4.tcp_syncookies
    (SYN flood protection). If syncookies is 0, enable it. If backlogs are at defaults (128/1024), increase them to match
    the server''s connection rate. Also verify the application''s listen() backlog argument.

    '
  distractor: 'Increase net.ipv4.ip_forward — this is for routing, not connection handling.

    '
- id: kerntune-002
  topic: linux_kernel_tuning
  level: L1
  question: 'After deploying a high-throughput application, you see ''nf_conntrack: table full, dropping packet'' in the logs.
    What happened and how do you fix it?

    '
  answer: 'The conntrack table (used by iptables/nftables for stateful tracking) is exhausted. Check net.netfilter.nf_conntrack_max
    (default ~65536) and increase it. Also reduce timeouts for established connections (net.netfilter.nf_conntrack_tcp_timeout_established)
    if many are long-idle. Monitor with /proc/sys/net/netfilter/nf_conntrack_count.

    '
  distractor: 'Restart the firewall service — this clears the table but drops all tracked connections and does not fix the
    root cause.

    '
- id: kerntune-003
  topic: linux_kernel_tuning
  level: L2
  question: 'You are tuning a database server for large file I/O. What is the difference between vm.dirty_ratio and vm.dirty_background_ratio,
    and what happens if you set dirty_ratio too high?

    '
  answer: 'dirty_background_ratio is the % of memory at which background writeback starts (asynchronous). dirty_ratio is the
    hard limit at which all processes block until writeback catches up (synchronous). Setting dirty_ratio too high allows
    massive dirty page accumulation — when the limit hits, all I/O stalls, causing latency spikes. Typical tuning: background
    5-10%, ratio 20-40%.

    '
  distractor: 'Set both to 0 to disable caching entirely — this would force synchronous writes for every operation, destroying
    throughput.

    '
- id: kerntune-004
  topic: linux_kernel_tuning
  level: L1
  question: 'What does net.core.rmem_max control and when would you increase it?

    '
  answer: 'rmem_max sets the maximum receive socket buffer size that applications can request. Increase it for high-bandwidth
    UDP receivers (metrics collectors, DNS servers, video streaming) or TCP connections with high bandwidth-delay product.
    Pair with rmem_default for the default buffer and net.ipv4.tcp_rmem for TCP auto-tuning range.

    '
  distractor: 'This controls disk read-ahead buffers — that is actually blockdev --setra.

    '
- id: kerntune-005
  topic: linux_kernel_tuning
  level: L2
  question: 'A containerized Java application is being OOM-killed despite the JVM heap being well within limits. What kernel
    memory settings should you investigate?

    '
  answer: 'Check cgroup memory limits (memory.max in cgroup v2). JVM total memory = heap + metaspace + thread stacks + native
    memory + NIO buffers. The cgroup limit applies to all RSS, not just heap. Also check vm.overcommit_memory — if set to
    2, the kernel may deny allocations before the cgroup limit. Increase the cgroup limit or reduce JVM non-heap consumption.

    '
  distractor: 'Increase vm.swappiness — swap can delay OOM but cgroups enforce hard limits regardless of swap unless memory.swap.max
    is also increased.

    '
- id: kerntune-006
  topic: linux_kernel_tuning
  level: L2
  question: 'You need to make sysctl changes persistent across reboots. What are the standard files and precedence order?

    '
  answer: '/etc/sysctl.d/*.conf files are loaded in lexicographic order, then /etc/sysctl.conf is loaded last (highest precedence
    by load order, later values win). Use numbered prefixes (e.g., 99-app.conf) for clarity. Verify with sysctl --system to
    reload all files. Changes via sysctl -w are runtime-only and lost on reboot.

    '
  distractor: 'Put settings in /etc/rc.local — this runs after sysctl.d and would use sysctl -w, but is a legacy approach
    and may not execute on systemd-only systems.

    '
- id: k8ssvc-001
  topic: k8s_services_ingress
  level: L1
  question: 'You create a ClusterIP Service but pods cannot reach it. kubectl get endpoints shows no endpoints. What are the
    most likely causes?

    '
  answer: '1) Label selector mismatch between Service and Pod. 2) Pods are not in Ready state (failed readiness probe). 3)
    Pods are in a different namespace than the Service (and selector does not cross namespaces). 4) No pods matching the selector
    exist at all. Check: kubectl describe svc <name> for selector, kubectl get pods -l <selector> to verify matches.

    '
  distractor: 'The Service needs a LoadBalancer type to work — ClusterIP is the default and works for in-cluster communication.

    '
- id: k8ssvc-002
  topic: k8s_services_ingress
  level: L1
  question: 'What is the difference between a NodePort, ClusterIP, and LoadBalancer Service type, and when would you use each?

    '
  answer: 'ClusterIP (default): internal-only, reachable within the cluster. NodePort: exposes on a static port (30000-32767)
    on every node — useful for on-prem without a cloud LB. LoadBalancer: provisions an external cloud load balancer that routes
    to NodePorts. Use ClusterIP for internal services, LoadBalancer for production external traffic, NodePort for dev/on-prem.

    '
  distractor: 'ExternalName is the type for external traffic — ExternalName is actually a DNS CNAME alias, not a load-balancing
    mechanism.

    '
- id: k8ssvc-003
  topic: k8s_services_ingress
  level: L2
  question: 'You are running an Ingress controller and notice 502 errors during pod rolling updates. What is happening and
    how do you fix it?

    '
  answer: 'The Ingress controller routes to pods that are terminating but still in the endpoints list. Fix: 1) Add a preStop
    hook with sleep (5-10s) to give the endpoints controller time to deregister the pod. 2) Ensure readiness probes fail fast
    on shutdown. 3) Set terminationGracePeriodSeconds high enough for in-flight requests to drain.

    '
  distractor: 'Increase the Ingress controller replica count — more replicas do not solve the pod deregistration race.

    '
- id: k8ssvc-004
  topic: k8s_services_ingress
  level: L2
  question: 'What is the difference between Ingress and Gateway API in Kubernetes, and why was Gateway API created?

    '
  answer: 'Ingress is a simple L7 routing resource (host/path → Service) but lacks standardized support for TCP/UDP, header-based
    routing, traffic splitting, and multi-tenancy. Gateway API introduces separate resources (Gateway, HTTPRoute, GRPCRoute)
    with role-based ownership (infra admin manages Gateway, app teams manage Routes). It is more expressive and portable across
    implementations.

    '
  distractor: 'Gateway API replaces Services entirely — it only replaces Ingress resources; Services still exist for L4 routing.

    '
- id: k8ssvc-005
  topic: k8s_services_ingress
  level: L1
  question: 'How does kube-proxy implement ClusterIP Services using iptables mode?

    '
  answer: 'kube-proxy creates iptables rules that DNAT (destination NAT) traffic sent to the ClusterIP:port to one of the
    backend pod IPs. It uses probability-based rules for load distribution (each endpoint gets 1/N probability). Rules are
    in the nat table, KUBE-SERVICES and KUBE-SVC-* chains. Changes to endpoints trigger iptables rule regeneration.

    '
  distractor: 'kube-proxy runs as a reverse proxy accepting connections — that is the legacy userspace mode, not the default
    iptables mode.

    '
- id: k8ssvc-006
  topic: k8s_services_ingress
  level: L2
  question: 'When should you use headless Services (clusterIP: None) instead of regular ClusterIP Services?

    '
  answer: 'Use headless Services when clients need to discover individual pod IPs (e.g., StatefulSets with stable DNS names,
    databases needing direct connections). DNS returns A records for each pod instead of one virtual IP. Headless Services
    are also used by StatefulSet for stable pod DNS ({pod}.{svc}.{ns}.svc.cluster.local) and by clients implementing their
    own load balancing.

    '
  distractor: 'Headless Services skip kube-proxy entirely for better performance — the primary purpose is DNS-based pod discovery,
    not performance.

    '
- id: sql-001
  topic: sql
  level: L1
  question: 'A query that was fast last week is now slow. EXPLAIN shows a sequential scan instead of an index scan. What are
    the most common causes?

    '
  answer: '1) Table statistics are stale — run ANALYZE. 2) The table has grown and the planner estimates a seq scan is cheaper
    than an index scan for a large result set. 3) Index bloat or corruption. 4) The query predicate changed or uses a function
    that prevents index use. 5) work_mem or other planner settings changed. Always check EXPLAIN ANALYZE for actual vs estimated
    rows.

    '
  distractor: 'Drop and recreate the index immediately — this causes downtime and may not fix the root cause if statistics
    or the query are the problem.

    '
- id: sql-002
  topic: sql
  level: L1
  question: 'What is the difference between a deadlock and a lock wait timeout, and how do you diagnose each in PostgreSQL?

    '
  answer: 'A deadlock is a circular dependency between transactions (A waits for B, B waits for A) — PostgreSQL detects and
    aborts one. A lock wait timeout is a single transaction waiting too long for a lock held by another. Diagnose with: pg_stat_activity
    (waiting queries), pg_locks (held/requested locks), and deadlock detection logs (log_lock_waits = on).

    '
  distractor: 'Increase lock_timeout to avoid deadlocks — lock_timeout only affects wait duration, not circular dependencies.

    '
- id: sql-003
  topic: sql
  level: L2
  question: 'You need to add a NOT NULL column with a default value to a table with 100M rows in PostgreSQL. How do you do
    this without locking the table for minutes?

    '
  answer: 'In PostgreSQL 11+, ALTER TABLE ADD COLUMN ... DEFAULT ... NOT NULL is instant — the default is stored in pg_attribute,
    not written to every row. Rows are backfilled lazily on read/update. For older versions: add the column as nullable, set
    the default, backfill in batches (UPDATE WHERE new_col IS NULL LIMIT 10000), then set NOT NULL.

    '
  distractor: 'Create a new table with the column, copy data, and rename — this is the most disruptive approach and unnecessary
    in modern PostgreSQL.

    '
- id: sql-004
  topic: sql
  level: L1
  question: 'What are the ACID properties of a database transaction and why does each matter?

    '
  answer: 'Atomicity: all operations succeed or all roll back (no partial updates). Consistency: transactions transition the
    database between valid states (constraints enforced). Isolation: concurrent transactions do not interfere (controlled
    by isolation levels). Durability: committed data survives crashes (WAL/redo log). Together they prevent data corruption,
    partial failures, and lost writes.

    '
  distractor: 'ACID only applies to SQL databases — NoSQL databases like MongoDB also support ACID transactions (since 4.0).

    '
- id: sql-005
  topic: sql
  level: L2
  question: 'Explain the difference between READ COMMITTED and REPEATABLE READ isolation levels with a concrete example.

    '
  answer: 'READ COMMITTED: each statement sees the latest committed data. If you SELECT, then another transaction commits
    an INSERT, a second SELECT sees the new row (non-repeatable read). REPEATABLE READ: the transaction sees a snapshot from
    its start. The second SELECT returns the same rows as the first, even if other transactions committed changes. Trade-off:
    REPEATABLE READ can cause serialization failures that need retry logic.

    '
  distractor: 'REPEATABLE READ prevents all anomalies — it still allows phantom reads in some databases (though PostgreSQL''s
    implementation prevents them).

    '
- id: sql-006
  topic: sql
  level: L2
  question: 'What is connection pool exhaustion and how do you diagnose and fix it?

    '
  answer: 'When all connections in the pool are checked out and new requests queue or fail. Diagnose: monitor pool metrics
    (active/idle/waiting counts), check for long-running transactions holding connections (pg_stat_activity with state=''idle
    in transaction''). Fix: increase pool size cautiously, set statement_timeout and idle_in_transaction_session_timeout,
    fix application code that holds connections across slow operations.

    '
  distractor: 'Set max_connections very high on the database — this wastes memory (each connection uses ~10MB) and shifts
    the bottleneck to the database.

    '
- id: k8score-004
  topic: k8s_core
  level: L1
  question: 'A pod is stuck in CrashLoopBackOff. Walk through your diagnostic steps.

    '
  answer: '1) kubectl describe pod — check Events for pull errors, OOM kills, probe failures. 2) kubectl logs <pod> --previous
    — see the crash output from the last container run. 3) Check exit code: 137 = OOM/SIGKILL, 1 = application error. 4) Verify
    resource requests/limits are adequate. 5) Check if liveness probe is killing a slow-starting container (increase initialDelaySeconds).
    6) If image issue, verify imagePullPolicy and registry access.

    '
  distractor: 'Delete the pod immediately — it will just restart with the same crash if the underlying cause is not fixed.

    '
- id: k8score-005
  topic: k8s_core
  level: L2
  question: 'What happens when etcd loses quorum in a 3-node cluster, and how do you recover?

    '
  answer: 'With 2 of 3 nodes down, etcd becomes read-only — no writes, no new pods, no config changes. The API server returns
    errors for mutating requests. Recovery: bring at least one failed node back to restore quorum. If data is lost, restore
    from etcd snapshot (etcdctl snapshot restore). Last resort: recreate the cluster from a single-node snapshot with --force-new-cluster,
    then re-add members.

    '
  distractor: 'Increase replicas to 5 to prevent this — adding members to a cluster that already lost quorum is impossible
    without recovery first.

    '
- id: k8score-006
  topic: k8s_core
  level: L1
  question: 'What is the difference between a Deployment, StatefulSet, and DaemonSet, and when do you choose each?

    '
  answer: 'Deployment: stateless workloads, interchangeable pods, rolling updates. StatefulSet: stateful workloads needing
    stable network identity ({name}-0, -1), ordered deployment/scaling, and persistent volume claims per replica. DaemonSet:
    exactly one pod per node (log collectors, monitoring agents, storage drivers). Choose based on whether pods need identity,
    ordering, or per-node scheduling.

    '
  distractor: 'Use StatefulSet for everything because it is the most capable — StatefulSets add complexity (ordered updates,
    PVC management) that is unnecessary for stateless workloads.

    '
- id: k8score-007
  topic: k8s_core
  level: L2
  question: 'Explain the difference between resource requests and limits in Kubernetes. What happens when a container exceeds
    each?

    '
  answer: 'Requests: the guaranteed minimum — used by the scheduler for placement. A container can use more than requested
    if available. Limits: the hard ceiling. Exceeding CPU limit causes throttling (CFS quota). Exceeding memory limit causes
    OOM kill (exit code 137). Best practice: set requests to actual usage, limits to 1.5-2x requests for CPU, and equal to
    requests for memory (to avoid OOM surprises).

    '
  distractor: 'Set limits equal to requests always — this wastes resources for CPU (throttling is preferable to over-provisioning).

    '
- id: k8score-008
  topic: k8s_core
  level: L1
  question: 'A namespace is stuck in Terminating state. What is causing this and how do you investigate?

    '
  answer: 'Kubernetes waits for all resources in the namespace to be deleted, including finalizers. Check: kubectl get all
    -n <ns> for remaining resources. Check for stuck finalizers: kubectl get ns <ns> -o json | jq ''.spec.finalizers''. Common
    causes: CRDs with finalizers whose controller is already deleted, or PVCs waiting for pod termination. Fix: remove the
    stuck finalizer (edit the namespace resource), but understand what it was protecting first.

    '
  distractor: 'Force delete with kubectl delete ns --force --grace-period=0 — this does not remove the finalizer and the namespace
    will remain stuck.

    '
- id: k8score-009
  topic: k8s_core
  level: L2
  question: 'What is the purpose of the Kubernetes admission controller chain, and name three important built-in admission
    controllers?

    '
  answer: 'Admission controllers intercept API requests after authentication/authorization but before persistence. They can
    mutate (add defaults) or validate (reject bad requests). Important built-ins: 1) LimitRanger: enforces default resource
    requests/limits. 2) PodSecurity: enforces Pod Security Standards (baseline, restricted). 3) ResourceQuota: enforces namespace
    resource caps. Webhook controllers (MutatingAdmissionWebhook, ValidatingAdmissionWebhook) allow custom policies.

    '
  distractor: 'Admission controllers run on the kubelet — they run in the API server, not on nodes.

    '
- id: docker-004
  topic: docker
  level: L1
  question: 'Your Docker image is 1.2GB. What are the most effective strategies to reduce its size?

    '
  answer: '1) Use a smaller base image (alpine, distroless, or scratch). 2) Multi-stage builds: compile in a fat builder stage,
    copy only the binary to a minimal final stage. 3) Combine RUN commands to reduce layers and clean caches in the same layer
    (apt-get install && rm -rf /var/lib/apt/lists/*). 4) Use .dockerignore to exclude build artifacts. 5) Pin specific package
    versions to avoid pulling unnecessary dependencies.

    '
  distractor: 'Use docker image prune to reduce size — this removes unused images from the host but does not change the image
    itself.

    '
- id: docker-005
  topic: docker
  level: L2
  question: 'Explain the difference between COPY and ADD in a Dockerfile. When should you use each?

    '
  answer: 'COPY simply copies files/directories from build context to image. ADD does the same but also auto-extracts tar
    archives and can fetch URLs. Best practice: always use COPY unless you specifically need tar extraction. ADD''s implicit
    behaviors make builds less predictable. For URL fetching, prefer RUN curl/wget for better caching control and error handling.

    '
  distractor: 'ADD is always faster because it is a newer command — both have the same performance; ADD just has extra implicit
    behaviors.

    '
- id: docker-006
  topic: docker
  level: L1
  question: 'A container exits immediately after docker run. How do you debug it?

    '
  answer: '1) docker logs <container> — check stdout/stderr for crash output. 2) docker inspect <container> — check State.ExitCode
    and State.OOMKilled. 3) Run interactively: docker run -it <image> /bin/sh to get a shell. 4) Override entrypoint: docker
    run --entrypoint /bin/sh <image> if the entrypoint crashes. 5) Check if the CMD/ENTRYPOINT expects a foreground process
    — containers exit when PID 1 exits.

    '
  distractor: 'Use docker restart to fix it — if the process crashes on start, restart will just trigger the same crash loop.

    '
- id: docker-007
  topic: docker
  level: L2
  question: 'What is the difference between a Docker volume and a bind mount, and when should you prefer each?

    '
  answer: 'Volumes: managed by Docker, stored in /var/lib/docker/volumes/, portable across hosts, support volume drivers (NFS,
    cloud storage). Bind mounts: map a specific host path into the container, useful for development (live code reload) but
    tightly couple to host filesystem. Prefer volumes for production data (databases, persistent state); use bind mounts for
    development and config files.

    '
  distractor: 'Bind mounts are faster because they bypass Docker''s storage driver — both use the host filesystem; the performance
    difference is negligible.

    '
- id: docker-008
  topic: docker
  level: L2
  question: 'How does Docker layer caching work, and how do you structure a Dockerfile to maximize cache hits?

    '
  answer: 'Each instruction creates a layer. Docker caches layers and reuses them if the instruction and all previous layers
    are unchanged. Cache-busting happens when any file referenced by COPY/ADD changes. Best practice: 1) Put rarely-changing
    instructions first (FROM, system packages). 2) Copy dependency files (package.json, requirements.txt) before source code.
    3) Install dependencies in a separate RUN before COPY . to avoid reinstalling on every code change.

    '
  distractor: 'Use --no-cache on every build to ensure fresh layers — this defeats the purpose of caching and makes builds
    much slower.

    '
- id: docker-009
  topic: docker
  level: L1
  question: 'What is the difference between CMD and ENTRYPOINT in a Dockerfile?

    '
  answer: 'ENTRYPOINT defines the executable that always runs. CMD provides default arguments to ENTRYPOINT (or is the default
    command if no ENTRYPOINT). docker run <image> <args> overrides CMD but not ENTRYPOINT. Use ENTRYPOINT for the main binary,
    CMD for default flags. Use exec form ["binary", "arg"] not shell form to ensure proper signal handling (PID 1 receives
    SIGTERM).

    '
  distractor: 'CMD and ENTRYPOINT are interchangeable — they serve different roles; CMD is overridable while ENTRYPOINT is
    not (without --entrypoint).

    '
- id: linnet-003
  topic: linux_networking
  level: L1
  question: 'A server has two network interfaces but only one is reachable from the network. What are the most common causes?

    '
  answer: '1) Missing or incorrect default gateway — only one default route exists, traffic exits the wrong interface. 2)
    Reverse path filtering (rp_filter=1) drops packets arriving on an unexpected interface. 3) Missing IP address or wrong
    subnet mask on the second interface. 4) Cable/switch port issue. Diagnose: ip route show for routing table, ip addr for
    interface config, ping from each interface explicitly (ping -I).

    '
  distractor: 'Linux cannot use two interfaces simultaneously — it can, but requires correct routing (policy routing or separate
    routing tables per interface).

    '
- id: linnet-004
  topic: linux_networking
  level: L2
  question: 'Explain the difference between ip route, ip rule, and ip tables in the Linux networking stack. When does each
    apply?

    '
  answer: 'ip route: defines routing table entries (where to send packets based on destination). ip rule: policy routing —
    selects which routing table to consult based on source IP, mark, or interface (multiple routing tables). iptables: packet
    filtering/mangling in netfilter — operates on packets traversing the network stack (filter, nat, mangle tables). Order:
    routing decision first, then netfilter hooks (PREROUTING, FORWARD, POSTROUTING).

    '
  distractor: 'iptables handles routing — iptables handles filtering/NAT; the routing decision is made by the kernel''s routing
    subsystem separately.

    '
- id: linnet-005
  topic: linux_networking
  level: L1
  question: 'What does the ss command show that netstat does not, and why is ss preferred?

    '
  answer: 'ss reads directly from kernel socket data structures (via netlink) instead of parsing /proc/net/tcp, making it
    much faster on servers with thousands of connections. ss also shows TCP state details (cwnd, rtt, retransmissions) with
    -i flag, socket memory usage with -m, and supports powerful filtering: ss -tn state established ''( dport = :443 )''.
    netstat is deprecated on modern Linux.

    '
  distractor: 'ss requires root privileges — ss works for unprivileged users for their own connections; root sees all.

    '
- id: linnet-006
  topic: linux_networking
  level: L2
  question: 'How do Linux network namespaces work, and how are they used in container networking?

    '
  answer: 'A network namespace provides an isolated network stack: its own interfaces, routing tables, iptables rules, and
    /proc/net. Containers each get a namespace. A veth pair connects the container namespace to the host (or a bridge): one
    end inside the container, one end on the host bridge (docker0, cni0). Traffic between containers traverses the bridge;
    external traffic uses NAT (MASQUERADE) on the host.

    '
  distractor: 'Network namespaces are Docker-specific — they are a Linux kernel feature used by all container runtimes (Docker,
    Podman, containerd, CRI-O).

    '
- id: linnet-007
  topic: linux_networking
  level: L1
  question: 'What is the difference between TCP and UDP, and give one use case where UDP is clearly better than TCP?

    '
  answer: 'TCP: connection-oriented, reliable, ordered delivery with congestion control. UDP: connectionless, no delivery
    guarantees, no ordering, no congestion control. UDP is better for DNS queries (single request-response, no connection
    overhead), real-time video/voice (late packets are useless, retransmission adds latency), and service discovery (broadcast/multicast
    not possible with TCP).

    '
  distractor: 'UDP is always faster — TCP can achieve similar throughput; UDP avoids overhead but the application must handle
    packet loss.

    '
- id: linnet-008
  topic: linux_networking
  level: L2
  question: 'You suspect packet loss between two hosts. Walk through your diagnosis using Linux networking tools.

    '
  answer: '1) ping/mtr: measure loss rate and identify which hop drops packets. 2) tcpdump on both ends: compare sent vs received
    packets to locate the drop point. 3) ip -s link: check interface error/drop counters. 4) ethtool -S: check NIC-level statistics
    (rx_drops, rx_missed). 5) netstat -s/nstat: check protocol-level errors (TCP retransmissions, UDP receive errors). 6)
    Check dmesg for NIC ring buffer overruns or driver errors.

    '
  distractor: 'Use traceroute — traceroute shows path but not packet loss rates; mtr is the better tool for this.

    '
- id: linhard-004
  topic: linux_hardening
  level: L1
  question: 'What are the first five security hardening steps you would perform on a freshly provisioned Linux server?

    '
  answer: '1) Update all packages (apt upgrade / yum update). 2) Disable root SSH login (PermitRootLogin no in sshd_config).
    3) Enable SSH key-only authentication (PasswordAuthentication no). 4) Configure a host firewall (allow only needed ports).
    5) Enable and configure automatic security updates (unattended-upgrades on Debian, dnf-automatic on RHEL). Also: remove
    unnecessary packages, enable auditd, set umask 027.

    '
  distractor: 'Install antivirus first — Linux servers rarely need AV; the listed steps address the most common attack vectors.

    '
- id: linhard-005
  topic: linux_hardening
  level: L2
  question: 'How does the Linux kernel''s seccomp mechanism restrict container syscalls, and what happens when a blocked syscall
    is attempted?

    '
  answer: 'seccomp-bpf applies a BPF filter to every syscall a process makes. The filter inspects the syscall number and arguments
    and returns an action: ALLOW, KILL (SIGSYS), ERRNO (return error), TRACE (notify tracer), or LOG. Container runtimes apply
    a default seccomp profile blocking ~44 dangerous syscalls (e.g., reboot, mount, kexec_load). A blocked call returns EPERM
    or kills the process depending on the profile''s default action.

    '
  distractor: 'seccomp only works with SELinux enabled — seccomp is independent of SELinux/AppArmor; they are separate security
    layers.

    '
- id: linhard-006
  topic: linux_hardening
  level: L1
  question: 'What is the purpose of SSH key passphrase and ssh-agent, and why should you use both?

    '
  answer: 'A passphrase encrypts the private key file at rest — if stolen, it cannot be used without the passphrase. ssh-agent
    holds decrypted keys in memory so you enter the passphrase once per session, not per connection. Together: the key is
    protected on disk, and agent forwarding (ssh -A) lets you authenticate through jump hosts without copying the private
    key. Use ForwardAgent cautiously — a compromised jump host can use your agent.

    '
  distractor: 'ssh-agent replaces the need for a passphrase — the agent caches the passphrase but does not eliminate the need
    to set one.

    '
- id: linhard-007
  topic: linux_hardening
  level: L2
  question: 'What are SUID/SGID bits and why are they a security concern? How do you find and audit them?

    '
  answer: 'SUID (set user ID) makes a binary run as its owner (often root) regardless of who executes it. SGID does the same
    for group. Security concern: a vulnerable SUID-root binary gives any user root code execution. Audit: find / -perm -4000
    -type f (SUID), find / -perm -2000 -type f (SGID). Remove SUID from unnecessary binaries (chmod u-s). Common legitimate
    SUID: passwd, sudo, ping (older kernels).

    '
  distractor: 'Remove SUID from all binaries — removing it from sudo and passwd will break normal system operation.

    '
- id: linhard-008
  topic: linux_hardening
  level: L1
  question: 'How do you disable unused network services and verify nothing unexpected is listening?

    '
  answer: '1) List listening ports: ss -tlnp (TCP) and ss -ulnp (UDP). 2) Identify each service by PID/program. 3) Disable
    unnecessary services: systemctl disable --now <service>. 4) Remove the package if the service is never needed. 5) Verify
    with nmap from an external host to check what is actually reachable. Common unnecessary listeners: cups, avahi-daemon,
    rpcbind.

    '
  distractor: 'Block all ports in iptables and open them as needed — this can lock you out; always verify SSH access first
    and identify what is needed before restricting.

    '
- id: linhard-009
  topic: linux_hardening
  level: L2
  question: 'What is the principle of least privilege and how does it apply to Linux file permissions, sudo, and capabilities?

    '
  answer: 'Least privilege: every process/user should have only the permissions needed. File permissions: set restrictive
    modes (640 for config, 750 for scripts), use groups instead of world-readable. sudo: grant specific commands (user ALL=(ALL)
    /usr/bin/systemctl restart myapp) not blanket ALL. Capabilities: instead of running a binary as root, grant only the needed
    capability (setcap cap_net_bind_service+ep for binding port 80). Each layer reduces the blast radius of compromise.

    '
  distractor: 'Use root for all administration to avoid permission issues — this violates least privilege and means any compromised
    process has full system access.

    '
- id: corpit-001
  topic: corporate_it
  level: L1
  question: 'Your company uses Active Directory for centralized auth. A new developer cannot access the internal wiki. Where
    do you check first?

    '
  answer: 'Check the user''s AD group membership — the wiki likely restricts access by AD security group. Verify the user
    is in the correct group and that the group has the required permissions.

    '
  distractor: 'Restart the wiki server to refresh user sessions

    '
- id: corpit-002
  topic: corporate_it
  level: L1
  question: 'A ticket says ''Outlook keeps asking for my password.'' What are two common causes in a Microsoft 365 environment?

    '
  answer: '1) Expired or changed password not synced to cached credentials. 2) Conditional Access policy blocking the client
    (e.g., non-compliant device). Fix: clear cached credentials, re-authenticate, check Conditional Access logs.

    '
  distractor: 'Reinstall Outlook from scratch

    '
- id: corpit-003
  topic: corporate_it
  level: L2
  question: 'Your org uses SAML SSO for all SaaS apps. After rotating the IdP signing certificate, users cannot log into Salesforce.
    What happened?

    '
  answer: 'The new IdP certificate was not uploaded to Salesforce''s SSO configuration. Salesforce is rejecting SAML assertions
    signed with the new certificate because it still trusts only the old certificate.

    '
  distractor: 'Salesforce''s SSL certificate expired

    '
- id: corpit-004
  topic: corporate_it
  level: L2
  question: 'A department requests a new shared network drive. What infrastructure and permission considerations should you
    address?

    '
  answer: 'Provision storage on a file server or NAS, create an AD security group for the department, assign NTFS/share permissions
    via the group (not individual users), map the drive via Group Policy, and document the share path and retention policy.

    '
  distractor: 'Install a separate file server in the department office

    '
- id: corpit-005
  topic: corporate_it
  level: L1
  question: 'Why should you avoid using personal email accounts for corporate SaaS tool registration?

    '
  answer: 'Personal accounts bypass corporate identity governance — the company loses control of the account when the employee
    leaves, cannot enforce MFA/SSO policies, and may lose access to data stored in that account.

    '
  distractor: 'Personal email is slower than corporate email

    '
- id: corpit-006
  topic: corporate_it
  level: L2
  question: 'Your MDM console shows 30% of company laptops have not applied the latest OS security patch. What remediation
    steps do you take?

    '
  answer: '1) Check MDM compliance policies — ensure patch deployment is mandatory. 2) Identify non-compliant devices and
    their status (offline, deferred, failed). 3) Escalate persistently offline devices. 4) Set a compliance deadline after
    which non-compliant devices lose VPN/SSO access.

    '
  distractor: 'Manually visit each user and patch their laptop

    '
- id: bin-001
  topic: binary
  level: L1
  question: 'A log shows a file size of 0x400 bytes. How many bytes is that in decimal?

    '
  answer: '1024 bytes (1 KB). 0x400 = 4 × 16² = 4 × 256 = 1024. Recognizing common hex values like 0x100 (256), 0x400 (1024),
    0x1000 (4096) speeds up debugging.

    '
  distractor: '400 bytes

    '
- id: bin-002
  topic: binary
  level: L1
  question: 'What is a bitmask and how would you use one to check if bit 3 is set in a byte?

    '
  answer: 'A bitmask is a value used with bitwise AND to isolate specific bits. To check bit 3: result = value & 0x08 (binary
    00001000). If result is non-zero, bit 3 is set.

    '
  distractor: 'Use modulo division by 3

    '
- id: bin-003
  topic: binary
  level: L2
  question: 'A C struct has a char (1 byte), an int (4 bytes), and a char (1 byte). Why might sizeof report 12 instead of
    6?

    '
  answer: 'The compiler adds 3 bytes of padding after the first char to align the int on a 4-byte boundary, and 3 bytes after
    the second char to align the struct size to 4 bytes. Total: 1+3+4+1+3 = 12.

    '
  distractor: 'The compiler uses 64-bit chars

    '
- id: bin-004
  topic: binary
  level: L2
  question: 'You are debugging a network protocol and see bytes arriving in big-endian order on a little-endian x86 machine.
    What function converts them?

    '
  answer: 'Use ntohs() for 16-bit or ntohl() for 32-bit values (network-to-host byte order). These functions swap bytes on
    little-endian machines and are no-ops on big-endian machines.

    '
  distractor: 'Use printf to reverse the string

    '
- id: bin-005
  topic: binary
  level: L1
  question: 'What is the difference between signed and unsigned integer overflow behavior in C?

    '
  answer: 'Unsigned overflow wraps around predictably (modular arithmetic). Signed overflow is undefined behavior in C — the
    compiler may optimize assuming it never happens, which can cause subtle bugs.

    '
  distractor: 'Both are always safe and wrap around

    '
- id: bin-006
  topic: binary
  level: L2
  question: 'A configuration flag byte uses individual bits for features. How do you enable bit 0 and bit 2 simultaneously
    without affecting other bits?

    '
  answer: 'Use bitwise OR: flags |= 0x05 (binary 00000101). This sets bits 0 and 2 while leaving all other bits unchanged.
    To clear those bits: flags &= ~0x05.

    '
  distractor: 'Set flags = 5 to replace all bits

    '
- id: linmem-001
  topic: linux_memory_management
  level: L1
  question: 'What does the OOM killer do and how does it choose which process to kill?

    '
  answer: 'The OOM (Out Of Memory) killer terminates processes when the system runs out of memory. It scores processes based
    on memory usage, oom_score_adj, and other factors — the highest-scoring process is killed first.

    '
  distractor: 'It swaps all processes to disk

    '
- id: linmem-002
  topic: linux_memory_management
  level: L2
  question: 'What is the difference between RSS and VSZ in ps output?

    '
  answer: 'RSS (Resident Set Size) is the physical memory currently in use by the process. VSZ (Virtual Size) is the total
    virtual address space, including mapped-but-not-loaded pages, shared libraries, and swap. RSS ≤ VSZ.

    '
  distractor: 'RSS includes swap space usage

    '
- id: linmem-003
  topic: linux_memory_management
  level: L1
  question: 'Why does Linux show very little ''free'' memory even when the system is not under load?

    '
  answer: 'Linux aggressively uses free memory for disk cache (buffer/cache). This memory is reclaimable — the kernel releases
    it immediately when applications need it. The ''available'' column in free -h shows truly usable memory.

    '
  distractor: 'The kernel has a memory leak

    '
- id: linmem-004
  topic: linux_memory_management
  level: L2
  question: 'What is vm.swappiness and how does changing it affect system behavior?

    '
  answer: 'vm.swappiness (0-200, default 60) controls how aggressively the kernel swaps anonymous pages vs. reclaiming page
    cache. Lower values prefer keeping application memory in RAM; higher values allow more swapping. Setting 0 does not disable
    swap.

    '
  distractor: 'Setting swappiness to 0 disables swap completely

    '
- id: linmem-005
  topic: linux_memory_management
  level: L2
  question: 'Explain the difference between anonymous memory and file-backed memory in Linux.

    '
  answer: 'File-backed memory maps to files on disk (code, libraries, mmap''d files) — it can be reclaimed by dropping the
    cache and re-reading from disk. Anonymous memory (heap, stack, tmpfs) has no file backing and must be swapped to reclaim.

    '
  distractor: 'Anonymous memory is always in swap

    '
- id: linmem-006
  topic: linux_memory_management
  level: L1
  question: 'What does ''free -h'' show in the buff/cache column and why is it important?

    '
  answer: 'buff/cache shows memory used for disk I/O buffers and file page cache. This is reclaimable memory that speeds up
    disk reads. The ''available'' field = free + reclaimable cache, which is the real measure of usable memory.

    '
  distractor: 'It shows memory used by running applications

    '
- id: claude-001
  topic: claude_code
  level: L1
  question: 'What is the difference between Claude Code''s Read tool and using cat in the Bash tool?

    '
  answer: 'The Read tool provides structured file reading with line numbers, handles images/PDFs, respects permissions, and
    gives better UX. Bash cat is raw — no line numbers, no image support, and less user-friendly for code review.

    '
  distractor: 'There is no difference; they are identical

    '
- id: claude-002
  topic: claude_code
  level: L2
  question: 'How do you configure Claude Code to automatically run commands before or after tool calls?

    '
  answer: 'Use hooks in settings.json — configure pre/post hooks that run shell commands in response to tool call events.
    Hooks can validate, lint, or notify based on what tool was called and its parameters.

    '
  distractor: 'Write the commands in CLAUDE.md

    '
- id: claude-003
  topic: claude_code
  level: L1
  question: 'What is the purpose of CLAUDE.md files and how does precedence work?

    '
  answer: 'CLAUDE.md files provide project-specific instructions to Claude Code. Precedence: direct user instruction > nearest
    subtree CLAUDE.md > repo root CLAUDE.md > workspace root CLAUDE.md. More local wins.

    '
  distractor: 'CLAUDE.md files are only for documentation

    '
- id: claude-004
  topic: claude_code
  level: L2
  question: 'When should you use the Agent tool vs. direct Grep/Glob calls in Claude Code?

    '
  answer: 'Use Grep/Glob for simple, directed searches (specific file, class, function). Use Agent for broader exploration
    requiring multiple rounds of search, or for parallelizing independent research tasks that might overwhelm the main context.

    '
  distractor: 'Always use Agent for every search

    '
- id: claude-005
  topic: claude_code
  level: L1
  question: 'How does Claude Code handle file edits — what is the difference between Edit and Write tools?

    '
  answer: 'Edit makes targeted string replacements (sends only the diff). Write overwrites the entire file. Prefer Edit for
    modifications to preserve context and minimize risk. Use Write only for new files or complete rewrites.

    '
  distractor: 'Write is always preferred because it is faster

    '
- id: claude-006
  topic: claude_code
  level: L2
  question: 'What is the purpose of the TodoWrite tool in Claude Code and when should you use it?

    '
  answer: 'TodoWrite creates a structured task list for tracking progress on complex, multi-step tasks. Use it when a task
    requires 3+ steps, the user provides multiple tasks, or you need to demonstrate progress. Skip for trivial single-step
    tasks.

    '
  distractor: 'TodoWrite saves tasks to disk for the next session

    '
- id: clouddive-001
  topic: cloud_deep_dive
  level: L1
  question: 'What is the shared responsibility model in cloud computing?

    '
  answer: 'The cloud provider secures the infrastructure (physical, network, hypervisor). The customer secures what they put
    in the cloud (data, IAM, app config, OS patches on VMs). The exact split depends on the service model (IaaS vs PaaS vs
    SaaS).

    '
  distractor: 'The cloud provider is responsible for everything

    '
- id: clouddive-002
  topic: cloud_deep_dive
  level: L2
  question: 'A microservice running on ECS Fargate suddenly has high latency. What three things do you check first?

    '
  answer: '1) Task CPU/memory metrics — is the container resource-constrained? 2) Target group health checks — are instances
    being deregistered? 3) VPC flow logs and security groups — is there a network bottleneck or dropped traffic?

    '
  distractor: 'Restart all ECS tasks simultaneously

    '
- id: clouddive-003
  topic: cloud_deep_dive
  level: L2
  question: 'What is the difference between horizontal and vertical scaling in cloud environments, and when do you prefer
    each?

    '
  answer: 'Vertical scaling (bigger instance) is simpler but has an upper limit. Horizontal scaling (more instances) has no
    ceiling but requires stateless design and load balancing. Prefer horizontal for web/API tiers; vertical for databases
    that are hard to shard.

    '
  distractor: 'Vertical scaling is always better because it avoids complexity

    '
- id: clouddive-004
  topic: cloud_deep_dive
  level: L1
  question: 'Why should you tag all cloud resources, and what are three useful tag keys?

    '
  answer: 'Tags enable cost allocation, access control, and automation. Useful keys: Environment (prod/staging/dev), Team/Owner
    (who pays and maintains), Service (which application). Untagged resources are invisible to governance tools.

    '
  distractor: 'Tags are only decorative and have no functional purpose

    '
- id: clouddive-005
  topic: cloud_deep_dive
  level: L2
  question: 'Your team receives a $50K monthly AWS bill. How do you identify the top cost drivers?

    '
  answer: 'Use AWS Cost Explorer with grouping by service, then drill into the top service by usage type. Check: reserved
    vs on-demand instance usage, data transfer costs (often hidden), and unused/idle resources (EBS volumes, old snapshots,
    idle NAT gateways).

    '
  distractor: 'Shut down all non-production accounts immediately

    '
- id: clouddive-006
  topic: cloud_deep_dive
  level: L2
  question: 'What is a VPC peering connection and what is its main limitation?

    '
  answer: 'VPC peering connects two VPCs for private IP communication without traversing the public internet. Main limitation:
    peering is non-transitive — if VPC A peers with B and B peers with C, A cannot reach C through B. Use Transit Gateway
    for hub-and-spoke.

    '
  distractor: 'VPC peering allows unlimited transitive routing

    '
- id: secscan-005
  topic: security_scanning
  level: L1
  question: 'What is the difference between SAST and DAST in application security?

    '
  answer: 'SAST (Static) analyzes source code without running it — finds code-level flaws early. DAST (Dynamic) tests the
    running application — finds runtime issues like injection and misconfigs. Both are complementary; use both in CI/CD.

    '
  distractor: 'SAST is always more accurate than DAST

    '
- id: secscan-006
  topic: security_scanning
  level: L2
  question: 'Your container image scan shows a critical CVE in a base image package you don''t directly use. How do you assess
    the real risk?

    '
  answer: 'Check: 1) Is the vulnerable code reachable from your application? 2) Is the vulnerable function called? 3) Is the
    attack vector exposed (network vs local)? Many CVEs are not exploitable in your specific context. Rebuild with patched
    base if feasible; document risk acceptance if not.

    '
  distractor: 'Immediately rebuild all containers regardless of context

    '
- id: secscan-007
  topic: security_scanning
  level: L1
  question: 'What does a Software Bill of Materials (SBOM) contain and why is it valuable?

    '
  answer: 'An SBOM lists all software components (direct + transitive dependencies), their versions, and licenses. It enables:
    vulnerability tracking across your fleet, license compliance, and rapid response when a new CVE affects a common library.

    '
  distractor: 'An SBOM is a backup of your source code

    '
- id: secscan-008
  topic: security_scanning
  level: L2
  question: 'How would you integrate dependency vulnerability scanning into a CI/CD pipeline without blocking every build?

    '
  answer: 'Run the scanner on every PR. Block on critical/high CVEs with known exploits. Warn on medium/low. Allow a grace
    period for newly disclosed CVEs. Maintain an allowlist for accepted risks with expiry dates. This balances security with
    developer velocity.

    '
  distractor: 'Block all builds until every CVE is resolved

    '
- id: secscan-009
  topic: security_scanning
  level: L2
  question: 'What is infrastructure-as-code scanning and name two tools that do it?

    '
  answer: 'IaC scanning checks Terraform, CloudFormation, Helm charts etc. for security misconfigurations (public S3 buckets,
    missing encryption, overly permissive IAM) before deployment. Tools: Checkov, tfsec, Trivy (also does IaC), KICS.

    '
  distractor: 'IaC scanning checks code syntax only

    '
- id: secscan-010
  topic: security_scanning
  level: L1
  question: 'Why is it important to scan container images in the registry, not just during build?

    '
  answer: 'New CVEs are disclosed after build time. Registry scanning continuously re-evaluates stored images against updated
    vulnerability databases. This catches newly-discovered vulnerabilities in already-deployed images.

    '
  distractor: 'Registry scanning is only needed for public images

    '
- id: dnf-001
  topic: dnf
  level: L1
  question: On RHEL 8+, what happens when you run the `yum` command?
  answer: yum is a symlink to dnf on RHEL 8+. Running yum actually executes dnf (yum4). The syntax is compatible, but the
    underlying dependency solver is libsolv instead of yum3's custom Python solver.
  distractor: yum and dnf are completely separate tools that can be used interchangeably
- id: dnf-002
  topic: dnf
  level: L1
  question: How do you apply only security updates with dnf, and why is this important during a patch window?
  answer: dnf update --security — installs only packages with security advisories. Add --sec-severity=Critical to filter further.
    This prevents pulling in feature updates or major version bumps that could introduce breaking changes during a maintenance
    window.
  distractor: dnf update automatically applies only security patches by default
- id: dnf-003
  topic: dnf
  level: L2
  question: What is a dnf module stream, and what happens when you enable one?
  answer: A module stream is a version track (e.g., postgresql:15 vs :16). Enabling a stream makes packages from other streams
    invisible to the solver. This is sticky — it persists until you explicitly reset the module. Switching streams requires
    a reset, which can remove installed packages.
  distractor: Module streams are just aliases for different repos
- id: dnf-004
  topic: dnf
  level: L1
  question: What is the difference between `dnf history undo 42` and `dnf history rollback 42`?
  answer: undo 42 reverses only the changes made in transaction 42. rollback 42 reverses ALL transactions after 42, restoring
    the system to the state immediately after transaction 42 completed. Rollback is more aggressive and affects multiple transactions.
  distractor: undo and rollback are synonyms in dnf
- id: dnf-005
  topic: dnf
  level: L1
  question: How does dnf versionlock work, and where is the lock configuration stored?
  answer: dnf versionlock add <package> pins a package at its current version. The lock is stored in /etc/dnf/plugins/versionlock.list.
    While locked, dnf update skips that package. Remove with dnf versionlock delete <package>. Requires dnf-plugin-versionlock.
  distractor: versionlock modifies the RPM database directly to prevent updates
- id: dnf-006
  topic: dnf
  level: L2
  question: Why can `dnf autoremove` break applications that were installed with `rpm -i`?
  answer: 'rpm -i does not register the package as user-installed in dnf''s database. Its dependencies appear as orphaned
    autoremove candidates. dnf autoremove removes them, breaking the rpm-installed application. Fix: install via dnf install
    ./pkg.rpm or mark deps with dnf mark install.'
  distractor: autoremove only removes packages that have no files on disk
- id: dnf-007
  topic: dnf
  level: L2
  question: How do you create an offline repository mirror for air-gapped environments?
  answer: Use dnf reposync --repoid=<repo> --download-metadata -p /srv/repos/ to mirror packages and metadata. Serve via HTTP.
    Always include --download-metadata or module stream filtering will not work on clients. Use --newest-only for bandwidth
    savings on delta syncs.
  distractor: Use dnf download --all to create a complete mirror
- id: dnf-008
  topic: dnf
  level: L1
  question: What does the `priority` field in a dnf repo config control, and what is the default?
  answer: Priority determines which repo dnf prefers when multiple repos offer the same package. Lower number = higher priority.
    Default is 99. Set internal repos to a low number (e.g., 10) to ensure they override EPEL or other third-party repos.
  distractor: Higher priority numbers mean higher preference
- id: dnf-009
  topic: dnf
  level: L2
  question: Why is using `exclude=` in repo configs risky for security patching?
  answer: exclude= makes matching packages completely invisible to dnf, including security updates. If someone added exclude=kernel*
    to prevent kernel updates, dnf update --security silently skips kernel CVE fixes. Use dnf versionlock instead — it pins
    versions but remains visible in versionlock list.
  distractor: exclude= only hides packages from search results, not from updates
- id: dnf-010
  topic: dnf
  level: L2
  question: What are the three dnf-automatic timer profiles and when would you use each?
  answer: dnf-automatic-download.timer downloads but does not install (pre-stage for maintenance windows). dnf-automatic-install.timer
    downloads and installs (fully unattended patching for non-critical servers). dnf-automatic-notifyonly.timer just sends
    notifications about available updates (awareness without action).
  distractor: dnf-automatic only supports a single timer that always installs updates
- id: mellanox-001
  topic: mellanox_switches
  level: L1
  question: What is the Onyx CLI command to save the running configuration to persistent storage?
  answer: '`configuration write`. Unlike Cisco IOS (`write memory` or `copy running-config startup-config`), Onyx uses its
    own command syntax.'
  distractor: Many people try `write memory` or `copy run start` from Cisco muscle memory, which will fail on Onyx.
- id: mellanox-002
  topic: mellanox_switches
  level: L1
  question: What does WJH (What Just Happened) do on a Mellanox switch?
  answer: WJH logs every packet dropped in hardware with the exact drop reason (e.g., ACL deny, buffer congestion, TTL expired,
    blackhole route). It is the single most useful debugging tool on the platform.
  distractor: WJH is not a packet capture tool — it only records drops, not successfully forwarded packets.
- id: mellanox-003
  topic: mellanox_switches
  level: L2
  question: Why must DCBX trust mode match between the switch and NIC for RoCEv2 to work correctly?
  answer: If the switch trusts L2 CoS bits but the NIC marks DSCP (or vice versa), RDMA traffic is classified into the wrong
    priority queue. PFC does not protect it, causing drops under load and degraded RDMA performance.
  distractor: Some assume DCBX negotiation auto-resolves mismatches, but in practice a trust mode mismatch silently misclassifies
    traffic.
- id: mellanox-004
  topic: mellanox_switches
  level: L1
  question: Name the four generations of the Mellanox Spectrum ASIC family and their maximum port speeds.
  answer: Spectrum (SN2000) — 100G. Spectrum-2 (SN3000) — 200G. Spectrum-3 (SN4000) — 400G. Spectrum-4 (SN5000) — 800G. Each
    generation roughly doubles bandwidth density.
- id: mellanox-005
  topic: mellanox_switches
  level: L2
  question: What is a PFC storm and how does the PFC watchdog prevent it?
  answer: A PFC storm occurs when a slow receiver causes PFC pause frames to cascade upstream through the fabric, eventually
    pausing unrelated traffic on spine switches. The PFC watchdog detects stuck PFC states and disables PFC on the affected
    port to break the cascade.
  distractor: PFC storms are often confused with broadcast storms, but they are a priority-based flow control issue specific
    to lossless Ethernet fabrics.
- id: mellanox-006
  topic: mellanox_switches
  level: L1
  question: What is the MLAG split-brain problem on Mellanox switches and what causes it?
  answer: When the ISL (Inter-Switch Link) between MLAG peers fails, both switches become primary and independently forward
    traffic, causing duplicate packets and MAC flapping downstream. Fix by using redundant ISL links and a management-network
    heartbeat backup.
- id: mellanox-007
  topic: mellanox_switches
  level: L2
  question: What three mechanisms must be configured together for a properly functioning RoCEv2 lossless fabric on Mellanox
    switches?
  answer: 1) PFC (Priority Flow Control) — to pause traffic before buffer overflow. 2) ECN (Explicit Congestion Notification)
    — to signal senders to back off before PFC activates. 3) DCBX trust mode — to ensure traffic is classified into the correct
    priority queue on both switch and NIC.
- id: mellanox-008
  topic: mellanox_switches
  level: L1
  question: How does Onyx firmware support rollback after a failed upgrade?
  answer: Onyx has dual boot partitions. After installing new firmware to the next partition and rebooting, if the new version
    fails, you can select the previous partition at boot to roll back to the last known-good version.
- id: mellanox-009
  topic: mellanox_switches
  level: L2
  question: Why might `show what-just-happened` return no results even when packets are being dropped?
  answer: WJH channels (forwarding, ACL) may not be enabled by default on some firmware versions. You must explicitly enable
    them with `what-just-happened forwarding enable` and `what-just-happened acl enable`.
  distractor: Some assume WJH is always active because it is a hardware feature, but the reporting channels must be explicitly
    enabled in software.
- id: mellanox-010
  topic: mellanox_switches
  level: L1
  question: What is UFM in the Mellanox/NVIDIA Networking ecosystem?
  answer: Unified Fabric Manager — a centralized management platform that provides topology discovery, health monitoring,
    firmware orchestration, and telemetry aggregation across multi-switch fabrics. It runs as a separate appliance or VM,
    not on the switches themselves.
- id: devops-git-workflows-001
  topic: git_workflows
  level: L2
  question: Which Git workflow is most appropriate for a SaaS team deploying 10 times per day with strong CI/CD and feature
    flag infrastructure?
  choices:
    a: GitFlow
    b: Trunk-Based Development
    c: GitLab Flow
    d: Release Branching
  answer: b
  explanation: Trunk-based development is designed for teams with high deploy frequency, strong CI, and feature flags. GitFlow
    would add unnecessary ceremony for a team deploying this often.
- id: devops-git-workflows-002
  topic: git_workflows
  level: L2
  question: In GitFlow, what is the most commonly forgotten step when creating a hotfix?
  choices:
    a: Tagging the release on main
    b: Merging the hotfix branch back to develop
    c: Deleting the hotfix branch after merge
    d: Running the CI pipeline on the hotfix branch
  answer: b
  explanation: The hotfix must be merged to BOTH main AND develop. Forgetting the develop merge means the fix regresses on
    the next release cut from develop.
- id: devops-git-workflows-003
  topic: git_workflows
  level: L2
  question: What is the main disadvantage of squash-merging all PRs?
  choices:
    a: It creates merge commits that clutter the log
    b: It loses git bisect granularity within the squashed commit
    c: It prevents reverting individual features
    d: It requires force-pushing after the squash
  answer: b
  explanation: Squash merge combines all PR commits into one. git bisect can only narrow to the PR level, not individual changes.
    A large squash commit with hundreds of lines cannot be further bisected.
- id: devops-git-workflows-004
  topic: git_workflows
  level: L1
  question: Which Git workflow uses environment branches (staging, production) to model the deployment pipeline?
  choices:
    a: GitHub Flow
    b: GitFlow
    c: GitLab Flow
    d: Trunk-Based Development
  answer: c
  explanation: GitLab Flow introduces environment branches where code flows downstream (main -> staging -> production). GitHub
    Flow has no environment branches, and GitFlow uses release branches, not environment branches.
- id: devops-git-workflows-005
  topic: git_workflows
  level: L2
  question: Why is force-pushing a shared branch dangerous?
  choices:
    a: It triggers an automatic deployment
    b: It rewrites commit SHAs, orphaning commits that teammates have already pulled
    c: It deletes the remote branch
    d: It bypasses branch protection rules
  answer: b
  explanation: Force-push rewrites commit SHAs. Anyone who fetched the old SHAs now has orphaned commits. Their next pull
    creates duplicate commits, phantom conflicts, or silently lost work.
- id: devops-git-workflows-006
  topic: git_workflows
  level: L1
  question: What does the FAST mnemonic stand for when choosing a Git workflow?
  choices:
    a: Features, Automation, Security, Testing
    b: Frequency, Active versions, Stage gates, Team size
    c: Flow, Agility, Simplicity, Throughput
    d: Flags, Approvals, Squash, Tags
  answer: b
  explanation: FAST helps you choose a workflow by evaluating deploy Frequency, number of Active supported versions, whether
    you have Stage gates (staging/prod), and Team size.
- id: devops-git-workflows-007
  topic: git_workflows
  level: L2
  question: What is cherry-pick drift?
  choices:
    a: When git cherry-pick modifies the commit message
    b: When feature branches slowly diverge from main over time
    c: When fixes are cherry-picked to some release branches but not others, causing inconsistent bug-fix coverage
    d: When cherry-picked commits conflict with the target branch
  answer: c
  explanation: Cherry-pick drift occurs when fixes land on some release branches but are missed on others (or on main). Over
    time, different branches have different bug fixes, and users on older versions hit bugs that were fixed elsewhere.
- id: devops-git-workflows-008
  topic: git_workflows
  level: L2
  question: When migrating from GitFlow to trunk-based development, what prerequisites must be met before deleting the develop
    branch?
  choices:
    a: All feature branches must be merged and the team must agree on a naming convention
    b: CI must run in under 15 minutes, test coverage must be above 80%, and feature flag infrastructure must be ready
    c: The develop branch must be empty and all tags must be moved to main
    d: A release manager must be appointed and all release branches must be closed
  answer: b
  explanation: Without fast CI, good test coverage, and feature flags, trunk-based development will result in a perpetually
    broken main branch. These are prerequisites, not nice-to-haves.
- id: devops-git-workflows-009
  topic: git_workflows
  level: L1
  question: In release branching, what is the correct order for applying a fix?
  choices:
    a: Fix on the oldest release branch, then cherry-pick forward to main
    b: Fix on main first, then cherry-pick backward to each affected release branch
    c: Fix on the production branch, then merge to main
    d: Fix on a hotfix branch, then merge to all release branches simultaneously
  answer: b
  explanation: '"Fix forward, port backward." Always fix on main (the newest code) first, then backport to release branches.
    This ensures the fix is never accidentally lost in future releases.'
- id: devops-git-workflows-010
  topic: git_workflows
  level: L2
  question: A team using GitHub Flow has a feature branch that is 2 weeks old with 200+ lines of merge conflicts. What is
    the root cause?
  choices:
    a: The team is not using squash merge
    b: The branch lived too long without merging main back into it
    c: GitHub Flow does not support long-running features
    d: The team needs to switch to GitFlow for better branch management
  answer: b
  explanation: Merge conflict probability grows exponentially with branch lifetime. A 2-week-old branch in an active team
    will have massive divergence. The fix is merging main into feature branches daily and keeping branches under 3 days.
- id: linux-mergerfs-001
  topic: mergerfs
  level: L2
  question: What is the default create policy in mergerfs and how does it distribute files?
  answer: pfrd (Probabilistic Free-space Random Distribution). It selects a branch randomly with probability proportional
    to available free space. A branch with 2 TB free is twice as likely to receive a file as one with 1 TB free. This naturally
    balances data across drives over time.
  distractor: Many confuse pfrd with mfs (most free space). pfrd is probabilistic/random; mfs always picks the single branch
    with the most free space deterministically.
- id: linux-mergerfs-002
  topic: mergerfs
  level: L2
  question: What does moveonenospc do, and what is its critical limitation?
  answer: 'When a write fails with ENOSPC on a branch, mergerfs moves the file to another branch and retries the write. Critical
    limitation: it only affects writes to already-open files, NOT creates. If the create policy selects a full branch, the
    create fails and moveonenospc does not intervene.'
  distractor: A common mistake is assuming moveonenospc fully protects against full drives. It does not -- minfreespace is
    the create-time protection; moveonenospc is only a write-time safety net.
- id: linux-mergerfs-003
  topic: mergerfs
  level: L2
  question: Why must SnapRAID parity drives NEVER be included in the mergerfs pool?
  answer: 'mergerfs will write user data to any branch in the pool. If the parity drive is a branch, user files overwrite
    parity data, silently destroying SnapRAID protection. Fix: use naming conventions like /mnt/disk* for data and /mnt/parity*
    for parity, and only glob /mnt/disk* in the mergerfs mount.'
- id: linux-mergerfs-004
  topic: mergerfs
  level: L2
  question: How do you add a new drive to a running mergerfs pool without unmounting?
  answer: 'Use xattr on the .mergerfs pseudo-file: setfattr -n user.mergerfs.srcmounts -v ''+>/mnt/disk5'' /storage/.mergerfs.
    The +> prefix appends a new branch. Changes are NOT persisted -- update /etc/fstab to make them survive reboot.'
  distractor: Some try to remount or restart the mergerfs daemon. The xattr interface allows zero-downtime branch management
    without interrupting active services.
- id: linux-mergerfs-005
  topic: mergerfs
  level: L1
  question: What are the three branch modes in mergerfs?
  answer: RW (Read-Write) -- default, eligible for all operations. RO (Read-Only) -- excluded from create and action policies.
    NC (No-Create) -- excluded from create policies but allows modifications and deletions. NC is used to gracefully drain
    a drive before removal.
- id: linux-mergerfs-006
  topic: mergerfs
  level: L2
  question: What is EXDEV error 18 and how does mergerfs handle cross-branch renames?
  answer: EXDEV means "Invalid cross-device link" -- returned when rename() crosses filesystem boundaries. Since each mergerfs
    branch is a separate filesystem, cross-branch renames trigger EXDEV. The rename-exdev option can be set to passthrough
    (default, returns error), rel-symlink, or abs-symlink to create symlinks as workarounds.
  distractor: Some applications check file type after rename and reject symlinks, so enabling symlink modes requires testing
    with your specific applications.
- id: linux-mergerfs-007
  topic: mergerfs
  level: L1
  question: Why is dropcacheonclose=true important for Plex/Jellyfin on mergerfs?
  answer: Without it, streaming large media files (20-50 GB) fills the Linux page cache with data that will never be re-read.
    This evicts useful cached data and causes system sluggishness. dropcacheonclose calls posix_fadvise(DONTNEED) on file
    close, telling the kernel to release the page cache for that file.
- id: linux-mergerfs-008
  topic: mergerfs
  level: L2
  question: What is the difference between epmfs and mspmfs create policies?
  answer: Both select the branch with the most free space among branches with an existing path. epmfs only considers branches
    where the exact parent directory exists -- if no branch has it, the create fails. mspmfs falls back to the parent directory,
    then grandparent, etc. mspmfs is more resilient but less strict about path preservation.
  distractor: The msp* prefix stands for "Most Specific Path" -- it tries the exact path first, then walks up the directory
    tree. The ep* prefix ("Existing Path") only tries the exact path.
- id: linux-mergerfs-009
  topic: mergerfs
  level: L2
  question: After a drive failure in a mergerfs + SnapRAID setup, what must you do BEFORE running snapraid sync?
  answer: Run snapraid fix -d dN to restore data from parity to the replacement drive. If you run snapraid sync before fix,
    SnapRAID recalculates parity without the missing data, permanently destroying the parity information needed for recovery.
    The correct order is always fix first, verify, then sync.
- id: linux-data-hoarding-001
  topic: linux_data_hoarding
  level: L1
  question: What is the core architectural difference between traditional RAID and the JBOD+mergerfs+SnapRAID approach used
    in data hoarding?
  choices:
    a: JBOD uses hardware controllers while RAID uses software
    b: Each drive is an independent filesystem pooled by a union filesystem, with parity computed offline on a schedule
    c: JBOD stripes data across drives for performance while RAID mirrors for redundancy
    d: There is no meaningful difference — both provide the same protection
  answer: b
  explanation: In the JBOD approach, each drive is formatted independently (ext4/XFS), merged into a single namespace by mergerfs,
    and protected by SnapRAID's snapshot parity (computed daily via cron). This allows mixed drive sizes, individual drive
    readability, and incremental growth.
- id: linux-data-hoarding-002
  topic: linux_data_hoarding
  level: L2
  question: A data hoarder runs `snapraid sync` and SnapRAID reports thousands of deleted files. What is the most likely cause?
  choices:
    a: A ransomware attack encrypted all files
    b: One or more data drives failed to mount, making their mount points appear empty
    c: The parity drive is full and cannot store new parity data
    d: The snapraid.conf file was modified to remove data drives
  answer: b
  explanation: When a drive fails to mount, its mount point is empty. SnapRAID interprets all files on that drive as deleted.
    This is why snapraid-runner's deletethreshold setting is critical — it aborts sync if deletions exceed a configured limit.
- id: linux-data-hoarding-003
  topic: linux_data_hoarding
  level: L1
  question: Which statement about SnapRAID parity vs backups is correct?
  choices:
    a: SnapRAID parity replaces the need for backups since it can recover any file
    b: Parity protects against disk failure; backups protect against deletion, ransomware, fire, and theft — you need both
    c: Backups replace the need for parity since they contain copies of all files
    d: Parity and backups serve the same purpose but use different storage formats
  answer: b
  explanation: Parity lets you reconstruct files after a disk failure but cannot protect against rm -rf, ransomware affecting
    the whole pool, or physical disasters. The minimum stack is SnapRAID for parity + borg/restic to a separate drive + rclone
    to offsite cloud.
- id: linux-data-hoarding-004
  topic: linux_data_hoarding
  level: L2
  question: Why is btrfs RAID5/RAID6 considered dangerous for data storage as of 2025?
  choices:
    a: btrfs RAID5/6 has poor read performance compared to ext4
    b: btrfs RAID5/6 has an unfixed write hole bug that can cause parity-data inconsistency after power loss, potentially
      making corruption worse during repair
    c: btrfs RAID5/6 requires ECC RAM to function correctly
    d: btrfs RAID5/6 cannot be created on drives larger than 8TB
  answer: b
  explanation: The btrfs RAID5/6 write hole means that power loss during writes can leave parity inconsistent with data. On
    the next scrub, btrfs may overwrite good data with bad parity, amplifying corruption. The kernel now warns when creating
    these profiles. Use btrfs RAID1/RAID10 or ext4+SnapRAID instead.
- id: linux-data-hoarding-005
  topic: linux_data_hoarding
  level: L1
  question: What did Google's landmark 2007 study of 100,000+ drives reveal about SMART monitoring?
  choices:
    a: SMART predicted 99% of all drive failures with at least 24 hours warning
    b: 36% of drives that failed showed zero SMART warnings beforehand
    c: SMART is only useful for SSD drives, not spinning disks
    d: Drives with SMART warnings had a 50% chance of surviving another year
  answer: b
  explanation: Google found that 36% of failed drives had no SMART anomalies. SMART catches gradual degradation (sector reallocation)
    but misses sudden failures (head crashes, PCB failures, firmware bugs). Use SMART as one layer in a defense stack, not
    the only one.
- id: linux-data-hoarding-006
  topic: linux_data_hoarding
  level: L2
  question: When choosing between BorgBackup and restic for a data hoarding backup solution, what is the key differentiator?
  choices:
    a: Borg supports encryption while restic does not
    b: Restic has native multi-backend support (S3, B2, Azure, GCS) while borg requires additional tools for cloud storage
    c: Borg is faster for all workloads because it is written in C
    d: Restic supports deduplication while borg does not
  answer: b
  explanation: restic natively supports S3, B2, Azure, GCS, SFTP, and rclone backends. BorgBackup primarily targets local/SFTP
    repos and needs rclone or borgmatic for cloud integration. Both support deduplication and encryption. Choose borg for
    local/SFTP + max compression, restic for cloud targets.
- id: linux-data-hoarding-007
  topic: linux_data_hoarding
  level: L2
  question: A SnapRAID array has 4 data drives (4TB, 8TB, 12TB, 16TB). What is the minimum size required for the parity drive?
  choices:
    a: 4TB (same as the smallest data drive)
    b: 10TB (average of all data drives)
    c: 16TB (at least as large as the largest data drive)
    d: 40TB (sum of all data drives)
  answer: c
  explanation: The SnapRAID parity drive must be at least as large as the largest data drive. Since parity is computed per-block
    across all drives, it needs to accommodate blocks from the largest drive. With split parity (v11.0+), you can combine
    smaller drives to meet this requirement.
- id: linux-data-hoarding-008
  topic: linux_data_hoarding
  level: L1
  question: What two fstab mount options should always be set on data drives in a hoarding array?
  choices:
    a: sync and noexec
    b: noatime and nofail
    c: relatime and auto
    d: discard and barrier
  answer: b
  explanation: noatime prevents unnecessary write operations from access time updates (critical for media streaming and reducing
    SnapRAID sync time). nofail allows the system to boot even if a drive fails or disconnects — giving you a degraded array
    instead of an unbootable server.
- id: linux-data-hoarding-009
  topic: linux_data_hoarding
  level: L2
  question: What is the purpose of drive burn-in before adding a new drive to a data hoarding array?
  choices:
    a: To format the drive with the correct filesystem alignment
    b: To catch infant mortality failures by running SMART extended tests and badblocks before trusting the drive with data
    c: To initialize the SnapRAID parity data on the new drive
    d: To calibrate the drive's SMART thresholds for accurate monitoring
  answer: b
  explanation: New drives have a higher failure rate in their first weeks (infant mortality). Burn-in with SMART long test
    + badblocks catches defective drives before you put data on them. Drives that pass burn-in are statistically more reliable.
    Typical burn-in takes 8-24 hours.
